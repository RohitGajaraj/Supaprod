<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadence Mark - animated loader (reference)</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: radial-gradient(120% 140% at 82% -10%, rgba(255,107,44,0.10), transparent 55%), #0a0a0a;
        color: #ededed; font-family: Inter, system-ui, sans-serif;
      }
      .demo { display: grid; gap: 22px; justify-items: center; padding: 40px; }
      .frame { width: min(60vmin, 360px); aspect-ratio: 1; display: grid; place-items: center; }
      svg { width: 100%; height: 100%; overflow: visible; }
      .title { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
      .tag { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.5); }
      .formula { max-width: 640px; padding: 12px 14px; border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px; background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.78);
        font: 12px/1.6 ui-monospace, Menlo, monospace; white-space: pre-wrap; text-align: center; }
    </style>
  </head>
  <body>
    <div class="demo">
      <div class="frame">
        <svg viewBox="0 0 100 100" aria-label="Cadence, working">
          <defs>
            <linearGradient id="g" x1="4%" y1="0%" x2="96%" y2="100%">
              <stop offset="0%" stop-color="#FF6B2C" />
              <stop offset="52%" stop-color="#8B5EAE" />
              <stop offset="100%" stop-color="#3E63DD" />
            </linearGradient>
            <radialGradient id="core" cx="42%" cy="36%" r="72%">
              <stop offset="0%" stop-color="#FFD9C2" />
              <stop offset="56%" stop-color="#FF6B2C" />
              <stop offset="100%" stop-color="#C24E1E" />
            </radialGradient>
            <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="1.6" result="b" /><feMerge>
                <feMergeNode in="b" /><feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <g id="loop">
            <path id="track" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2.6"
              stroke-linecap="round" stroke-linejoin="round" />
            <g id="particles" filter="url(#glow)"></g>
          </g>
          <g id="corewrap" filter="url(#glow)">
            <circle id="c1" cx="50" cy="50" r="6.2" fill="url(#core)" />
            <circle id="c2" cx="50" cy="50" r="2.15" fill="#E8B44C" />
          </g>
        </svg>
      </div>
      <div class="title">Cadence</div>
      <div class="tag">the loop, working</div>
      <pre class="formula" id="formula"></pre>
    </div>
    <script>
      // Cadence mark = a seven-petal epitrochoid (the 7 loop stages) revolving
      // around a pulsing core (Brain + Pulse). Tweak `config` and reuse. This
      // mirrors src/components/cadence/CadenceMark.tsx; the app uses the SVG +
      // CSS version, this RAF variant is the reference "gif".
      const config = {
        R: 7, r: 1, d: 3, // R=7,r=1 -> K=6 -> seven petals
        pad: 10,
        particleCount: 74,
        trailSpan: 0.3,
        loopDurationMs: 2700, // energy flow speed
        rotationMs: 18000, // the loop turning
        pulseMs: 3000, // the core beat
        strokeGradient: "url(#g)",
      };
      const SVG_NS = "http://www.w3.org/2000/svg";
      const R = config.R, r = config.r, d = config.d, K = (R - r) / r, MAX = R - r + d;
      const scale = (50 - config.pad) / MAX;
      const point = (progress) => {
        const t = (((progress % 1) + 1) % 1) * Math.PI * 2;
        return {
          x: 50 + ((R - r) * Math.cos(t) + d * Math.cos(K * t)) * scale,
          y: 50 + ((R - r) * Math.sin(t) - d * Math.sin(K * t)) * scale,
        };
      };
      const track = document.getElementById("track");
      track.setAttribute("d", Array.from({ length: 361 }, (_, i) => {
        const p = point(i / 360); return `${i === 0 ? "M" : "L"} ${p.x.toFixed(2)} ${p.y.toFixed(2)}`;
      }).join(" ") + " Z");
      const group = document.getElementById("particles");
      const dots = Array.from({ length: config.particleCount }, () => {
        const c = document.createElementNS(SVG_NS, "circle");
        c.setAttribute("fill", config.strokeGradient); group.appendChild(c); return c;
      });
      const loop = document.getElementById("loop");
      const c1 = document.getElementById("c1"), c2 = document.getElementById("c2");
      document.getElementById("formula").textContent =
        "u(t) = ((R-r) cos t + d cos((R-r)t/r), (R-r) sin t - d sin((R-r)t/r))\nR = 7, r = 1, d = 3   .   seven petals, one core";
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const start = performance.now();
      function frame(now) {
        const time = now - start;
        const prog = (time % config.loopDurationMs) / config.loopDurationMs;
        loop.setAttribute("transform", `rotate(${((time % config.rotationMs) / config.rotationMs) * 360} 50 50)`);
        dots.forEach((node, i) => {
          const tail = i / (config.particleCount - 1);
          const p = point(prog - tail * config.trailSpan);
          const fade = Math.pow(1 - tail, 0.6);
          node.setAttribute("cx", p.x.toFixed(2)); node.setAttribute("cy", p.y.toFixed(2));
          node.setAttribute("r", (0.8 + fade * 2.4).toFixed(2));
          node.setAttribute("opacity", (0.05 + fade * 0.95).toFixed(3));
        });
        const beat = 0.9 + ((Math.sin(((time % config.pulseMs) / config.pulseMs) * Math.PI * 2) + 1) / 2) * 0.24;
        c1.setAttribute("r", (6.2 * beat).toFixed(2)); c2.setAttribute("r", (2.15 * beat).toFixed(2));
        if (!reduce) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
