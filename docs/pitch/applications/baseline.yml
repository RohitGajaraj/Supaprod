positioning:
  order: door, then body, then brain. ALWAYS. The brain is the crescendo, never the opening.
  layers:
    - id: "01"
      name: the director
      claim: Tells you what to build from your own signals and market, with the evidence attached. Argues down weak bets before you commit.
      note: This is the layer nobody else sells.
    - id: "02"
      name: the operating system
      claim: Writes the spec, plans, designs, builds, opens a real pull request behind a merge gate no agent can cross.
    - id: "03"
      name: the brain
      claim: Every decision recorded with the forecast that justified it, frozen at the moment of the call, then graded against what shipped.
      note: The only layer defensible alone.
  moat: >-
    The forecast captured at decision time: what a team believed would happen,
    recorded before the outcome was known. Not an artifact, leaves no trace unless
    something caught it at the moment of the call.
  moat_falsified_alternatives:
    - claim: Storage is the moat
      status: FALSE. Any vendor can store decisions.
    - claim: The compounding record of what happened is the moat
      status: >-
        FALSE, falsified 2026-08-10. Causes survive in Slack, email and call
        recordings, and have been reconstructed on the record. This is why the
        moat is the forecast, not the record.
      naming_the_example: BANNED OUTWARD. See outward_ban below.

  outward_ban:
    # FOUNDER RULING 2026-08-17. This is a positioning ban, not a style note.
    banned_story: >-
      Never name the company, the person or the "built in two days" detail behind
      the 2026-08-10 falsification, in any application, deck, form or written
      answer. Not in the competitors answer, not as a self-correction, nowhere.
    why: >-
      The beat was written to buy credibility by conceding a falsified claim. What
      a reader takes from it is that a large engineering org rebuilt a year of
      decision history in two days, which reads as: the thing being sold is two
      days of work for anyone with a team. It hands the reviewer the strongest
      objection to our own moat, in our own words, in the field where we are
      supposed to be answering it. Founder: "For them it is not a big deal to just
      have that feature integrated, and what we are trying to say is our primary
      USP. From that perspective it is not great."
    say_this_instead: >-
      A forecast is not an artifact. It exists only if something captured it at
      the moment of the call, so it cannot be backfilled by anyone starting later,
      at any budget.
    why_it_is_stronger: >-
      It answers the big-player objection instead of raising it. The constraint is
      time, not engineering, and no budget shortens it. It is already on slide 6
      of the deck, so the strongest artifact and the applications now agree.
    enforced_by: "bun run pitch:check fails on any paste block naming it"
    already_filed_with_it: >-
      YC, Berkeley SkyDeck, Campus Founders, ikigai, Conviction Embed, The
      Residency, South Park Commons, Betaworks, Sequoia Arc. Those are sent and
      are left as the historical record. Do not rewrite them, do not repeat them.
  hard_mechanisms:
    # Say the mechanism, never the adjective.
    - Forecast fields made immutable by a BEFORE UPDATE trigger in Postgres, not a check in application code, so the rule holds for every caller including our own agents.
    - A merge gate no agent can cross; a person approves and merges.
    - An audit trail on every agent action.
    - One-key rollback on anything an agent produced.
    - A customer-reachable kill switch and workspace pause that halt work in flight.
    - Agents earn autonomy from their own track record, with floors on merge, revert and delegate.
    - Deliberate refusal to compute performance scores about named human teammates.
  taglines:
    # FOUNDER RULING 2026-08-17: every one-liner carries ALL THREE layers, in order.
    # "As of now it's just one layer we are speaking about." A line that names one
    # layer sells one third of the product. Test any candidate against all three:
    #   01 tells/knows what to BUILD · 02 BUILDS and ships it · 03 LEARNS and GUIDES the next call
    three_layer_rule: mandatory
    # FOUNDER RULING 2026-08-17: close on GUIDE, never on "warn". "Warn" carries
    # only the negative half of layer 03. The product also re-ranks what to build
    # next, which "guide" carries in one word. This line is already on the deck
    # cover, so the shortest surface and the strongest artifact now agree.
    canonical: "Agents that know what to build, ship it, and guide the next call."   # 65
    under_50_chars: "Agents know what to build, ship it, and guide"                  # 45
    under_100_chars: "Tells product teams what to build from their own signals, ships it, guides the next call."  # 89
    ten_words: "Agents that know what to build, ship it, and guide."
    retired:
      - line: "Cursor for PMs, the whole product org."
        reason: >-
          Three readers killed it. It borrows the do-the-work-faster frame that the
          competitors answer spends a paragraph disowning, so it argues against
          itself inside one application.
      - line: "Product decisions with a forecast you cannot edit"
        reason: >-
          Layer 03 only, and it opens on the forecast, which the 2026-08-11
          positioning change moved out of the lead.
      - line: "Agents run the product org. You keep the judgment."
        reason: >-
          Layer 02 only. Never says the product decides what to build or learns
          from the result.
      - line: "Agents that know what to build, ship it, and remember."
        reason: >-
          Closes on a banned verb of the brain. The third layer guides, it does not
          hold a record.
      - line: "Agents that know what to build, ship it, warn you"
        reason: >-
          Founder ruling 2026-08-17. "Warn" carries only the negative half of layer
          03. It says the product stops a repeat of something that went wrong and
          says nothing about re-ranking what to build next. Close on "guide".
    never_close_on: [remember, remembers, stores, logs, warn, "warn you", warns]

tech:
  ai_coding_tools: [Claude Code, Codex, Lovable, Antigravity]
  models:
    # CORRECTED 2026-08-19 against the code. The old values were both wrong.
    retrieval: Cohere embed-v4
    default: google/gemini-3-flash-preview     # src/lib/ai/models.ts:370 DEFAULT_MODEL
    agent_loop: Gemini 3 Flash
    deep_reasoning: [Claude, GPT-5]
    byok_only_never_call_it_the_engine: [Qwen-plus]
    correction_note: >-
      This block said "agent_loop: [Qwen-plus, Gemini 2.5 Flash]". Both halves
      were wrong. DEFAULT_MODEL is google/gemini-3-flash-preview, and Qwen is a
      bring-your-own-key provider option plus the OpenHands delegate default,
      not the core engine. Naming Qwen as the agent loop overstated a customer
      option into an architecture claim. Founder ruling: lead with Claude,
      because the PLATFORM IS BUILT WITH CLAUDE CODE, then name Gemini for the
      engine.
    say_the_default_is_a_setting: >-
      Founder ruling 2026-08-19. Never let a named default read as a lock-in.
      "The default today is X. The default is a setting, not an architecture."
      Then say new models are added as they land rather than migrated to, which
      claims the chokepoint you already built rather than promising a roadmap.
    never_quote_call_counts: >-
      The 14-day per-model call counts (27,008 / 4,902 / 4,329) are RETIRED.
      They decay daily and no reader can re-derive them.
    note: One runtime chokepoint handles budget, cache, guardrails, tracing, fallback and feature gates. Models are interchangeable parts.
  frontend: [TanStack Start, React 19, Vite, TypeScript, Tailwind, shadcn, Bun]
  data: [Supabase Postgres with RLS, pgvector, pg_cron]
  deploy: Cloudflare Workers
  sandboxing: E2B, with secret redaction on every output stream
  connectors_real: [GitHub, GitLab, Slack, Intercom, Zendesk, Canny, Productboard, Salesforce, HubSpot, Stripe]
  connectors_stub_DO_NOT_NAME: [Linear, Notion, Jira, Figma, Gmail, Google Docs]
  never_close_the_set: >-
    FOUNDER RULING 2026-08-19, and it is register rule 3 made concrete. A bare
    list of nine connectors implies the set STOPS at nine, which under-describes
    the product - and under-describing is as much a defect as overclaiming, and
    far harder to see, because a narrow sentence still reads as true. Always
    close an enumeration with where it is going, framed from the READER's side:
    "More are landing on the same registry, so a team is not waiting on a
    bespoke build for the tool they already use." A partner's real question is
    never "how many do you have", it is "will you have mine".

competition:
  primary: >-
    The stitched stack, not a company. Discovery in one tool, spec in a second,
    design in a third, code agents in a fourth, flags in a fifth, results in a sixth.
    The tax is the seams, not the tools.
  structural_gap: >-
    Grading a decision needs the call and its outcome inside one system, and a
    handoff is precisely where those two get separated. No feature ships past that.
  named: [Notion Ship OS, Atlassian Product Collection, Linear, ChatPRD, Samepage, Brief]
  second_competitor: >-
    A folder of markdown files. Low-level tools are agent-writable but not
    agent-governable.
  never_say: "we have no competitors"
  deliberate_non_goal: We do not build the code generator. The models keep absorbing that layer.

market:
  tam: $300B+/yr, the product management work budget (~2.6M PMs at ~$115K loaded cost), already paid for as headcount
  sam: $2B growing to $12B/yr
  som: ~$47M ARR at launch pricing
  buyer: >-
    The "product staff" seat: Instagram replaced its ~13-person canonical team
    with pods of 4-6 engineers led by a PM who absorbs design, data and research
    (Mosseri, July 2026). That seat has no system of record.
  pricing: Workspace subscription plus credits for agent runs, so the bill tracks work done rather than seats. Untested until beta.
  tailwind: Devin $37M to $492M ARR in twelve months; Cursor at $2B.

europe_wedge:
  # Use ONLY for European programmes. It does not travel to US applications.
  law: EU AI Act
  live_since: 2026-08-02
  plain_statement: >-
    A company running AI agents on real work must show automatic logs of what the
    system did, prove a human could oversee and halt it, and carry that duty itself
    as the deployer rather than pushing it to the vendor.
  articles_for_live_conversation_only:
    art_12: automatic logging over a high-risk system's lifetime
    art_14: provider must build the system so a human can oversee and halt it
    art_26: deployer duties land on the customer, not the vendor
    art_50: transparency and machine-readable marking of generated content; fines to EUR 15M or 3% of worldwide turnover
    annex_III_pt_4: AI used in task allocation and performance evaluation is high-risk
  register_rule: >-
    In writing, state the rule plainly and show the product answering it. Reciting
    article numbers reads as homework. Save the numbers for the live conversation.
  source: docs/planning/rebuild-2026-07/governance/gov-c-frame-and-story.md

assets:
  # What to attach, by who is asking. Founder rulings 2026-08-16 and 2026-08-17.
  #
  # ABSOLUTE, NO EXCEPTIONS, RULED TWICE. Every application, every programme,
  # every "attach your pitch deck" field gets the ONE-PAGE BRIEF. Do not build a
  # variant. Do not send a multi-page deck. Do not reason from a programme's list
  # of required deck contents to "therefore we need more pages" - that reasoning
  # was tried on Hub71 on 2026-08-17, an 18-page deck was built, and the founder
  # rejected it on the same grounds he rejected the 16-pager for Campus Founders:
  # "the format is not good". A malformed or wrong-format artifact costs more
  # than a thin one.
  #
  # Why the one-pager is not a compromise: its orange button is a real PDF link
  # annotation into supaprod.ai/brief, a LIVING page. A reviewer who clicks gets
  # the current full content. A PDF snapshot is stale the moment /brief changes.
  deck_for_programmes: docs/pitch/shareables/Supaprod-Brief.pdf
  deck_for_programmes_rule: ABSOLUTE. No per-programme variants, ever.
  deck_for_investors: docs/pitch/shareables/Supaprod-Investor-Briefing.pdf
  product_video_file: docs/pitch/shareables/Supaprod-Product-Film.mp4   # 97.6MB, gitignored
  product_video_link: https://youtu.be/x9WgGn0FyYU                       # public, 2:23
  founder_video_link: https://youtu.be/zBmtUtkTyBs                       # unlisted, 2:32
  retired:
    - path: docs/pitch/shareables/supaprod-pre-seed-deck-16pp.pdf
      reason: Renders badly. Slides 3, 6, 15 and 16 clip; slide 15 loses three lines.
  traps:
    - path: videos/supaprod-film/renders/video-v15.mp4
      reason: >-
        The final SILENT picture. Higher version number than the master and dated
        within a minute of it. The two naming series are not comparable. Probe for
        an audio stream before sending any render.
    - rule: >-
        Never send Supaprod-Investor-Briefing.pdf to an accelerator. Its content
        reads "Pre-Seed Briefing - Confidential" with investors@ in the footer.

demo_logins:
  rule: One login per programme, never shared. Approving a gate is a write, so a second reviewer finds an emptied queue.
  verify_before_sending: true
  record_signin_timestamp: >-
    Sign in to verify the queue is armed, then RECORD THE TIMESTAMP. Any later
    sign-in is then attributable to the programme. This is what explore@ lacked.
  allocated:
    explore@supaprod.ai: Y Combinator (locked)
    compass@supaprod.ai: Betaworks AI Camp
    lantern@supaprod.ai: Campus Founders (verified working 2026-08-16 11:25 IST)
    meridian@supaprod.ai: ikigai Launchpad (reserved)
    harbor@supaprod.ai: founder rehearsal, NEVER send
    voyage@supaprod.ai: EF The Bridge SF, given inline in Q4 on 2026-08-18. SPENT.
  # CORRECTED 2026-08-19. This read `free: [voyage@supaprod.ai]` while the `filed:`
  # block on the same page recorded voyage as handed to EF. The next application
  # would have sent an already-used login, and the rule at the top of this block
  # says exactly what that costs: the second reviewer opens an emptied queue.
  # Two fields on one page disagreed, and only the one nobody reads was right.
  free: [ember@supaprod.ai]
  ember_note: >-
    ember@supaprod.ai is the ONLY unspent login. Created 2026-07-22 alongside the
    others, never signed into (last_sign_in_at NULL as of 2026-08-19), and brought
    to the same standard as the rest on 2026-08-19: one workspace, two products
    (Relay + Prism), 20 decisions, 20 forecasts, 6 hit / 3 miss / 3 inconclusive,
    2 sitting in the due queue. Natural allocation is a16z speedrun in October.

  seeded_state_2026_08_19: >-
    All seven demo accounts are now IDENTICAL: one workspace each, two products,
    ~19 decisions, ~19 forecasts, 6 hit / 3 miss / 3 inconclusive, and 2 forecasts
    sitting in the due queue awaiting a person. Zero orphaned decisions, zero rows
    where a verdict predates its own horizon. Before this, `decisions_with_forecast`
    was ZERO in every workspace, so the claim every application leads with was
    invisible to any reviewer who signed in. Detail: session-handoff.md.

vocabulary:
  banned_everywhere:
    [receipts, ledger, company brain, decision layer, unattended, first run, provenance]
  banned_brain_verbs: [remembers, stores, logs]
  keep: [audit trail, shared brain]
  approve_vs_review: >-
    Use "approve" only where a click UNBLOCKS something. Use "review" where it
    only shows you something.
  banned_filler:
    [leverage, utilize, robust, seamless, cutting-edge, revolutionize, game-changer,
     unlock, empower, supercharge, delve, testament to]
  punctuation: No em dashes, no en dashes, no invisible Unicode in anything pasted.

never_claim:
  - Accumulated learning in the present tense. The honest form is that the loop is wired and proven and begins accruing on first real use.
  - The claim that Supaprod's own roadmap runs inside Supaprod. It does not survive its own database.
  - Any count of human approvals. The gate is a principle as a feature and a liability as a count.
  - Any product-usage number. Every one that ever existed was seed data.
  - The mission names at ISRO. Moon and Mars missions only.
  - Any number that decays before the reader sees it and that they cannot re-derive.

application_rules:
  form_is_the_spec: >-
    Read every question, label, character limit and dropdown option off the LIVE
    form before drafting. If an account gate blocks it, getting past the gate is
    the first task, not something to work around.
  scroll_dropdowns: A visible option is not the best option. Scroll to the bottom.
  optional_fields: >-
    Blank when filling would overstate. FILL when the field shows something true
    that no other field carries. A founder video on a solo application is the
    clearest case for filling.
  numeric_fields: A required revenue or user field gets the TRUE figure. The never-volunteer-the-zero rule governs prose, not numbers.
  never_volunteer_the_zero: >-
    Banned in prose on every application: zero revenue, zero outside users, no
    users, nobody has used it yet, or any sentence whose only job is to announce
    an absence.
  vulnerability_beats: 1     # exactly one, placed where the form invites it
  self_corrections: 1        # exactly one
  rule_6_adjacency:
    rule: The commit count and "agents write the code" must never share a field.
    # STRENGTHENED 2026-08-19. The rule existed and was violated anyway, because
    # it was one line with no reason attached, so nobody recognised the shape.
    # The filed line read: "Eleven weeks, near enough every day, solo, DIRECTING
    # AGENTS: 5,400+ COMMITS and 545 database migrations." Same sentence.
    why_it_is_not_a_style_note: >-
      Do the arithmetic the reader does. 5,400 commits over 78 days is about 69
      a day, and the same sentence has just told them agents wrote it. So the
      number does not measure the founder, it measures the agents. A volume
      figure adjacent to an agent mention is evidence for the wrong subject, and
      the bigger the number the more clearly it belongs to the machine.
      Independent readers reached this unprompted: "5,400 commits is roughly
      seventy a day, which reads as agent output, not judgment" and "545
      migrations is fifty schema changes a week, which I can read as thrash".
    the_test: >-
      In any sentence carrying a build number, cover the number and ask who the
      sentence is about. If the answer is the agents, the number is arguing
      against the founder and it comes out.
    founder_ruling_2026_08_19: >-
      He caught the half-fix himself: the numbers were removed from "how far
      along" and left in "how long have you been working on this". Removing a
      hostile number from one field and leaving it in another is not a fix. The
      duration field answers "how long" completely with eleven weeks and
      full-time; the numbers were never load-bearing.

  peer_signal_vs_discovery_claim:
    # FOUNDER RULING 2026-08-19: he wants the "I talk to people in this space"
    # signal injected subtly. That is allowed. The interview claim is not.
    allowed: >-
      "Every product person I talk to has the same meeting." He is a member of a
      30,000-person product community and has a decade of peers. Saying that
      peers share the problem is true and it is the cheapest credibility in the
      corpus.
    banned: >-
      Any number, any "we interviewed", any "discovery calls", any "N customers
      said". Zero first-party discovery interviews have happened and the
      customer-evidence rule is binding.
    the_line_between_them: >-
      Peers sharing a PROBLEM is observation. Users validating a SOLUTION is
      research. Claim the first, never the second, and never attach a count to
      either.

  the_director_must_be_named_outward:
    # FOUNDER RULING 2026-08-19, given twice in one session because the first
    # correction did not take: "The director part is not being mentioned
    # anywhere... Telling what to build is most important as well. That is not
    # projected, and that is one of our USPs."
    rule: >-
      Every substantial outward answer states, in plain words and early, that
      the product TELLS A TEAM WHAT TO BUILD. Not implied by a pipeline
      description, not left to be inferred from "runs the lifecycle". Said.
    the_canonical_sentence: >-
      "Supaprod tells a team what to build next and why, ranked, with the
      evidence attached." Follow it with the adversarial half, never the other
      way round.
    both_halves_or_it_is_not_the_director:
      positive: tells a team what to build next and why, ranked, evidence attached
      adversarial: >-
        argues against its own recommendation - a critic makes the case against
        the bet from the team's own data and kills the weak ones before a sprint
        is spent
    why_the_adversarial_half_carries_the_differentiation: >-
      "Ranking ideas is cheap. Being told no, with the reason attached, is the
      part nobody else is selling." Every competitor can rank. None argues back.
    the_failure_this_corrects: >-
      A draft compressed the director down to the critic alone, to avoid
      duplicating a locked field that already described the input pipeline. That
      removed the USP to solve a repetition problem. WRONG TRADE. The fix is to
      state the CLAIM (what the product decides) rather than re-tell the
      MECHANIC (what it reads and how it clusters) - the claim is never a
      duplicate, because no other field makes it.
    ordering_with_the_forecast: >-
      Director first, forecast second, and the forecast closes by feeding the
      director: "that verdict re-ranks what to build next, so the critic gets
      sharper at arguing with this particular team." That makes the forecast
      serve the USP instead of competing with it.

  layer_balance:
    # FOUNDER QUESTION 2026-08-19: "is knowing what to build and the forecast
    # part one and the same?" They are NOT, and the confusion is worth writing
    # down because the draft had drifted exactly the way the question implies.
    they_are_not_the_same:
      layer_01_the_director: >-
        "Knowing what to build" is the OUTPUT and the DOOR. Tells a team what to
        build from their own signals and market, with the evidence attached, and
        argues down the weak bets. This is the layer nobody else sells.
      layer_03_the_brain: >-
        The forecast is a MECHANISM INSIDE layer 03, not a layer and not the
        value. It is what lets a decision be graded, which is what makes the
        director get better over time.
      the_relationship: >-
        The forecast is how the director learns to be a better director. Causally
        linked, different layers. Say them in that order and the forecast earns
        its place; say the forecast alone and it sounds like accountability
        software.
    all_three_layers_or_it_is_not_the_product:
      # FOUNDER RULING 2026-08-19, given after the THIRD draft in one session
      # let the forecast crowd out the layers: "this is the mistake you are
      # repeatedly doing again and again. I want you to correct this."
      rule: >-
        Every substantial outward answer, script or pitch names ALL THREE
        LAYERS, in order, before the forecast is mentioned at all. The forecast
        is optional and may be merged into layer 03. The three layers are not
        optional and are never merged into each other.
      the_three_in_his_words:
        1_knowing_what_to_build: "Supaprod tells you what to build."
        2_the_whole_loop: >-
          It takes care of the entire product lifecycle, discover through learn.
          Say the stations out loud. It BUILDS and SHIPS. A draft that skips this
          makes the product sound like an advisor rather than an operator.
        3_the_brain: >-
          It learns and guides the next move, and tells a team where they went
          wrong.
        4_the_forecast: >-
          Optional. Merge it into layer 03 where it earns room. NEVER the
          headline, never the scene, never the payoff on its own.
      the_recurring_failure: >-
        Three separate drafts on 2026-08-19 built their strongest beat on the
        forecast and left layer 02 unsaid. Each time the founder caught it. The
        pattern: the forecast is the most INTERESTING idea to write, so it wins
        the best sentence by default. Interesting is not the same as load
        bearing. Layer 01 is what a team buys and layer 02 is what they use
        daily; the forecast is why it compounds.
      the_mechanical_check: >-
        Before shipping any script or long answer, point at the sentence that
        carries each layer. If you cannot point at all three, it is not ready.
        If the forecast has more words than layer 02, it is inverted.
      the_scene_test_for_the_problem_beat: >-
        The problem beat asks "why did we decide to build this, and what was
        the reason" - NOT "what did we predict". A scene about a missing
        forecast is layer 03 wearing a problem statement. The reconstructable
        thing a team actually loses is the REASONING behind the call.

    the_balance_test: >-
      Count paragraphs per layer in any long answer. The YC update had two of
      five on the forecast and ONE CLAUSE on the director, which inverts
      door-body-brain. The door gets at least as much room as the brain, and the
      brain closes by feeding the door: "that verdict re-ranks what to build
      next, which is where the first paragraph starts over."
    the_contradiction_to_watch: >-
      An adversarial reader caught this in the same draft: "Agents run the work,
      a person clears the gate, that is the only place a human is required"
      argues humans are nearly unnecessary, eight lines after arguing human
      judgment is the only scarce thing left. Both sentences are true and they
      cannot sit unmediated. Order fixes it: the human decides WHAT (layer 01),
      the agents do the work (layer 02), the human clears the ship gate.
    and_the_old_warning_still_stands: >-
      Never open on the forecast. A pitch that starts "we record what you
      predicted so it can be checked later" sells accountability to the person
      who would be held accountable. Google's internal prediction markets beat
      expert forecasts by up to a 25 percent reduction in mean squared error and
      died anyway, for exactly that reason.
  unconditional_commitment: Never "if accepted, I will". The programme changes the speed and the postcode, never the decision.
  read_the_verb: '"JOINED" is not "applied". Answer the question actually asked.'
  founder_submits: Never submit an application. The founder submits.

  # ============================================================================
  # FOUNDER RULINGS 2026-08-18, given after reviewing a filled EF application.
  # His words: "you are not efficient in incorporating it... keep it as a
  # baseline so that it does not come back to back for you."
  # These are NOT EF-specific. They govern EVERY field of EVERY application.
  # Run them as a CHECKLIST over a finished draft, not as a vibe.
  # ============================================================================

  say_it_once:
    rule: >-
      No fact, phrase, number or story appears in two fields. One fact, one home.
      Pick the field where it does the most work and delete it everywhere else.
    why: >-
      "Duplicacy would irritate people." A reader going field to field sees the
      repeat immediately and concludes the applicant had less to say than the
      form allowed. With a 100-word cap, a repeated sentence is also space
      stolen from a claim that was never made.
    also_applies_between: >-
      The written answers AND the video. If the video repeats what the form
      already says, it has spent its minute telling them what they just read.
    how_to_check: >-
      Before filing, list every proper noun, number and anecdote per field and
      look for anything appearing twice. Do this mechanically; it is invisible
      when reading the answers one at a time.

  laymans_terms:
    rule: >-
      A non-technical reader must be able to follow every sentence. Technical
      detail and metrics are welcome; jargon strings are not.
    founder_words: >-
      "Instead of making it sound very much like techno-reporting, techno guy...
      if a layman wants to read and understand, how would that be?"
    test: >-
      Would an intelligent generalist know what this sentence means without
      looking anything up? If not, say what the thing DOES before what it is
      called.
    example_bad: "a 500-test suite pairing LLM-as-judge with deterministic graders across factuality, safety, latency and cost"
    example_good: "a 500-test harness that checks every model answer for accuracy, safety, speed and cost before it reaches a customer"

  never_frame_growth_as_deficiency:
    rule: >-
      Never state what he could NOT do. State what he can do now. Growth is
      shown by the present capability, not by naming a past hole.
    banned_shape: '"Two years ago I could not ship production software."'
    say_instead: '"I build and ship production software end to end myself, directing agents."'
    why: >-
      FOUNDER RULING, and it is a real credibility bug: beside "a decade in
      product" the deficit sentence reads as an admission that the earlier
      years were not effective. It was written to show learning RATE and it
      buys that at too high a price. The slope is still visible from the facts
      without confessing a floor.

  discarded_work_carries_its_reason:
    rule: >-
      Never say "threw away" on its own. State WHY the thing was rebuilt and
      what it taught. A bare discard reads as waste; a reasoned rebuild reads
      as judgment.
    founder_words: '"thrown away is a hard thing... if you are saying thrown away, for what reason you threw away."'
    say_instead: >-
      "Each one worked and each one was the wrong shape, so I rebuilt it" -
      or name the specific thing each version got wrong.

  hand_over_the_demo:
    rule: >-
      Where a form asks what he has built, GIVE a working demo login inline.
      Never write "I will give access on request" or "happy to walk you
      through it": both ask the reader to do work and to wait.
    founder_words: '"Directly throw an account at them and ask them to check out."'
    mechanics: See demo_logins above. One login per programme, re-armed and verified before sending.

  no_deficit_no_apology: >-
    Related to the above and already law 2 in answer-bank.md. Candour goes
    where the form asks for it, stated as fact plus what happens next, never
    as apology and never volunteered.

  # ============================================================================
  # FOUNDER RULINGS 2026-08-19, from the YC Fall 2026 update pass. Each one is
  # a defect that was found ON A FILED FORM, not a style preference. Run them
  # as a checklist. Two of them were invisible to every existing rule.
  # ============================================================================

  demand_evidence_beats_every_number:
    # THE MOST EXPENSIVE FINDING OF THE WHOLE CORPUS. Five independent adversarial
    # readers - a serial entrepreneur, a multiple-time founder, two VC partners and
    # a YC partner - scored the YC Fall 2026 update on 2026-08-19 without seeing
    # each other's verdicts. Median 5-6 out of 10. ALL FIVE named the same defect,
    # and all five named the same fix. That is not a style opinion, it is a reading.
    the_defect: >-
      Every new fact in the update was supply-side. Commits, migrations, tests,
      connectors, a server interface. Not one human being outside the founder
      appeared anywhere, and the single demand-side sentence was future tense.
    what_they_actually_said:
      - "Not one line of it is a human being outside this founder."
      - "Not one sentence in the update comes from outside your own head."
      - "The only human being in this entire update is him."
      - >-
        "That is the precise signature of an excellent employee enjoying a
        project: enormous, disciplined, genuinely high-quality output with no
        contact with anyone who has to want it."
    rule: >-
      An application with zero outside users must carry at least one piece of
      CONTACT evidence: named people (with permission), what they did, and the
      one thing they did that was not predicted. Contact is not usage. It costs
      nothing to have and it cannot be faked, and its absence is read as a
      choice rather than a stage.
    volume_numbers_invert_without_it:
      rule: >-
        Build-volume numbers are NOT neutral when no user exists. They are read
        hostilely, and the bigger they are the worse it gets.
      the_readings_we_got:
        - "545 migrations in eleven weeks is fifty schema changes a week, which I can read as thrash rather than progress."
        - "5,400 commits is roughly seventy a day, which reads as agent output, not judgment."
        - "9,405 tests: I stopped to be suspicious, not impressed."
      so: >-
        Pair every volume number with a demand fact, or cut it. Never let a
        build metric be the largest number in a field.
    a_pivot_needs_an_external_cause: >-
      "Founders re-position because five buyers said no in the same way;
      employees re-position because they read the market and thought harder."
      A repositioning justified only by reasoning reads as a preference, not a
      finding. Give every positioning change a person who caused it.
    the_asset_that_was_sitting_unused: >-
      docs/pitch/design-partner-kit.md holds 25 hand-picked, live-verified
      practitioners, unsent since 2026-07-10. A reader found it and named it as
      the fastest available fix. CHECK IT BEFORE CLAIMING THERE IS NO ROUTE TO
      USERS.

  moat_tense:
    # A VC reader inverted our strongest sentence in under thirty seconds.
    rule: >-
      Never claim the MECHANISM is uncopyable. Claim the TIME is. A trigger, a
      locked column and a due-date queue are roughly two sprints for Linear,
      Productboard or Atlassian, all of whom already own the surface where the
      call gets recorded. What cannot be shortened is the accumulation.
    banned: ["that is the one thing nobody can copy in later", "cannot be copied", "nobody can rebuild it"]
    say_instead: >-
      "It only builds for whoever was capturing it at the time." The constraint
      is elapsed time, not engineering, and no budget shortens it.
    the_objection_this_must_survive: >-
      "A corpus is a distribution artifact, not a code artifact: whoever has
      teams in October has more of it by January than he does, no matter who
      wrote the trigger first." That objection is CORRECT and the honest answer
      is that the race is for teams, not for the feature. Do not pretend
      otherwise in writing.

  count_the_vulnerability_beats_across_locked_fields_too: >-
    The one-beat rule counts LOCKED fields. A reader found the YC update
    carrying four: the locked 9c already spent it on unvalidated pricing, and
    the update added three more. Audit the whole application, not the part
    being edited.

  claim_timing:
    # THE ONE THAT COST THE MOST. A false clock on a true mechanism.
    rule: >-
      Every mechanism claim carries a WHEN, and the when is verified SEPARATELY
      from the mechanism. A true thing described at the wrong point in time is
      a false claim, and it is the hardest kind to see, because the sentence
      is 90 percent accurate and the checker's eye stops at the part that is.
    the_defect_that_produced_it: >-
      The YC application said a reviewer "holds every change against the test
      suite BEFORE IT CAN MERGE". The reviewer is real. The suite is real and
      green. The timing was invented: `gh pr list --state all` returns exactly
      ONE pull request in the repo's whole history, work lands on main
      directly, and branch protection returns 403 (unavailable on a private
      repo on the free plan). CI runs ON THE PUSH, not as a gate before a
      merge. Every existing rule checked whether a thing EXISTS. None checked
      when it FIRES.
    the_test: >-
      For every verb of sequence or prevention - before, after, blocks,
      prevents, gates, stops, requires, until, then - ask what would have to be
      configured for that word to be true, and go look at that configuration.
      Not the code that could do it. The setting that makes it happen.
    the_words_that_trigger_a_check:
      ["before", "prevents", "blocks", "cannot", "requires", "gates", "until",
       "stops", "no one can", "is enforced", "automatically"]
    two_honest_repairs:
      narrow_it: >-
        State only what is true now. "Every change is held against the
        typecheck and the whole test suite" is true, and it costs four words to
        get there from the false version.
      make_it_true: >-
        PREFERRED WHERE IT IS CHEAP. Founder ruling 2026-08-19: "please do the
        right call, even if it is not there today. Anyway, we are going to have
        the things in place." Where the gap is configuration rather than
        engineering, close the gap instead of weakening the sentence. The merge
        gate is a USD 4 per month GitHub Pro plan plus a required status check.
        Fixing the repo beats rewording the application.
    the_ordering_rule: >-
      A claim made true AFTER a form is submitted is still false ON the form.
      Law 1 governs: true on the day you hit submit. So the repair must land
      before the paste, or the narrowed version ships and the stronger sentence
      waits for the next update.
    already_found_in_two_places:
      - "before it can merge (the merge gate) - FALSE, narrowed 2026-08-19"
      - >-
        "PostHog and Sentry drop into a vendor neutral facade AT LAUNCH" - the
        facade is built, the two vendors are not wired yet. Correct as written
        because it names the future tense. Kept as the model of a right one.

  roadmap_tense:
    rule: >-
      Anything not running today is written in a tense that says so, in the
      same sentence, never in a footnote. "Wired for launch" and "lands at
      launch" are correct. The same fact with the tense removed is a lie.
    why_this_is_not_pedantry: >-
      A programme verifies. The cost of the honest tense is three words. The
      cost of being caught is the application.

  update_surfaces:
    # For any form that offers an UPDATE to an application already filed.
    rule: >-
      An update is read as a rate-of-change signal, so it opens on the STATE
      the company is in, never on a since-I-filed window.
    founder_ruling_2026_08_19: >-
      A draft opened "Since I filed on 11 August: 401 commits, 29 database
      migrations". Rejected: "this does not give an overall picture of where we
      are at". A narrow delta measures the drafter's window, not the company.
    never_open_on: ["since I filed", "since I applied", "in the last N days", a commit delta]
    do_not_submit_an_empty_update: >-
      Where an update surface has nothing true to report, DO NOT OPEN IT. YC's
      Fundraising Update is one radio that already reads No, and its own label
      is "you've raised funds since applying, or your fundraising situation has
      changed". Submitting an update that changes nothing spends a reader's
      attention on nothing, which on a movement-scored form is a small negative
      rather than a neutral.

  editable_vs_locked:
    rule: >-
      On a part-editable form, a retired or banned claim sitting in an EDITABLE
      field is a live defect and gets scrubbed. The same claim in a LOCKED
      field is the historical record and is left alone. Never let "filed,
      therefore exempt" become "editable, therefore unchecked".
    the_defect_that_produced_it: >-
      The 2026-08-17 ban on the moat-falsification story was applied to every
      programme folder, and missed the YC file entirely, because the gate
      script scans docs/pitch/applications/ and NOT docs/pitch/yc/ - the one
      file source_precedence ranks FIRST. It reported clean with a banned story
      live in an editable field.
    and_the_bigger_one: >-
      READ THE LOCKED FIELDS BEFORE DRAFTING THE EDITABLE ONES. The YC locked
      fields still sell "Cursor for PMs, one unified tool for the whole product
      development lifecycle" - a positioning retired months ago - and the
      forecast, the moat and the brain appear NOWHERE in them. That made the
      editable surfaces the only channel for the current positioning, which
      changed what the update had to do. It was invisible until the founder
      sent screenshots of the filed form.
    so: >-
      The editable fields must close the gap between the company the reader
      just read about and the company that exists, stated as a founder
      sharpening his thesis, never as a correction of the record.

