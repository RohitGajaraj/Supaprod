---
# Supaprod application baseline
#
# READ THIS FIRST when drafting any outward application. It is the compact,
# machine-readable source of truth so a session does not have to read 30K of
# markdown to get a fact right.
#
# It does NOT replace:
#   answer-bank.md              the long-form facts and reusable prose blocks
#   positioning-doctrine.md     the seven rules
#   how-to-draft-the-next-one.md  the craft, and every correction the founder made
#
# Where this file and those disagree, THOSE WIN and this file is stale. Fix it.

meta:
  updated: 2026-08-17
  updated_after: "Hub71 Access Programme Cohort 20, SUBMITTED 2026-08-17"
  refresh_rule: >-
    Re-derive every value under `numbers` on the morning of any submission.
    Two of them move daily. A number that cannot be re-derived on demand is
    not evidence and must not be used.
  source_precedence:
    # Added 2026-08-17 after a draft was written from a stale answer bank and
    # thrown away. The bank was six days behind the filed applications, so it did
    # not merely go unused, it actively misled. Highest wins.
    1: "the most recent APPLICATION-FINAL.md or FILL-SHEET-*.md (register, structure, positioning order)"
    2: "this file (numbers, standing rules, banned vocabulary)"
    3: "how-to-draft-the-next-one.md (craft, founder corrections)"
    4: "positioning-doctrine.md (the seven rules, per-programme axis)"
    5: "answer-bank.md (facts and blocks, only once back-ported from rank 1)"
  back_port_rule: >-
    A filing is not finished until what it taught is back in answer-bank.md and
    this file, in the same session. Enforced by `bun run pitch:check`, which fails
    when the answer bank's stamp is older than the newest filing.

company:
  name: Supaprod
  url: https://supaprod.ai
  brief_url: https://supaprod.ai/brief
  film_url: https://supaprod.ai/film
  hq_city: Bangalore
  hq_country: India
  incorporated: false
  incorporation_plan: >-
    Deliberately not incorporated. Registering an Indian Pvt Ltd first would
    require unwinding through FEMA and RBI share-swap rules, which routinely
    costs more in time, legal fees and tax than the entity is worth. Jurisdiction
    is chosen to match where the company will actually operate.
  stage_label: Users          # never "Prototype", never "Idea"
  public_launch: 30 September 2026
  product_state_outward: >-
    The product runs end to end today: agents read the signals, argue down the
    weak bets, come back with a call and its evidence, write the spec, build it,
    open a real pull request, and a person merges. Public launch is
    30 September 2026.
  # FOUNDER RULING 2026-08-17. The fields `beta: private, invite-only` and
  # `signup_closed: 2026-08-07` are DELETED, not moved. They were being pasted
  # into applications as "private beta, invite-only, signup closed 7 August,
  # entry is by invite code", which reads as a company with more demand than
  # capacity: a signup drive, a queue behind it, and a decision to close the
  # doors. None of that exists. Founder: "If someone asks how many people have
  # signed up, we do not have an answer. Literally we have zero users on the
  # waitlist. This will put us in a weak spot."
  never_imply_demand:
    rule: >-
      Never let a sentence imply a quantity, a queue or a level of demand that
      cannot be put to a number. The twin of never_volunteer_the_zero: rule 0
      says do not announce the absence, this says do not manufacture the
      appearance either.
    test: >-
      Say the clause, then ask whether a reviewer replying "how many?" would get
      a number we are happy to give. If not, the clause goes.
    banned_everywhere:
      ["signup closed", "sign-ups are closed", "invite-only", "by invite",
       "invite code", waitlist, "early access list", "we are onboarding",
       "first cohort of users"]
    say_instead: see company.product_state_outward above
    enforced_by: "bun run pitch:check fails on any paste block using them"
  revenue_eur: 0
  outside_users: 0
  funding_raised: none
  grants: none
  team_fulltime: 1

  # FOUNDER RULING 2026-08-17. Solo is the state today, NEVER the intention.
  # "I do not want to do everything on my own. As we scale I want to hire my first
  # founding engineer, go-to-market engineer, and so on, working along with a crew of
  # agents."
  hiring_plan:
    rule: >-
      Never let a solo answer read as permanent. Any field that establishes the
      founder builds alone must close on where the team goes next. A programme
      funds a company that grows; "no non-founder has touched this" is true and,
      left alone, says he intends to do everything himself forever.
    first_hires: [founding engineer, go-to-market engineer]
    shape: >-
      Each hire works the way the founder works now, directing a crew of agents
      rather than replacing them. Headcount is not how the execution scales.
    the_line: "Agents scale the execution. Hiring is how I scale the judgment."
    do_not_say: >-
      Never give a hiring number, a date, or a headcount plan. There is no
      recruiting process and no offer out, so a figure would be an implied demand
      claim under never_imply_demand. Name the roles and the shape, nothing more.
    cofounder_stance_is_separate: >-
      Open to a cofounder who adds a perspective he does not have, and not waiting
      on one. That answer is about a COFOUNDER and does not replace this one.

  # FOUNDER RULING 2026-08-17. Never leave a "no" as the last word.
  # "When you say 'I'm not currently raising', that looks like a negative. You
  # should say 'I'm open to raising and working towards it.' It has to be
  # optimistic rather than shutting the doors."
  fundraising_stance:
    outward: >-
      Working towards a pre-seed after the 30 September launch, priced against
      real usage rather than a projection, and open to the right investor before
      then.
    banned_phrasing: ["not currently raising", "not raising", "we are not raising"]
    why: >-
      True, and it closes a door in a room whose value is capital partners. A
      programme reads it as either no ambition or no need for them.
    cap_table_line: >-
      Self-funded, held outright, so there is no dilution to unwind and the cap
      table is clean for whoever comes first. Turn the absence into the asset.
    do_not_say: >-
      No target amount, no valuation, no date beyond "after launch". Pricing is
      untested, so a number here would be a claim we cannot defend.

  never_end_on_a_negative:
    # The third of the rule-0 family, and the one that was missing.
    #   rule 0   do not ANNOUNCE the absence
    #   rule 0a  do not MANUFACTURE the appearance
    #   this     do not LEAVE the absence as the last thing read
    rule: >-
      Where a form asks a question whose honest answer is "none", the "none"
      answers the question and the very next sentence must open the door it just
      closed. Never end a field on a negative.
    applies_to: >-
      investors, revenue, entity, users, prior programmes, grants, and any other
      field whose true answer today is nothing.

founder:
  name: Rohit Gajaraj
  email: founder@supaprod.ai
  investor_email: investors@supaprod.ai
  # Recorded 2026-08-17 so no future application has to stop and ask for it.
  # This repo is PRIVATE (verified before writing). Never paste this into an
  # outward document, a deck, or anything published; forms only.
  phone: "+91 8892298119"
  phone_local: "8892298119"          # type this where a country code is prefilled
  nationality: Indian
  linkedin: https://linkedin.com/in/rohit-gajaraj
  x: https://twitter.com/rohit_gajaraj
  github: https://github.com/RohitGajaraj
  second_time_founder: false
  education:
    - BE Mechatronics Engineering
    - MBA, TUM School of Management
  career:
    - org: ISRO (India's national space agency)
      role: the communication link for spacecraft going to the Moon and Mars, from age 21
      note: >-
        Say "Moon and Mars missions", NEVER the mission names. A reader outside
        India has to look them up, and a name that stops the sentence is a defect.
        Both missions flew.
      # FOUNDER RULING 2026-08-17. Always carry the DISTANCE.
      carry_the_distance: >-
        "No patch, no rollback, no second attempt" is abstract and a reader can
        nod past it. The distance makes it physical, and it is the thing that
        conveys the complexity. Always pair the consequence with the scale.
      canonical_phrasing: >-
        I built the communication link for spacecraft going to the Moon and Mars.
        My job was keeping a signal alive across hundreds of millions of
        kilometres. After launch there is no patch and no second attempt.
      why_that_phrasing_is_strongest: >-
        It ties the distance to HIS OWN contribution rather than to space in
        general. He built the comms link, so the distance is not colour, it is
        the engineering problem he was solving. A generic "space is hard" line
        is worth far less.
      distance_accuracy:
        moon_km: 384400          # hundreds of THOUSANDS
        mars_km_range: 55e6 to 401e6   # hundreds of MILLIONS
        say: "hundreds of millions of kilometres"
        never_say: >-
          "billions of kilometres". Billions is Saturn territory, roughly 1.2 to
          1.6 billion km. Mars never exceeds about 401 million. The founder said
          "millions and billions" in conversation; the accurate figure is the
          stronger one because a space-literate reviewer catches an inflated
          number and the whole application pays for it.
    - org: Infineon Technologies, Munich
      role: product manager, semiconductors
    - org: Intellect (BFSI technology company)
      role: senior AI product manager
      note: >-
        The AI platform 200+ financial institutions across 70+ countries build
        their own AI products on.
  proof_of_persistence: >-
    Built and threw away four complete working versions of this product before
    this one, each rebuilt from scratch when the shape turned out to be wrong.
    Two years ago could not ship production software at all; learned to build by
    directing agents. SHOW THE BEHAVIOUR, never name the trait.

  # FOUNDER RULING 2026-08-18, given verbatim and standing for EVERY application,
  # not just EF: "I am not going on a sabbatical. My notice is already in. I am
  # quitting and starting it full time. Not just for this application, for any
  # further application, it needs to be the same way."
  commitment:
    state: notice_served
    say: >-
      My notice is in. I am leaving a senior role to do this full time.
    never_say:
      # Each of these reframes an irreversible act as a reversible one, which is
      # the exact thing EF's round-three rejection ("hedging on commitment") is
      # looking for. They are banned on every surface, in every programme.
      - sabbatical
      - career break
      - leave of absence
      - taking time off / time out
      - "stepping back" / "stepping away"
      - "exploring" or "testing" whether to go full time
      - "if accepted, I will quit" (conditional commitment of any shape)
      - "planning to" / "intend to" / "about to" resign
    why: >-
      A served notice is a fact with a date on it and it cannot be hedged. Every
      banned phrasing above turns it back into an option, and an option is worth
      nothing to a reader deciding whether this person actually starts. The
      company is happening full time regardless of any programme's decision; a
      programme changes the speed and the zip code, never the decision.
    tense: >-
      Present or past, never future. "My notice is in" and "I am leaving", never
      "I will leave". Still in the seat until the notice period ends, so present
      tense is correct for the CURRENT ROLE ("I am senior AI product manager"),
      and that is not a contradiction: both are true on the same day.

numbers:
  # Re-derive on the morning of any submission.
  commits:
    value: 5366
    as_of: 2026-08-18
    outward_form: "5,300+"
    command: git rev-list --count origin/main
  tests:
    # Re-derived 2026-08-18 because "9,400 tests across 563 files" was in the EF
    # application and was wrong in BOTH halves.
    value: 9395
    files: 567
    as_of: 2026-08-18
    outward_form: "9,395 passing tests across 567 files"
    command: bun test
  elapsed:
    value: eleven weeks
    as_of: 2026-08-18
    note: >-
      2026-06-02 to 2026-08-18 is 77 days. RETIRED AND BANNED: "eight weeks" and
      "seven weeks", both of which are still sitting in older application drafts.
      Re-derive this every time; it moves every seven days.
  migrations:
    value: 545
    as_of: 2026-08-17
    command: ls supabase/migrations/*.sql | wc -l
  first_real_commit:
    value: 2026-06-02
    command: git log --reverse --format='%ad' --date=short | sed -n 2p
    note: A template commit dated 2025-01-01 is scaffold, not work.
  research_sources:
    value: 679
    # CORRECTED 2026-08-18. The old note said "Primary sources read", and that is
    # not what 679 is. It is the SIZE OF A PAID ARCHIVE he can search, named in
    # one-pager.md as "the 679-document paid archive". He did not read 679 sources.
    # The first interview follow-up is "which ones?", so claim the searching.
    is: size of a searchable paid archive of practitioner interviews
    is_not: a count of sources he has read
    outward_form: >-
      I search a paid 679-document archive of practitioner interviews before
      forming a view.
  pm_community:
    value: 30000
    as_of: 2026-04
    note: >-
      Verified externally at 30,000+ members. He is a MEMBER, not the operator.
      Never present a paid membership as "unusually high access" - anyone with a
      card has it. His real unusual access is the bank rooms; see positioning.
    outward_form: "a 30,000-member product community"

positioning:
  order: door, then body, then brain. ALWAYS. The brain is the crescendo, never the opening.
  layers:
    - id: "01"
      name: the director
      claim: Tells you what to build from your own signals and market, with the evidence attached. Argues down weak bets before you commit.
      note: This is the layer nobody else sells.
    - id: "02"
      name: the operating system
      claim: Writes the spec, plans, designs, builds, opens a real pull request behind a merge gate no agent can cross.
    - id: "03"
      name: the brain
      claim: Every decision recorded with the forecast that justified it, frozen at the moment of the call, then graded against what shipped.
      note: The only layer defensible alone.
  moat: >-
    The forecast captured at decision time: what a team believed would happen,
    recorded before the outcome was known. Not an artifact, leaves no trace unless
    something caught it at the moment of the call.
  moat_falsified_alternatives:
    - claim: Storage is the moat
      status: FALSE. Any vendor can store decisions.
    - claim: The compounding record of what happened is the moat
      status: >-
        FALSE, falsified 2026-08-10. Causes survive in Slack, email and call
        recordings, and have been reconstructed on the record. This is why the
        moat is the forecast, not the record.
      naming_the_example: BANNED OUTWARD. See outward_ban below.

  outward_ban:
    # FOUNDER RULING 2026-08-17. This is a positioning ban, not a style note.
    banned_story: >-
      Never name the company, the person or the "built in two days" detail behind
      the 2026-08-10 falsification, in any application, deck, form or written
      answer. Not in the competitors answer, not as a self-correction, nowhere.
    why: >-
      The beat was written to buy credibility by conceding a falsified claim. What
      a reader takes from it is that a large engineering org rebuilt a year of
      decision history in two days, which reads as: the thing being sold is two
      days of work for anyone with a team. It hands the reviewer the strongest
      objection to our own moat, in our own words, in the field where we are
      supposed to be answering it. Founder: "For them it is not a big deal to just
      have that feature integrated, and what we are trying to say is our primary
      USP. From that perspective it is not great."
    say_this_instead: >-
      A forecast is not an artifact. It exists only if something captured it at
      the moment of the call, so it cannot be backfilled by anyone starting later,
      at any budget.
    why_it_is_stronger: >-
      It answers the big-player objection instead of raising it. The constraint is
      time, not engineering, and no budget shortens it. It is already on slide 6
      of the deck, so the strongest artifact and the applications now agree.
    enforced_by: "bun run pitch:check fails on any paste block naming it"
    already_filed_with_it: >-
      YC, Berkeley SkyDeck, Campus Founders, ikigai, Conviction Embed, The
      Residency, South Park Commons, Betaworks, Sequoia Arc. Those are sent and
      are left as the historical record. Do not rewrite them, do not repeat them.
  hard_mechanisms:
    # Say the mechanism, never the adjective.
    - Forecast fields made immutable by a BEFORE UPDATE trigger in Postgres, not a check in application code, so the rule holds for every caller including our own agents.
    - A merge gate no agent can cross; a person approves and merges.
    - An audit trail on every agent action.
    - One-key rollback on anything an agent produced.
    - A customer-reachable kill switch and workspace pause that halt work in flight.
    - Agents earn autonomy from their own track record, with floors on merge, revert and delegate.
    - Deliberate refusal to compute performance scores about named human teammates.
  taglines:
    # FOUNDER RULING 2026-08-17: every one-liner carries ALL THREE layers, in order.
    # "As of now it's just one layer we are speaking about." A line that names one
    # layer sells one third of the product. Test any candidate against all three:
    #   01 tells/knows what to BUILD · 02 BUILDS and ships it · 03 LEARNS and GUIDES the next call
    three_layer_rule: mandatory
    # FOUNDER RULING 2026-08-17: close on GUIDE, never on "warn". "Warn" carries
    # only the negative half of layer 03. The product also re-ranks what to build
    # next, which "guide" carries in one word. This line is already on the deck
    # cover, so the shortest surface and the strongest artifact now agree.
    canonical: "Agents that know what to build, ship it, and guide the next call."   # 65
    under_50_chars: "Agents know what to build, ship it, and guide"                  # 45
    under_100_chars: "Tells product teams what to build from their own signals, ships it, guides the next call."  # 89
    ten_words: "Agents that know what to build, ship it, and guide."
    retired:
      - line: "Cursor for PMs, the whole product org."
        reason: >-
          Three readers killed it. It borrows the do-the-work-faster frame that the
          competitors answer spends a paragraph disowning, so it argues against
          itself inside one application.
      - line: "Product decisions with a forecast you cannot edit"
        reason: >-
          Layer 03 only, and it opens on the forecast, which the 2026-08-11
          positioning change moved out of the lead.
      - line: "Agents run the product org. You keep the judgment."
        reason: >-
          Layer 02 only. Never says the product decides what to build or learns
          from the result.
      - line: "Agents that know what to build, ship it, and remember."
        reason: >-
          Closes on a banned verb of the brain. The third layer guides, it does not
          hold a record.
      - line: "Agents that know what to build, ship it, warn you"
        reason: >-
          Founder ruling 2026-08-17. "Warn" carries only the negative half of layer
          03. It says the product stops a repeat of something that went wrong and
          says nothing about re-ranking what to build next. Close on "guide".
    never_close_on: [remember, remembers, stores, logs, warn, "warn you", warns]

tech:
  ai_coding_tools: [Claude Code, Codex, Lovable, Antigravity]
  models:
    retrieval: Cohere embed-v4
    agent_loop: [Qwen-plus, Gemini 2.5 Flash]
    deep_reasoning: GPT-5
    note: One runtime chokepoint handles budget, cache, guardrails, tracing, fallback and feature gates. Models are interchangeable parts.
  frontend: [TanStack Start, React 19, Vite, TypeScript, Tailwind, shadcn, Bun]
  data: [Supabase Postgres with RLS, pgvector, pg_cron]
  deploy: Cloudflare Workers
  sandboxing: E2B, with secret redaction on every output stream
  connectors_real: [GitHub, GitLab, Slack, Intercom, Zendesk, Canny, Productboard, Salesforce, HubSpot, Stripe]
  connectors_stub_DO_NOT_NAME: [Linear, Notion, Jira, Figma, Gmail, Google Docs]

competition:
  primary: >-
    The stitched stack, not a company. Discovery in one tool, spec in a second,
    design in a third, code agents in a fourth, flags in a fifth, results in a sixth.
    The tax is the seams, not the tools.
  structural_gap: >-
    Grading a decision needs the call and its outcome inside one system, and a
    handoff is precisely where those two get separated. No feature ships past that.
  named: [Notion Ship OS, Atlassian Product Collection, Linear, ChatPRD, Samepage, Brief]
  second_competitor: >-
    A folder of markdown files. Low-level tools are agent-writable but not
    agent-governable.
  never_say: "we have no competitors"
  deliberate_non_goal: We do not build the code generator. The models keep absorbing that layer.

market:
  tam: $300B+/yr, the product management work budget (~2.6M PMs at ~$115K loaded cost), already paid for as headcount
  sam: $2B growing to $12B/yr
  som: ~$47M ARR at launch pricing
  buyer: >-
    The "product staff" seat: Instagram replaced its ~13-person canonical team
    with pods of 4-6 engineers led by a PM who absorbs design, data and research
    (Mosseri, July 2026). That seat has no system of record.
  pricing: Workspace subscription plus credits for agent runs, so the bill tracks work done rather than seats. Untested until beta.
  tailwind: Devin $37M to $492M ARR in twelve months; Cursor at $2B.

europe_wedge:
  # Use ONLY for European programmes. It does not travel to US applications.
  law: EU AI Act
  live_since: 2026-08-02
  plain_statement: >-
    A company running AI agents on real work must show automatic logs of what the
    system did, prove a human could oversee and halt it, and carry that duty itself
    as the deployer rather than pushing it to the vendor.
  articles_for_live_conversation_only:
    art_12: automatic logging over a high-risk system's lifetime
    art_14: provider must build the system so a human can oversee and halt it
    art_26: deployer duties land on the customer, not the vendor
    art_50: transparency and machine-readable marking of generated content; fines to EUR 15M or 3% of worldwide turnover
    annex_III_pt_4: AI used in task allocation and performance evaluation is high-risk
  register_rule: >-
    In writing, state the rule plainly and show the product answering it. Reciting
    article numbers reads as homework. Save the numbers for the live conversation.
  source: docs/planning/rebuild-2026-07/governance/gov-c-frame-and-story.md

assets:
  # What to attach, by who is asking. Founder rulings 2026-08-16 and 2026-08-17.
  #
  # ABSOLUTE, NO EXCEPTIONS, RULED TWICE. Every application, every programme,
  # every "attach your pitch deck" field gets the ONE-PAGE BRIEF. Do not build a
  # variant. Do not send a multi-page deck. Do not reason from a programme's list
  # of required deck contents to "therefore we need more pages" - that reasoning
  # was tried on Hub71 on 2026-08-17, an 18-page deck was built, and the founder
  # rejected it on the same grounds he rejected the 16-pager for Campus Founders:
  # "the format is not good". A malformed or wrong-format artifact costs more
  # than a thin one.
  #
  # Why the one-pager is not a compromise: its orange button is a real PDF link
  # annotation into supaprod.ai/brief, a LIVING page. A reviewer who clicks gets
  # the current full content. A PDF snapshot is stale the moment /brief changes.
  deck_for_programmes: docs/pitch/shareables/Supaprod-Brief.pdf
  deck_for_programmes_rule: ABSOLUTE. No per-programme variants, ever.
  deck_for_investors: docs/pitch/shareables/Supaprod-Investor-Briefing.pdf
  product_video_file: docs/pitch/shareables/Supaprod-Product-Film.mp4   # 97.6MB, gitignored
  product_video_link: https://youtu.be/x9WgGn0FyYU                       # public, 2:23
  founder_video_link: https://youtu.be/zBmtUtkTyBs                       # unlisted, 2:32
  retired:
    - path: docs/pitch/shareables/supaprod-pre-seed-deck-16pp.pdf
      reason: Renders badly. Slides 3, 6, 15 and 16 clip; slide 15 loses three lines.
  traps:
    - path: videos/supaprod-film/renders/video-v15.mp4
      reason: >-
        The final SILENT picture. Higher version number than the master and dated
        within a minute of it. The two naming series are not comparable. Probe for
        an audio stream before sending any render.
    - rule: >-
        Never send Supaprod-Investor-Briefing.pdf to an accelerator. Its content
        reads "Pre-Seed Briefing - Confidential" with investors@ in the footer.

demo_logins:
  rule: One login per programme, never shared. Approving a gate is a write, so a second reviewer finds an emptied queue.
  verify_before_sending: true
  record_signin_timestamp: >-
    Sign in to verify the queue is armed, then RECORD THE TIMESTAMP. Any later
    sign-in is then attributable to the programme. This is what explore@ lacked.
  allocated:
    explore@supaprod.ai: Y Combinator (locked)
    compass@supaprod.ai: Betaworks AI Camp
    lantern@supaprod.ai: Campus Founders (verified working 2026-08-16 11:25 IST)
    meridian@supaprod.ai: ikigai Launchpad (reserved)
    harbor@supaprod.ai: founder rehearsal, NEVER send
  free: [voyage@supaprod.ai]

vocabulary:
  banned_everywhere:
    [receipts, ledger, company brain, decision layer, unattended, first run, provenance]
  banned_brain_verbs: [remembers, stores, logs]
  keep: [audit trail, shared brain]
  approve_vs_review: >-
    Use "approve" only where a click UNBLOCKS something. Use "review" where it
    only shows you something.
  banned_filler:
    [leverage, utilize, robust, seamless, cutting-edge, revolutionize, game-changer,
     unlock, empower, supercharge, delve, testament to]
  punctuation: No em dashes, no en dashes, no invisible Unicode in anything pasted.

never_claim:
  - Accumulated learning in the present tense. The honest form is that the loop is wired and proven and begins accruing on first real use.
  - The claim that Supaprod's own roadmap runs inside Supaprod. It does not survive its own database.
  - Any count of human approvals. The gate is a principle as a feature and a liability as a count.
  - Any product-usage number. Every one that ever existed was seed data.
  - The mission names at ISRO. Moon and Mars missions only.
  - Any number that decays before the reader sees it and that they cannot re-derive.

application_rules:
  form_is_the_spec: >-
    Read every question, label, character limit and dropdown option off the LIVE
    form before drafting. If an account gate blocks it, getting past the gate is
    the first task, not something to work around.
  scroll_dropdowns: A visible option is not the best option. Scroll to the bottom.
  optional_fields: >-
    Blank when filling would overstate. FILL when the field shows something true
    that no other field carries. A founder video on a solo application is the
    clearest case for filling.
  numeric_fields: A required revenue or user field gets the TRUE figure. The never-volunteer-the-zero rule governs prose, not numbers.
  never_volunteer_the_zero: >-
    Banned in prose on every application: zero revenue, zero outside users, no
    users, nobody has used it yet, or any sentence whose only job is to announce
    an absence.
  vulnerability_beats: 1     # exactly one, placed where the form invites it
  self_corrections: 1        # exactly one
  rule_6_adjacency: The commit count and "agents write the code" must never share a field.
  unconditional_commitment: Never "if accepted, I will". The programme changes the speed and the postcode, never the decision.
  read_the_verb: '"JOINED" is not "applied". Answer the question actually asked.'
  founder_submits: Never submit an application. The founder submits.

  # ============================================================================
  # FOUNDER RULINGS 2026-08-18, given after reviewing a filled EF application.
  # His words: "you are not efficient in incorporating it... keep it as a
  # baseline so that it does not come back to back for you."
  # These are NOT EF-specific. They govern EVERY field of EVERY application.
  # Run them as a CHECKLIST over a finished draft, not as a vibe.
  # ============================================================================

  say_it_once:
    rule: >-
      No fact, phrase, number or story appears in two fields. One fact, one home.
      Pick the field where it does the most work and delete it everywhere else.
    why: >-
      "Duplicacy would irritate people." A reader going field to field sees the
      repeat immediately and concludes the applicant had less to say than the
      form allowed. With a 100-word cap, a repeated sentence is also space
      stolen from a claim that was never made.
    also_applies_between: >-
      The written answers AND the video. If the video repeats what the form
      already says, it has spent its minute telling them what they just read.
    how_to_check: >-
      Before filing, list every proper noun, number and anecdote per field and
      look for anything appearing twice. Do this mechanically; it is invisible
      when reading the answers one at a time.

  laymans_terms:
    rule: >-
      A non-technical reader must be able to follow every sentence. Technical
      detail and metrics are welcome; jargon strings are not.
    founder_words: >-
      "Instead of making it sound very much like techno-reporting, techno guy...
      if a layman wants to read and understand, how would that be?"
    test: >-
      Would an intelligent generalist know what this sentence means without
      looking anything up? If not, say what the thing DOES before what it is
      called.
    example_bad: "a 500-test suite pairing LLM-as-judge with deterministic graders across factuality, safety, latency and cost"
    example_good: "a 500-test harness that checks every model answer for accuracy, safety, speed and cost before it reaches a customer"

  never_frame_growth_as_deficiency:
    rule: >-
      Never state what he could NOT do. State what he can do now. Growth is
      shown by the present capability, not by naming a past hole.
    banned_shape: '"Two years ago I could not ship production software."'
    say_instead: '"I build and ship production software end to end myself, directing agents."'
    why: >-
      FOUNDER RULING, and it is a real credibility bug: beside "a decade in
      product" the deficit sentence reads as an admission that the earlier
      years were not effective. It was written to show learning RATE and it
      buys that at too high a price. The slope is still visible from the facts
      without confessing a floor.

  discarded_work_carries_its_reason:
    rule: >-
      Never say "threw away" on its own. State WHY the thing was rebuilt and
      what it taught. A bare discard reads as waste; a reasoned rebuild reads
      as judgment.
    founder_words: '"thrown away is a hard thing... if you are saying thrown away, for what reason you threw away."'
    say_instead: >-
      "Each one worked and each one was the wrong shape, so I rebuilt it" -
      or name the specific thing each version got wrong.

  hand_over_the_demo:
    rule: >-
      Where a form asks what he has built, GIVE a working demo login inline.
      Never write "I will give access on request" or "happy to walk you
      through it": both ask the reader to do work and to wait.
    founder_words: '"Directly throw an account at them and ask them to check out."'
    mechanics: See demo_logins above. One login per programme, re-armed and verified before sending.

  no_deficit_no_apology: >-
    Related to the above and already law 2 in answer-bank.md. Candour goes
    where the form asks for it, stated as fact plus what happens next, never
    as apology and never volunteered.

