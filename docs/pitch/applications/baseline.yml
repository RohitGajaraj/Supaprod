      reason: >-
        The final SILENT picture. Higher version number than the master and dated
        within a minute of it. The two naming series are not comparable. Probe for
        an audio stream before sending any render.
    - rule: >-
        Never send Supaprod-Investor-Briefing.pdf to an accelerator. Its content
        reads "Pre-Seed Briefing - Confidential" with investors@ in the footer.

demo_logins:
  rule: One login per programme, never shared. Approving a gate is a write, so a second reviewer finds an emptied queue.
  verify_before_sending: true
  record_signin_timestamp: >-
    Sign in to verify the queue is armed, then RECORD THE TIMESTAMP. Any later
    sign-in is then attributable to the programme. This is what explore@ lacked.
  allocated:
    explore@supaprod.ai: Y Combinator (locked)
    compass@supaprod.ai: Betaworks AI Camp
    lantern@supaprod.ai: Campus Founders (verified working 2026-08-16 11:25 IST)
    meridian@supaprod.ai: ikigai Launchpad (reserved)
    harbor@supaprod.ai: founder rehearsal, NEVER send
  free: [voyage@supaprod.ai]

vocabulary:
  banned_everywhere:
    [receipts, ledger, company brain, decision layer, unattended, first run, provenance]
  banned_brain_verbs: [remembers, stores, logs]
  keep: [audit trail, shared brain]
  approve_vs_review: >-
    Use "approve" only where a click UNBLOCKS something. Use "review" where it
    only shows you something.
  banned_filler:
    [leverage, utilize, robust, seamless, cutting-edge, revolutionize, game-changer,
     unlock, empower, supercharge, delve, testament to]
  punctuation: No em dashes, no en dashes, no invisible Unicode in anything pasted.

never_claim:
  - Accumulated learning in the present tense. The honest form is that the loop is wired and proven and begins accruing on first real use.
  - The claim that Supaprod's own roadmap runs inside Supaprod. It does not survive its own database.
  - Any count of human approvals. The gate is a principle as a feature and a liability as a count.
  - Any product-usage number. Every one that ever existed was seed data.
  - The mission names at ISRO. Moon and Mars missions only.
  - Any number that decays before the reader sees it and that they cannot re-derive.

application_rules:
  form_is_the_spec: >-
    Read every question, label, character limit and dropdown option off the LIVE
    form before drafting. If an account gate blocks it, getting past the gate is
    the first task, not something to work around.
  scroll_dropdowns: A visible option is not the best option. Scroll to the bottom.
  optional_fields: >-
    Blank when filling would overstate. FILL when the field shows something true
    that no other field carries. A founder video on a solo application is the
    clearest case for filling.
  numeric_fields: A required revenue or user field gets the TRUE figure. The never-volunteer-the-zero rule governs prose, not numbers.
  never_volunteer_the_zero: >-
    Banned in prose on every application: zero revenue, zero outside users, no
    users, nobody has used it yet, or any sentence whose only job is to announce
    an absence.
  vulnerability_beats: 1     # exactly one, placed where the form invites it
  self_corrections: 1        # exactly one
  rule_6_adjacency: The commit count and "agents write the code" must never share a field.
  unconditional_commitment: Never "if accepted, I will". The programme changes the speed and the postcode, never the decision.
  read_the_verb: '"JOINED" is not "applied". Answer the question actually asked.'
  founder_submits: Never submit an application. The founder submits.

