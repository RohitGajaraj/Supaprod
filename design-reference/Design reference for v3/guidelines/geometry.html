<!-- @dsCard group="Foundations" viewport="700x150" subtitle="4px grid · rhythm 8/12/16/24/40 · radii 8/12/14/99" name="Geometry" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--canvas);
        font-family: var(--font-ui);
        padding: 18px;
        box-sizing: border-box;
        display: flex;
        gap: 28px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div style="display: flex; gap: 10px; align-items: flex-end">
      <div
        style="
          width: 8px;
          height: 8px;
          background: var(--raised);
          border: 1px solid var(--hairline-strong);
        "
      ></div>
      <div
        style="
          width: 12px;
          height: 12px;
          background: var(--raised);
          border: 1px solid var(--hairline-strong);
        "
      ></div>
      <div
        style="
          width: 16px;
          height: 16px;
          background: var(--raised);
          border: 1px solid var(--hairline-strong);
        "
      ></div>
      <div
        style="
          width: 24px;
          height: 24px;
          background: var(--raised);
          border: 1px solid var(--hairline-strong);
        "
      ></div>
      <div
        style="
          width: 40px;
          height: 40px;
          background: var(--raised);
          border: 1px solid var(--hairline-strong);
        "
      ></div>
      <span
        style="
          font-family: var(--font-mono);
          font-size: 8.5px;
          letter-spacing: 0.1em;
          color: var(--text-faint);
          margin-left: 4px;
        "
        >8 / 12 / 16 / 24 / 40</span
      >
    </div>
    <div style="display: flex; gap: 12px; align-items: center">
      <div
        style="
          width: 52px;
          height: 32px;
          border-radius: var(--radius-control);
          background: var(--card);
          border: 1px solid var(--hairline-strong);
          display: grid;
          place-items: center;
          font-family: var(--font-mono);
          font-size: 8px;
          color: var(--text-subtle);
        "
      >
        8
      </div>
      <div
        style="
          width: 52px;
          height: 40px;
          border-radius: var(--radius-card);
          background: var(--card);
          border: 1px solid var(--hairline-strong);
          display: grid;
          place-items: center;
          font-family: var(--font-mono);
          font-size: 8px;
          color: var(--text-subtle);
        "
      >
        12
      </div>
      <div
        style="
          width: 52px;
          height: 48px;
          border-radius: var(--radius-panel);
          background: var(--card);
          border: 1px solid var(--hairline-strong);
          display: grid;
          place-items: center;
          font-family: var(--font-mono);
          font-size: 8px;
          color: var(--text-subtle);
        "
      >
        14
      </div>
      <div
        style="
          width: 64px;
          height: 26px;
          border-radius: var(--radius-pill);
          background: var(--card);
          border: 1px solid var(--hairline-strong);
          display: grid;
          place-items: center;
          font-family: var(--font-mono);
          font-size: 8px;
          color: var(--text-subtle);
        "
      >
        99
      </div>
    </div>
  </body>
</html>
