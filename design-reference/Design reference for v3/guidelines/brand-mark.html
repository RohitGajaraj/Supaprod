<!-- @dsCard group="Brand" viewport="700x170" subtitle="The Butterfly · status instrument, not decoration · glow intensity IS the signal" name="The mark" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--canvas);
        font-family: var(--font-ui);
        padding: 20px;
        box-sizing: border-box;
        display: flex;
        gap: 44px;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <span style="display: inline-flex; flex-direction: column; align-items: center; gap: 9px">
      <img src="../assets/butterfly-idle.svg" width="40" height="40" alt="Idle" />
      <span
        style="
          font-family: var(--font-mono);
          font-size: 8px;
          letter-spacing: 0.1em;
          color: var(--text-faint);
        "
        >IDLE</span
      >
    </span>
    <span style="display: inline-flex; flex-direction: column; align-items: center; gap: 9px">
      <span style="position: relative; display: inline-flex"
        ><span
          aria-hidden="true"
          style="
            position: absolute;
            inset: -8px;
            border-radius: 99px;
            background: radial-gradient(closest-side, rgba(199, 125, 255, 0.34), transparent 72%);
            animation: cadGlow 2.6s ease-in-out infinite;
          "
        ></span
        ><img
          src="../assets/butterfly-working.svg"
          width="40"
          height="40"
          alt="Working"
          style="position: relative"
      /></span>
      <span
        style="
          font-family: var(--font-mono);
          font-size: 8px;
          letter-spacing: 0.1em;
          background: var(--shimmer-gradient);
          background-size: 280% 100%;
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          animation: cadShimmer 5s linear infinite;
        "
        >WORKING</span
      >
    </span>
    <span style="display: inline-flex; flex-direction: column; align-items: center; gap: 9px">
      <span style="position: relative; display: inline-flex"
        ><span
          aria-hidden="true"
          style="
            position: absolute;
            inset: -8px;
            border-radius: 99px;
            background: radial-gradient(closest-side, rgba(255, 107, 44, 0.35), transparent 72%);
            animation: cadGlow 2.2s ease-in-out infinite;
          "
        ></span
        ><img
          src="../assets/butterfly-ember.svg"
          width="40"
          height="40"
          alt="Call waiting"
          style="position: relative"
      /></span>
      <span
        style="
          font-family: var(--font-mono);
          font-size: 8px;
          letter-spacing: 0.1em;
          color: var(--ember);
        "
        >CALL WAITING</span
      >
    </span>
    <div style="max-width: 240px; font-size: 11px; line-height: 1.55; color: var(--text-subtle)">
      Bilateral butterfly, exact production geometry. No ring or halo decoration on the mark itself.
      Wordmark: bold lowercase with an ember full stop.
    </div>
  </body>
</html>
