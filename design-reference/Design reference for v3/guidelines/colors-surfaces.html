<!-- @dsCard group="Colors" viewport="700x150" subtitle="Canvas ramp · depth from tint, not shadow" name="Surfaces" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--canvas);
        font-family: var(--font-ui);
        padding: 16px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div style="display: flex; gap: 8px">
      <div
        style="
          flex: 1;
          background: var(--canvas);
          border: 1px solid var(--hairline-strong);
          border-radius: 10px;
          padding: 14px 12px;
        "
      >
        <div style="font-family: var(--font-mono); font-size: 9.5px; color: var(--text-subtle)">
          #0A0A0B
        </div>
        <div style="font-size: 11.5px; color: var(--text-muted); margin-top: 3px">Canvas</div>
      </div>
      <div
        style="
          flex: 1;
          background: var(--rail);
          border: 1px solid var(--hairline-strong);
          border-radius: 10px;
          padding: 14px 12px;
        "
      >
        <div style="font-family: var(--font-mono); font-size: 9.5px; color: var(--text-subtle)">
          #0D0D0F
        </div>
        <div style="font-size: 11.5px; color: var(--text-muted); margin-top: 3px">Rail</div>
      </div>
      <div
        style="
          flex: 1;
          background: var(--card);
          border: 1px solid var(--hairline-strong);
          border-radius: 10px;
          padding: 14px 12px;
        "
      >
        <div style="font-family: var(--font-mono); font-size: 9.5px; color: var(--text-subtle)">
          #111113
        </div>
        <div style="font-size: 11.5px; color: var(--text-muted); margin-top: 3px">Card</div>
      </div>
      <div
        style="
          flex: 1;
          background: var(--raised);
          border: 1px solid var(--hairline-strong);
          border-radius: 10px;
          padding: 14px 12px;
        "
      >
        <div style="font-family: var(--font-mono); font-size: 9.5px; color: var(--text-subtle)">
          #17171A
        </div>
        <div style="font-size: 11.5px; color: var(--text-muted); margin-top: 3px">Raised</div>
      </div>
      <div
        style="
          flex: 1;
          background: var(--hover);
          border: 1px solid var(--hairline-strong);
          border-radius: 10px;
          padding: 14px 12px;
        "
      >
        <div style="font-family: var(--font-mono); font-size: 9.5px; color: var(--text-subtle)">
          #1D1D21
        </div>
        <div style="font-size: 11.5px; color: var(--text-muted); margin-top: 3px">Hover</div>
      </div>
    </div>
  </body>
</html>
