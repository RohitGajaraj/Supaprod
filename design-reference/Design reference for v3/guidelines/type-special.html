<!-- @dsCard group="Type" viewport="700x160" subtitle="Codystar on aurora scores only · Caveat for pencil annotations only" name="Special inks" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--canvas);
        font-family: var(--font-ui);
        padding: 20px;
        box-sizing: border-box;
        display: flex;
        gap: 40px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div>
      <div
        style="
          font-family: var(--font-dotted);
          font-size: 52px;
          line-height: 1.1;
          color: var(--text-primary);
          letter-spacing: 0.04em;
        "
      >
        84
      </div>
      <div
        style="
          font-family: var(--font-mono);
          font-size: 8.5px;
          letter-spacing: 0.12em;
          color: var(--text-faint);
          margin-top: 4px;
        "
      >
        CODYSTAR · AURORA NUMERALS
      </div>
    </div>
    <div style="display: flex; gap: 24px; align-items: center">
      <span
        style="
          font-family: var(--font-pencil);
          font-size: 21px;
          font-weight: 600;
          color: var(--pencil-lime);
          transform: rotate(-2deg);
          display: inline-block;
          text-shadow: 0 0 14px rgba(205, 224, 122, 0.4);
          border-bottom: 2px solid rgba(205, 224, 122, 0.75);
          padding: 0 2px;
        "
        >best bet</span
      >
      <span
        style="
          font-family: var(--font-pencil);
          font-size: 21px;
          font-weight: 600;
          color: var(--pencil-blossom);
          transform: rotate(1.5deg);
          display: inline-block;
          text-shadow: 0 0 14px rgba(229, 189, 223, 0.4);
          border-bottom: 2px solid rgba(229, 189, 223, 0.75);
          padding: 0 2px;
        "
        >pet feature?</span
      >
      <span
        style="
          font-family: var(--font-pencil);
          font-size: 21px;
          font-weight: 600;
          color: var(--pencil-apricot);
          transform: rotate(-1.5deg);
          display: inline-block;
          text-shadow: 0 0 14px rgba(255, 178, 122, 0.4);
          border-bottom: 2px solid rgba(255, 178, 122, 0.75);
          padding: 0 2px;
        "
        >scope creep!</span
      >
    </div>
  </body>
</html>
