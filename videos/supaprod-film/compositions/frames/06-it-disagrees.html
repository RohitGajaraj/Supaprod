<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- F6 · It disagrees — Decide screen scores both bets; the exciting one loses and is passed.
       v5 shell: full-width top bar → seven-station strip (02 Decide active) → narrow icon rail.
       Head is metadata only; the runtime clones ONLY the <template> below. Duration 10.9s. -->
</head>
<body>
<template>
  <style>
    /* ————— fonts (kit copy of frame.md block, dual-path src) ————— */
    @font-face{font-family:"Geist";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/Geist-Regular.woff2") format("woff2"),url("assets/fonts/Geist-Regular.woff2") format("woff2");}
    @font-face{font-family:"Geist Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistMono-Regular.woff2") format("woff2"),url("assets/fonts/GeistMono-Regular.woff2") format("woff2");}
    @font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2");}
    @font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");}
    @font-face{font-family:"Mona Sans";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/MonaSans-Regular.woff2") format("woff2"),url("assets/fonts/MonaSans-Regular.woff2") format("woff2");}

    /* ————— tokens — declared on #root (a :root selector gets scoped away in the composited render) ————— */
    #root{
      --sk-ground:#0A0A0B;
      --sk-panel:#141416;
      --sk-raised:#1A1A1D;
      --sk-hairline:#26262A;
      --sk-text:#F2EFE9;
      --sk-muted:#A8A29A;
      --sk-faint:#6B6660;
      --sk-discover:#6FA9A0;
      --sk-decide:#C39A5E;
      --sk-plan:#8FA464;
      --sk-design:#AB7FA0;
      --sk-build:#6D97C2;
      --sk-ship:#BD8092;
      --sk-learn:#A89F66;
      --sk-pass:#4FC47A;
      --sk-fail:#EF6A5F;
      --sk-warn:#E8B44C;
      --sk-ember:#FF6B2C;
      --sk-accent:var(--sk-decide);
      --sk-r-chip:7px;
      --sk-r-control:8px;
      --sk-r-row:9px;
      --sk-r-card:10px;
      --sk-r-panel:12px;
      --sk-r-pane:16px;
      --sk-ui:"Mona Sans",system-ui,sans-serif;
      --sk-mono:"IBM Plex Mono",ui-monospace,monospace;
      --sk-ring:0 0 0 1px var(--sk-hairline);
      --sk-ambient:0 24px 80px rgba(0,0,0,.5);
      position:absolute;inset:0;width:100%;height:100%;overflow:hidden;font-family:var(--sk-ui);
    }

    /* ————— ground clip (track 0) — the dependable full-bleed ink ————— */
    .f6-ground{position:absolute;inset:0;background:#0A0A0B;}

    /* ————— frame ground & perspective stage (kit) ————— */
    .sk-frame{
      position:absolute;inset:0;overflow:hidden;
      container-type:size;
      background:var(--sk-ground);
      color:var(--sk-text);
      font-family:var(--sk-ui);
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }
    .sk-frame *,.sk-frame *::before,.sk-frame *::after{box-sizing:border-box;margin:0;padding:0;}
    .sk-stage{
      position:absolute;inset:0;display:grid;place-items:center;
      padding-bottom:10cqh;
      perspective:2200px;
      perspective-origin:50% 42%;
    }
    .sk-screen{
      position:relative;
      width:88cqw;height:82cqh;
      transform:rotateX(1.8deg) rotateY(-2.4deg);
      transform-style:preserve-3d;
      background:var(--sk-ground);
      border-radius:var(--sk-r-pane);
      box-shadow:var(--sk-ring),var(--sk-ambient);
      overflow:hidden;
    }

    /* ————— app shell · the REAL product shell —————
       Full-width top bar → full-width seven-station strip → narrow icon rail
       beside the content. The stations never live in the left nav; the rail is
       its own axis, so the working surface keeps the width the sidebar took. */
    .sk-shell{
      display:grid;height:100%;
      grid-template-columns:2.9cqw minmax(0,1fr);
      grid-template-rows:4cqh 7cqh minmax(0,1fr);
      grid-template-areas:"top top" "spine spine" "rail main";
    }

    /* top bar · bare mark + wordmark · breadcrumb · centred notification strip · ask + avatar */
    .sk-topbar{
      grid-area:top;display:grid;align-items:center;
      grid-template-columns:auto minmax(0,1fr) auto;gap:0.9cqw;
      padding:0 1cqw;border-bottom:1px solid var(--sk-hairline);background:var(--sk-ground);
    }
    .sk-topleft{display:flex;align-items:center;gap:0.7cqw;min-width:0;}
    .sk-brand{display:flex;align-items:center;gap:0.42cqw;}
    .sk-brand-mark{width:1.15cqw;height:1.15cqw;flex:none;display:block;}
    .sk-brand-name{font:600 0.86cqw/1.25 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
    .sk-topdiv{width:1px;height:1.5cqh;flex:none;background:var(--sk-hairline);}
    .sk-crumb{
      display:flex;align-items:center;gap:0.3cqw;white-space:nowrap;
      font:400 0.72cqw/1 var(--sk-ui);color:var(--sk-muted);
    }
    .sk-crumb-sep{color:var(--sk-faint);}
    .sk-crumb-here{color:var(--sk-text);}
    .sk-crumb-caret{font:400 0.6cqw/1 var(--sk-mono);color:var(--sk-faint);}
    .sk-notify{justify-self:center;display:flex;align-items:center;gap:0.45cqw;min-width:0;white-space:nowrap;}
    .sk-notify-gl{display:flex;align-items:center;gap:0.26cqw;flex:none;}
    .sk-notify-gl svg{width:0.72cqw;height:0.72cqw;display:block;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
    .sk-notify-lead{font:500 0.66cqw/1.2 var(--sk-ui);color:var(--sk-text);flex:none;}
    .sk-notify-sub{font:400 0.66cqw/1.2 var(--sk-ui);color:var(--sk-faint);min-width:0;overflow:hidden;text-overflow:ellipsis;}
    .sk-notify-time{font:400 0.6cqw/1.2 var(--sk-ui);color:var(--sk-faint);flex:none;}
    .sk-topright{display:flex;align-items:center;gap:0.6cqw;}
    .sk-ask{
      display:flex;align-items:center;gap:0.38cqw;height:2.3cqh;flex:none;
      padding:0 0.6cqw;background:var(--sk-panel);
      border:1px solid var(--sk-hairline);border-radius:999px;
      font:400 0.7cqw/1 var(--sk-ui);color:var(--sk-text);
    }
    .sk-ask svg{width:0.72cqw;height:0.72cqw;flex:none;stroke:var(--sk-muted);fill:none;stroke-width:1.5;stroke-linejoin:round;}
    .sk-kbd{font:400 0.62cqw/1 var(--sk-mono);color:var(--sk-faint);}
    .sk-avatar{
      width:1.5cqw;height:1.5cqw;flex:none;display:grid;place-items:center;
      background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:50%;
      font:600 0.55cqw/1 var(--sk-ui);color:var(--sk-muted);letter-spacing:0.03em;
    }

    /* ————— station strip · seven numbered cells, full width, straight under the top bar ————— */
    .sk-spine{
      grid-area:spine;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
      border-bottom:1px solid var(--sk-hairline);background:var(--sk-ground);
    }
    .sk-stn{
      position:relative;display:grid;grid-template-rows:1.05cqh 1.75cqh 1.2cqh;gap:0.3cqh;
      align-content:center;padding:0 0.9cqw;min-width:0;
    }
    .sk-stn + .sk-stn{border-left:1px solid var(--sk-hairline);}
    .sk-stn-n{font:400 0.5cqw/1 var(--sk-mono);color:var(--sk-faint);letter-spacing:0.08em;}
    .sk-stn-name{font:400 0.84cqw/1.1 var(--sk-ui);color:var(--sk-muted);letter-spacing:-0.005em;white-space:nowrap;}
    .sk-stn-sub{font:400 0.56cqw/1.1 var(--sk-ui);color:var(--sk-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .sk-stn.is-here .sk-stn-name{font-weight:600;color:var(--sk-text);}
    .sk-stn.is-here .sk-stn-sub{color:var(--sk-ember);}
    .sk-stn.has-work .sk-stn-name{color:color-mix(in srgb,var(--sk-text) 82%,var(--sk-muted));}
    .sk-stn-dot{
      position:absolute;right:0.85cqw;top:1.15cqh;width:0.3cqw;height:0.3cqw;border-radius:50%;
      background:var(--sk-ember);box-shadow:0 0 0.5cqw color-mix(in srgb,var(--sk-ember) 62%,transparent);
    }

    /* ————— narrow icon rail · Today · Runs · Brain · Crew · Engine room ————— */
    .sk-rail{
      grid-area:rail;display:flex;flex-direction:column;align-items:center;min-height:0;
      padding:0.85cqh 0;background:var(--sk-ground);border-right:1px solid var(--sk-hairline);
    }
    .sk-railtop{display:flex;flex-direction:column;align-items:center;gap:0.42cqh;}
    .sk-railfoot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:0.3cqh;}
    .sk-glyph{
      position:relative;width:1.95cqw;height:1.95cqw;flex:none;
      display:grid;place-items:center;border-radius:var(--sk-r-control);color:var(--sk-faint);
    }
    .sk-glyph svg{
      width:1.02cqw;height:1.02cqw;display:block;fill:none;stroke:currentColor;
      stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
    }
    .sk-glyph.is-active{background:var(--sk-raised);color:var(--sk-text);box-shadow:inset 0 0 0 1px var(--sk-hairline);}
    .sk-railfoot .sk-glyph{width:1.7cqw;height:1.7cqw;}
    .sk-railfoot .sk-glyph svg{width:0.9cqw;height:0.9cqw;}
    .sk-livedot{
      width:0.26cqw;height:0.26cqw;flex:none;border-radius:50%;
      background:var(--sk-pass);box-shadow:0 0 0.4cqw var(--sk-pass);
    }

    /* ————— true-UI type (kit) ————— */
    .sk-title{font:600 1.3cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.01em;}
    .sk-body{font:400 0.73cqw/1.45 var(--sk-ui);color:var(--sk-text);}
    .sk-meta{font:400 0.68cqw/1.4 var(--sk-ui);color:var(--sk-muted);}
    .sk-label{font:500 0.65cqw/1.4 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.10em;text-transform:uppercase;}
    .sk-spacer{flex:1;}

    /* ————— panels · rows (kit) ————— */
    .sk-panel{
      background:var(--sk-panel);border:1px solid var(--sk-hairline);
      border-radius:var(--sk-r-panel);overflow:hidden;min-height:0;
      display:flex;flex-direction:column;
    }
    .sk-panel-hd{
      display:flex;align-items:center;gap:0.6cqw;flex:none;
      padding:0.75cqw 1cqw;border-bottom:1px solid var(--sk-hairline);
    }
    .sk-panel-title{font:600 0.83cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
    .sk-panel-body{flex:1;min-height:0;overflow:hidden;}
    .sk-panel-ft{
      display:flex;align-items:center;gap:0.6cqw;flex:none;
      padding:0.6cqw 1cqw;border-top:1px solid var(--sk-hairline);background:var(--sk-panel);
    }
    .sk-row{padding:0.7cqw 1cqw;}
    .sk-row + .sk-row{border-top:1px solid var(--sk-hairline);}

    /* ————— chips · badges (kit) ————— */
    .sk-chip{
      display:inline-flex;align-items:center;gap:0.3cqw;
      padding:0.22cqw 0.45cqw;border:1px solid var(--sk-hairline);
      border-radius:var(--sk-r-chip);background:rgba(255,255,255,0.02);
      font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;
      white-space:nowrap;
    }
    .sk-chip.is-on,
    .sk-chip--accent{color:var(--sk-accent);border-color:color-mix(in srgb,var(--sk-accent) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-accent) 8%,transparent);}
    .sk-chip--pass{color:var(--sk-pass);border-color:color-mix(in srgb,var(--sk-pass) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-pass) 8%,transparent);}
    .sk-chip--fail{color:var(--sk-fail);border-color:color-mix(in srgb,var(--sk-fail) 42%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-fail) 9%,transparent);}
    .sk-dot-inline{width:0.26cqw;height:0.26cqw;flex:none;border-radius:50%;background:currentColor;}
    .sk-badge{
      display:inline-flex;align-items:center;padding:0.22cqw 0.45cqw;
      background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:var(--sk-r-chip);
      font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-muted);font-variant-numeric:tabular-nums;
    }

    /* ————— score + sub-bars (kit) ————— */
    .sk-score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.1cqw;align-items:center;margin-top:0.7cqw;}
    .sk-score-main{display:flex;flex-direction:column;align-items:flex-start;gap:0.15cqw;}
    .sk-score-num{
      font:500 1.5cqw/1 var(--sk-mono);color:var(--sk-accent);
      letter-spacing:-0.03em;font-variant-numeric:tabular-nums;
    }
    .sk-score-cap{font:500 0.5cqw/1 var(--sk-mono);color:var(--sk-faint);letter-spacing:0.08em;text-transform:uppercase;}
    .sk-score-bars{display:flex;flex-direction:column;gap:0.45cqw;}
    .sk-subbar{display:grid;grid-template-columns:4.6cqw minmax(0,1fr) 1.9cqw;gap:0.55cqw;align-items:center;}
    .sk-subbar-name{font:400 0.55cqw/1 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.04em;}
    .sk-subbar-track{display:block;height:0.18cqw;background:var(--sk-hairline);border-radius:2px;overflow:hidden;}
    .sk-subbar-track i{display:block;height:100%;background:var(--sk-accent);border-radius:inherit;will-change:transform;}
    .sk-subbar-val{font:400 0.55cqw/1 var(--sk-mono);color:var(--sk-muted);text-align:right;font-variant-numeric:tabular-nums;}
    .sk-score--dim .sk-subbar-track i{background:#4B4B51;}
    .sk-score--dim .sk-subbar-name,.sk-score--dim .sk-subbar-val{color:var(--sk-faint);}

    /* ————— bet detail cards ————— */
    .sk-betcard{
      flex:none;padding:1.05cqw 1.15cqw;background:var(--sk-raised);
      border:1px solid var(--sk-hairline);border-radius:var(--sk-r-card);
    }
    .sk-betcard-hd{display:flex;align-items:center;gap:0.55cqw;}
    .sk-betcard-title{position:relative;font:600 0.95cqw/1.25 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
    .sk-betcard .sk-meta{margin-top:0.3cqw;font-size:0.62cqw;}
    .sk-betnote{
      display:flex;align-items:baseline;gap:0.45cqw;margin-top:0.8cqw;padding-top:0.65cqw;
      border-top:1px solid var(--sk-hairline);
      font:400 0.6cqw/1.4 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;
    }
    .sk-betnote span{color:var(--sk-accent);flex:none;}
    .sk-agentline{
      display:flex;align-items:center;gap:0.5cqw;
      padding:0.6cqw 0.8cqw;background:var(--sk-raised);
      border:1px solid var(--sk-hairline);border-radius:var(--sk-r-row);
      font:400 0.62cqw/1.3 var(--sk-mono);color:var(--sk-muted);
    }
    .sk-run{color:var(--sk-accent);text-align:center;}

    /* ————— cursor (kit) ————— */
    .sk-cursor{position:absolute;z-index:90;width:1.05cqw;height:1.05cqw;pointer-events:none;left:31cqw;top:56cqh;opacity:0;will-change:transform,opacity;}
    .sk-cursor svg{display:block;width:100%;height:100%;overflow:visible;}
    .sk-cursor svg path{fill:var(--sk-text);stroke:var(--sk-ground);stroke-width:1.1;stroke-linejoin:round;}

    /* ————— frame-6 specifics ————— */
    #f6cam{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform;}
    .f6-content{
      grid-area:main;position:relative;display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr) 16cqw;
      grid-template-rows:auto auto minmax(0,1fr);
      gap:1cqw;padding:1.1cqw;min-height:0;
    }
    .f6-head{grid-column:1/-1;display:flex;align-items:baseline;gap:0.8cqw;}
    .f6-cell{position:relative;grid-row:2;align-self:start;min-height:0;}
    .f6-card{--dof:0px;filter:blur(var(--dof));will-change:filter,transform,opacity;position:relative;}
    .f6-slot{
      position:absolute;inset:0;display:grid;place-items:center;
      border:1px dashed color-mix(in srgb,var(--sk-fail) 30%,var(--sk-hairline));
      border-radius:var(--sk-r-card);background:color-mix(in srgb,var(--sk-fail) 3%,transparent);
      opacity:0;pointer-events:none;
    }
    .f6-slot-txt{font:400 0.62cqw/1.3 var(--sk-mono);color:color-mix(in srgb,var(--sk-fail) 62%,var(--sk-faint));letter-spacing:0.03em;}
    .f6-ring{
      position:absolute;inset:0;border:1px solid var(--sk-pass);border-radius:var(--sk-r-card);
      box-shadow:0 0 1cqw rgba(79,196,122,0.20);
      opacity:0;pointer-events:none;
    }
    .f6-strike{
      position:absolute;left:0;right:0;top:52%;height:1.5px;background:var(--sk-fail);
      transform:scaleX(0);transform-origin:0 50%;will-change:transform;
    }
    .f6-reveal{opacity:0;}
    .f6-note{opacity:0;will-change:transform,opacity;}
    .f6-val{opacity:0;}
    /* what each score is built from — the data under the disagreement */
    .f6-ev{
      margin-top:0.85cqw;padding-top:0.7cqw;border-top:1px solid var(--sk-hairline);
      display:flex;flex-direction:column;gap:0.4cqw;
    }
    .f6-evhd{font:500 0.55cqw/1 var(--sk-mono);color:var(--sk-faint);letter-spacing:0.10em;text-transform:uppercase;}
    .f6-evrow{
      display:grid;grid-template-columns:minmax(0,1fr) 4.2cqw 6.2cqw;gap:0.5cqw;align-items:baseline;
      font:400 0.66cqw/1.3 var(--sk-ui);color:var(--sk-text);opacity:0;
    }
    .f6-evrow b{font:400 0.6cqw/1.3 var(--sk-mono);color:var(--sk-muted);text-align:right;font-variant-numeric:tabular-nums;}
    .f6-evrow em{font:400 0.57cqw/1.3 var(--sk-mono);font-style:normal;color:var(--sk-faint);text-align:right;white-space:nowrap;}
    .f6-evrow em.is-direct{color:var(--sk-pass);}
    .f6-evrow em.is-thin{color:color-mix(in srgb,var(--sk-fail) 62%,var(--sk-muted));}
    .f6-rail{grid-column:3;grid-row:2/span 2;align-self:stretch;}
    .f6-rail-body{position:relative;flex:1;min-height:0;overflow:hidden;}
    .f6-passrow-title{font:400 0.73cqw/1.35 var(--sk-ui);color:var(--sk-muted);}
    .f6-passrow-title s{color:var(--sk-faint);}
    .f6-passrow-meta{margin-top:0.2cqw;font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-faint);font-variant-numeric:tabular-nums;}
    .f6-shiftrow{will-change:transform;}
    .f6-incoming{
      position:absolute;top:0.5cqw;left:0.6cqw;right:0.6cqw;z-index:5;
      padding:0.6cqw 0.8cqw;background:color-mix(in srgb,var(--sk-fail) 7%,var(--sk-raised));
      border:1px solid color-mix(in srgb,var(--sk-fail) 40%,var(--sk-hairline));border-radius:var(--sk-r-row);
      opacity:0;transform-origin:50% 50%;will-change:transform,opacity;
    }
    .f6-incoming .f6-passrow-title s{color:color-mix(in srgb,var(--sk-fail) 70%,var(--sk-muted));}
    .f6-badge{display:inline-grid;}
    .f6-badge span{grid-area:1/1;text-align:center;}
    .f6-b3{opacity:0;}
    .f6-agentwrap{grid-column:1/3;grid-row:3;align-self:start;position:relative;}
    #f6-agentB{position:absolute;inset:0;opacity:0;}
    .f6-agenttrack{display:block;width:9cqw;height:0.18cqw;background:var(--sk-hairline);border-radius:2px;overflow:hidden;flex:none;}
    .f6-agentfill{display:block;width:100%;height:100%;background:var(--sk-accent);border-radius:inherit;transform:scaleX(0.06);transform-origin:0 50%;}
    /* drag proxy · the small card the cursor actually carries to the rail */
    .f6-ghost{
      position:absolute;left:1.09cqw;top:6.76cqh;width:16.7cqw;z-index:80;
      padding:0.6cqw 0.75cqw;background:var(--sk-raised);
      border:1px solid var(--sk-hairline);border-radius:var(--sk-r-row);
      box-shadow:var(--sk-ring),var(--sk-ambient);
      opacity:0;transform-origin:50% 50%;will-change:transform,opacity;
    }
    .f6-ghost-hd{display:flex;align-items:center;gap:0.5cqw;}

                      <h2 class="sk-panel-title" style="font-size:0.78cqw;">Passed</h2>
                      <span class="sk-spacer"></span>
                      <span class="sk-badge f6-badge"><span id="f6-b2">4</span><span class="f6-b3" id="f6-b3">5</span></span>
                    </header>
                    <div class="sk-panel-body f6-rail-body">
                      <!-- incoming struck row (scale-swap target, fail-red) -->
                      <div class="f6-incoming" id="f6-incoming">
                        <p class="f6-passrow-title"><s>redesign the app</s></p>
                        <p class="f6-passrow-meta">scored 4.0 · passed just now</p>
                      </div>
                      <div class="sk-row f6-shiftrow f6-pr" id="f6-pr1">
                        <p class="f6-passrow-title"><s>add AI to everything</s></p>
                        <p class="f6-passrow-meta">scored 3.1 · 3w ago</p>
                      </div>
                      <div class="sk-row f6-shiftrow f6-pr" id="f6-pr2">
                        <p class="f6-passrow-title"><s>rewrite in the new stack</s></p>
                        <p class="f6-passrow-meta">scored 2.8 · 5w ago</p>
                      </div>
                      <div class="sk-row f6-shiftrow f6-pr" id="f6-pr3">
                        <p class="f6-passrow-title"><s>one more analytics dashboard</s></p>
                        <p class="f6-passrow-meta">scored 2.4 · 7w ago</p>
                      </div>
                      <div class="sk-row f6-shiftrow f6-pr" id="f6-pr4">
                        <p class="f6-passrow-title"><s>in-app tour, take two</s></p>
                        <p class="f6-passrow-meta">scored 2.1 · 9w ago</p>
                      </div>
                    </div>
                    <footer class="sk-panel-ft">
                      <span class="sk-meta" style="font-size:0.6cqw;">every call keeps its scoring</span>
                      <span class="sk-spacer"></span>
                      <span class="sk-meta" style="font-size:0.6cqw;color:var(--sk-accent);">open →</span>
                    </footer>
                  </section>

                  <!-- drag proxy + click ripple + cursor · ride the screen tilt with the content -->
                  <div class="f6-ghost" id="f6-ghost">
                    <div class="f6-ghost-hd">
                      <span class="f6-ghost-title">redesign the app</span>
                      <span class="sk-spacer"></span>
                      <span class="sk-badge">4.0</span>
                    </div>
                  </div>
                  <div class="f6-ripple" id="f6-ripple"></div>
                  <div class="sk-cursor" id="f6-cursor">
                    <svg viewBox="0 0 24 24"><path d="M5.5 3.2 L5.5 18.6 L9.3 15.1 L11.8 20.6 L14.4 19.4 L11.9 14 L17 13.5 Z" /></svg>
                  </div>

                </main>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- track 2 · film overlay — lower-third, above the caption keep-out -->
    <div id="f6-overlay" class="clip f6-overlay" data-start="0" data-duration="10.9" data-track-index="2">
      <div class="sk-lowerthird">
        <span class="sk-lt-kicker" id="f6-lt-k">02 · Decide</span>
        <span class="sk-lt-line" id="f6-lt-l">it can say no — and show why.</span>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
  <script>
    gsap.defaults({ lazy: false });   // paused, seeked timelines never tick — lazy tweens would render stale start values
        window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const DUR = 10.9;
    const camEl = document.getElementById("f6cam");
    const screenEl = document.getElementById("f6-screen");

    /* ── VO cue map (06.mp3, clip-relative, measured) ───────────────────
       0.31–2.16  "It scores each bet."
       2.76–4.48  "When the data says you're wrong"
       4.83–5.76  "it disagrees."
       6.29–7.59  "And the exciting idea"
       7.83–10.07 "loses to the boring one that pays."
       10.07–10.9 held read (the slack lives here)                      */

    /* ── macro camera (multi-phase-camera + viewport-change) ───────────
       One world wrapper; cam is the single source of truth; one driver
       tween writes transform every frame (phase moves + sine micro-drift).
       The screen is 88cqw × 82cqh on a stage with 10cqh bottom padding, so
       its untransformed top sits 54px above frame centre. `ly` is the px of
       ink wanted ABOVE the screen; the vertical translate is derived from it
       (y = 496.8·s − 540 + ly) so the shell stays framed at every scale, and
       |x| ≤ 844.8·s − 960 keeps the side edges past the frame edges. */
    const cam = { s: 1.10, x: -16, ly: 53 };
    const tilt = { rx: 1.8, ry: -2.4 };
    const applyTilt = () => { screenEl.style.transform = "rotateX(" + tilt.rx.toFixed(3) + "deg) rotateY(" + tilt.ry.toFixed(3) + "deg)"; };
    applyTilt();

    /* ── motion-blur streak (horizontal, peaks at max pan velocity) ── */
    const blurNode = document.getElementById("f6-streak-blur");
    const blurProxy = { v: 0 };
    const writeBlur = () => {
      blurNode.setAttribute("stdDeviation", blurProxy.v.toFixed(2) + " 0");
      camEl.style.filter = blurProxy.v < 0.02 ? "none" : "url(#f6-streak)";
    };
    writeBlur(); // seed frame 0

    /* ── single deterministic driver: phase state + micro-drift ── */
    const DRIFT_CYCLES = 2.1, AMP_X = 5, AMP_Y = 3, FREQ_RATIO = 1.31;
    const driver = { t: 0 };
    const apply = () => {
      const p = (driver.t / DUR) * Math.PI * 2 * DRIFT_CYCLES;
      const dx = Math.sin(p) * AMP_X;
      const dy = Math.sin(p * FREQ_RATIO) * AMP_Y;
      const y = 496.8 * cam.s - 540 + cam.ly;
      camEl.style.transform =
        "translate(" + (cam.x + dx).toFixed(2) + "px," + (y + dy).toFixed(2) + "px) scale(" + cam.s.toFixed(4) + ")";
    };

    /* ═════════ Scene 1 (0.0–2.4) · "It scores each bet." ═════════ */
    tl.fromTo("#f6-frame", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.01);
    // arrival settle, then a slow push across the pair while the scoring runs
    tl.to(cam, { s: 1.155, x: -18, ly: 30, duration: 2.25, ease: "power2.out", onUpdate: apply }, 0.1);
    tl.to(tilt, { rx: 1.2, ry: -1.7, duration: 2.25, ease: "power2.out", onUpdate: applyTilt }, 0.1);

    tl.fromTo("#f6-lt-k", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5,  ease: "power3.out" }, 0.5);
    tl.fromTo("#f6-lt-l", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.68);
    tl.fromTo(".f6-headmeta", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.35);
    tl.fromTo(".f6-headchip", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.06 }, 0.45);
    tl.fromTo(".f6-pr", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", stagger: 0.09 }, 0.35);

    // agent presence · the working indicator runs the whole score fill
    tl.fromTo("#f6-agentA", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.25);
    tl.fromTo("#f6-agentfill", { scaleX: 0.06 }, { scaleX: 0.97, duration: 1.75, ease: "power1.inOut" }, 0.4);

    // sub-bars fill on "scores", then the two composites tick up (sfx: two score ticks)
    tl.fromTo(".f6-bar", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 1.05, ease: "power3.out", stagger: 0.05 }, 0.55);
    tl.fromTo(".f6-val", { opacity: 0 }, { opacity: 1, duration: 0.32, ease: "power2.out", stagger: 0.04 }, 1.45);
    // the inputs the scores are built on read in as the agent weighs them
    tl.fromTo(".f6-evrow", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.32, ease: "power2.out", stagger: 0.05 }, 0.4);

    const numL = document.getElementById("f6-num-l");
    const numR = document.getElementById("f6-num-r");
    const scoreL = { v: 0, fs: 1.05 };
    const scoreR = { v: 0, fs: 1.05 };
    const writeL = () => { numL.textContent = scoreL.v.toFixed(1); numL.style.fontSize = scoreL.fs.toFixed(3) + "cqw"; };
    const writeR = () => { numR.textContent = scoreR.v.toFixed(1); numR.style.fontSize = scoreR.fs.toFixed(3) + "cqw"; };
    writeL(); writeR();
    tl.to(scoreL, { v: 4.0, fs: 1.5, duration: 1.15, ease: "power3.out", onUpdate: writeL }, 0.62);
    tl.to(scoreR, { v: 8.0, fs: 1.5, duration: 1.35, ease: "power3.out", onUpdate: writeR }, 0.72);
    tl.to(numL, { color: "#F2EFE9", duration: 1.15, ease: "power2.out" }, 0.62);
    tl.to(numR, { color: "#C39A5E", duration: 1.35, ease: "power2.out" }, 0.72);

    // the losing card's own note lands in the beat of quiet after the first sentence
    tl.fromTo("#f6-note-l", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.2);

    /* ═════════ Scene 2 (2.4–6.2) · "When the data says you're wrong — it disagrees." ═════════ */
    // pan onto the winner as the evidence-based dissent note lands
    tl.to(cam, { s: 1.30, x: -120, ly: 0, duration: 1.0, ease: "power2.inOut", onUpdate: apply }, 2.75);
    tl.to(tilt, { rx: 1.0, ry: -1.2, duration: 1.0, ease: "power2.inOut", onUpdate: applyTilt }, 2.75);
    tl.to(blurProxy, { v: 5.5, duration: 0.5, ease: "power2.in",  onUpdate: writeBlur }, 2.75);
    tl.to(blurProxy, { v: 0,   duration: 0.5, ease: "power2.out", onUpdate: writeBlur }, 3.25);

    // "the data says you're wrong" — the agent's take, with the data under it
    tl.fromTo("#f6-note-r", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.0);
    tl.fromTo("#f6-card-l", { "--dof": "0px" }, { "--dof": "2.4px", opacity: 0.84, duration: 0.7, ease: "power2.inOut" }, 3.05);

    // breathe between the two halves of the sentence (camera never sleeps)
    tl.to(cam, { s: 1.32, x: -112, duration: 0.95, ease: "power1.inOut", onUpdate: apply }, 3.85);

    // "it disagrees." — rack back to the exciting one as it takes the reject state
    tl.to(cam, { s: 1.30, x: 132, duration: 0.9, ease: "power2.inOut", onUpdate: apply }, 4.8);
    tl.to("#f6-card-l", { "--dof": "0px", opacity: 1, duration: 0.7, ease: "power2.inOut" }, 4.8);
    tl.fromTo("#f6-card-r", { "--dof": "0px" }, { "--dof": "2.2px", opacity: 0.86, duration: 0.7, ease: "power2.inOut" }, 4.85);
    tl.fromTo("#f6-reject", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.95);

    /* ═════════ Scene 3 (6.2–10.9) · "And the exciting idea loses to the boring one that pays." ═════════ */
    // pull back so both cards and the Passed rail are in frame for the kill
    tl.to(cam, { s: 1.16, x: 0, ly: 30, duration: 0.85, ease: "power2.inOut", onUpdate: apply }, 5.8);
    tl.to("#f6-card-r", { "--dof": "0px", opacity: 1, duration: 0.6, ease: "power2.inOut" }, 5.85);
    tl.to(tilt, { rx: 1.5, ry: -2.1, duration: 0.85, ease: "power2.inOut", onUpdate: applyTilt }, 5.8);

    /* Screen-local geometry (measured): left card 77,192 623×335 · Passed rail 1362,192
       · incoming row 1375,257 282×62 · cursor hotspot at translate 0 = (656,727)
       · ripple centre at translate 0 = (56,119). */
    // cursor arcs to the exciting card on "And the exciting idea" (x and y on different eases)
    tl.set("#f6-cursor", { x: -150, y: -70 }, 0);
    tl.fromTo("#f6-cursor", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 6.05);
    tl.to("#f6-cursor", { x: -406, duration: 0.75, ease: "power1.inOut" }, 6.2);
    tl.to("#f6-cursor", { y: -515, duration: 0.75, ease: "power2.out" }, 6.2);
    // press (cursor-click-ripple: press → release → ripple on the grab point)
    tl.to("#f6-cursor", { scale: 0.86, duration: 0.09, ease: "power2.in" }, 7.0);
    tl.to("#f6-cursor", { scale: 1, duration: 0.16, ease: "power2.out" }, 7.09);
    tl.set("#f6-ripple", { x: 194, y: 93 }, 0);
    tl.fromTo("#f6-ripple", { scale: 0.2, opacity: 0.5 }, { scale: 2.6, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, 7.04);

    // grab · the card hands a proxy to the cursor and dims in place
    tl.to("#f6-card-l", { opacity: 0.5, duration: 0.25, ease: "power2.out" }, 7.12);
    tl.fromTo("#f6-ghost", { opacity: 0, scale: 0.86, rotation: 1.4 }, { opacity: 1, scale: 1, rotation: 1.4, duration: 0.26, ease: "power3.out" }, 7.1);
    tl.to("#f6-cursor", { x: 800, y: -455, duration: 0.85, ease: "power2.inOut" }, 7.15);
    tl.to("#f6-ghost", { x: 1279, y: 66, duration: 0.85, ease: "power2.inOut" }, 7.15);
    // camera follows the drag, streaking at peak velocity
    tl.to(cam, { s: 1.18, x: -20, ly: 18, duration: 1.05, ease: "power2.inOut", onUpdate: apply }, 7.05);
    tl.to(blurProxy, { v: 7, duration: 0.5, ease: "power2.in",  onUpdate: writeBlur }, 7.15);
    tl.to(blurProxy, { v: 0, duration: 0.5, ease: "power2.out", onUpdate: writeBlur }, 7.65);

    // "loses" · the strike sweeps the losing card in fail-red and it dims out
    tl.fromTo("#f6-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.26, ease: "power2.out" }, 7.83);
    tl.to("#f6-card-l", { opacity: 0.34, borderColor: "#EF6A5F", duration: 0.3, ease: "power2.out" }, 7.83);
    tl.to("#f6-ghost", { borderColor: "#EF6A5F", duration: 0.26, ease: "power2.out" }, 7.83);
    // the proxy drops into the rail (scale-swap-transition)
    tl.to("#f6-ghost", { scale: 0.7, opacity: 0, duration: 0.3, ease: "power2.in" }, 8.06);
    tl.to("#f6-card-l", { opacity: 0, duration: 0.35, ease: "power2.in" }, 8.16);

    // scale-swap-transition · the struck row pops into the Passed rail, the stack shifts, the count ticks
    tl.fromTo("#f6-incoming", { scale: 0.72, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 8.2);
    tl.to(".f6-shiftrow", { y: 52, duration: 0.45, ease: "power3.out" }, 8.12);
    tl.to("#f6-b2", { opacity: 0, duration: 0.22, ease: "power1.inOut" }, 8.2);
    tl.to("#f6-b3", { opacity: 1, duration: 0.22, ease: "power1.inOut" }, 8.2);
    // the vacated slot says where it went
    tl.fromTo("#f6-slot", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 8.3);

    // "to the boring one that pays" · the winner advances — pass-green edge, advancing chip
    tl.fromTo("#f6-ring", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 8.55);
    tl.to("#f6-card-r", { scale: 1.018, duration: 0.5, ease: "power2.out" }, 8.55);
    tl.fromTo("#f6-advance", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 8.7);
    // the agent line hands the winner to the next station
    tl.to("#f6-agentA", { opacity: 0, duration: 0.3, ease: "power1.out" }, 8.6);
    tl.fromTo("#f6-agentB", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 8.68);
    tl.to("#f6-cursor", { x: 594, y: -512, duration: 0.9, ease: "power2.inOut" }, 8.5);

    // push onto the winner, then a settled held read (10.07–10.9 absorbs the slack)
    tl.to(cam, { s: 1.34, x: -150, ly: -28, duration: 1.35, ease: "power2.inOut", onUpdate: apply }, 8.2);
    tl.to(tilt, { rx: 1.0, ry: -1.1, duration: 1.35, ease: "power2.inOut", onUpdate: applyTilt }, 8.2);
    tl.to(cam, { s: 1.355, x: -156, ly: -34, duration: 1.35, ease: "power1.inOut", onUpdate: apply }, 9.55);

    /* driver registered LAST so it reads each frame's settled cam values */
    tl.to(driver, { t: DUR, duration: DUR, ease: "none", onUpdate: apply }, 0);
    apply(); // seed t=0

    window.__timelines["06-it-disagrees"] = tl;
  </script>
</template>
