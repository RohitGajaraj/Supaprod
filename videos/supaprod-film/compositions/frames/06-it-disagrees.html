<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- F6 · It disagrees — Decide screen scores both bets; the exciting one loses and is passed.
       Head is metadata only; the runtime clones ONLY the <template> below. -->
</head>
<body>
<template>
  <style>
    /* ————— fonts (screen kit, dual-path src) ————— */
    @font-face{font-family:"Geist";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/Geist-Regular.woff2") format("woff2"),url("assets/fonts/Geist-Regular.woff2") format("woff2");}
    @font-face{font-family:"Geist Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistMono-Regular.woff2") format("woff2"),url("assets/fonts/GeistMono-Regular.woff2") format("woff2");}
    @font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2");}
    @font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");}
    @font-face{font-family:"Mona Sans";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/MonaSans-Regular.woff2") format("woff2"),url("assets/fonts/MonaSans-Regular.woff2") format("woff2");}

    /* ————— tokens (screen kit v3 — declared on #root, inherit down; :root breaks under scoping) ————— */
    #root{
      --sk-ground:#0A0A0B;
      --sk-panel:#141416;
      --sk-raised:#1A1A1D;
      --sk-hairline:#26262A;
      --sk-text:#F2EFE9;
      --sk-muted:#A8A29A;
      --sk-faint:#6B6660;
      --sk-discover:#6FA9A0;
      --sk-decide:#C39A5E;
      --sk-plan:#8FA464;
      --sk-design:#AB7FA0;
      --sk-build:#6D97C2;
      --sk-ship:#BD8092;
      --sk-learn:#A89F66;
      --sk-pass:#4FC47A;
      --sk-fail:#EF6A5F;
      --sk-warn:#E8B44C;
      --sk-ember:#FF6B2C;
      --sk-accent:var(--sk-decide);
      --sk-r-chip:7px;
      --sk-r-control:8px;
      --sk-r-row:9px;
      --sk-r-card:10px;
      --sk-r-panel:12px;
      --sk-r-pane:16px;
      --sk-ui:"Mona Sans",system-ui,sans-serif;
      --sk-mono:"IBM Plex Mono",ui-monospace,monospace;
      --sk-ring:0 0 0 1px var(--sk-hairline);
      --sk-ambient:0 24px 80px rgba(0,0,0,.5);
      position:absolute;inset:0;width:100%;height:100%;overflow:hidden;
    }

    /* ————— ground clip (track 0) — the dependable full-bleed ink ————— */
    .f6-ground{position:absolute;inset:0;background:#0A0A0B;}

    /* ————— world clip (track 1) — kit frame + camera rig ————— */
    .f6-world{position:absolute;inset:0;}
    .sk-frame{
      position:relative;width:100%;height:100%;overflow:hidden;
      container-type:size;
      background:var(--sk-ground);
      color:var(--sk-text);
      font-family:var(--sk-ui);
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }
    .sk-frame *,.sk-frame *::before,.sk-frame *::after{box-sizing:border-box;margin:0;padding:0;}
    /* camera wrapper — single world transform (multi-phase-camera + viewport-change) */
    .f6-cam{
      position:absolute;inset:0;
      transform-origin:50% 50%;
      will-change:transform,filter;
      filter:url(#f6-pushblur);
    }
    .sk-stage{
      position:absolute;inset:0;display:grid;place-items:center;
      perspective:2200px;
      perspective-origin:50% 42%;
    }
    .sk-screen{
      position:relative;
      width:88cqw;height:86cqh;
      transform:rotateX(2.7deg) rotateY(-4.2deg);
      transform-style:preserve-3d;
      background:var(--sk-ground);
      border-radius:var(--sk-r-pane);
      box-shadow:var(--sk-ring),var(--sk-ambient);
      overflow:hidden;
      will-change:transform;
    }

    /* ————— app shell ————— */
    .sk-shell{
      display:grid;height:100%;
      grid-template-columns:12.5cqw minmax(0,1fr);
      grid-template-rows:3.2cqh minmax(0,1fr);
      grid-template-areas:"side top" "side main";
    }
    .sk-sidebar{
      grid-area:side;display:flex;flex-direction:column;min-height:0;
      background:var(--sk-ground);border-right:1px solid var(--sk-hairline);
    }
    .sk-ws{display:flex;align-items:center;gap:0.55cqw;padding:1cqw 1cqw 0.8cqw;}
    .sk-ws-mark{
      width:0.72cqw;height:0.72cqw;flex:none;border-radius:50%;
      border:1px solid var(--sk-ember);
      background:radial-gradient(circle at 50% 50%,var(--sk-ember) 0 28%,transparent 30%);
    }
    .sk-ws-name{font:600 0.82cqw/1 var(--sk-ui);color:var(--sk-text);letter-spacing:0.01em;}
    .sk-ws-caret{margin-left:auto;font:400 0.6cqw/1 var(--sk-mono);color:var(--sk-faint);}
    .sk-nav{display:flex;flex-direction:column;gap:0.12cqh;padding:0.3cqw 0.5cqw;}
    .sk-navrow{
      display:flex;align-items:center;gap:0.55cqw;
      padding:0.42cqw 0.6cqw;border-radius:var(--sk-r-row);
      font:400 0.73cqw/1 var(--sk-ui);color:var(--sk-muted);
    }
    .sk-navrow .sk-dot{
      width:0.3cqw;height:0.3cqw;flex:none;border-radius:50%;
      background:var(--dot,var(--sk-faint));
    }
    .sk-navcount{margin-left:auto;font:400 0.55cqw/1 var(--sk-mono);color:var(--sk-faint);}
    .sk-navrow.is-active{background:var(--sk-raised);color:var(--sk-text);}
    .sk-navrow.is-active .sk-dot{box-shadow:0 0 0.45cqw 0 var(--dot,var(--sk-accent));}
    .sk-navrow.is-active .sk-navcount{color:var(--sk-muted);}
    .sk-side-foot{
      margin-top:auto;display:flex;align-items:center;gap:0.45cqw;
      padding:0.85cqw 1cqw;border-top:1px solid var(--sk-hairline);
      font:400 0.57cqw/1 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.03em;
    }
    .sk-livedot{
      width:0.26cqw;height:0.26cqw;flex:none;border-radius:50%;
      background:var(--sk-pass);box-shadow:0 0 0.4cqw var(--sk-pass);
    }
    .sk-topbar{
      grid-area:top;display:flex;align-items:center;gap:0.9cqw;
      padding:0 1cqw;border-bottom:1px solid var(--sk-hairline);background:var(--sk-ground);
    }
    .sk-crumb{display:flex;align-items:center;font:400 0.62cqw/1 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;}
    .sk-crumb-sep{padding:0 0.35cqw;color:var(--sk-faint);}
    .sk-crumb-here{color:var(--sk-text);}
    .sk-ask{
      display:flex;align-items:center;gap:0.5cqw;flex:0 1 20cqw;height:2.1cqh;
      padding:0 0.4cqw 0 0.65cqw;background:var(--sk-panel);
      border:1px solid var(--sk-hairline);border-radius:var(--sk-r-control);
      font:400 0.66cqw/1 var(--sk-ui);color:var(--sk-faint);
    }
    .sk-ask svg{width:0.68cqw;height:0.68cqw;flex:none;stroke:var(--sk-faint);fill:none;stroke-width:1.6;}
    .sk-kbd{
      margin-left:auto;padding:0.1cqw 0.32cqw;
      font:400 0.57cqw/1.4 var(--sk-mono);color:var(--sk-faint);
      background:var(--sk-ground);border:1px solid var(--sk-hairline);border-radius:5px;
    }
    .sk-avatar{
      width:1.25cqw;height:1.25cqw;flex:none;display:grid;place-items:center;
      background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:50%;
      font:600 0.5cqw/1 var(--sk-ui);color:var(--sk-muted);letter-spacing:0.05em;
    }

    /* ————— type + primitives ————— */
    .sk-title{font:600 1.3cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.01em;}
    .sk-body{font:400 0.73cqw/1.45 var(--sk-ui);color:var(--sk-text);}
    .sk-meta{font:400 0.68cqw/1.4 var(--sk-ui);color:var(--sk-muted);}
    .sk-label{font:500 0.65cqw/1.4 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.10em;text-transform:uppercase;}
    .sk-spacer{flex:1;}
    .sk-panel{
      background:var(--sk-panel);border:1px solid var(--sk-hairline);
      border-radius:var(--sk-r-panel);overflow:hidden;min-height:0;
      display:flex;flex-direction:column;
    }
    .sk-panel-hd{
      display:flex;align-items:center;gap:0.6cqw;flex:none;
      padding:0.75cqw 1cqw;border-bottom:1px solid var(--sk-hairline);
    }
    .sk-panel-title{font:600 0.83cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
    .sk-panel-body{flex:1;min-height:0;overflow:hidden;}
    .sk-row{padding:0.7cqw 1cqw;}
    .sk-row + .sk-row{border-top:1px solid var(--sk-hairline);}
    .sk-chip{
      display:inline-flex;align-items:center;gap:0.3cqw;
      padding:0.22cqw 0.45cqw;border:1px solid var(--sk-hairline);
      border-radius:var(--sk-r-chip);background:rgba(255,255,255,0.02);
      font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;
      white-space:nowrap;
    }
    .sk-chip.is-on,
    .sk-chip--accent{color:var(--sk-accent);border-color:color-mix(in srgb,var(--sk-accent) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-accent) 8%,transparent);}
    .sk-chip--pass{color:var(--sk-pass);border-color:color-mix(in srgb,var(--sk-pass) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-pass) 8%,transparent);}
    .sk-chip--ember{color:var(--sk-ember);border-color:color-mix(in srgb,var(--sk-ember) 45%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-ember) 9%,transparent);}
    .sk-dot-inline{width:0.26cqw;height:0.26cqw;flex:none;border-radius:50%;background:currentColor;}
    .sk-badge{
      display:inline-flex;align-items:center;padding:0.22cqw 0.45cqw;
      background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:var(--sk-r-chip);
      font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-muted);font-variant-numeric:tabular-nums;
    }

    /* ————— composite score with sub-bars ————— */
    .sk-score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.1cqw;align-items:center;margin-top:0.7cqw;}
    .sk-score-main{display:flex;flex-direction:column;align-items:flex-start;gap:0.15cqw;}
    .sk-score-num{
      font:500 1.5cqw/1 var(--sk-mono);color:var(--sk-accent);
      letter-spacing:-0.03em;font-variant-numeric:tabular-nums;
    }
    .sk-score-cap{font:500 0.5cqw/1 var(--sk-mono);color:var(--sk-faint);letter-spacing:0.08em;text-transform:uppercase;}
    .sk-score-bars{display:flex;flex-direction:column;gap:0.45cqw;}
    .sk-subbar{display:grid;grid-template-columns:4.6cqw minmax(0,1fr) 1.9cqw;gap:0.55cqw;align-items:center;}
    .sk-subbar-name{font:400 0.55cqw/1 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.04em;}
    .sk-subbar-track{display:block;height:0.18cqw;background:var(--sk-hairline);border-radius:2px;overflow:hidden;}
    .sk-subbar-track i{display:block;height:100%;background:var(--sk-accent);border-radius:inherit;will-change:transform;}
    .sk-subbar-val{font:400 0.55cqw/1 var(--sk-mono);color:var(--sk-muted);text-align:right;font-variant-numeric:tabular-nums;}
    .sk-score--dim .sk-subbar-track i{background:#4B4B51;}
    .sk-score--dim .sk-subbar-name,.sk-score--dim .sk-subbar-val{color:var(--sk-faint);}

    /* ————— bet detail cards ————— */
    .sk-betcard{
      flex:none;padding:1.1cqw 1.2cqw;background:var(--sk-raised);
      border:1px solid var(--sk-hairline);border-radius:var(--sk-r-card);
    }
    .sk-betcard-hd{display:flex;align-items:center;gap:0.6cqw;}
    .sk-betcard-title{font:600 0.95cqw/1.25 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
    .sk-betcard .sk-meta{margin-top:0.3cqw;font-size:0.62cqw;}
    .sk-betnote{
      display:flex;gap:0.45cqw;margin-top:0.8cqw;padding-top:0.65cqw;
      border-top:1px solid var(--sk-hairline);
      font:400 0.57cqw/1.4 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;
    }
    .sk-betnote span{color:var(--sk-accent);}

    /* ————— cursor (kit) ————— */
    .sk-cursor{position:absolute;z-index:90;width:1.05cqw;height:1.05cqw;pointer-events:none;left:52cqw;top:44cqh;opacity:0;will-change:transform,opacity;}
    .sk-cursor svg{display:block;width:100%;height:100%;overflow:visible;}
    .sk-cursor svg path{fill:var(--sk-text);stroke:var(--sk-ground);stroke-width:1.1;stroke-linejoin:round;}

    /* ————— frame-6 specifics ————— */
    .f6-content{
      grid-area:main;position:relative;display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr) 15.5cqw;
      grid-template-rows:auto minmax(0,1fr);
      gap:1cqw;padding:1.1cqw;min-height:0;
    }
    .f6-head{grid-column:1/-1;display:flex;align-items:baseline;gap:0.8cqw;}
    .f6-cell{position:relative;align-self:start;min-height:0;}
    .f6-card{--dof:0px;filter:blur(var(--dof));will-change:filter,transform,opacity;position:relative;}
    .f6-slot{
      position:absolute;inset:0;display:grid;place-items:center;
      border:1px dashed var(--sk-hairline);border-radius:var(--sk-r-card);
      opacity:0;pointer-events:none;
    }
    .f6-ring{
      position:absolute;inset:0;border:1px solid var(--sk-ember);border-radius:var(--sk-r-card);
      box-shadow:0 0 1cqw rgba(255,107,44,0.22);
      opacity:0;pointer-events:none;
    }
    .f6-advance{opacity:0;}
    .f6-note{opacity:0;will-change:transform,opacity;}
    .f6-val{opacity:0;}
    .f6-rail{align-self:stretch;}
    .f6-rail-body{position:relative;flex:1;min-height:0;overflow:hidden;}
    .f6-passrow-title{font:400 0.73cqw/1.35 var(--sk-ui);color:var(--sk-muted);}
    .f6-passrow-title s{color:var(--sk-faint);}
    .f6-passrow-meta{margin-top:0.2cqw;font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-faint);font-variant-numeric:tabular-nums;}
    .f6-shiftrow{will-change:transform;}
    .f6-incoming{
      position:absolute;top:0.5cqw;left:0.6cqw;right:0.6cqw;z-index:5;
      padding:0.6cqw 0.8cqw;background:var(--sk-raised);
      border:1px solid var(--sk-hairline);border-radius:var(--sk-r-row);
      opacity:0;transform-origin:50% 50%;will-change:transform,opacity;
    }
    .f6-badge{display:inline-grid;}
    .f6-badge span{grid-area:1/1;text-align:center;}
    .f6-b3{opacity:0;}
    .f6-ghost{
      position:absolute;left:12cqw;top:9.6cqh;width:16cqw;z-index:80;
      padding:0.7cqw 0.9cqw;background:var(--sk-raised);
      border:1px solid var(--sk-hairline);border-radius:var(--sk-r-card);
      box-shadow:var(--sk-ring),var(--sk-ambient);
      opacity:0;transform-origin:50% 50%;will-change:transform,opacity;
    }
    .f6-ghost-hd{display:flex;align-items:center;gap:0.5cqw;}
    .f6-ghost-title{font:600 0.8cqw/1.2 var(--sk-ui);color:var(--sk-text);}
    .f6-ripple{
      position:absolute;left:16cqw;top:10.8cqh;width:2.2cqw;height:2.2cqw;
      margin:-1.1cqw 0 0 -1.1cqw;border:1px solid var(--sk-text);border-radius:50%;
      opacity:0;z-index:85;pointer-events:none;transform-origin:50% 50%;will-change:transform,opacity;
    }

    /* ————— overlay clip (track 2) — lower-third, kept above the caption keep-out ————— */
    .f6-overlay{position:absolute;inset:0;container-type:size;pointer-events:none;}
    .sk-lowerthird{
      position:absolute;left:5.5cqw;bottom:18.5cqh;z-index:60;
      display:flex;flex-direction:column;gap:0.55cqh;
      text-shadow:0 2px 30px rgba(0,0,0,.6);
      font-family:var(--sk-ui);
    }
    .sk-lt-kicker{
      font:500 0.72cqw/1 var(--sk-mono);letter-spacing:0.14em;text-transform:uppercase;
      color:var(--sk-decide);opacity:0;will-change:transform,opacity;
    }
    .sk-lt-line{font:600 2.6cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.01em;opacity:0;will-change:transform,opacity;}
  
/* v4 identity: real product mark + workspace label */
.sk-ws-mark{background:none !important;border-radius:0 !important;padding:0.08cqw;box-sizing:border-box;}
.sk-ws-space{font:400 0.62cqw/1 var(--sk-mono, "IBM Plex Mono", monospace);color:var(--sk-text-muted, #A8A29A);margin-left:0.45cqw;padding:0.16cqw 0.38cqw;border:1px solid var(--sk-hairline, #26262A);border-radius:6px;}
</style>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    /* ───────────────────────── camera rig (multi-phase-camera + viewport-change) ───────────────────────── */
    const camEl = document.getElementById("f6-cam");
    const screenEl = document.getElementById("f6-screen");
    const cam = { scale: 0.945, x: 20, y: 0 };          // phase state
    const drift = { p: 0 };                              // continuous micro-drift
    let dx = 0, dy = 0;
    function applyCamera() {
      dx = Math.sin(drift.p) * 5;
      dy = Math.sin(drift.p * 1.31) * 3;
      camEl.style.transform = `translate(${cam.x + dx}px, ${cam.y + dy}px) scale(${cam.scale})`;
    }
    const tilt = { rx: 2.7, ry: -4.2 };                  // the arc around the pair, in perspective
    function applyTilt() {
      screenEl.style.transform = `rotateX(${tilt.rx}deg) rotateY(${tilt.ry}deg)`;
    }
    applyCamera(); applyTilt();

    /* push-blur (motion-blur-streak, push-through "B B" smear) — seeded at 0 */
    const blurNode = document.getElementById("f6-pushblur-std");
    const blurProxy = { v: 0 };
    const writeBlur = () => blurNode.setAttribute("stdDeviation", `${blurProxy.v} ${blurProxy.v}`);
    writeBlur();

    /* ── Scene 1 (0.0–2.4) · arrival: settle + arc, chrome reveals ── */
    tl.fromTo("#f6-frame", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.01);
    tl.to(cam, { scale: 1, x: 0, duration: 2.3, ease: "power2.out", onUpdate: applyCamera }, 0);
    tl.to(tilt, { rx: 1.5, ry: -2.0, duration: 2.4, ease: "power2.out", onUpdate: applyTilt }, 0);
    tl.fromTo("#f6-lt-k", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.55);
    tl.fromTo("#f6-lt-l", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.72);
    tl.fromTo(".f6-headmeta", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.65);
    tl.fromTo(".f6-headchip", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.06 }, 0.8);
    tl.fromTo(".f6-pr", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out", stagger: 0.12 }, 0.95);

    /* ── Scene 2 (2.4–5.2) · "it scores each bet": bars fill + counts, then the rack-focus disagreement ── */
    // sub-bars fill as a chord (stat fill, transform-only)
    tl.fromTo(".f6-bar", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 1.15, ease: "power3.out" }, 2.5);
    tl.fromTo(".f6-val", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 3.35);

    // composite scores count up (counting-dynamic-scale, small UI register: value + font-size in one tween)
    const numL = document.getElementById("f6-num-l");
    const numR = document.getElementById("f6-num-r");
    const scoreL = { v: 0, fs: 1.05 };
    const scoreR = { v: 0, fs: 1.05 };
    const writeL = () => { numL.textContent = scoreL.v.toFixed(1); numL.style.fontSize = scoreL.fs.toFixed(3) + "cqw"; };
    const writeR = () => { numR.textContent = scoreR.v.toFixed(1); numR.style.fontSize = scoreR.fs.toFixed(3) + "cqw"; };
    writeL(); writeR();
    tl.to(scoreL, { v: 4.0, fs: 1.5, duration: 1.3, ease: "power3.out", onUpdate: writeL }, 2.55);
    tl.to(scoreR, { v: 8.0, fs: 1.5, duration: 1.3, ease: "power3.out", onUpdate: writeR }, 2.55);
    tl.to(numL, { color: "#F2EFE9", duration: 1.3, ease: "power2.out" }, 2.55);
    tl.to(numR, { color: "#C39A5E", duration: 1.3, ease: "power2.out" }, 2.55);

    // left card's own agent line lands with its low score
    tl.fromTo("#f6-note-l", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 4.0);

    // rack focus (depth-of-field-blur): look at the exciting one… then the boring one that pays
    tl.to(cam, { x: 38, duration: 0.55, ease: "power2.inOut", onUpdate: applyCamera }, 3.75);
    tl.to("#f6-card-r", { "--dof": "2.2px", opacity: 0.86, duration: 0.55, ease: "power2.inOut" }, 3.75);
    tl.to(cam, { x: -55, duration: 0.6, ease: "power2.inOut", onUpdate: applyCamera }, 4.45);
    tl.to("#f6-card-r", { "--dof": "0px", opacity: 1, duration: 0.6, ease: "power2.inOut" }, 4.45);
    tl.to("#f6-card-l", { "--dof": "2.4px", opacity: 0.82, duration: 0.6, ease: "power2.inOut" }, 4.45);

    // the dissent note slides under the right card
    tl.fromTo("#f6-note-r", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.55);

    /* ── Scene 3 (5.2–8.3) · "loses": drag to passed (scale-swap), winner takes the ember edge, push ── */
    // cursor arrives and travels to the exciting card (cursor-click-ripple: move → settle → click)
    tl.fromTo("#f6-cursor", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 4.65);
