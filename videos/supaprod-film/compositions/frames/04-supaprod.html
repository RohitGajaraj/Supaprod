<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>F4: Supaprod (the home out of focus → rack focus in → the product introduces itself)</title>
</head>
<body>
<template>
<style>
/* ————— fonts (kit declarations, dual-path src) ————— */
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2");}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");}
@font-face{font-family:"Mona Sans";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/MonaSans-Regular.woff2") format("woff2"),url("assets/fonts/MonaSans-Regular.woff2") format("woff2");}

/* ————— root (styled via #root, never a class — scoper law) —————
   Product-screen tokens live here so every sk- component inherits them. */
#root{
  position:absolute;inset:0;overflow:hidden;background:#0A0A0B;
  /* surfaces */
  --sk-ground:#0A0A0B;
  --sk-panel:#141416;
  --sk-raised:#1A1A1D;
  --sk-hairline:#26262A;
  --sk-text:#F2EFE9;
  --sk-muted:#A8A29A;
  --sk-faint:#6B6660;
  /* stage colors */
  --sk-discover:#6FA9A0;
  --sk-decide:#C39A5E;
  --sk-plan:#8FA464;
  --sk-design:#AB7FA0;
  --sk-build:#6D97C2;
  --sk-ship:#BD8092;
  --sk-learn:#A89F66;
  --sk-pass:#4FC47A;
  --sk-fail:#EF6A5F;
  --sk-warn:#E8B44C;
  --sk-ember:#FF6B2C;
  --sk-accent:var(--sk-decide);
  /* radii */
  --sk-r-chip:7px;
  --sk-r-control:8px;
  --sk-r-row:9px;
  --sk-r-card:10px;
  --sk-r-panel:12px;
  --sk-r-pane:16px;
  /* faces */
  --sk-ui:"Mona Sans",system-ui,sans-serif;
  --sk-mono:"IBM Plex Mono",ui-monospace,monospace;
  /* the only two shadows */
  --sk-ring:0 0 0 1px var(--sk-hairline);
  --sk-ambient:0 24px 80px rgba(0,0,0,.5);
}

/* ————— frame ground & perspective stage (kit) ————— */
.sk-frame{
  position:relative;width:100%;height:100%;overflow:hidden;
  container-type:size;
  background:var(--sk-ground);
  color:var(--sk-text);
  font-family:var(--sk-ui);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
.sk-frame *,.sk-frame *::before,.sk-frame *::after{box-sizing:border-box;margin:0;padding:0;}
.sk-stage{
  position:absolute;inset:0;display:grid;place-items:center;
  perspective:var(--sk-persp,2400px);
  perspective-origin:50% 44%;
}
.sk-screen{
  position:relative;
  width:var(--sk-w,96cqw);height:var(--sk-h,94cqh);
  transform:rotateX(var(--sk-rx,1.2deg)) rotateY(var(--sk-ry,-1.5deg));
  transform-style:preserve-3d;
  background:var(--sk-ground);
  border-radius:var(--sk-r-pane);
  box-shadow:var(--sk-ring),var(--sk-ambient);
  overflow:hidden;
}

/* ————— app shell · the REAL product shell —————
   Full-width top bar → full-width seven-station strip → narrow icon rail beside
   the content. The stations never live in the left nav; the rail is its own axis. */
.sk-shell{
  display:grid;height:100%;
  grid-template-columns:2.9cqw minmax(0,1fr);
  grid-template-rows:4.0cqh 7.2cqh minmax(0,1fr);
  grid-template-areas:"top top" "spine spine" "rail main";
}

/* top bar · bare mark + wordmark · breadcrumb · centred notification strip · ask + avatar */
.sk-topbar{
  grid-area:top;display:grid;align-items:center;
  grid-template-columns:auto minmax(0,1fr) auto;gap:1cqw;
  padding:0 1.1cqw;border-bottom:1px solid var(--sk-hairline);background:var(--sk-ground);
}
.sk-topleft{display:flex;align-items:center;gap:0.75cqw;min-width:0;}
.sk-brand{display:flex;align-items:center;gap:0.45cqw;}
.sk-brand-mark{width:1.2cqw;height:1.2cqw;flex:none;display:block;}
.sk-brand-name{font:600 0.92cqw/1.25 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
.sk-topdiv{width:1px;height:1.7cqh;flex:none;background:var(--sk-hairline);}
.sk-crumb{
  display:flex;align-items:center;gap:0.32cqw;white-space:nowrap;
  font:400 0.78cqw/1 var(--sk-ui);color:var(--sk-muted);
}
.sk-crumb-sep{color:var(--sk-faint);}
.sk-crumb-here{color:var(--sk-text);}
.sk-crumb-caret{font:400 0.62cqw/1 var(--sk-mono);color:var(--sk-faint);}
.sk-notify{justify-self:center;display:flex;align-items:center;gap:0.5cqw;min-width:0;white-space:nowrap;}
.sk-notify-gl{display:flex;align-items:center;gap:0.28cqw;flex:none;}
.sk-notify-gl svg{width:0.76cqw;height:0.76cqw;display:block;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.sk-notify-lead{font:500 0.72cqw/1.2 var(--sk-ui);color:var(--sk-text);flex:none;}
.sk-notify-sub{font:400 0.72cqw/1.2 var(--sk-ui);color:var(--sk-faint);min-width:0;overflow:hidden;text-overflow:ellipsis;}
.sk-notify-time{font:400 0.64cqw/1.2 var(--sk-ui);color:var(--sk-faint);flex:none;}
.sk-topright{display:flex;align-items:center;gap:0.62cqw;}
.sk-ask{
  display:flex;align-items:center;gap:0.4cqw;height:2.6cqh;flex:none;
  padding:0 0.68cqw;background:var(--sk-panel);
  border:1px solid var(--sk-hairline);border-radius:999px;
  font:400 0.76cqw/1 var(--sk-ui);color:var(--sk-text);
}
.sk-ask svg{width:0.78cqw;height:0.78cqw;flex:none;stroke:var(--sk-muted);fill:none;stroke-width:1.5;stroke-linejoin:round;}
.sk-kbd{font:400 0.66cqw/1 var(--sk-mono);color:var(--sk-faint);}
.sk-avatar{
  width:1.6cqw;height:1.6cqw;flex:none;display:grid;place-items:center;
  background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:50%;
  font:600 0.58cqw/1 var(--sk-ui);color:var(--sk-muted);letter-spacing:0.03em;
}

/* ————— station strip · seven numbered cells, full width, under the top bar —————
   Today is not a station, so nothing is "here"; Discover and Build carry the
   ember status sublines the screenshots use for work that is waiting on you. */
.sk-spine{
  grid-area:spine;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  border-bottom:1px solid var(--sk-hairline);background:var(--sk-ground);
}
.sk-stn{
  position:relative;display:grid;grid-template-rows:1.1cqh 1.8cqh 1.25cqh;gap:0.3cqh;
  align-content:center;padding:0 1cqw;min-width:0;
}
.sk-stn + .sk-stn{border-left:1px solid var(--sk-hairline);}
.sk-stn-n{font:400 0.54cqw/1 var(--sk-mono);color:var(--sk-faint);letter-spacing:0.08em;}
.sk-stn-name{font:400 0.92cqw/1.1 var(--sk-ui);color:var(--sk-muted);letter-spacing:-0.005em;white-space:nowrap;}
.sk-stn-sub{font:400 0.62cqw/1.1 var(--sk-ui);color:var(--sk-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sk-stn.is-waiting .sk-stn-name{font-weight:600;color:var(--sk-text);}
.sk-stn.is-waiting .sk-stn-sub{color:var(--sk-ember);}
.sk-stn.has-work .sk-stn-name{color:color-mix(in srgb,var(--sk-text) 82%,var(--sk-muted));}
.sk-stn-dot{
  position:absolute;right:0.95cqw;top:1.3cqh;width:0.32cqw;height:0.32cqw;border-radius:50%;
  background:var(--sk-ember);box-shadow:0 0 0.5cqw color-mix(in srgb,var(--sk-ember) 62%,transparent);
}

/* ————— narrow icon rail · Today active · Runs · Brain · Crew · Engine room ————— */
.sk-rail{
  grid-area:rail;display:flex;flex-direction:column;align-items:center;min-height:0;
  padding:1cqh 0 1.2cqh;background:var(--sk-ground);border-right:1px solid var(--sk-hairline);
}
.sk-railtop{display:flex;flex-direction:column;align-items:center;gap:0.5cqh;}
.sk-railfoot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:0.34cqh;}
.sk-glyph{
  position:relative;width:2cqw;height:2cqw;flex:none;
  display:grid;place-items:center;border-radius:var(--sk-r-control);color:var(--sk-faint);
}
.sk-glyph svg{
  width:1.05cqw;height:1.05cqw;display:block;fill:none;stroke:currentColor;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
}
.sk-glyph.is-active{background:var(--sk-raised);color:var(--sk-text);box-shadow:inset 0 0 0 1px var(--sk-hairline);}
.sk-railfoot .sk-glyph{width:1.72cqw;height:1.72cqw;}
.sk-railfoot .sk-glyph svg{width:0.92cqw;height:0.92cqw;}
.sk-livedot{
  width:0.28cqw;height:0.28cqw;flex:none;border-radius:50%;
  background:var(--sk-pass);box-shadow:0 0 0.42cqw var(--sk-pass);
}

/* ————— chips · badges (kit) ————— */
.sk-spacer{flex:1;}
.sk-chip{
  display:inline-flex;align-items:center;gap:0.32cqw;
  padding:0.26cqw 0.5cqw;border:1px solid var(--sk-hairline);
  border-radius:var(--sk-r-chip);background:rgba(255,255,255,0.02);
  font:400 0.62cqw/1.3 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;
  white-space:nowrap;
}
.sk-chip--pass{color:var(--sk-pass);border-color:color-mix(in srgb,var(--sk-pass) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-pass) 8%,transparent);}
.sk-chip--ember{color:var(--sk-ember);border-color:color-mix(in srgb,var(--sk-ember) 45%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-ember) 9%,transparent);}
.sk-dot-inline{width:0.28cqw;height:0.28cqw;flex:none;border-radius:50%;background:currentColor;}

/* ————— lower-third (kit — film overlay, lower-left, never centered) ————— */
.sk-lowerthird{
  position:absolute;left:5.5cqw;bottom:7cqh;z-index:70;
  display:flex;flex-direction:column;gap:0.55cqh;
  text-shadow:0 2px 30px rgba(0,0,0,.6);
}
.sk-lt-kicker{
  font:500 0.72cqw/1 var(--sk-mono);letter-spacing:0.14em;text-transform:uppercase;
  color:var(--sk-accent);
}
.sk-lt-line{font:600 2.6cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.01em;}
/* frame-0 hidden states live in CSS, never in a zero-duration set at position 0 */
#sp4-ltk,#sp4-ltl{opacity:0;}
/* the band itself is invisible until its text arrives, and leaves with it */
#sp4-ltband{opacity:0;}

/* ═════ frame-specific — the home, the focus pull, the film title ═════ */

/* ground clip — the ink field the screen sits on */
#sp4-ground{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 64% 56% at 50% 44%, #101013 0%, #0A0A0B 70%);
}
#sp4-world{position:absolute;inset:0;}

/* the one camera — the product surface rides it; the titles do not */
#sp4-cam{
  position:absolute;inset:0;
  transform-origin:50% 50%;
  will-change:transform;
}

/* the app's home · Today — already on screen at frame 0, deeply out of focus.
   --sp4dof is the depth-of-field radius the rack focus resolves to 0. */
#sp4-app{
  position:absolute;inset:0;z-index:3;
  /* --sp4dof is the depth-of-field radius the cut lands on. It opens at 3px,
     never more — the frame is never a blank glow — and resolves inside 1.35s.
     The lum/sat pair rides the same window, then neutralises. */
  --sp4dof:3px;
  --sp4lum:1.12;
  --sp4sat:1.08;
  filter:blur(var(--sp4dof)) brightness(var(--sp4lum)) saturate(var(--sp4sat));
  opacity:0;
  will-change:transform,filter,opacity;
}

/* ————— content column · the screenshots' grammar, almost literally ————— */
.sp4-main{
  grid-area:main;position:relative;min-height:0;overflow:hidden;
  padding:1.5cqh 3.4cqw 0 3.2cqw;
}
.sp4-greet{font:400 0.85cqw/1.3 var(--sk-ui);color:var(--sk-muted);}
.sp4-head{margin-top:0.7cqh;font:600 1.82cqw/1.16 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.02em;}
.sp4-headmeta{margin-top:0.7cqh;font:400 0.82cqw/1.4 var(--sk-ui);color:var(--sk-muted);}
.sp4-underline{border-bottom:1px solid var(--sk-hairline);padding-bottom:0.14cqh;}
/* the work still running under the calls — agent activity, kept slim and high */
.sp4-live{
  display:flex;align-items:center;gap:0.5cqw;margin-top:0.75cqh;
  font:400 0.66cqw/1.3 var(--sk-mono);color:var(--sk-muted);
}
.sp4-run{color:var(--sk-ember);}
.sp4-live-sep{color:var(--sk-faint);}
.sp4-rule{margin-top:1.5cqh;height:1px;background:var(--sk-hairline);}

.sp4-sec{margin-top:1.5cqh;}
.sp4-sec-hd{display:flex;align-items:baseline;gap:0.8cqw;}
.sp4-sec-t{font:600 0.95cqw/1.2 var(--sk-ui);color:var(--sk-text);}
.sp4-sec-link{margin-left:auto;font:400 0.78cqw/1.2 var(--sk-ui);color:var(--sk-muted);border-bottom:1px solid var(--sk-hairline);}
.sp4-sec-note{margin-top:0.6cqh;font:400 0.8cqw/1.4 var(--sk-ui);color:var(--sk-faint);}

.sp4-row{
  display:grid;grid-template-columns:2.1cqw minmax(0,1fr) auto;align-items:center;gap:0.7cqw;
  padding:0.72cqh 0;border-top:1px solid var(--sk-hairline);
}
.sp4-sec-rows{margin-top:0.6cqh;}
.sp4-rowicon{display:grid;place-items:center;width:1.2cqw;height:1.2cqw;}
.sp4-rowicon svg{width:1.05cqw;height:1.05cqw;display:block;fill:none;stroke:var(--sk-pass);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
.sp4-rowmain{display:flex;flex-direction:column;gap:0.2cqh;min-width:0;}
.sp4-rowtitle{font:600 0.88cqw/1.25 var(--sk-ui);color:var(--sk-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp4-rowstate{font:400 0.76cqw/1.2 var(--sk-ui);color:var(--sk-pass);}
.sp4-rowtime{font:400 0.76cqw/1.2 var(--sk-ui);color:var(--sk-faint);font-variant-numeric:tabular-nums;}

.sp4-card{
  margin-top:0.9cqh;background:var(--sk-panel);
  border:1px solid var(--sk-hairline);border-radius:var(--sk-r-card);
  padding:0.95cqh 1.1cqw;
}
.sp4-card-hd{display:flex;align-items:center;gap:0.42cqw;}
.sp4-card-hd svg{width:0.86cqw;height:0.86cqw;flex:none;fill:none;stroke:var(--sk-ember);stroke-width:1.5;stroke-linecap:round;}
.sp4-card-kind{font:500 0.78cqw/1.2 var(--sk-ui);color:var(--sk-ember);}
.sp4-card-sep{font:400 0.78cqw/1.2 var(--sk-ui);color:var(--sk-faint);}
.sp4-card-scope{font:400 0.78cqw/1.2 var(--sk-ui);color:var(--sk-muted);}
.sp4-card-idx{margin-left:auto;font:400 0.76cqw/1.2 var(--sk-ui);color:var(--sk-faint);font-variant-numeric:tabular-nums;}
.sp4-card-t{margin-top:0.7cqh;font:600 1.05cqw/1.25 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.008em;}
.sp4-card-m{margin-top:0.5cqh;font:400 0.76cqw/1.4 var(--sk-ui);color:var(--sk-muted);}
.sp4-card-ft{display:flex;align-items:center;gap:0.45cqw;margin-top:0.85cqh;}
/* the gate chip carries its own ember ring so the pulse is a light, not a jump */
#sp4-gatewrap{position:relative;display:inline-flex;}
#sp4-gateglow{
  position:absolute;inset:-0.22cqw;border-radius:var(--sk-r-chip);
  box-shadow:0 0 1.1cqw 0.12cqw color-mix(in srgb,var(--sk-ember) 55%,transparent);
  opacity:0;pointer-events:none;
}

/* ————— the film scrim · lets the titles sit on the picture ————— */
#sp4-scrim{
  position:absolute;left:0;right:0;bottom:0;height:46cqh;z-index:50;
  background:linear-gradient(to top,
    rgba(10,10,11,0.94) 0%,
    rgba(10,10,11,0.86) 22%,
    rgba(10,10,11,0.52) 52%,
    rgba(10,10,11,0) 100%);
  opacity:0;pointer-events:none;
}

/* ————— shot A · the brand lockup, centered on the ink field ————— */
#sp4-logo-shot{
  position:absolute;inset:0;z-index:2;
  display:grid;place-items:center;
  filter:url(#sp4-streak);
  will-change:transform,filter,opacity;
}
#sp4-glow{
  position:absolute;left:50%;top:50%;z-index:1;
  width:58cqh;height:58cqh;margin-left:-29cqh;margin-top:-29cqh;
  border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(255,107,44,0.34) 0%, rgba(255,107,44,0.10) 42%, transparent 70%);
  opacity:0;
  will-change:transform,opacity;
}
.sp4-lockup{position:absolute;inset:0;z-index:2;}
#sp4-spin{
  position:absolute;left:50%;top:50%;
  width:30cqh;height:30cqh;margin-left:-15cqh;margin-top:-15cqh;
  will-change:transform;
}
#sp4-spin svg{display:block;width:100%;height:100%;overflow:visible;}
#sp4-core{opacity:0;}
#sp4-word{
  position:absolute;left:0;right:0;top:calc(50% + 16.6cqh);
  text-align:center;
  font:600 4.6cqw/1 var(--sk-ui);letter-spacing:-0.03em;color:var(--sk-text);
  text-transform:lowercase;
  opacity:0;
  will-change:transform,opacity;
}

/* ————— the ember flood — the core filling the frame at the seam ————— */
#sp4-flood{
  position:absolute;left:50%;top:50%;z-index:4;
  width:52cqh;height:52cqh;margin-left:-26cqh;margin-top:-26cqh;
  border-radius:50%;
  background:radial-gradient(circle at 46% 42%,
    color-mix(in oklab, #fff 55%, #FF6B2C) 0%,
    #FF6B2C 34%,
    color-mix(in oklab, #FF6B2C 75%, #000) 62%,
    transparent 76%);
  opacity:0;
  pointer-events:none;
  will-change:transform,opacity;
}

/* ————— the film title · quiet, lower-left, over the working product ————— */
#sp4-lock{
  position:absolute;left:5.5cqw;top:73.4cqh;z-index:62;
  display:flex;align-items:center;gap:0.78cqw;
  transform-origin:0% 0%;
  text-shadow:0 2px 30px rgba(0,0,0,.65);
  opacity:0;
  will-change:transform,opacity;
}
#sp4-mark{width:2.35cqw;height:2.35cqw;flex:none;display:block;}
#sp4-mark svg{display:block;width:100%;height:100%;overflow:visible;}
#sp4-lk-core{opacity:0;}
#sp4-lk-word{
  font:600 2.9cqw/1 var(--sk-ui);letter-spacing:-0.035em;color:var(--sk-text);
  text-transform:lowercase;
  opacity:0;
  will-change:transform,opacity;
}

#sp4-thesis{
  position:absolute;left:5.6cqw;top:80.2cqh;z-index:62;
  display:flex;align-items:center;gap:0.55cqw;
}
.sp4-th{
  display:inline-flex;align-items:center;gap:0.4cqw;
  padding:0.3cqw 0.58cqw;border-radius:var(--sk-r-chip);
  border:1px solid color-mix(in srgb,var(--sk-text) 14%,transparent);
  background:rgba(20,20,22,0.62);
  font:400 0.72cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:0.005em;
  white-space:nowrap;
  opacity:0;
}
.sp4-th i{
  width:0.3cqw;height:0.3cqw;flex:none;border-radius:50%;background:var(--sk-discover);
  box-shadow:0 0 0.45cqw color-mix(in srgb,var(--sk-discover) 62%,transparent);
}

/* ————— the pointer · one honest interaction on the gate ————— */
#sp4-cursor{
  position:absolute;left:0;top:0;z-index:40;width:1.35cqw;height:1.35cqw;
  opacity:0;pointer-events:none;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.65));
}
#sp4-cursor svg{display:block;width:100%;height:100%;}

      /* ═══ premium overlay normalization (film-wide typographic system) ═══
         One anchor: left 8cqw, block bottom at 79cqh. One scale. A soft scrim
         for legibility on any background. A 2px ember rule as the signature. */
      .sk-lowerthird, .f3-lt, .f1-lt, .f2-lt{
        position:absolute; left:0; bottom:14cqh; top:auto; right:auto;
        width:auto; max-width:52cqw; transform:none;

<script>
  gsap.defaults({ lazy: false });   // paused, seeked timelines never tick — lazy tweens would render stale start values
        window.__timelines = window.__timelines || {};

  (function () {
    // Scope every query to THIS frame — kit classes repeat across sibling frames.
    var sp4Root = document.querySelector('[data-composition-id="04-supaprod"]');
    var $ = function (sel) { return sp4Root.querySelector(sel); };

    var tl = gsap.timeline({ paused: true });

    /* ── svg-path-draw setup — measured synchronously at build time ───── */
    var loop = $("#sp4-loop");
    var len = loop.getTotalLength() * 1.02; // slight overestimate per the recipe
    loop.style.strokeDasharray = String(len);
    loop.style.strokeDashoffset = String(len);

    // the lower-left film title carries its own mark, drawn the same way
    var lkLoop = $("#sp4-lk-loop");
    var lkLen = lkLoop.getTotalLength() * 1.02;
    lkLoop.style.strokeDasharray = String(lkLen);
    lkLoop.style.strokeDashoffset = String(lkLen);

    /* ── motion-blur-streak setup — proxy → stdDeviation (depth push: B B) ── */
    var blurNode = $("#sp4-streak-blur");
    var blurP = { v: 0 };
    var writeBlur = function () {
      blurNode.setAttribute("stdDeviation", blurP.v + " " + blurP.v);
    };
    writeBlur(); // seed frame 0 sharp

    /* ── the one camera (multi-phase-camera) — both shots ride it ───────── */
    var camEl = $("#sp4-cam");
    var cam = { s: 0.97, x: 0, y: 0 };
    var drift = { p: 0 };
    var DRIFT_AMP_X = 3.6, DRIFT_AMP_Y = 2.0, DRIFT_FREQ_RATIO = 1.35;
    var applyCam = function () {
      var dx = Math.sin(drift.p) * DRIFT_AMP_X;
      var dy = Math.sin(drift.p * DRIFT_FREQ_RATIO) * DRIFT_AMP_Y;
      camEl.style.transform =
        "translate(" + (cam.x + dx) + "px," + (cam.y + dy) + "px) scale(" + cam.s + ")";
    };
    applyCam(); // seed frame 0

    /* ── seek-safe baselines ──
       Every hidden-at-frame-0 element carries its hidden state in CSS (a
       zero-duration set at position 0 does not render while the playhead sits
       exactly at 0). These sets only seed the resting geometry the tweens
       hand off between. */
    // fixed composition coordinates — the pointer rides the same transformed space
    // as the gate chip, so matching layout coords lands it under any camera state.
    var CUR_FROM = { x: 620, y: 905 };
    var CUR_TO   = { x: 245, y: 742 };
    gsap.set("#sp4-cursor", CUR_FROM);
    gsap.set(["#sp4-th1", "#sp4-th2", "#sp4-th3"], { y: 12 });
    gsap.set(["#sp4-ltk", "#sp4-ltl"], { y: 14 });

    /* ═══ SCENE 1 (0.0–2.3s) · the mark draws itself, revolving, core blooms,
       the wordmark rises beneath it. Centred on the ink field, nothing else. ═══ */

    // the loader motif — the mark revolves as it completes
    tl.fromTo("#sp4-spin", { rotation: -52 }, { rotation: 0, duration: 2.25, ease: "power2.out" }, 0);
    // stroke draw (pen trace — power2.out, no bounce), running from the first frame
    tl.fromTo(loop, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 1.6, ease: "power2.out" }, 0.05);
    // the stroke warms as it closes, the way the product's own loader does
    tl.fromTo(loop, { stroke: "#F2EFE9" }, { stroke: "#F6DFC9", duration: 1.2, ease: "power2.inOut" }, 0.35);
    // ambient-glow-bloom behind the mark (bloom-and-hold — the flood follows soon)
    tl.fromTo("#sp4-glow", { opacity: 0, scale: 0.85 },
      { opacity: 0.30, scale: 1, duration: 0.65, ease: "power2.out" }, 1.35);
    // the ember core blooms as the loop closes
    tl.fromTo("#sp4-core", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.42);
    // the wordmark rises beneath and settles by 2.27
    tl.fromTo("#sp4-word", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 1.72);
    // camera phase 1 — slow approach on the mark
    tl.to(cam, { s: 1.045, duration: 2.4, ease: "power2.inOut" }, 0);

    /* ═══ SCENE 2 (2.55–4.4s) · push THROUGH the ember core into the home ═══
       zoom-through seam per the cut catalog: the outgoing mark accelerates
       toward the viewer, blur and flood peak at the hard cut, the incoming
       home continues forward and decelerates into the focal plane. It lands
       barely soft — 3px, never a blank glow — and is sharp inside 1.35s. */

    // camera hard push into the core. The push tops out at 1.15, not the 1.24 the
    // old frame used: this home is a 96cqw screen with almost no margin, so a
    // deeper push would still be cropping the top bar when the flood clears.
    tl.to(cam, { s: 1.15, duration: 0.48, ease: "power3.in" }, 2.55);
    // outgoing mark: scale toward viewer + depth blur peaks at the cut
    tl.fromTo("#sp4-logo-shot", { scale: 1 },
      { scale: 2.4, duration: 0.48, ease: "power3.in" }, 2.55);
    tl.fromTo(blurP, { v: 0 },
      { v: 16, duration: 0.48, ease: "power3.in", onUpdate: writeBlur }, 2.55);
    tl.fromTo("#sp4-logo-shot", { opacity: 1 },
      { opacity: 0.15, duration: 0.46, ease: "none" }, 2.55); // linear dim, separate tween
    // the core glow floods the frame
    tl.fromTo("#sp4-flood", { opacity: 0, scale: 0.5 },
      { opacity: 0.96, scale: 7, duration: 0.5, ease: "power3.in" }, 2.53);

    // HARD CUT at peak velocity + peak flood
    tl.set("#sp4-logo-shot", { opacity: 0 }, 3.05);

    // incoming home: continues forward (0.86→1) and takes the frame
    tl.fromTo("#sp4-app", { opacity: 0.18, scale: 0.86 },
      { opacity: 1, scale: 1, duration: 0.62, ease: "expo.out", immediateRender: false }, 3.05);
    // depth-of-field-blur, mechanic 1: a shallow 3px settle, sharp by 4.41.
    // The lum/sat pair rides the same window and neutralises with it.
    tl.fromTo("#sp4-app",
      { "--sp4dof": "3px", "--sp4lum": 1.12, "--sp4sat": 1.08 },
      { "--sp4dof": "0px", "--sp4lum": 1, "--sp4sat": 1, duration: 1.35, ease: "power2.out" }, 3.06);
    // flood resolves away as the home appears
    tl.to("#sp4-flood", { opacity: 0, scale: 9, duration: 0.75, ease: "power2.out" }, 3.09);
    // camera settles out of the push fast — the whole home has to be inside the
    // frame by the time the flood clears — then resumes its slow breath
    tl.to(cam, { s: 1.032, duration: 0.85, ease: "power3.out" }, 3.05);
    tl.to(cam, { s: 1.052, duration: 1.92, ease: "power1.inOut" }, 3.90);
    // the film scrim belongs to the product half — it never touches the brand entrance
    tl.fromTo("#sp4-scrim", { opacity: 0 },
      { opacity: 0.46, duration: 0.6, ease: "power2.out", immediateRender: false }, 3.25);

    /* the lower-left film title, exactly as it was designed: the block fades in,
       its bare mark draws and spins up, the stroke warms to amber, the ember core
       pops, the word rises. It now plays over the working home instead of on the
       ink field, because the centred reveal owns the first 2.3s. */
    tl.fromTo("#sp4-lock", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 3.30);
    tl.fromTo(lkLoop, { strokeDashoffset: lkLen }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 3.40);
    tl.fromTo("#sp4-mark", { rotation: -96 }, { rotation: 0, duration: 1.5, ease: "power3.out", transformOrigin: "50% 50%" }, 3.40);
    tl.fromTo(lkLoop, { stroke: "#F2EFE9" }, { stroke: "#F6DFC9", duration: 1.1, ease: "power2.inOut" }, 3.55);
    tl.fromTo("#sp4-lk-core", { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 3.87);
    tl.fromTo("#sp4-lk-word", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 3.97);

    tl.fromTo("#sp4-th1", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.70);
    tl.fromTo("#sp4-th2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.30);
    tl.fromTo("#sp4-th3", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.90);

    /* ═══ SCENE 3 (5.8–11.0s) · sharp and alive. The camera pans across the home,
       the gate pulses on "you make the calls", the title recedes to a corner mark. ═══ */

    // the slow lateral pan across the working surface
    tl.to(cam, { x: -34, s: 1.052, duration: 3.15, ease: "power1.inOut" }, 5.82);

    // the film grade deepens as the titles take the lower-left
    tl.fromTo("#sp4-scrim", { opacity: 0.46 },
      { opacity: 0.9, duration: 1.2, ease: "power2.inOut", immediateRender: false }, 5.95);

    // the title recedes: chips clear, the lockup shrinks into a small corner mark
    tl.fromTo("#sp4-thesis", { opacity: 1, y: 0 },
      { opacity: 0, y: -10, duration: 0.5, ease: "power2.in", immediateRender: false }, 6.70);
    tl.fromTo("#sp4-lock", { scale: 1, opacity: 1 },
      { scale: 0.42, opacity: 0.82, duration: 1.0, ease: "power2.inOut", immediateRender: false }, 6.75);

    // one honest interaction: the pointer settles on the gate that is waiting on you
    tl.fromTo("#sp4-cursor", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 6.55);
    tl.fromTo("#sp4-cursor", CUR_FROM,
      { x: CUR_TO.x, y: CUR_TO.y, duration: 0.6, ease: "power2.inOut" }, 6.75);

    // "you make the calls" — the gate chip pulses ember once
    tl.fromTo("#sp4-gate", { scale: 1 },
      { scale: 1.13, duration: 0.18, ease: "power2.out", immediateRender: false }, 7.20);
    tl.fromTo("#sp4-gate", { scale: 1.13 },
      { scale: 1, duration: 0.44, ease: "power2.inOut", immediateRender: false }, 7.40);
    tl.fromTo("#sp4-gateglow", { opacity: 0 },
      { opacity: 0.95, duration: 0.2, ease: "power2.out", immediateRender: false }, 7.20);
    tl.fromTo("#sp4-gateglow", { opacity: 0.95 },
      { opacity: 0, duration: 0.72, ease: "power2.inOut", immediateRender: false }, 7.44);

    // the audience line, lower-left. Its band arrives just ahead of the words and
    // leaves before the frame ends — it is never on screen without text on it.
    tl.fromTo("#sp4-ltband", { opacity: 0 },
      { opacity: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, 8.35);
    tl.fromTo("#sp4-ltk", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 8.50);
    tl.fromTo("#sp4-ltl", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 8.62);

    // settled breathing hold — the camera never sleeps, but it stops travelling
    tl.to(cam, { x: -21, s: 1.066, duration: 1.85, ease: "power2.inOut" }, 9.10);
    tl.fromTo("#sp4-cursor", { opacity: 1 },
      { opacity: 0, duration: 0.5, ease: "power2.inOut", immediateRender: false }, 9.95);
    tl.fromTo("#sp4-ltband", { opacity: 1 },
      { opacity: 0, duration: 0.45, ease: "power2.inOut", immediateRender: false }, 10.40);

    /* drift — continuous micro-motion across the whole 11.0s. Added LAST so every
       cam tween has updated before applyCam composes the transform. */
    tl.to(drift, {
      p: Math.PI * 2 * 2,
      duration: 11.0,
      ease: "none",
      onUpdate: applyCam
    }, 0);

    window.__timelines["04-supaprod"] = tl;
  })();
</script>
