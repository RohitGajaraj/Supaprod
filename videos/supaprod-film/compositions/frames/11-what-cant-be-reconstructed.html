<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- F11 · What can't be reconstructed — the decision record close-up: artifacts (reconstructable)
       vs the sealed forecast (not). The camera does the arguing via a rack focus.
       Head is metadata only; the runtime clones ONLY the <template> below. -->
</head>
<body>
<template>
  <style>
    /* ————— fonts (screen kit, dual-path src) ————— */
    @font-face{font-family:"Geist";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/Geist-Regular.woff2") format("woff2"),url("assets/fonts/Geist-Regular.woff2") format("woff2");}
    @font-face{font-family:"Geist Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistMono-Regular.woff2") format("woff2"),url("assets/fonts/GeistMono-Regular.woff2") format("woff2");}
    @font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2");}
    @font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");}
    @font-face{font-family:"Mona Sans";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/MonaSans-Regular.woff2") format("woff2"),url("assets/fonts/MonaSans-Regular.woff2") format("woff2");}

    /* ————— tokens (screen kit v3 — declared on #root, inherit down; :root breaks under scoping) ————— */
    #root{
      --sk-ground:#0A0A0B;
      --sk-panel:#141416;
      --sk-raised:#1A1A1D;
      --sk-hairline:#26262A;
      --sk-text:#F2EFE9;
      --sk-muted:#A8A29A;
      --sk-faint:#6B6660;
      --sk-discover:#6FA9A0;
      --sk-decide:#C39A5E;
      --sk-plan:#8FA464;
      --sk-design:#AB7FA0;
      --sk-build:#6D97C2;
      --sk-ship:#BD8092;
      --sk-learn:#A89F66;
      --sk-pass:#4FC47A;
      --sk-fail:#EF6A5F;
      --sk-warn:#E8B44C;
      --sk-ember:#FF6B2C;
      --sk-accent:var(--sk-decide);
      --sk-r-chip:7px;
      --sk-r-control:8px;
      --sk-r-row:9px;
      --sk-r-card:10px;
      --sk-r-panel:12px;
      --sk-r-pane:16px;
      --sk-ui:"Mona Sans",system-ui,sans-serif;
      --sk-mono:"IBM Plex Mono",ui-monospace,monospace;
      --sk-ring:0 0 0 1px var(--sk-hairline);
      --sk-ambient:0 24px 80px rgba(0,0,0,.5);
      position:absolute;inset:0;width:100%;height:100%;overflow:hidden;
    }

    /* ————— ground clip (track 0) — the dependable full-bleed ink ————— */
    .f11-ground{position:absolute;inset:0;background:#0A0A0B;}

    /* ————— world clip (track 1) — kit frame + camera rig ————— */
    .f11-world{position:absolute;inset:0;}
    .sk-frame{
      position:relative;width:100%;height:100%;overflow:hidden;
      container-type:size;
      background:var(--sk-ground);
      color:var(--sk-text);
      font-family:var(--sk-ui);
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }
    .sk-frame *,.sk-frame *::before,.sk-frame *::after{box-sizing:border-box;margin:0;padding:0;}
    /* camera wrapper — single world transform (multi-phase-camera + viewport-change),
       horizontal pan streak rides the directional filter (motion-blur-streak, "X 0") */
    .f11-cam{
      position:absolute;inset:0;
      transform-origin:50% 50%;
      will-change:transform,filter;
      filter:url(#f11-panblur);
    }
    .sk-stage{
      position:absolute;inset:0;display:grid;place-items:center;
      perspective:2200px;
      perspective-origin:50% 42%;
    }
    .sk-screen{
      position:relative;
      width:88cqw;height:86cqh;
      transform:rotateX(2.6deg) rotateY(-4deg);
      transform-style:preserve-3d;
      background:var(--sk-ground);
      border-radius:var(--sk-r-pane);
      box-shadow:var(--sk-ring),var(--sk-ambient);
      overflow:hidden;
      will-change:transform;
    }

    /* ————— app shell ————— */
    .sk-shell{
      display:grid;height:100%;
      grid-template-columns:12.5cqw minmax(0,1fr);
      grid-template-rows:3.2cqh minmax(0,1fr);
      grid-template-areas:"side top" "side main";
    }
    .sk-sidebar{
      grid-area:side;display:flex;flex-direction:column;min-height:0;
      background:var(--sk-ground);border-right:1px solid var(--sk-hairline);
    }
    .sk-ws{display:flex;align-items:center;gap:0.55cqw;padding:1cqw 1cqw 0.8cqw;}
    .sk-ws-mark{
      width:0.72cqw;height:0.72cqw;flex:none;border-radius:50%;
      border:1px solid var(--sk-ember);
      background:radial-gradient(circle at 50% 50%,var(--sk-ember) 0 28%,transparent 30%);
    }
    .sk-ws-name{font:600 0.82cqw/1 var(--sk-ui);color:var(--sk-text);letter-spacing:0.01em;}
    .sk-ws-caret{margin-left:auto;font:400 0.6cqw/1 var(--sk-mono);color:var(--sk-faint);}
    .sk-nav{display:flex;flex-direction:column;gap:0.12cqh;padding:0.3cqw 0.5cqw;}
    .sk-navrow{
      display:flex;align-items:center;gap:0.55cqw;
      padding:0.42cqw 0.6cqw;border-radius:var(--sk-r-row);
      font:400 0.73cqw/1 var(--sk-ui);color:var(--sk-muted);
    }
    .sk-navrow .sk-dot{
      width:0.3cqw;height:0.3cqw;flex:none;border-radius:50%;
      background:var(--dot,var(--sk-faint));
    }
    .sk-navcount{margin-left:auto;font:400 0.55cqw/1 var(--sk-mono);color:var(--sk-faint);}
    .sk-navrow.is-active{background:var(--sk-raised);color:var(--sk-text);}
    .sk-navrow.is-active .sk-dot{box-shadow:0 0 0.45cqw 0 var(--dot,var(--sk-accent));}
    .sk-navrow.is-active .sk-navcount{color:var(--sk-muted);}
    .sk-side-foot{
      margin-top:auto;display:flex;align-items:center;gap:0.45cqw;
      padding:0.85cqw 1cqw;border-top:1px solid var(--sk-hairline);
      font:400 0.57cqw/1 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.03em;
    }
    .sk-livedot{
      width:0.26cqw;height:0.26cqw;flex:none;border-radius:50%;
      background:var(--sk-pass);box-shadow:0 0 0.4cqw var(--sk-pass);
    }
    .sk-topbar{
      grid-area:top;display:flex;align-items:center;gap:0.9cqw;
      padding:0 1cqw;border-bottom:1px solid var(--sk-hairline);background:var(--sk-ground);
    }
    .sk-crumb{display:flex;align-items:center;font:400 0.62cqw/1 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;}
    .sk-crumb-sep{padding:0 0.35cqw;color:var(--sk-faint);}
    .sk-crumb-here{color:var(--sk-text);}
    .sk-ask{
      display:flex;align-items:center;gap:0.5cqw;flex:0 1 20cqw;height:2.1cqh;
      padding:0 0.4cqw 0 0.65cqw;background:var(--sk-panel);
      border:1px solid var(--sk-hairline);border-radius:var(--sk-r-control);
      font:400 0.66cqw/1 var(--sk-ui);color:var(--sk-faint);
    }
    .sk-ask svg{width:0.68cqw;height:0.68cqw;flex:none;stroke:var(--sk-faint);fill:none;stroke-width:1.6;}
    .sk-kbd{
      margin-left:auto;padding:0.1cqw 0.32cqw;
      font:400 0.57cqw/1.4 var(--sk-mono);color:var(--sk-faint);
      background:var(--sk-ground);border:1px solid var(--sk-hairline);border-radius:5px;
    }
    .sk-avatar{
      width:1.25cqw;height:1.25cqw;flex:none;display:grid;place-items:center;
      background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:50%;
      font:600 0.5cqw/1 var(--sk-ui);color:var(--sk-muted);letter-spacing:0.05em;
    }

    /* ————— type + primitives ————— */
    .sk-title{font:600 1.3cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.01em;}
    .sk-body{font:400 0.73cqw/1.45 var(--sk-ui);color:var(--sk-text);}
    .sk-meta{font:400 0.68cqw/1.4 var(--sk-ui);color:var(--sk-muted);}
    .sk-label{font:500 0.65cqw/1.4 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.10em;text-transform:uppercase;}
    .sk-spacer{flex:1;}
    .sk-panel{
      background:var(--sk-panel);border:1px solid var(--sk-hairline);
      border-radius:var(--sk-r-panel);overflow:hidden;min-height:0;
      display:flex;flex-direction:column;
    }
    .sk-panel-hd{
      display:flex;align-items:center;gap:0.6cqw;flex:none;
      padding:0.75cqw 1cqw;border-bottom:1px solid var(--sk-hairline);
    }
    .sk-panel-title{font:600 0.83cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
    .sk-panel-body{flex:1;min-height:0;overflow:hidden;}
    .sk-panel-ft{
      display:flex;align-items:center;gap:0.6cqw;flex:none;
      padding:0.6cqw 1cqw;border-top:1px solid var(--sk-hairline);
      background:var(--sk-panel);
    }
    .sk-row{padding:0.7cqw 1cqw;}
    .sk-row + .sk-row{border-top:1px solid var(--sk-hairline);}
    .sk-chip{
      display:inline-flex;align-items:center;gap:0.3cqw;
      padding:0.22cqw 0.45cqw;border:1px solid var(--sk-hairline);
      border-radius:var(--sk-r-chip);background:rgba(255,255,255,0.02);
      font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;
      white-space:nowrap;
    }
    .sk-chip--pass{color:var(--sk-pass);border-color:color-mix(in srgb,var(--sk-pass) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-pass) 8%,transparent);}
    .sk-chip--ember{color:var(--sk-ember);border-color:color-mix(in srgb,var(--sk-ember) 45%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-ember) 9%,transparent);}
    .sk-dot-inline{width:0.26cqw;height:0.26cqw;flex:none;border-radius:50%;background:currentColor;}
    .sk-badge{
      display:inline-flex;align-items:center;padding:0.22cqw 0.45cqw;
      background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:var(--sk-r-chip);
      font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-muted);font-variant-numeric:tabular-nums;
    }

    /* ————— frame-11 specifics ————— */
    .f11-content{
      grid-area:main;position:relative;display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      grid-template-rows:auto minmax(0,1fr);
      gap:1cqw;padding:1.1cqw;min-height:0;
    }
    .f11-head{grid-column:1/-1;display:flex;align-items:center;gap:0.7cqw;}
    .f11-head .sk-title{font-size:1.05cqw;}
    .f11-headbit{will-change:transform,opacity;}

    /* the two focus planes (depth-of-field-blur — rack focus between them) */
    .f11-plane{--dof:0px;filter:blur(var(--dof));will-change:filter,opacity;}
    #f11-right{--dof:2.6px;opacity:0.72;}   /* pre-blurred plane B — rack setup, no pop at the rack */

    /* left · artifact rows */
    .f11-arow{background-color:rgba(242,239,233,0);will-change:transform,opacity;}
    .f11-arow-hd{display:flex;align-items:baseline;gap:0.5cqw;}
    .f11-srcdot{width:0.28cqw;height:0.28cqw;flex:none;align-self:center;border-radius:50%;background:var(--c,var(--sk-faint));}
    .f11-tag{font-size:0.52cqw;}
    .f11-time{font:400 0.57cqw/1 var(--sk-mono);color:var(--sk-faint);font-variant-numeric:tabular-nums;}
    .f11-abody{margin-top:0.25cqw;font:400 0.7cqw/1.4 var(--sk-ui);color:var(--sk-text);}
    .f11-ameta{margin-top:0.2cqw;font:400 0.6cqw/1.4 var(--sk-ui);color:var(--sk-muted);}

    /* right · the sealed forecast */
    .f11-rbody{
      display:flex;flex-direction:column;justify-content:center;gap:0.75cqw;
      padding:1.2cqw 1.5cqw 1.2cqw 1.2cqw;
    }
    .f11-record{
      position:relative;display:flex;align-items:center;gap:0.8cqw;
      padding:0.95cqw 1cqw;background:var(--sk-raised);
      border:1px solid color-mix(in srgb,var(--sk-ember) 28%,var(--sk-hairline));
      border-radius:var(--sk-r-row);
    }
    .f11-quote{font:600 0.92cqw/1.45 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
    .f11-glow{
      position:absolute;left:1.9cqw;top:50%;width:7cqw;height:7cqw;margin:-3.5cqw 0 0 -3.5cqw;
      border-radius:50%;pointer-events:none;opacity:0;
      background:radial-gradient(circle,rgba(255,107,44,0.45) 0%,rgba(255,107,44,0) 65%);
      will-change:transform,opacity;
    }
    #f11-sealchip{will-change:transform;}
    .f11-recmeta{font:400 0.6cqw/1.4 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;font-variant-numeric:tabular-nums;}
    .f11-div{height:1px;background:var(--sk-hairline);margin:0.3cqw 0;flex:none;}
    .f11-field{display:grid;grid-template-columns:8.5cqw minmax(0,1fr);align-items:baseline;gap:0.8cqw;will-change:transform,opacity;}
    .f11-field .sk-label{font-size:0.55cqw;}
    .f11-fval{font:400 0.73cqw/1.4 var(--sk-ui);color:var(--sk-text);}
    .f11-guide{display:flex;align-items:center;gap:0.6cqw;will-change:transform,opacity;}

    /* ————— overlay clip (track 2) — lower-third, above the caption keep-out ————— */
    .f11-overlay{position:absolute;inset:0;container-type:size;pointer-events:none;}
    .sk-lowerthird{
      position:absolute;left:5.5cqw;bottom:18.5cqh;z-index:60;
      display:flex;flex-direction:column;gap:0.55cqh;
      text-shadow:0 2px 30px rgba(0,0,0,.6);
      font-family:var(--sk-ui);
    }
    .sk-lt-kicker{
      font:500 0.72cqw/1 var(--sk-mono);letter-spacing:0.14em;text-transform:uppercase;
      color:var(--sk-decide);opacity:0;will-change:transform,opacity;
    }
    .f11-lt-swap{display:grid;}
    .sk-lt-line{
      grid-area:1/1;justify-self:start;
      font:600 2.6cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.01em;
      opacity:0;will-change:transform,opacity;white-space:nowrap;
    }
  
/* v4 identity: real product mark + workspace label */
.sk-ws-mark{background:none !important;border-radius:0 !important;padding:0.08cqw;box-sizing:border-box;}
.sk-ws-space{font:400 0.62cqw/1 var(--sk-mono, "IBM Plex Mono", monospace);color:var(--sk-text-muted, #A8A29A);margin-left:0.45cqw;padding:0.16cqw 0.38cqw;border:1px solid var(--sk-hairline, #26262A);border-radius:6px;}
</style>

  <div id="root" data-composition-id="11-what-cant-be-reconstructed" data-width="1920" data-height="1080" data-duration="7.7">

    <!-- track 0 · full-bleed ink ground -->
    <div id="f11-bg" class="clip f11-ground" data-start="0" data-duration="7.2" data-track-index="0"></div>

    <!-- track 1 · the world: kit frame + camera rig + the decision record -->
    <div id="f11-world" class="clip f11-world" data-start="0" data-duration="7.2" data-track-index="1" data-layout-allow-overflow="">
      <div class="sk-frame" id="f11-frame">

        <svg width="0" height="0" aria-hidden="true" style="position:absolute">
          <defs>

          </defs>
        </svg>

          <div class="sk-stage">

              <div class="sk-shell">

                <aside class="sk-sidebar">

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    /* ───────── camera rig (multi-phase-camera + viewport-change; tilt via onUpdate, never GSAP transform props) ───────── */
    const camEl = document.getElementById("f11-cam");
    const screenEl = document.getElementById("f11-screen");
    const cam = { scale: 1.45, x: 255, y: 70 };          // extreme close-up on the artifacts plane
    const drift = { p: 0 };                               // continuous micro-drift — the camera never sleeps
    function applyCamera() {
      const dx = Math.sin(drift.p) * 5;
      const dy = Math.sin(drift.p * 1.31) * 3;
      camEl.style.transform = `translate(${cam.x + dx}px, ${cam.y + dy}px) scale(${cam.scale})`;
    }
    const tilt = { rx: 2.6, ry: -4.0 };
    function applyTilt() {
      screenEl.style.transform = `rotateX(${tilt.rx}deg) rotateY(${tilt.ry}deg)`;
    }
    applyCamera(); applyTilt();

    /* pan streak (motion-blur-streak, directional "X 0") — proxy tween, seeded at 0 */
    const blurNode = document.getElementById("f11-panblur-std");
    const blurProxy = { v: 0 };
    const writeBlur = () => blurNode.setAttribute("stdDeviation", `${blurProxy.v} 0`);
    writeBlur();

    /* ── Scene 1 (0.0–2.8) · extreme close-up slides across the artifact rows, softly lit ── */
    tl.fromTo("#f11-frame", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.01);
    tl.to(cam, { x: 195, y: 55, duration: 2.75, ease: "power1.inOut", onUpdate: applyCamera }, 0.05);
    tl.to(tilt, { rx: 2.0, ry: -2.8, duration: 2.75, ease: "power1.inOut", onUpdate: applyTilt }, 0.05);

    tl.fromTo(".f11-headbit", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.07 }, 0.35);
    tl.fromTo(".f11-arow", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out", stagger: 0.09 }, 0.25);
    // a soft light passes row to row as the camera tracks across them (finite yoyo, deterministic)
    gsap.utils.toArray(".f11-arow").forEach((row, i) => {
      tl.to(row, { backgroundColor: "rgba(242,239,233,0.05)", duration: 0.22, ease: "power1.inOut", yoyo: true, repeat: 1 }, 0.6 + i * 0.27);
    });

    tl.fromTo("#f11-lt-k", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.5);
    tl.fromTo("#f11-lt-l1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.66);

    /* ── Scene 2 (2.8–5.4) · "Supaprod keeps" — rack focus to the sealed forecast, pan with streak ── */
    // rack (depth-of-field-blur): plane A defocuses exactly as pre-blurred plane B snaps sharp
    tl.to("#f11-left",  { "--dof": "3px",  opacity: 0.62, duration: 0.7, ease: "power2.inOut" }, 2.8);
    tl.to("#f11-right", { "--dof": "0px",  opacity: 1,    duration: 0.7, ease: "power2.inOut" }, 2.8);
    // camera pans right (world left), streak peaks at mid-pan velocity
    tl.to(cam, { scale: 1.32, x: -110, duration: 0.85, ease: "power2.inOut", onUpdate: applyCamera }, 2.8);
    tl.to(tilt, { rx: 1.5, ry: -1.8, duration: 0.85, ease: "power2.inOut", onUpdate: applyTilt }, 2.8);
    tl.to(blurProxy, { v: 6, duration: 0.42, ease: "power2.in", onUpdate: writeBlur }, 2.8);
    tl.to(blurProxy, { v: 0, duration: 0.46, ease: "power2.out", onUpdate: writeBlur }, 3.22);

    // lower-third swap (cut-the-curve, whole-line): exit rips left, entry continues leftward
    tl.to("#f11-lt-l1", { x: -230, duration: 0.34, ease: "power4.in" }, 2.9);
    tl.to("#f11-lt-l1", { opacity: 0, duration: 0.3, ease: "power1.in" }, 2.92);
    tl.fromTo("#f11-lt-l2",
      { x: 230, opacity: 0.35 },
      { x: 0, opacity: 1, duration: 0.3, ease: "power4.out", immediateRender: false }, 3.26);

    // the lock glints ember — the deep hit lands here
    tl.fromTo("#f11-glow", { opacity: 0, scale: 0.5 }, { opacity: 0.85, scale: 1.25, duration: 0.3, ease: "power2.out" }, 3.3);
    tl.to("#f11-glow", { opacity: 0, duration: 0.55, ease: "power2.out" }, 3.62);
    tl.to("#f11-sealchip", { scale: 1.09, duration: 0.13, ease: "power2.in", yoyo: true, repeat: 1 }, 3.3);
    tl.to("#f11-record", { borderColor: "rgba(255,107,44,0.55)", duration: 0.5, ease: "power2.out" }, 3.3);

    // "what you believed" — the belief fields land under the sealed row
    tl.fromTo(".f11-belief", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.16 }, 3.9);
