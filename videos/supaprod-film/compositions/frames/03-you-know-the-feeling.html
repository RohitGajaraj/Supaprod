<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- F3 · You know the feeling — the PM's Monday desktop, filmed. Everything the runtime needs lives inside <template>. -->
</head>
<body>
<template>
<style>
/* ————— fonts (frame.md block, kit dual-path form) ————— */
@font-face{font-family:"Geist";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/Geist-Regular.woff2") format("woff2"),url("assets/fonts/Geist-Regular.woff2") format("woff2");}
@font-face{font-family:"Geist Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistMono-Regular.woff2") format("woff2"),url("assets/fonts/GeistMono-Regular.woff2") format("woff2");}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2");}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");}
@font-face{font-family:"Mona Sans";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/MonaSans-Regular.woff2") format("woff2"),url("assets/fonts/MonaSans-Regular.woff2") format("woff2");}

/* ————— root (styled via #root only) ————— */
#root{position:absolute;inset:0;overflow:hidden;}

/* ————— tokens (screen-kit v3) ————— */
#root{
  --sk-ground:#0A0A0B; --sk-panel:#141416; --sk-raised:#1A1A1D; --sk-hairline:#26262A;
  --sk-text:#F2EFE9; --sk-muted:#A8A29A; --sk-faint:#6B6660;
  --sk-discover:#6FA9A0; --sk-decide:#C39A5E; --sk-plan:#8FA464; --sk-design:#AB7FA0;
  --sk-build:#6D97C2; --sk-ship:#BD8092; --sk-learn:#A89F66;
  --sk-pass:#4FC47A; --sk-fail:#EF6A5F; --sk-warn:#E8B44C; --sk-ember:#FF6B2C;
  --sk-r-chip:7px; --sk-r-control:8px; --sk-r-row:9px; --sk-r-card:10px; --sk-r-panel:12px; --sk-r-pane:16px;
  --sk-ui:"Mona Sans",system-ui,sans-serif; --sk-mono:"IBM Plex Mono",ui-monospace,monospace;
  --sk-ring:0 0 0 1px var(--sk-hairline);
  --sk-ambient:0 24px 80px rgba(0,0,0,.5);
}

/* ————— ground clip = the frame (container law lives here) ————— */
.f3-scene{
  position:absolute;inset:0;overflow:hidden;
  container-type:size;
  background:var(--sk-ground);
  color:var(--sk-text);
  font-family:var(--sk-ui);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
.f3-scene *,.f3-scene *::before,.f3-scene *::after{box-sizing:border-box;margin:0;padding:0;}

/* ————— world = the camera's subject (single wrapper; JS composes translate+scale) ————— */
.f3-world{
  position:absolute;inset:0;
  perspective:2400px;perspective-origin:50% 42%;
  transform-origin:50% 50%;
  will-change:transform;
  filter:url(#f3-pan-blur);
}
.f3-desk{
  position:absolute;inset:-40cqh -30cqw;
  background:
    radial-gradient(60cqw 46cqh at 30% 22%, rgba(26,26,29,.55) 0%, transparent 70%),
    radial-gradient(70cqw 52cqh at 74% 66%, rgba(26,26,29,.42) 0%, transparent 72%),
    var(--sk-ground);
}

/* ————— windows ————— */
.win{
  position:absolute;
  background:var(--sk-panel);
  border:1px solid var(--sk-hairline);
  border-radius:var(--sk-r-pane);
  box-shadow:var(--sk-ring),var(--sk-ambient);
  overflow:hidden;display:flex;flex-direction:column;
  --dof:0px;filter:blur(var(--dof));
  will-change:filter,opacity;
}
.win-hd{display:flex;align-items:center;gap:.5cqw;flex:none;padding:.55cqw .8cqw;border-bottom:1px solid var(--sk-hairline);background:var(--sk-panel);}
.win-bd{flex:1;min-height:0;overflow:hidden;}
/* brand glyph in a window header (marks inlined, never fetched) */
.win-glyph{width:.75cqw;height:.75cqw;flex:none;display:block;margin-right:-.16cqw;}
.win-glyph svg{display:block;width:100%;height:100%;fill:var(--sk-muted);}

/* kit type + chrome (sk- prefixed, copied inline) */
.sk-title{font:600 1.3cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.01em;}
.sk-body{font:400 0.73cqw/1.45 var(--sk-ui);color:var(--sk-text);}
.sk-prose{font:400 0.70cqw/1.65 var(--sk-ui);color:var(--sk-text);}
.sk-meta{font:400 0.68cqw/1.4 var(--sk-ui);color:var(--sk-muted);}
.sk-label{font:500 0.65cqw/1.4 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.10em;text-transform:uppercase;}
.sk-data{font:400 0.62cqw/1.5 var(--sk-mono);color:var(--sk-text);font-variant-numeric:tabular-nums;}
.sk-spacer{flex:1;}
.sk-row{padding:.55cqw .8cqw;}
.sk-row + .sk-row{border-top:1px solid var(--sk-hairline);}
.sk-chip{display:inline-flex;align-items:center;gap:.3cqw;padding:.22cqw .45cqw;border:1px solid var(--sk-hairline);border-radius:var(--sk-r-chip);background:rgba(255,255,255,0.02);font:400 .57cqw/1.3 var(--sk-mono);color:var(--sk-muted);letter-spacing:.02em;white-space:nowrap;}
.sk-chip--fail{color:var(--sk-fail);border-color:color-mix(in srgb,var(--sk-fail) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-fail) 8%,transparent);}
.sk-chip--warn{color:var(--sk-warn);border-color:color-mix(in srgb,var(--sk-warn) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-warn) 8%,transparent);}
.sk-badge{display:inline-flex;align-items:center;padding:.22cqw .45cqw;background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:var(--sk-r-chip);font:400 .57cqw/1.3 var(--sk-mono);color:var(--sk-muted);font-variant-numeric:tabular-nums;}
.sk-dot-inline{width:.26cqw;height:.26cqw;flex:none;border-radius:50%;background:currentColor;}

/* focus ping — the "one new thing" that pops when the camera lands */
.ping{opacity:0;will-change:transform,opacity;}

/* W1 interview notes */
.iv-row{position:relative;}
.iv-hl{position:absolute;inset:0;background:color-mix(in srgb,var(--sk-discover) 7%,transparent);box-shadow:inset 2px 0 0 var(--sk-discover);opacity:0;}
.iv-q{font:400 .78cqw/1.5 var(--sk-ui);color:var(--sk-text);letter-spacing:-.002em;}
.iv-src{margin-top:.22cqw;font:400 .57cqw/1.3 var(--sk-mono);color:var(--sk-faint);}

/* W2 inbox */
.ib-row{display:flex;align-items:baseline;gap:.5cqw;}
.ib-who{font:600 .68cqw/1.4 var(--sk-ui);color:var(--sk-text);white-space:nowrap;}
.ib-snip{font:400 .66cqw/1.4 var(--sk-ui);color:var(--sk-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ib-t{margin-left:auto;font:400 .55cqw/1.4 var(--sk-mono);color:var(--sk-faint);white-space:nowrap;}
.ib-new{opacity:0;background:color-mix(in srgb,var(--sk-warn) 5%,transparent);}
.ib-unread{color:var(--sk-warn);border-color:color-mix(in srgb,var(--sk-warn) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-warn) 8%,transparent);}

/* W3 linear issues */
.tk-cols{display:grid;grid-template-columns:1fr 1fr;gap:.7cqw;padding:.7cqw .8cqw;}
.tk-col .sk-label{display:block;margin-bottom:.45cqw;font-size:.55cqw;}
.tk-card{padding:.5cqw .6cqw;background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:var(--sk-r-card);margin-bottom:.5cqw;}
.tk-meta{display:flex;align-items:center;gap:.3cqw;}
.tk-pri{width:.3cqw;height:.3cqw;flex:none;border-radius:50%;background:currentColor;}
.tk-id{font:500 .55cqw/1.3 var(--sk-mono);color:var(--sk-faint);letter-spacing:.04em;}
.tk-tt{margin-top:.18cqw;font:400 .66cqw/1.35 var(--sk-ui);color:var(--sk-text);}
.tk-new{opacity:0;border-color:color-mix(in srgb,var(--sk-fail) 40%,var(--sk-hairline));}

/* W4 dashboard */
.fx-wrap{padding:.8cqw .9cqw;display:flex;flex-direction:column;gap:.55cqw;}
.fx-step{display:grid;grid-template-columns:6.2cqw minmax(0,1fr) 2.6cqw;gap:.55cqw;align-items:center;}
.fx-name{font:400 .55cqw/1.2 var(--sk-mono);color:var(--sk-muted);letter-spacing:.04em;}
.fx-track{display:block;height:.9cqh;background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:4px;overflow:hidden;}
.fx-track i{display:block;height:100%;width:100%;background:#4B4B51;transform-origin:left center;}
.fx-step.is-bad .fx-track i{background:color-mix(in srgb,var(--sk-fail) 62%,#4B4B51);}
.fx-val{font:400 .55cqw/1.2 var(--sk-mono);color:var(--sk-muted);text-align:right;font-variant-numeric:tabular-nums;}
.fx-big{display:flex;align-items:baseline;gap:.6cqw;padding:.2cqw .9cqw .7cqw;}
.fx-num{font:500 2.1cqw/1 var(--sk-mono);color:var(--sk-fail);letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.fx-cap{font:500 .5cqw/1.3 var(--sk-mono);color:var(--sk-faint);letter-spacing:.08em;text-transform:uppercase;}

/* W5 roadmap */
.rm-row{position:relative;display:flex;align-items:center;gap:.55cqw;height:4.9cqh;padding:0 .9cqw;border-top:1px solid var(--sk-hairline);will-change:transform;}
.rm-grip{font:400 .6cqw/1 var(--sk-mono);color:var(--sk-faint);letter-spacing:.08em;}
.rm-tt{font:400 .73cqw/1.3 var(--sk-ui);color:var(--sk-text);}
.rm-hl{position:absolute;inset:0;background:color-mix(in srgb,var(--sk-warn) 7%,transparent);box-shadow:inset 2px 0 0 var(--sk-warn);opacity:0;}
.rm-pin{opacity:0;}

/* W6 hunches */
.hn-row{position:relative;display:flex;gap:.45cqw;padding:.42cqw .8cqw;font:400 .68cqw/1.5 var(--sk-ui);color:var(--sk-muted);}
.hn-row b{font-weight:400;color:var(--sk-warn);font-family:var(--sk-mono);}
.hn-hl{position:absolute;inset:0;background:color-mix(in srgb,var(--sk-learn) 8%,transparent);box-shadow:inset 2px 0 0 var(--sk-learn);opacity:0;}

/* W7 chat */
.ch-msg{display:flex;gap:.55cqw;padding:.5cqw .8cqw;}
.ch-av{width:1.35cqw;height:1.35cqw;flex:none;display:grid;place-items:center;background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:5px;font:600 .5cqw/1 var(--sk-ui);color:var(--sk-muted);letter-spacing:.04em;}
.ch-who{font:600 .66cqw/1.4 var(--sk-ui);color:var(--sk-text);}
.ch-t{margin-left:.4cqw;font:400 .52cqw/1.5 var(--sk-mono);color:var(--sk-faint);}
.ch-txt{font:400 .7cqw/1.5 var(--sk-ui);color:var(--sk-muted);margin-top:.1cqw;}
.ch-exec{opacity:0;background:color-mix(in srgb,var(--sk-ember) 5%,transparent);box-shadow:inset 2px 0 0 var(--sk-ember);will-change:transform,opacity;filter:url(#f3-slam-blur);}
.ch-exec .ch-av{background:color-mix(in srgb,var(--sk-ember) 16%,var(--sk-raised));color:var(--sk-text);border-color:color-mix(in srgb,var(--sk-ember) 40%,var(--sk-hairline));}
.ch-exec .ch-txt{color:var(--sk-text);font-weight:600;}
.ch-reacts{display:flex;gap:.4cqw;margin-top:.45cqw;}
.ch-react{opacity:0;will-change:transform,opacity;}
.ch-pin{opacity:0;color:var(--sk-ember);border-color:color-mix(in srgb,var(--sk-ember) 45%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-ember) 9%,transparent);}

/* W8 claude code agent session */
.cc-term{padding:.55cqw .75cqw;display:flex;flex-direction:column;gap:.42cqw;}
.cc-line{display:flex;align-items:baseline;gap:.34cqw;font:400 .6cqw/1.4 var(--sk-mono);color:var(--sk-muted);letter-spacing:.01em;}
.cc-p{color:var(--sk-faint);}
.cc-run{width:.32cqw;height:.32cqw;flex:none;align-self:center;border-radius:50%;background:var(--sk-warn);}
.cc-ok{color:var(--sk-pass);}
.cc-txt{color:var(--sk-text);}
.cc-new{opacity:0;}
.cc-caret{display:inline-block;width:.42cqw;height:.72cqw;background:var(--sk-text);vertical-align:-.1cqw;}

/* ask palette (scene 4) */
.ask-wrap{position:absolute;left:33cqw;top:24cqh;width:34cqw;z-index:40;opacity:0;transform-origin:50% 50%;will-change:transform,opacity;}
.ask-bar{display:flex;align-items:center;gap:.6cqw;height:4.6cqh;padding:0 .9cqw;background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:var(--sk-r-panel);box-shadow:var(--sk-ring),var(--sk-ambient);}
.ask-bar svg{width:.95cqw;height:.95cqw;flex:none;stroke:var(--sk-muted);fill:none;stroke-width:1.6;}
.ask-line{display:inline-flex;align-items:baseline;min-width:24cqw;white-space:pre;font:400 .95cqw/1 var(--sk-mono);color:var(--sk-text);}
.ask-cursor{display:inline-block;width:.5cqw;height:1.15cqw;margin-left:.12cqw;background:var(--sk-text);vertical-align:-0.18cqw;}
.ask-kbd{margin-left:auto;padding:.14cqw .4cqw;font:400 .55cqw/1.4 var(--sk-mono);color:var(--sk-faint);background:var(--sk-ground);border:1px solid var(--sk-hairline);border-radius:5px;}
.ask-result{margin-top:.7cqh;padding:.8cqw 1cqw;background:var(--sk-panel);border:1px solid var(--sk-hairline);border-radius:var(--sk-r-panel);box-shadow:var(--sk-ring);opacity:0;will-change:transform,opacity;}
.ask-empty{font:400 .85cqw/1.4 var(--sk-ui);color:var(--sk-muted);}
.ask-empty-meta{margin-top:.3cqw;font:400 .57cqw/1.5 var(--sk-mono);color:var(--sk-faint);letter-spacing:.02em;}

/* film chrome */
.f3-vig{position:absolute;inset:0;z-index:50;pointer-events:none;background:radial-gradient(120cqw 90cqh at 50% 42%, transparent 52%, rgba(0,0,0,.52) 100%);opacity:.55;}
.f3-lt{position:absolute;left:5.5cqw;bottom:18cqh;z-index:60;display:flex;flex-direction:column;gap:.55cqh;text-shadow:0 2px 30px rgba(0,0,0,.6);opacity:0;will-change:transform,opacity;}
.f3-lt-kicker{font:500 .72cqw/1 var(--sk-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--sk-warn);}
.f3-lt-line{font:600 2.4cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-.01em;}
</style>

      <!-- W3 · linear issue board -->
      <section class="win" id="w-tk" style="left:60cqw;top:8cqh;width:33cqw;height:36cqh;transform:rotateY(-2.6deg) rotateX(1deg);z-index:4;">
        <header class="win-hd">
          <span class="win-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2.886 4.18A11.982 11.982 0 0 1 11.99 0C18.624 0 24 5.376 24 12.009c0 3.64-1.62 6.903-4.18 9.105L2.887 4.18ZM1.817 5.626l16.556 16.556c-.524.33-1.075.62-1.65.866L.951 7.277c.247-.575.537-1.126.866-1.65ZM.322 9.163l14.515 14.515c-.71.172-1.443.282-2.195.322L0 11.358a12 12 0 0 1 .322-2.195Zm-.17 4.862 9.823 9.824a12.02 12.02 0 0 1-9.824-9.824Z"/></svg></span>
          <span class="sk-label" style="font-size:.55cqw;">linear · issues</span>
          <span class="sk-chip ping" id="tk-ping"><span class="sk-dot-inline" style="color:var(--sk-fail)"></span>12 open</span>
          <span class="sk-spacer"></span>
          <span class="sk-meta" style="font-size:.55cqw;">cycle 14 · checkout</span>

    if (peak > 0){

  var s1 = T(50, 45, 1.0);

  tl.to(slamP, { v: 0, duration: 0.42, ease: "power4.out", onUpdate: writeSlam }, 7.35);

  tl.fromTo(".ch-react", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)", stagger: 0.22 }, 8.25);

  /* roadmap visibly reorders — "app redesign" jumps 3 slots to the top (row = 4.9cqh = 52.9px) */
  var ROW = 52.9;
  tl.fromTo("#rm4-hl", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 9.05);
  tl.to("#rm4", { y: -3 * ROW, duration: 0.55, ease: "power3.inOut" }, 9.15);
  tl.to("#rm1", { y: ROW, duration: 0.55, ease: "power3.inOut" }, 9.15);
  tl.to("#rm2", { y: ROW, duration: 0.55, ease: "power3.inOut" }, 9.15);
  tl.to("#rm3", { y: ROW, duration: 0.55, ease: "power3.inOut" }, 9.15);
  tl.set("#rm4", { zIndex: 3 }, 9.15);
  ping(9.55, "#rm4-pin");
  tl.fromTo("#rm-edited", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 9.55);

  /* ——— Scene 4 · the ask bar and the question ——— */
  tl.fromTo("#ask-wrap", { opacity: 0, scale: 0.96, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.65, ease: "power3.out" }, 10.25);
  tl.fromTo("#ask-result", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 13.40);

  /* typing (discrete-text-sequence) + context-sensitive cursor (cream while typing, faint on the empty result) */
  var CREAM = "#F2EFE9", FAINT = "#6B6660";
  var SEQ = [
    { t: 0,     x: "",                        c: CREAM },
    { t: 10.60, x: "w",                       c: CREAM },
    { t: 10.72, x: "wh",                      c: CREAM },
    { t: 10.84, x: "why",                     c: CREAM },
    { t: 11.05, x: "why ",                    c: CREAM },
    { t: 11.16, x: "why d",                   c: CREAM },
    { t: 11.28, x: "why di",                  c: CREAM },
    { t: 11.40, x: "why did",                 c: CREAM },
    { t: 11.58, x: "why did ",                c: CREAM },
    { t: 11.69, x: "why did w",               c: CREAM },
    { t: 11.80, x: "why did we",              c: CREAM },
    { t: 12.02, x: "why did we ",             c: CREAM },
    { t: 12.13, x: "why did we b",            c: CREAM },
    { t: 12.23, x: "why did we bu",           c: CREAM },
    { t: 12.33, x: "why did we bui",          c: CREAM },
    { t: 12.43, x: "why did we buil",         c: CREAM },
    { t: 12.53, x: "why did we build",        c: CREAM },
    { t: 12.68, x: "why did we build ",       c: CREAM },
    { t: 12.78, x: "why did we build t",      c: CREAM },
    { t: 12.86, x: "why did we build th",     c: CREAM },
    { t: 12.92, x: "why did we build thi",    c: CREAM },
    { t: 12.98, x: "why did we build this",   c: CREAM },
    { t: 13.12, x: "why did we build this?",  c: CREAM },
    { t: 13.45, x: "why did we build this?",  c: FAINT }
  ];
  function seqAt(t){
    for (var i = SEQ.length - 1; i >= 0; i--) if (t >= SEQ[i].t) return SEQ[i];
    return SEQ[0];
  }
  var askText = document.getElementById("ask-text");
  var askCursor = document.getElementById("ask-cursor");

  /* master driver — one ease:none sweep runs discrete text states + inbox count */
  var driver = { t: 0 };
  tl.to(driver, { t: DUR, duration: DUR, ease: "none", onUpdate: function(){
    var e = seqAt(driver.t);
    askText.textContent = e.x;
    askCursor.style.background = e.c;
    var c = IB_COUNTS[0].v;
    for (var i = IB_COUNTS.length - 1; i >= 0; i--) if (driver.t >= IB_COUNTS[i].t){ c = IB_COUNTS[i].v; break; }
    ibEl.textContent = c;
  }}, 0);

  /* deterministic cursor blink — 20 cycles over 14.5s (period ≈ 0.72s), sin square-wave */
  var ccCaret = document.getElementById("cc-caret");
  var blink = { p: 0 };
  tl.to(blink, { p: Math.PI * 2 * 20, duration: DUR, ease: "none", onUpdate: function(){
    askCursor.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
    /* the agent terminal rides the same driver, phase shifted so the two carets never blink in lockstep */
    ccCaret.style.opacity = Math.sin(blink.p * 0.62 + 1.9) > 0 ? "1" : "0.12";
  }}, 0);

  window.__timelines["03-you-know-the-feeling"] = tl;
})();
