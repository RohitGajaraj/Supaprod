  <body>
    <template>
      <style>

        /* Root — styled via #root only (scoper drops root-class rules). */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
        }

        /* Full-bleed ink ground — a clip, never a background on #root. */
        .bg-field {
          position: absolute;
          inset: 0;
          background: #0A0A0B;
        }

        .stage {
          position: absolute;
          inset: 0;

        /* ————— Draft decision card (left, 55) ————— */
        .draft-card {
          position: absolute;
          left: 5.5cqw;

        .outcome-line {
          margin-top: 1.7cqw;

          font-weight: 700;

        .word.dash {

        }
      </style>

      <div id="root" data-composition-id="10-it-stops-you" data-width="1920" data-height="1080" data-duration="12.9">
        <!-- ground: dedicated full-duration clip on the lowest track -->
        <div id="bg" class="clip bg-field" data-start="0" data-duration="12.3" data-track-index="0"></div>

        <!-- single stage clip; all reveals inside are timeline-driven -->
        <div id="stage" class="clip stage" data-start="0" data-duration="12.3" data-track-index="1">

          <!-- draft decision card — starts frame-centered, shifts left when the warning arrives -->
          <div class="draft-card" id="draft-card">
            <div class="kicker-row">
              <span class="rule-stub"></span>
              <span class="kicker">new bet &middot; draft</span>
            </div>
            <div class="draft-title-row">
              <span class="draft-title" id="draft-title"></span>
              <span class="caret" id="caret"></span>
            </div>
            <span class="sk sk-1" id="sk-1"></span>
            <span class="sk sk-2" id="sk-2"></span>
            <div class="meta-row">
              <span class="score-pending" id="score-pending">score &middot; pending</span>
              <span class="score-chip" id="score-chip">
                <span class="score-chip-label">re-scored</span>
                <span class="score-val" id="score-val">8.0</span>
              </span>
            </div>
          </div>

          <!-- warning card — slides in from the right; intentionally starts off-frame -->
          <div class="warn-card" id="warn-card" data-layout-allow-overflow>
            <div class="warn-glow" id="warn-glow"></div>
            <div class="warn-inner">
              <div class="warn-head">you&rsquo;ve made this call before</div>
              <div class="warn-divider"></div>
              <div class="warn-body" id="warn-body">last year &middot; similar bet</div>
              <div class="mini-card" id="mini-card">
                <span class="mini-title-wrap">
                  <span class="mini-title">redesign the app</span>
                  <span class="mini-strike" id="mini-strike"></span>
                </span>
                <span class="mini-score">4.0</span>
              </div>
              <div class="outcome-line" id="outcome-line">
                <span class="word" data-word="outcome">outcome:</span>
                <span class="word" data-word="missed">missed</span>
                <span class="word dash">&mdash;</span>
                <span class="word" data-word="the">the</span>
                <span class="word" data-word="boring">boring</span>
                <span class="word" data-word="fix">fix</span>
                <span class="word" data-word="paid">paid</span>
                <span class="word" data-word="instead">instead</span>
              </div>
            </div>
          </div>

        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const DUR = 12.3;

        /* ============================================================
           Block motion — GSAP-native transforms only (no direct style
           writes on these elements, so no cache desync).
           ============================================================ */

        // Scene 1 — draft card sits frame-centered (xPercent offset), pops in.
        // spring-pop-entrance: fromTo, smooth power3.out settle, no overshoot.
        tl.fromTo(
          "#draft-card",
          { xPercent: 44.9, y: 18, scale: 0.97, opacity: 0 },
          { xPercent: 44.9, y: 0, scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
          0.05
        );

        // The rest of the draft sketches itself while the title types.
        tl.fromTo("#sk-1", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.out" }, 2.05);
        tl.fromTo("#sk-2", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.out" }, 2.4);
        tl.fromTo(
          "#score-pending",
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          2.8
        );

        // Scene 2 — on "it stops you": draft yields left...
        tl.to("#draft-card", { xPercent: 0, duration: 1.05, ease: "power3.inOut" }, 3.18);

        // ...and the ember warning card slides in from the right and settles
        // (spring-pop-entrance mechanics: explicit fromTo, scale grow into rest,
        // long-tail power3.out, garnish x-slide reads as "slides in").
        tl.fromTo(
          "#warn-card",
          { xPercent: 82, scale: 0.975, opacity: 0 },
          { xPercent: 0, scale: 1, opacity: 1, duration: 0.98, ease: "power3.out" },
          3.22
        );

        // Ember edge glow blooms on arrival — glow is a static box-shadow layer,
        // only its OPACITY is animated (stays inside the property allowlist).
        tl.fromTo("#warn-glow", { opacity: 0 }, { opacity: 0.85, duration: 1.1, ease: "power2.out" }, 3.3);

        // "You made this call last year" — body line, then the struck mini-card.
        tl.fromTo(
          "#warn-body",
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          4.45
        );
        tl.fromTo(
          "#mini-card",
          { opacity: 0, y: 12, scale: 0.97 },
          { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" },
          4.75
        );
        // The strike from Frame 6 re-draws itself across the past bet, in miniature.
        tl.fromTo("#mini-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.inOut" }, 5.5);

        // Scene 3 — "Here's what happened": the outcome line arrives, then glows word by word.
        tl.fromTo(
          "#outcome-line",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          6.88
        );

        // The draft's provisional score is quietly re-scored downward (counting-dynamic-scale).
        tl.to("#score-pending", { opacity: 0, duration: 0.3, ease: "power2.out" }, 8.1);
        tl.fromTo(
          "#score-chip",
          { opacity: 0, scale: 0.9 },
          { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
          8.25
        );

        // Scene 4 — "guiding the next move": the glow settles to a calm ember.
        tl.to("#warn-glow", { opacity: 0.5, duration: 1.0, ease: "power2.inOut" }, 9.85);

        // Subtle jitter only (sine-wave-loop doctrine, hand-authored finite arcs —
        // low amplitude, out of phase, easing to full rest for the held read).
        tl.to("#draft-card", { y: 1.6, duration: 0.7, ease: "sine.inOut" }, 10.05);
        tl.to("#draft-card", { y: -1.2, duration: 0.9, ease: "sine.inOut" }, 10.75);
        tl.to("#draft-card", { y: 0, duration: 0.65, ease: "sine.inOut" }, 11.65);
        tl.to("#warn-card", { y: -1.4, duration: 0.8, ease: "sine.inOut" }, 10.2);
        tl.to("#warn-card", { y: 1.0, duration: 0.85, ease: "sine.inOut" }, 11.0);
        tl.to("#warn-card", { y: 0, duration: 0.45, ease: "sine.inOut" }, 11.85);

        /* ============================================================
           JS-driven state — ONE full-duration linear driver so every
           seek recomputes every state from absolute time (seek-safe
           in any sampling order). Handles: title typing (discrete-
           text-sequence), caret, keyword glow envelopes (asr-keyword-
           glow), and the score count-down (counting-dynamic-scale).
           ============================================================ */

        // discrete-text-sequence — grouped keystrokes, word-break pauses, no smear.
        const TITLE_SEQ = [
          { t: 0.0, text: "" },
          { t: 0.7, text: "r" },
          { t: 0.82, text: "re" },
          { t: 0.94, text: "red" },
          { t: 1.1, text: "rede" },
          { t: 1.22, text: "redes" },
          { t: 1.34, text: "redesi" },
          { t: 1.46, text: "redesig" },
          { t: 1.58, text: "redesign" },
          { t: 1.9, text: "redesign " },
          { t: 2.02, text: "redesign t" },
          { t: 2.14, text: "redesign th" },
          { t: 2.26, text: "redesign the" },
          { t: 2.58, text: "redesign the " },
          { t: 2.68, text: "redesign the a" },
          { t: 2.78, text: "redesign the ap" },
          { t: 2.88, text: "redesign the app" },
        ];
        function titleAt(t) {
          for (let i = TITLE_SEQ.length - 1; i >= 0; i--) {
            if (t >= TITLE_SEQ[i].t) return TITLE_SEQ[i].text;
          }
          return "";
        }

        // asr-keyword-glow — attack/sustain/release envelope per word, ember glow.
        // "missed" is the brand-weight word: longer window, stronger peak.
        const GLOW_TIMINGS = {
          outcome: { start: 7.1, end: 7.4 },
          missed: { start: 7.5, end: 8.15 },
          the: { start: 8.3, end: 8.45 },
          boring: { start: 8.5, end: 8.8 },
          fix: { start: 8.85, end: 9.05 },
          paid: { start: 9.1, end: 9.4 },
          instead: { start: 9.45, end: 9.75 },
        };
        const ATTACK = 0.14;
        const RELEASE = 0.35;
        const REST_LEVEL = 0.35;
        const REST_RGB = { r: 107, g: 102, b: 96 };   // cream-hint
        const ACTIVE_RGB = { r: 242, g: 239, b: 233 }; // cream
        const BRAND_RGB = { r: 255, g: 107, b: 44 };   // fire-orange
        function envelope(t, start, end) {
          const releaseEnd = end + RELEASE;
          if (t < start) return 0;
          if (t < end) return Math.min((t - start) / ATTACK, 1);
          if (t < releaseEnd) {
            const decay = (t - end) / RELEASE;
            return 1 - decay * (1 - REST_LEVEL);
          }
          return REST_LEVEL;
        }
        function lerpCh(a, b, p) {
          return Math.round(a + (b - a) * p);
        }

        const titleEl = document.getElementById("draft-title");
        const caretEl = document.getElementById("caret");
        const scoreValEl = document.getElementById("score-val");
        const glowWords = Array.from(document.querySelectorAll(".word[data-word]"));

        const driver = { t: 0 };
        tl.to(
          driver,
          {
            t: DUR,
            duration: DUR,
            ease: "none",
            onUpdate: () => {
              const t = driver.t;

              // — title typing —
              titleEl.textContent = titleAt(t);

              // — caret: solid while typing, deterministic sin-blink while the
              //   draft idles, fades out once the warning has taken the frame —
              let caretOpacity;
              if (t < 0.4) {
                caretOpacity = 0;
              } else if (t < 3.0) {
                caretOpacity = 1; // typing — solid
              } else if (t < 4.4) {
                caretOpacity = Math.sin(((t - 3.0) / 0.65) * Math.PI * 2) > 0 ? 1 : 0.15;
              } else {
                caretOpacity = Math.max(0, 1 - (t - 4.4) / 0.3) * 0.15;
              }
              caretEl.style.opacity = String(caretOpacity);

              // — keyword glow (ember, calm not alarming) —
              for (const el of glowWords) {
                const key = el.dataset.word;
                const timing = GLOW_TIMINGS[key];
                if (!timing) continue;
                const isBrand = key === "missed";
                const env = envelope(t, timing.start, timing.end);
                const target = isBrand ? BRAND_RGB : ACTIVE_RGB;
                const maxBlur = isBrand ? 22 : 14;
                const boost = isBrand ? 0.09 : 0.04;
                el.style.color =
                  "rgb(" +
                  lerpCh(REST_RGB.r, target.r, env) +
                  "," +
                  lerpCh(REST_RGB.g, target.g, env) +
                  "," +
                  lerpCh(REST_RGB.b, target.b, env) +
                  ")";
                el.style.textShadow =
                  "0 0 " + (maxBlur * env).toFixed(1) + "px rgba(255,107,44," + (0.08 + 0.4 * env).toFixed(3) + ")";
                el.style.transform = "scale(" + (1 + boost * env).toFixed(4) + ")";
              }

              // — score re-scores downward: 8.0 → 4.0, value + size co-driven
              //   (counting-dynamic-scale, small register, power3.out feel) —
              const p = Math.min(Math.max((t - 8.45) / 1.15, 0), 1);
              const e = 1 - Math.pow(1 - p, 3);
              scoreValEl.textContent = (8.0 - 4.0 * e).toFixed(1);
              scoreValEl.style.fontSize = (1.85 - 0.35 * e).toFixed(3) + "cqw";
            },
          },
          0
        );

        window.__timelines["10-it-stops-you"] = tl;
      </script>
    </template>
  </body>
