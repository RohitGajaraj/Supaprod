<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- F10 · It stops you — mid-draft on Decide, a precedent side-sheet interrupts:
       you've made this call before, with the record to prove it.
       Head is metadata only; the runtime clones ONLY the <template> below. -->
</head>
<body>
<template>
  <style>
    /* ————— fonts (screen kit, dual-path src) ————— */
    @font-face{font-family:"Geist";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/Geist-Regular.woff2") format("woff2"),url("assets/fonts/Geist-Regular.woff2") format("woff2");}
    @font-face{font-family:"Geist Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistMono-Regular.woff2") format("woff2"),url("assets/fonts/GeistMono-Regular.woff2") format("woff2");}
    @font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2");}
    @font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");}
    @font-face{font-family:"Mona Sans";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/MonaSans-Regular.woff2") format("woff2"),url("assets/fonts/MonaSans-Regular.woff2") format("woff2");}

    /* ————— tokens (screen kit v3 — declared on #root, inherit down; :root breaks under scoping) ————— */
    #root{
      --sk-ground:#0A0A0B;
      --sk-panel:#141416;
      --sk-raised:#1A1A1D;
      --sk-hairline:#26262A;
      --sk-text:#F2EFE9;
      --sk-muted:#A8A29A;
      --sk-faint:#6B6660;
      --sk-discover:#6FA9A0;
      --sk-decide:#C39A5E;
      --sk-plan:#8FA464;
      --sk-design:#AB7FA0;
      --sk-build:#6D97C2;
      --sk-ship:#BD8092;
      --sk-learn:#A89F66;
      --sk-pass:#4FC47A;
      --sk-fail:#EF6A5F;
      --sk-warn:#E8B44C;
      --sk-ember:#FF6B2C;
      --sk-accent:var(--sk-decide);
      --sk-r-chip:7px;
      --sk-r-control:8px;
      --sk-r-row:9px;
      --sk-r-card:10px;
      --sk-r-panel:12px;
      --sk-r-pane:16px;
      --sk-ui:"Mona Sans",system-ui,sans-serif;
      --sk-mono:"IBM Plex Mono",ui-monospace,monospace;
      --sk-ring:0 0 0 1px var(--sk-hairline);
      --sk-ambient:0 24px 80px rgba(0,0,0,.5);
      position:absolute;inset:0;width:100%;height:100%;overflow:hidden;
    }

    /* ————— ground clip (track 0) — the dependable full-bleed ink ————— */
    .f10-ground{position:absolute;inset:0;background:#0A0A0B;}

    /* ————— world clip (track 1) — kit frame + camera rig ————— */
    .f10-world{position:absolute;inset:0;}
    .sk-frame{
      position:relative;width:100%;height:100%;overflow:hidden;
      container-type:size;
      background:var(--sk-ground);
      color:var(--sk-text);
      font-family:var(--sk-ui);
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }
    .sk-frame *,.sk-frame *::before,.sk-frame *::after{box-sizing:border-box;margin:0;padding:0;}
    /* camera wrapper — single world transform (multi-phase-camera + viewport-change) */
    .f10-cam{
      position:absolute;inset:0;
      transform-origin:50% 50%;
      will-change:transform,filter;
      filter:url(#f10-camblur);
    }
    .sk-stage{
      position:absolute;inset:0;display:grid;place-items:center;
      perspective:2200px;
      perspective-origin:50% 42%;
    }
    .sk-screen{
      position:relative;
      width:88cqw;height:86cqh;
      transform:rotateX(2.6deg) rotateY(-3.9deg);
      transform-style:preserve-3d;
      background:var(--sk-ground);
      border-radius:var(--sk-r-pane);
      box-shadow:var(--sk-ring),var(--sk-ambient);
      overflow:hidden;
      will-change:transform;
    }

    /* ————— app shell ————— */
        .sk-shell{
      display:grid;height:100%;
      grid-template-columns:2.9cqw minmax(0,1fr);
      grid-template-rows:4cqh 7cqh minmax(0,1fr);
      grid-template-areas:"top top" "spine spine" "rail main";
    }

    /* top bar · bare mark + wordmark · breadcrumb · centred notification strip · ask + avatar */
    .sk-topbar{
      grid-area:top;display:grid;align-items:center;
      grid-template-columns:auto minmax(0,1fr) auto;gap:0.9cqw;
      padding:0 1cqw;border-bottom:1px solid var(--sk-hairline);background:var(--sk-ground);
    }
    .sk-topleft{display:flex;align-items:center;gap:0.7cqw;min-width:0;}
    .sk-brand{display:flex;align-items:center;gap:0.42cqw;}
    .sk-brand-mark{width:1.15cqw;height:1.15cqw;flex:none;display:block;}
    .sk-brand-name{font:600 0.86cqw/1.25 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
    .sk-topdiv{width:1px;height:1.5cqh;flex:none;background:var(--sk-hairline);}
    .sk-crumb{
      display:flex;align-items:center;gap:0.3cqw;white-space:nowrap;
      font:400 0.72cqw/1 var(--sk-ui);color:var(--sk-muted);
    }
    .sk-crumb-sep{color:var(--sk-faint);}
    .sk-crumb-here{color:var(--sk-text);}
    .sk-crumb-caret{font:400 0.6cqw/1 var(--sk-mono);color:var(--sk-faint);}
    .sk-notify{justify-self:center;display:flex;align-items:center;gap:0.45cqw;min-width:0;white-space:nowrap;}
    .sk-notify-gl{display:flex;align-items:center;gap:0.26cqw;flex:none;}
    .sk-notify-gl svg{width:0.72cqw;height:0.72cqw;display:block;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
    .sk-notify-lead{font:500 0.66cqw/1.2 var(--sk-ui);color:var(--sk-text);flex:none;}
    .sk-notify-sub{font:400 0.66cqw/1.2 var(--sk-ui);color:var(--sk-faint);min-width:0;overflow:hidden;text-overflow:ellipsis;}
    .sk-notify-time{font:400 0.6cqw/1.2 var(--sk-ui);color:var(--sk-faint);flex:none;}
    .sk-topright{display:flex;align-items:center;gap:0.6cqw;}
    .sk-ask{
      display:flex;align-items:center;gap:0.38cqw;height:2.3cqh;flex:none;
      padding:0 0.6cqw;background:var(--sk-panel);
      border:1px solid var(--sk-hairline);border-radius:999px;
      font:400 0.7cqw/1 var(--sk-ui);color:var(--sk-text);
    }
    .sk-ask svg{width:0.72cqw;height:0.72cqw;flex:none;stroke:var(--sk-muted);fill:none;stroke-width:1.5;stroke-linejoin:round;}
    .sk-kbd{font:400 0.62cqw/1 var(--sk-mono);color:var(--sk-faint);}
    .sk-avatar{
      width:1.5cqw;height:1.5cqw;flex:none;display:grid;place-items:center;
      background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:50%;
      font:600 0.55cqw/1 var(--sk-ui);color:var(--sk-muted);letter-spacing:0.03em;
    }

    /* ————— station strip · seven numbered cells, full width, straight under the top bar ————— */
    .sk-spine{
      grid-area:spine;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
      border-bottom:1px solid var(--sk-hairline);background:var(--sk-ground);
    }
    .sk-stn{
      position:relative;display:grid;grid-template-rows:1.05cqh 1.75cqh 1.2cqh;gap:0.3cqh;
      align-content:center;padding:0 0.9cqw;min-width:0;
    }
    .sk-stn + .sk-stn{border-left:1px solid var(--sk-hairline);}
    .sk-stn-n{font:400 0.5cqw/1 var(--sk-mono);color:var(--sk-faint);letter-spacing:0.08em;}
    .sk-stn-name{font:400 0.84cqw/1.1 var(--sk-ui);color:var(--sk-muted);letter-spacing:-0.005em;white-space:nowrap;}
    .sk-stn-sub{font:400 0.56cqw/1.1 var(--sk-ui);color:var(--sk-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .sk-stn.is-here .sk-stn-name{font-weight:600;color:var(--sk-text);}
    .sk-stn.is-here .sk-stn-sub{color:var(--sk-ember);}
    .sk-stn.has-work .sk-stn-name{color:color-mix(in srgb,var(--sk-text) 82%,var(--sk-muted));}
    .sk-stn-dot{
      position:absolute;right:0.85cqw;top:1.15cqh;width:0.3cqw;height:0.3cqw;border-radius:50%;
      background:var(--sk-ember);box-shadow:0 0 0.5cqw color-mix(in srgb,var(--sk-ember) 62%,transparent);
    }

    /* ————— narrow icon rail · Today · Runs · Brain · Crew · Engine room ————— */
    .sk-rail{
      grid-area:rail;display:flex;flex-direction:column;align-items:center;min-height:0;
      padding:0.85cqh 0;background:var(--sk-ground);border-right:1px solid var(--sk-hairline);
    }
    .sk-railtop{display:flex;flex-direction:column;align-items:center;gap:0.42cqh;}
    .sk-railfoot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:0.3cqh;}
    .sk-glyph{
      position:relative;width:1.95cqw;height:1.95cqw;flex:none;
      display:grid;place-items:center;border-radius:var(--sk-r-control);color:var(--sk-faint);
    }
    .sk-glyph svg{
      width:1.02cqw;height:1.02cqw;display:block;fill:none;stroke:currentColor;
      stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
    }
    .sk-glyph.is-active{background:var(--sk-raised);color:var(--sk-text);box-shadow:inset 0 0 0 1px var(--sk-hairline);}
    .sk-railfoot .sk-glyph{width:1.7cqw;height:1.7cqw;}
    .sk-railfoot .sk-glyph svg{width:0.9cqw;height:0.9cqw;}
    .sk-livedot{
      width:0.26cqw;height:0.26cqw;flex:none;border-radius:50%;
      background:var(--sk-pass);box-shadow:0 0 0.4cqw var(--sk-pass);
    }
    .sk-livedot{
      width:0.26cqw;height:0.26cqw;flex:none;border-radius:50%;
      background:var(--sk-pass);box-shadow:0 0 0.4cqw var(--sk-pass);
    }
    .sk-topbar{
      grid-area:top;display:flex;align-items:center;gap:0.9cqw;
      padding:0 1cqw;border-bottom:1px solid var(--sk-hairline);background:var(--sk-ground);
    }
    .sk-crumb{display:flex;align-items:center;font:400 0.62cqw/1 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;}
    .sk-crumb-sep{padding:0 0.35cqw;color:var(--sk-faint);}
    .sk-crumb-here{color:var(--sk-text);}
    .sk-ask{
      display:flex;align-items:center;gap:0.5cqw;flex:0 1 20cqw;height:2.1cqh;
      padding:0 0.4cqw 0 0.65cqw;background:var(--sk-panel);
      border:1px solid var(--sk-hairline);border-radius:var(--sk-r-control);
      font:400 0.66cqw/1 var(--sk-ui);color:var(--sk-faint);
    }
    .sk-ask svg{width:0.68cqw;height:0.68cqw;flex:none;stroke:var(--sk-faint);fill:none;stroke-width:1.6;}
    .sk-kbd{
      margin-left:auto;padding:0.1cqw 0.32cqw;
      font:400 0.57cqw/1.4 var(--sk-mono);color:var(--sk-faint);
      background:var(--sk-ground);border:1px solid var(--sk-hairline);border-radius:5px;
    }
    .sk-avatar{
      width:1.25cqw;height:1.25cqw;flex:none;display:grid;place-items:center;
      background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:50%;
      font:600 0.5cqw/1 var(--sk-ui);color:var(--sk-muted);letter-spacing:0.05em;
    }

    /* ————— type + primitives ————— */
    .sk-title{font:600 1.3cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.01em;}
    .sk-body{font:400 0.73cqw/1.45 var(--sk-ui);color:var(--sk-text);}
    .sk-meta{font:400 0.68cqw/1.4 var(--sk-ui);color:var(--sk-muted);}
    .sk-label{font:500 0.65cqw/1.4 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.10em;text-transform:uppercase;}
    .sk-spacer{flex:1;}
    .sk-panel{
      background:var(--sk-panel);border:1px solid var(--sk-hairline);
      border-radius:var(--sk-r-panel);overflow:hidden;min-height:0;
      display:flex;flex-direction:column;
    }
    .sk-panel-hd{
      display:flex;align-items:center;gap:0.6cqw;flex:none;
      padding:0.75cqw 1cqw;border-bottom:1px solid var(--sk-hairline);
    }
    .sk-panel-title{font:600 0.83cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
    .sk-panel-body{flex:1;min-height:0;overflow:hidden;}
    .sk-panel-ft{
      display:flex;align-items:center;gap:0.6cqw;flex:none;
      padding:0.6cqw 1cqw;border-top:1px solid var(--sk-hairline);
      background:var(--sk-panel);
    }
    .sk-row{padding:0.7cqw 1cqw;}
    .sk-row + .sk-row{border-top:1px solid var(--sk-hairline);}
    .sk-chip{
      display:inline-flex;align-items:center;gap:0.3cqw;
      padding:0.22cqw 0.45cqw;border:1px solid var(--sk-hairline);
      border-radius:var(--sk-r-chip);background:rgba(255,255,255,0.02);
      font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;
      white-space:nowrap;
    }
    .sk-chip.is-on,
    .sk-chip--accent{color:var(--sk-accent);border-color:color-mix(in srgb,var(--sk-accent) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-accent) 8%,transparent);}
    .sk-chip--pass{color:var(--sk-pass);border-color:color-mix(in srgb,var(--sk-pass) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-pass) 8%,transparent);}
    .sk-chip--ember{color:var(--sk-ember);border-color:color-mix(in srgb,var(--sk-ember) 45%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-ember) 9%,transparent);}
    .sk-dot-inline{width:0.26cqw;height:0.26cqw;flex:none;border-radius:50%;background:currentColor;}
    .sk-badge{
      display:inline-flex;align-items:center;padding:0.22cqw 0.45cqw;
      background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:var(--sk-r-chip);
      font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-muted);font-variant-numeric:tabular-nums;
    }
    .sk-caret{
      display:inline-block;width:0.08cqw;height:0.95em;margin-left:0.08cqw;
      background:var(--sk-accent);vertical-align:-0.12em;
    }
    .sk-agentline{
      display:flex;align-items:center;gap:0.5cqw;
      padding:0.6cqw 0.8cqw;background:var(--sk-raised);
      border:1px solid var(--sk-hairline);border-radius:var(--sk-r-row);
      font:400 0.62cqw/1.3 var(--sk-mono);color:var(--sk-muted);
    }
    .sk-run{color:var(--sk-accent);}

    /* ————— composite score with sub-bars (kit §10) ————— */
    .sk-score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.1cqw;align-items:center;margin-top:0.7cqw;}
    .sk-score-main{display:flex;flex-direction:column;align-items:flex-start;gap:0.15cqw;}
    .sk-score-num{
      font:500 1.5cqw/1 var(--sk-mono);color:var(--sk-accent);
      letter-spacing:-0.03em;font-variant-numeric:tabular-nums;
    }
    .sk-score-cap{font:500 0.5cqw/1 var(--sk-mono);color:var(--sk-faint);letter-spacing:0.08em;text-transform:uppercase;}
    .sk-score-bars{display:flex;flex-direction:column;gap:0.45cqw;}
    .sk-subbar{display:grid;grid-template-columns:4.6cqw minmax(0,1fr) 1.9cqw;gap:0.55cqw;align-items:center;}
    .sk-subbar-name{font:400 0.55cqw/1 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.04em;}
    .sk-subbar-track{display:block;height:0.18cqw;background:var(--sk-hairline);border-radius:2px;overflow:hidden;}
    .sk-subbar-track i{display:block;height:100%;background:var(--sk-accent);border-radius:inherit;will-change:transform;}
    .sk-subbar-val{font:400 0.55cqw/1 var(--sk-mono);color:var(--sk-muted);text-align:right;font-variant-numeric:tabular-nums;}

    /* ————— bet card (kit §11) ————— */
    .sk-betcard{
      flex:none;padding:1.1cqw 1.2cqw;background:var(--sk-raised);
      border:1px solid var(--sk-hairline);border-radius:var(--sk-r-card);
    }
    .sk-betcard-hd{display:flex;align-items:center;gap:0.6cqw;}
    .sk-rank{font:500 0.62cqw/1 var(--sk-mono);color:var(--sk-faint);letter-spacing:0.06em;text-transform:uppercase;}
    .sk-betcard-title{font:600 0.95cqw/1.25 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;white-space:nowrap;}
    .sk-betcard .sk-meta{margin-top:0.3cqw;font-size:0.62cqw;}
    .sk-betnote{
      display:flex;gap:0.45cqw;margin-top:0.8cqw;padding-top:0.65cqw;
      border-top:1px solid var(--sk-hairline);
      font:400 0.57cqw/1.4 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;
    }
    .sk-betnote span{color:var(--sk-accent);}

    /* ————— depth-of-field layers (—dof drives blur; kit surfaces stay sharp per focus plan) ————— */
    .f10-dof{--dof:0px;filter:blur(var(--dof));will-change:filter,opacity;}
    .f10-ctx{--dof:2.2px;opacity:0.88;}

    /* ————— frame-10 content grid ————— */
    .f10-content{
      grid-area:main;position:relative;display:grid;
      grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) 15.5cqw;
      grid-template-rows:auto minmax(0,1fr);
      gap:1cqw;padding:1.1cqw;min-height:0;
    }
    .f10-head{grid-column:1/-1;display:flex;align-items:baseline;gap:0.8cqw;}
    .f10-leftcol{display:flex;flex-direction:column;gap:0.9cqw;min-height:0;align-self:start;}

    /* the new draft being typed */
    .f10-draft{position:relative;}
    .f10-type{min-height:1.19cqw;}
    .f10-chipslot{display:inline-grid;}
    .f10-chipslot .sk-chip{grid-area:1/1;justify-self:end;}
    .f10-prechip{opacity:0;}
    .f10-scoreblock{opacity:0;}
    .f10-val{opacity:0;}
    .f10-note{opacity:0;will-change:transform,opacity;}
    .f10-agentline{opacity:0;will-change:transform,opacity;}

    /* in-review panel */
    .f10-irrow-hd{display:flex;align-items:center;gap:0.55cqw;}
    .f10-irrow-title{font:400 0.73cqw/1.35 var(--sk-ui);color:var(--sk-text);}
    .f10-irrow-meta{margin-top:0.22cqw;font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-faint);font-variant-numeric:tabular-nums;}

    /* passed rail */
    .f10-passrow-title{font:400 0.73cqw/1.35 var(--sk-ui);color:var(--sk-muted);}
    .f10-passrow-title s{color:var(--sk-faint);}
    .f10-passrow-meta{margin-top:0.2cqw;font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-faint);font-variant-numeric:tabular-nums;}

    /* ————— the precedent side-sheet (slides in from the right, over the rail) ————— */
    .f10-drawer{
      position:absolute;top:0;right:0;bottom:0;width:19.5cqw;z-index:20;
      display:flex;flex-direction:column;min-height:0;
      background:var(--sk-panel);
      border-left:1px solid var(--sk-hairline);
      border-radius:var(--sk-r-pane) 0 0 var(--sk-r-pane);
      box-shadow:var(--sk-ring),var(--sk-ambient);
      will-change:transform,filter;
      filter:url(#f10-streak);
    }
    .f10-ring{
      position:absolute;inset:0;z-index:5;pointer-events:none;
      border:1px solid var(--sk-ember);
      border-radius:var(--sk-r-pane) 0 0 var(--sk-r-pane);
      box-shadow:0 0 1cqw rgba(255,107,44,0.2);
      opacity:0;
    }
    .f10-drawer-hd{
      display:flex;align-items:center;gap:0.55cqw;flex:none;
      padding:0.9cqw 1.2cqw;border-bottom:1px solid var(--sk-hairline);
    }
    .f10-warndot{
      width:0.3cqw;height:0.3cqw;flex:none;border-radius:50%;
      background:var(--sk-warn);box-shadow:0 0 0.4cqw var(--sk-warn);
    }
    .f10-drawer-title{font:600 0.83cqw/1.25 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
    .f10-drawer-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:0.9cqw;padding:1cqw 1.2cqw;}
    .f10-pastcard{
      position:relative;padding:0.85cqw 1cqw;background:var(--sk-raised);
      border:1px solid var(--sk-hairline);border-radius:var(--sk-r-card);
      overflow:hidden;
    }

                          <div class="sk-subbar"><span class="sk-subbar-name">effort</span><span class="sk-subbar-track"><i class="f10-bar" style="width:84%"></i></span><span class="sk-subbar-val f10-val">8.4</span></div>
                        </div>

                  </div>

                  <!-- middle · in review (the world after F9's re-rank) -->
                  <section class="sk-panel f10-dof f10-ctx" style="align-self:stretch;">
                    <header class="sk-panel-hd">

                    </header>

                  <section class="sk-panel f10-dof f10-ctx" style="align-self:stretch;">

                      <div class="sk-row">

                  <!-- the precedent side-sheet — the interrupt -->
                  <aside class="f10-drawer" id="f10-drawer">
                    <div class="f10-ring" id="f10-ring"></div>
                    <header class="f10-drawer-hd">
                      <span class="f10-warndot"></span>

                    <div class="f10-drawer-body">
                      <article class="f10-pastcard" id="f10-pastcard">

                        <div class="f10-src">
                          <span class="sk-chip sk-chip--ember" style="font-size:0.5cqw;"><svg width="9" height="9" viewBox="0 0 12 12" style="stroke:currentColor;fill:none;stroke-width:1.4;"><rect x="2" y="5" width="8" height="5.5" rx="1.2" /><path d="M4 5 V3.6 a2 2 0 0 1 4 0 V5" /></svg>sealed</span>
                          before the outcome · maya r.

    </div>

    <!-- track 2 · film overlay — lower-third, above the caption keep-out -->
    <div id="f10-overlay" class="clip f10-overlay" data-start="0" data-duration="12.3" data-track-index="2">
      <div class="sk-lowerthird">
        <span class="sk-lt-kicker" id="f10-lt-k">the record</span>
        <span class="sk-lt-line" id="f10-lt-l">the mistake you almost repeated, caught.</span>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    gsap.defaults({ lazy: false });   // paused, seeked timelines never tick — lazy tweens would render stale start values
        window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    /* ───────────── camera rig — multi-phase-camera (phases + drift) on one world wrapper ───────────── */
    const camEl = document.getElementById("f10-cam");
    const screenEl = document.getElementById("f10-screen");
    const cam = { scale: 1.5, x: 310, y: 150 };          // phase state — close on the typing
    const drift = { p: 0 };                               // continuous micro-drift (Lissajous)
    function applyCamera() {
      const dx = Math.sin(drift.p) * 5;
      const dy = Math.sin(drift.p * 1.31) * 3;
      camEl.style.transform = `translate(${cam.x + dx}px, ${cam.y + dy}px) scale(${cam.scale})`;
    }
    const tilt = { rx: 2.6, ry: -3.9 };
    function applyTilt() {
      screenEl.style.transform = `rotateX(${tilt.rx}deg) rotateY(${tilt.ry}deg)`;
    }
    applyCamera(); applyTilt();

    /* camera push-blur (motion-blur-streak, symmetric smear at pan peak) — seeded at 0 */
    const camBlurNode = document.getElementById("f10-camblur-std");
    const camBlur = { v: 0 };
    const writeCamBlur = () => camBlurNode.setAttribute("stdDeviation", `${camBlur.v} ${camBlur.v}`);
    writeCamBlur();

    /* drawer entrance streak (motion-blur-streak path A, X axis) — seeded at peak */
    const streakNode = document.getElementById("f10-streak-std");
    const streak = { v: 14 };
    const writeStreak = () => streakNode.setAttribute("stdDeviation", `${streak.v} 0`);
    writeStreak();

    /* ── Scene 1 (0.0–3.0) · close on the draft: the caret types the old idea back to life ── */
    tl.fromTo("#f10-frame", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.01);
    tl.to(cam, { scale: 1.44, x: 295, y: 140, duration: 2.9, ease: "power2.out", onUpdate: applyCamera }, 0);
    tl.to(tilt, { rx: 2.1, ry: -3.1, duration: 2.9, ease: "power2.out", onUpdate: applyTilt }, 0);

    // typing (discrete-text-sequence: human cadence, word-break pauses)
    const SEQ = [
      { t: 0.00, s: "" },
      { t: 0.42, s: "r" },
      { t: 0.53, s: "re" },
      { t: 0.61, s: "red" },
      { t: 0.74, s: "rede" },
      { t: 0.82, s: "redes" },
      { t: 0.94, s: "redesi" },
      { t: 1.02, s: "redesig" },
      { t: 1.10, s: "redesign" },
      { t: 1.46, s: "redesign t" },
      { t: 1.54, s: "redesign th" },
      { t: 1.63, s: "redesign the" },
      { t: 1.94, s: "redesign the a" },
      { t: 2.03, s: "redesign the ap" },
      { t: 2.12, s: "redesign the app" }
    ];
    function textAt(time) {
      for (let i = SEQ.length - 1; i >= 0; i--) if (time >= SEQ[i].t) return SEQ[i].s;
      return "";
    }
    const typedEl = document.getElementById("f10-typed");
    const typeDriver = { t: 0 };
    tl.to(typeDriver, {
      t: 2.3, duration: 2.3, ease: "none",
      onUpdate: () => { typedEl.textContent = textAt(typeDriver.t); }
    }, 0);

    // caret blink — deterministic sin, whole shot
    const caretEl = document.getElementById("f10-caret");
    const blink = { p: 0 };
    tl.to(blink, {
      p: Math.PI * 2 * 9, duration: 12.3, ease: "none",
      onUpdate: () => { caretEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0"; }
    }, 0);

    // agent line + "scoring…" chip, then the provisional score lands (bars fill as a chord)
    tl.fromTo("#f10-agentline", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.15);
    tl.fromTo("#f10-scoringchip", { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.0);
    tl.to("#f10-scoringchip", { opacity: 0, duration: 0.25, ease: "power1.inOut" }, 2.5);
    tl.fromTo("#f10-scoreblock", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.55);
    tl.fromTo(".f10-bar", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.6, ease: "power3.out", stagger: 0.08 }, 2.62);
    tl.fromTo(".f10-val", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", stagger: 0.08 }, 2.85);

    // composite counts to the provisional 6.1 (counting-dynamic-scale, UI register)
    const numEl = document.getElementById("f10-num");
    const sc = { v: 0, fs: 1.5 };
    const writeNum = () => { numEl.textContent = sc.v.toFixed(1); numEl.style.fontSize = sc.fs.toFixed(3) + "cqw"; };
    writeNum();
    tl.to(sc, { v: 6.1, duration: 0.55, ease: "power2.out", onUpdate: writeNum }, 2.62);

    /* ── Scene 2 (3.0–6.4) · "it stops you": the precedent sheet streaks in; rack focus to it ── */
    // camera pans right toward the sheet (viewport-change), streaking at peak velocity
    tl.to(cam, { scale: 1.16, x: -430, y: 0, duration: 0.85, ease: "power2.inOut", onUpdate: applyCamera }, 3.1);
    tl.to(tilt, { rx: 1.8, ry: -2.4, duration: 0.85, ease: "power2.inOut", onUpdate: applyTilt }, 3.1);
    tl.to(camBlur, { v: 3.8, duration: 0.42, ease: "power2.in", onUpdate: writeCamBlur }, 3.1);
    tl.to(camBlur, { v: 0, duration: 0.43, ease: "power2.out", onUpdate: writeCamBlur }, 3.52);

    // the sheet slides from the right — position and streak share one window + ease
    tl.fromTo("#f10-drawer", { xPercent: 112 }, { xPercent: 0, duration: 0.65, ease: "power3.out" }, 3.15);
    tl.to(streak, { v: 0, duration: 0.65, ease: "power3.out", onUpdate: writeStreak }, 3.15);

    // rack focus (depth-of-field-blur): draft defocuses + dims while the sheet stays sharp
    tl.to("#f10-draft", { "--dof": "2.4px", opacity: 0.84, duration: 0.6, ease: "power2.inOut" }, 3.2);
    tl.to("#f10-agentline", { "--dof": "2.4px", opacity: 0.7, duration: 0.6, ease: "power2.inOut" }, 3.2);

    // lower-third lands on the interrupt — container (scrim + ember rule) leads the type in
    tl.fromTo("#f10-overlay .sk-lowerthird", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 3.20);
    tl.fromTo("#f10-lt-k", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.35);
    tl.fromTo("#f10-lt-l", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 3.55);
    // and clears well before the cross to frame 11 (frame 11 fades up at local 10.8) so the two never stack
    tl.to("#f10-lt-k", { opacity: 0, y: -8, duration: 0.4, ease: "power1.in" }, 9.9);
    tl.to("#f10-lt-l", { opacity: 0, y: -8, duration: 0.4, ease: "power1.in" }, 10.0);
    // band and type leave together
    tl.to("#f10-overlay .sk-lowerthird", { opacity: 0, duration: 0.45, ease: "power1.in" }, 10.0);

    // "You made this call last year" — the past card takes the accent bar
    tl.fromTo("#f10-pastbar", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.45, ease: "power2.out" }, 4.35);
    tl.fromTo("#f10-pastcard", { scale: 1 }, { scale: 1.012, duration: 0.28, ease: "power1.inOut", yoyo: true, repeat: 1 }, 4.35);

    // the sheet's sections reveal down the VO: forecast → outcome → link → foot
    tl.fromTo(".f10-dr2", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.32 }, 5.0);

    // camera keeps breathing onto the sheet between cues
    tl.to(cam, { scale: 1.18, x: -455, y: 5, duration: 2.6, ease: "power1.inOut", onUpdate: applyCamera }, 4.1);

    /* ── Scene 3 (6.4–9.4) · "Here's what happened": the outcome line speaks; the score recomputes DOWN ── */
    // asr-keyword-glow — one driver, per-word attack/sustain/release envelope
    const words = gsap.utils.toArray(".f10-w");
    const WT = [
      { s: 6.55, e: 6.75, miss: false },
      { s: 6.85, e: 7.40, miss: true },   // "missed." — the long, fail-toned sustain
      { s: 7.50, e: 7.62, miss: false },
      { s: 7.66, e: 7.86, miss: false },
      { s: 7.94, e: 8.10, miss: false },
      { s: 8.18, e: 8.36, miss: false },
      { s: 8.44, e: 8.66, miss: false }
    ];
    const REST = { r: 107, g: 102, b: 96 };    // #6B6660
    const LIT  = { r: 242, g: 239, b: 233 };   // #F2EFE9
    const MISS = { r: 239, g: 106, b: 95 };    // #EF6A5F
    const ATTACK = 0.12, RELEASE = 0.35, REST_LEVEL = 0.3;
    function env(t, s, e) {
      if (t < s) return 0;
      if (t < e) return Math.min((t - s) / ATTACK, 1);
      if (t < e + RELEASE) return 1 - ((t - e) / RELEASE) * (1 - REST_LEVEL);
      return REST_LEVEL;
    }
    function lerpC(a, b, t) { return Math.round(a + (b - a) * t); }
    const glow = { t: 6.4 };
    function writeGlow() {
      for (let i = 0; i < words.length; i++) {
        const cfg = WT[i];
        if (!cfg) continue;
        const v = env(glow.t, cfg.s, cfg.e);
        const T = cfg.miss ? MISS : LIT;
        words[i].style.color = `rgb(${lerpC(REST.r, T.r, v)}, ${lerpC(REST.g, T.g, v)}, ${lerpC(REST.b, T.b, v)})`;
        words[i].style.textShadow = `0 0 ${(10 * v).toFixed(2)}px rgba(${T.r}, ${T.g}, ${T.b}, ${(0.4 * v).toFixed(3)})`;
        words[i].style.transform = `scale(${(1 + 0.055 * v).toFixed(4)})`;
      }
    }
    writeGlow();
    tl.to(glow, { t: 9.1, duration: 2.7, ease: "none", onUpdate: writeGlow }, 6.4);

    // camera eases back left so the recompute is in view; draft half-refocuses
    tl.to(cam, { scale: 1.11, x: -200, y: 0, duration: 1.0, ease: "power2.inOut", onUpdate: applyCamera }, 7.15);
    tl.to("#f10-draft", { "--dof": "0.8px", opacity: 0.96, duration: 0.5, ease: "power2.inOut" }, 7.25);

    // the draft's score quietly recomputes DOWN (counting-dynamic-scale, small): 6.1 → 4.1
    tl.to(sc, { v: 4.1, fs: 1.3, duration: 0.9, ease: "power2.inOut", onUpdate: writeNum }, 7.5);
    tl.to(numEl, { color: "#A8A29A", duration: 0.9, ease: "power2.inOut" }, 7.5);
    const cvalEl = document.getElementById("f10-cval");
    const cv = { v: 5.6 };
    tl.to(cv, { v: 2.9, duration: 0.9, ease: "power2.inOut", onUpdate: () => { cvalEl.textContent = cv.v.toFixed(1); } }, 7.5);
    tl.to("#f10-bar-c", { scaleX: 0.518, transformOrigin: "0% 50%", duration: 0.9, ease: "power2.inOut" }, 7.5);
    tl.to("#f10-cval", { color: "#6B6660", duration: 0.9, ease: "power2.inOut" }, 7.5);
    tl.fromTo("#f10-prechip", { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 8.3);
    tl.fromTo("#f10-note", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 8.35);

    // "view the record" pulses once
    tl.fromTo("#f10-link", { scale: 1 }, { scale: 1.06, duration: 0.16, ease: "power1.inOut", yoyo: true, repeat: 1 }, 8.75);

    // camera creeps back onto the sheet for the settle
    tl.to(cam, { scale: 1.13, x: -250, duration: 1.0, ease: "power1.inOut", onUpdate: applyCamera }, 8.25);

    /* ── Scene 4 (9.4–12.3) · "guiding the next move": calm ember edge, pull WIDE — draft + precedent side by side ── */
    tl.fromTo("#f10-ring", { opacity: 0 }, { opacity: 0.95, duration: 0.6, ease: "power2.out" }, 9.55);
    tl.to(cam, { scale: 1.0, x: 0, y: 0, duration: 2.0, ease: "power2.inOut", onUpdate: applyCamera }, 9.45);
    tl.to(tilt, { rx: 1.2, ry: -1.5, duration: 2.0, ease: "power2.inOut", onUpdate: applyTilt }, 9.45);
    // everything settles sharp (refocus release before the hold)
    tl.to("#f10-draft", { "--dof": "0px", opacity: 1, duration: 1.1, ease: "power2.inOut" }, 9.6);
    tl.to("#f10-agentline", { "--dof": "0px", opacity: 1, duration: 1.1, ease: "power2.inOut" }, 9.6);
    tl.to(".f10-ctx", { "--dof": "0px", opacity: 1, duration: 1.1, ease: "power2.inOut" }, 9.6);

    /* drift driver — inserted LAST so it reads final cam state each frame; spans the whole shot */
    tl.to(drift, { p: Math.PI * 2 * 2, duration: 12.3, ease: "none", onUpdate: applyCamera }, 0);

    window.__timelines["10-it-stops-you"] = tl;
  </script>
