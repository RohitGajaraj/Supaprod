<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- F9 · The loop closes — Learn scores the outcome against the sealed call; Discover re-ranks. 10.8s.
         One world, two screens (Learn left · Discover right) on one perspective stage; a single macro
         camera pushes on the verdict, tracks to the sealed record, whip-pans (cut-the-curve seam, blur
         peaks at the cut) to the re-ranking, then pulls wide to both panes joined by the ember thread.
         Everything the runtime needs lives inside <template>. -->
  </head>
  <body>
    <template>
      <style>
        /* ————— fonts (kit copy of frame.md block, dual-path src) ————— */
        @font-face{font-family:"Geist";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/Geist-Regular.woff2") format("woff2"),url("assets/fonts/Geist-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistMono-Regular.woff2") format("woff2"),url("assets/fonts/GeistMono-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Pixel Circle";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelCircle-Regular.woff2") format("woff2"),url("assets/fonts/GeistPixelCircle-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Pixel Grid";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelGrid-Regular.woff2") format("woff2"),url("assets/fonts/GeistPixelGrid-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Pixel Line";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelLine-Regular.woff2") format("woff2"),url("assets/fonts/GeistPixelLine-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Pixel Square";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelSquare-Regular.woff2") format("woff2"),url("assets/fonts/GeistPixelSquare-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Pixel Triangle";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelTriangle-Regular.woff2") format("woff2"),url("assets/fonts/GeistPixelTriangle-Regular.woff2") format("woff2");}
        @font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2");}
        @font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");}
        @font-face{font-family:"Mona Sans";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/MonaSans-Regular.woff2") format("woff2"),url("assets/fonts/MonaSans-Regular.woff2") format("woff2");}

        /* ————— tokens — declared on #root (the doc-root selector gets scoped away in the composited render) ————— */
        #root{
          --sk-ground:#0A0A0B;
          --sk-panel:#141416;
          --sk-raised:#1A1A1D;
          --sk-hairline:#26262A;
          --sk-text:#F2EFE9;
          --sk-muted:#A8A29A;
          --sk-faint:#6B6660;
          --sk-discover:#6FA9A0;
          --sk-decide:#C39A5E;
          --sk-plan:#8FA464;
          --sk-design:#AB7FA0;
          --sk-build:#6D97C2;
          --sk-ship:#BD8092;
          --sk-learn:#A89F66;
          --sk-pass:#4FC47A;
          --sk-fail:#EF6A5F;
          --sk-warn:#E8B44C;
          --sk-ember:#FF6B2C;
          --sk-accent:var(--sk-learn);
          --sk-r-chip:7px;
          --sk-r-control:8px;
          --sk-r-row:9px;
          --sk-r-card:10px;
          --sk-r-panel:12px;
          --sk-r-pane:16px;
          --sk-ui:"Mona Sans",system-ui,sans-serif;
          --sk-mono:"IBM Plex Mono",ui-monospace,monospace;
          --sk-ring:0 0 0 1px var(--sk-hairline);
          --sk-ambient:0 24px 80px rgba(0,0,0,.5);
        }
        #root{position:absolute;inset:0;overflow:hidden;font-family:var(--sk-ui);}

        /* ————— frame ground & perspective stage (kit) ————— */
        .sk-frame{
          position:absolute;inset:0;overflow:hidden;
          container-type:size;
          background:var(--sk-ground);
          color:var(--sk-text);
          font-family:var(--sk-ui);
          -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
        }
        .sk-frame *,.sk-frame *::before,.sk-frame *::after{box-sizing:border-box;margin:0;padding:0;}
        .sk-screen{
          position:relative;flex:none;
          width:var(--sk-w,88cqw);height:var(--sk-h,86cqh);
          transform:rotateX(var(--sk-rx,1.8deg)) rotateY(var(--sk-ry,-2.4deg));
          transform-style:preserve-3d;
          background:var(--sk-ground);
          border-radius:var(--sk-r-pane);
          box-shadow:var(--sk-ring),var(--sk-ambient);
          overflow:hidden;
        }

        /* ————— app shell · the real product shell —————
           Full-width top bar → full-width seven-station strip → narrow icon rail beside
           the content. The stations never live in the left nav; the rail is its own axis. */
        .sk-shell{
          display:grid;height:100%;
          grid-template-columns:2.8cqw minmax(0,1fr);
          grid-template-rows:4cqh 7cqh minmax(0,1fr);
          grid-template-areas:"top top" "spine spine" "rail main";
        }

        /* top bar · bare mark + wordmark · breadcrumb · centred notification strip · ask + avatar */
        .sk-topbar{
          grid-area:top;display:grid;align-items:center;
          grid-template-columns:auto minmax(0,1fr) auto;gap:0.9cqw;
          padding:0 1cqw;border-bottom:1px solid var(--sk-hairline);background:var(--sk-ground);
        }
        .sk-topleft{display:flex;align-items:center;gap:0.7cqw;min-width:0;}
        .sk-brand{display:flex;align-items:center;gap:0.42cqw;}
        .sk-brand-mark{width:1.15cqw;height:1.15cqw;flex:none;display:block;}
        .sk-brand-name{font:600 0.86cqw/1.25 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
        .sk-topdiv{width:1px;height:1.5cqh;flex:none;background:var(--sk-hairline);}
        .sk-crumb{
          display:flex;align-items:center;gap:0.3cqw;white-space:nowrap;
          font:400 0.72cqw/1 var(--sk-ui);color:var(--sk-muted);
        }
        .sk-crumb-sep{color:var(--sk-faint);}
        .sk-crumb-here{color:var(--sk-text);}
        .sk-crumb-caret{font:400 0.6cqw/1 var(--sk-mono);color:var(--sk-faint);}
        .sk-notify{justify-self:center;display:flex;align-items:center;gap:0.45cqw;min-width:0;white-space:nowrap;}
        .sk-notify-gl{display:flex;align-items:center;gap:0.26cqw;flex:none;}
        .sk-notify-gl svg{width:0.72cqw;height:0.72cqw;display:block;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
        .sk-notify-lead{font:500 0.66cqw/1.2 var(--sk-ui);color:var(--sk-text);flex:none;}
        .sk-notify-sub{font:400 0.66cqw/1.2 var(--sk-ui);color:var(--sk-faint);min-width:0;overflow:hidden;text-overflow:ellipsis;}
        .sk-notify-time{font:400 0.6cqw/1.2 var(--sk-ui);color:var(--sk-faint);flex:none;}
        .sk-topright{display:flex;align-items:center;gap:0.6cqw;}
        .sk-ask{
          display:flex;align-items:center;gap:0.38cqw;height:2.3cqh;flex:none;
          padding:0 0.6cqw;background:var(--sk-panel);
          border:1px solid var(--sk-hairline);border-radius:999px;
          font:400 0.7cqw/1 var(--sk-ui);color:var(--sk-text);
        }
        .sk-ask svg{width:0.72cqw;height:0.72cqw;flex:none;stroke:var(--sk-muted);fill:none;stroke-width:1.5;stroke-linejoin:round;}
        .sk-kbd{font:400 0.62cqw/1 var(--sk-mono);color:var(--sk-faint);}
        .sk-avatar{
          width:1.5cqw;height:1.5cqw;flex:none;display:grid;place-items:center;
          background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:50%;
          font:600 0.55cqw/1 var(--sk-ui);color:var(--sk-muted);letter-spacing:0.03em;
        }

        /* ————— station strip · seven numbered cells, full width, straight under the top bar ————— */
        .sk-spine{
          grid-area:spine;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
          border-bottom:1px solid var(--sk-hairline);background:var(--sk-ground);
        }
        .sk-stn{
          position:relative;display:grid;grid-template-rows:1.05cqh 1.75cqh 1.2cqh;gap:0.3cqh;
          align-content:center;padding:0 0.9cqw;min-width:0;
        }
        .sk-stn + .sk-stn{border-left:1px solid var(--sk-hairline);}
        .sk-stn-n{font:400 0.5cqw/1 var(--sk-mono);color:var(--sk-faint);letter-spacing:0.08em;}
        .sk-stn-name{font:400 0.84cqw/1.1 var(--sk-ui);color:var(--sk-muted);letter-spacing:-0.005em;white-space:nowrap;}
        .sk-stn-sub{font:400 0.56cqw/1.1 var(--sk-ui);color:var(--sk-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .sk-stn.is-here .sk-stn-name{font-weight:600;color:var(--sk-text);}
        .sk-stn.is-here .sk-stn-sub{color:var(--sk-ember);}
        .sk-stn.is-source .sk-stn-name{color:color-mix(in srgb,var(--sk-ember) 42%,var(--sk-text));}
        .sk-stn.is-source .sk-stn-sub{color:color-mix(in srgb,var(--sk-ember) 72%,var(--sk-muted));}
        .sk-stn-dot{
          position:absolute;right:0.85cqw;top:1.15cqh;width:0.3cqw;height:0.3cqw;border-radius:50%;
          background:var(--sk-ember);box-shadow:0 0 0.5cqw color-mix(in srgb,var(--sk-ember) 62%,transparent);
        }
        .sk-stn-dot.is-src{background:transparent;box-shadow:inset 0 0 0 1px var(--sk-ember);}

        /* ————— narrow icon rail · Today · Runs · Brain · Crew · Engine room ————— */
        .sk-rail{
          grid-area:rail;display:flex;flex-direction:column;align-items:center;min-height:0;
          padding:0.85cqh 0;background:var(--sk-ground);border-right:1px solid var(--sk-hairline);
        }
        .sk-railtop{display:flex;flex-direction:column;align-items:center;gap:0.42cqh;}
        .sk-railfoot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:0.3cqh;}
        .sk-glyph{
          position:relative;width:1.95cqw;height:1.95cqw;flex:none;
          display:grid;place-items:center;border-radius:var(--sk-r-control);color:var(--sk-faint);
        }
        .sk-glyph svg{
          width:1.02cqw;height:1.02cqw;display:block;fill:none;stroke:currentColor;
          stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
        }
        .sk-glyph.is-active{background:var(--sk-raised);color:var(--sk-text);box-shadow:inset 0 0 0 1px var(--sk-hairline);}
        .sk-railfoot .sk-glyph{width:1.7cqw;height:1.7cqw;}
        .sk-railfoot .sk-glyph svg{width:0.9cqw;height:0.9cqw;}
        /* the shared brain takes the outcome — one ring, one tick, as the thread lands */
        .sk-brainring{
          position:absolute;inset:-0.12cqw;border-radius:var(--sk-r-control);
          border:1px solid var(--sk-ember);opacity:0;pointer-events:none;
        }
        .sk-railcount{
          position:absolute;right:-0.34cqw;top:-0.02cqw;
          font:500 0.46cqw/1 var(--sk-mono);color:var(--sk-ember);letter-spacing:0.02em;opacity:0;
        }
        .sk-livedot{
          width:0.26cqw;height:0.26cqw;flex:none;border-radius:50%;
          background:var(--sk-pass);box-shadow:0 0 0.4cqw var(--sk-pass);
        }

        /* ————— true-UI type (kit) ————— */
        .sk-title{font:600 1.3cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.01em;}
        .sk-body{font:400 0.73cqw/1.45 var(--sk-ui);color:var(--sk-text);}
        .sk-meta{font:400 0.68cqw/1.4 var(--sk-ui);color:var(--sk-muted);}
        .sk-label{font:500 0.65cqw/1.4 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.10em;text-transform:uppercase;}
        .sk-spacer{flex:1;}

        /* ————— panels · rows (kit) ————— */
        .sk-panel{
          background:var(--sk-panel);border:1px solid var(--sk-hairline);
          border-radius:var(--sk-r-panel);overflow:hidden;min-height:0;
          display:flex;flex-direction:column;
        }
        .sk-pane{
          background:var(--sk-panel);border:1px solid var(--sk-hairline);
          border-radius:var(--sk-r-pane);overflow:hidden;min-height:0;
          display:flex;flex-direction:column;
        }
        .sk-panel-hd,.sk-pane-hd{
          display:flex;align-items:center;gap:0.6cqw;flex:none;
          padding:0.75cqw 1cqw;border-bottom:1px solid var(--sk-hairline);
        }
        .sk-panel-title{font:600 0.83cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
        .sk-panel-body,.sk-pane-body{flex:1;min-height:0;overflow:hidden;}
        .sk-panel-ft{
          display:flex;align-items:center;gap:0.6cqw;flex:none;
          padding:0.6cqw 1cqw;border-top:1px solid var(--sk-hairline);
          background:var(--sk-panel);
        }
        .sk-row{padding:0.7cqw 1cqw;}
        .sk-row + .sk-row{border-top:1px solid var(--sk-hairline);}

        /* ————— chips · badges (kit) ————— */
        .sk-chip{
          display:inline-flex;align-items:center;gap:0.3cqw;
          padding:0.22cqw 0.45cqw;border:1px solid var(--sk-hairline);
          border-radius:var(--sk-r-chip);background:rgba(255,255,255,0.02);
          font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;
          white-space:nowrap;
        }
        .sk-chip.is-on,
        .sk-chip--accent{color:var(--sk-accent);border-color:color-mix(in srgb,var(--sk-accent) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-accent) 8%,transparent);}
        .sk-chip--pass{color:var(--sk-pass);border-color:color-mix(in srgb,var(--sk-pass) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-pass) 8%,transparent);}
        .sk-chip--ember{color:var(--sk-ember);border-color:color-mix(in srgb,var(--sk-ember) 45%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-ember) 9%,transparent);}
        .sk-dot-inline{width:0.26cqw;height:0.26cqw;flex:none;border-radius:50%;background:currentColor;}
        .sk-badge{
          display:inline-flex;align-items:center;padding:0.22cqw 0.45cqw;
          background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:var(--sk-r-chip);
          font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-muted);font-variant-numeric:tabular-nums;
        }
        .sk-tick{color:var(--sk-pass);font-family:var(--sk-mono);}

        /* ————— score + sub-bars (kit) ————— */
        .sk-score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.1cqw;align-items:center;margin-top:0.38cqw;}
        .sk-score-main{display:flex;flex-direction:column;align-items:flex-start;gap:0.15cqw;}
        .sk-score-num{
          font:500 1.5cqw/1 var(--sk-mono);color:var(--sk-accent);
          letter-spacing:-0.03em;font-variant-numeric:tabular-nums;
        }
        .sk-score-cap{font:500 0.5cqw/1 var(--sk-mono);color:var(--sk-faint);letter-spacing:0.08em;text-transform:uppercase;}
        .sk-score-bars{display:flex;flex-direction:column;gap:0.32cqw;}
        .sk-subbar{display:grid;grid-template-columns:4.6cqw minmax(0,1fr) 1.9cqw;gap:0.55cqw;align-items:center;}
        .sk-subbar-name{font:400 0.55cqw/1 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.04em;}
        .sk-subbar-track{display:block;height:0.18cqw;background:var(--sk-hairline);border-radius:2px;overflow:hidden;}
        .sk-subbar-track i{display:block;height:100%;background:var(--sk-accent);border-radius:inherit;}
        .sk-subbar-val{font:400 0.55cqw/1 var(--sk-mono);color:var(--sk-muted);text-align:right;font-variant-numeric:tabular-nums;}
        .sk-score--dim .sk-score-num{color:var(--sk-text);}
        .sk-score--dim .sk-subbar-track i{background:#4B4B51;}
        .sk-score--dim .sk-subbar-name,.sk-score--dim .sk-subbar-val{color:var(--sk-faint);}

        /* ————— bet card (kit) ————— */
        .sk-betcard{
          padding:0.62cqw 1.05cqw;background:var(--sk-raised);
          border:1px solid var(--sk-hairline);border-radius:var(--sk-r-card);
        }
        .sk-betcard-hd{display:flex;align-items:center;gap:0.6cqw;}
        .sk-rank{font:500 0.62cqw/1 var(--sk-mono);color:var(--sk-faint);letter-spacing:0.06em;}
        .sk-betcard-title{font:600 0.85cqw/1.25 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
        .sk-betcard .sk-meta{margin-top:0.22cqw;}
        .sk-betcard.is-lead{
          border-color:color-mix(in srgb,var(--sk-accent) 45%,var(--sk-hairline));
          background:color-mix(in srgb,var(--sk-accent) 4%,var(--sk-raised));
        }
        .sk-betcard.is-lead .sk-rank{color:var(--sk-accent);}
        .sk-betnote{
          display:flex;gap:0.45cqw;margin-top:0.42cqw;padding-top:0.38cqw;
          border-top:1px solid var(--sk-hairline);
          font:400 0.57cqw/1.4 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;
        }
        .sk-betnote span{color:var(--sk-accent);}
        .sk-agentline{
          display:flex;align-items:center;gap:0.5cqw;
          padding:0.6cqw 0.8cqw;background:var(--sk-raised);
          border:1px solid var(--sk-hairline);border-radius:var(--sk-r-row);
          font:400 0.62cqw/1.3 var(--sk-mono);color:var(--sk-muted);
        }
        .sk-run{color:var(--sk-accent);text-align:center;}

        /* ————— sealed record row (kit) ————— */
        .sk-record{
          display:flex;align-items:center;gap:0.7cqw;
          padding:0.7cqw 1cqw;background:var(--sk-panel);
          border:1px solid var(--sk-hairline);border-radius:var(--sk-r-row);
        }
        .sk-record .sk-body{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

        /* ————— toast (kit, lifted to stay inside the shot's keep-out) ————— */
        .sk-toast{
          position:absolute;right:1.2cqw;bottom:19cqh;z-index:40;
          display:inline-flex;align-items:center;gap:0.5cqw;
          padding:0.55cqw 0.8cqw;background:var(--sk-raised);
          border:1px solid var(--sk-hairline);border-radius:var(--sk-r-card);
          box-shadow:var(--sk-ring),var(--sk-ambient);
          font:400 0.68cqw/1.3 var(--sk-ui);color:var(--sk-text);
        }
        .sk-toast .sk-meta{color:var(--sk-faint);font-size:0.58cqw;}
        /* toast attribution · the reorder names its cause, and wears the thread's mark */
        .f9-toast-src{
          display:inline-flex;align-items:center;gap:0.3cqw;flex:none;align-self:flex-start;
          padding:0.18cqw 0.4cqw;border-radius:var(--sk-r-chip);
          border:1px solid color-mix(in srgb,var(--sk-ember) 42%,var(--sk-hairline));
          background:color-mix(in srgb,var(--sk-ember) 9%,transparent);
          font:400 0.55cqw/1.2 var(--sk-mono);color:var(--sk-ember);letter-spacing:0.03em;
        }
        .f9-toast-src svg{width:0.66cqw;height:0.58cqw;flex:none;}
        .f9-toast-body{display:flex;flex-direction:column;gap:0.18cqw;}
        .f9-toast-line{font:400 0.68cqw/1.3 var(--sk-ui);color:var(--sk-text);}

        /* ————— lower-third (kit, above the caption keep-out) ————— */
        .sk-lowerthird{
          position:absolute;left:5.5cqw;bottom:18cqh;z-index:60;
          display:flex;flex-direction:column;gap:0.55cqh;
          text-shadow:0 2px 30px rgba(0,0,0,.6);
        }
        .sk-lt-kicker{
          font:500 0.72cqw/1 var(--sk-mono);letter-spacing:0.14em;text-transform:uppercase;
          color:var(--sk-accent);
        }
        .sk-lt-line{font:600 2.6cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.01em;}

        /* ————— F9-specific ————— */
        #f9cam{
          position:absolute;inset:0;
          transform-origin:50% 50%;
          will-change:transform;
        }
        /* the two-screen stage — one space, two panes; perspective gives the camera depth */
        .f9-stage{
          position:absolute;inset:0;
          display:flex;align-items:center;justify-content:center;gap:6cqw;
          padding-bottom:8cqh;
          perspective:2400px;
          perspective-origin:50% 42%;
        }
        .f9-dofA{--dof:0px;filter:blur(var(--dof));will-change:filter;}

        /* Learn — outcome surfaces.
           Three rows: header · two working columns · a full-width record strip pinned low.
           The margin above the strip opens the LINEAGE CHANNEL — the clear band the ember
           thread routes through, and where its mid-path labels sit. */
        .f9-learnmain{
          grid-area:main;position:relative;min-height:0;

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
      <script>
        gsap.defaults({ lazy: false });   // paused, seeked timelines never tick — lazy tweens would render stale start values
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const DUR = 10.8;
        const camEl = document.getElementById("f9cam");

        /* ── macro camera (multi-phase-camera + viewport-change) ───────────
           Single world wrapper; cam is the one source of truth; the driver
           tween writes transform every frame (phase moves + sine micro-drift).
           World-point → screen: (S·(p−center) + center + t); T = −offset × S. */
        /* Framing is reckoned against the real shell: the narrow icon rail moved the Learn and
           Discover content ~183px LEFT and ~50px DOWN in world space versus the old wide sidebar,
           so every pushed-in phase carries that offset back (Δ×scale). Without it the product text
           slides under the fixed lower-third, which does not ride the camera. */
        const cam = { s: 1.16, x: 740, y: 30 };            // t=0 · framed on the Learn screen, slightly high

        /* ── motion-blur streak (path A, horizontal, peak at the whip's cut point) ── */
        const blurNode = document.getElementById("f9-streak-blur");
        const blurProxy = { v: 0 };
        const writeBlur = () => {
          blurNode.setAttribute("stdDeviation", blurProxy.v.toFixed(2) + " 0");
          camEl.style.filter = blurProxy.v < 0.02 ? "none" : "url(#f9-streak)";
        };
        writeBlur(); // seed frame 0

        /* ── svg-path-draw setup: measured sparkline (length captured once, before the
           timeline is registered, so every render worker gets the same constant) ── */
        const spark = document.getElementById("f9-sparkline");
        const SPARK_LEN = spark.getTotalLength() * 1.02;
        spark.style.strokeDasharray = SPARK_LEN;
        spark.style.strokeDashoffset = SPARK_LEN;

        /* ── the ember thread, drawn as a routed connector ─────────────────────
           drawLeg draws the ember run and its dark casing together so the line
           stays legible wherever it crosses UI; ridePulse walks a small pulse
           along the same path with the drawing tip (deterministic: the dot's
           position is a pure function of the tween's own progress). */
        const drawLeg = (path, casing, at, dur) => {
          [casing, path].forEach((p) => {
            const len = p.getTotalLength() * 1.02;
            p.style.strokeDasharray = len;
            p.style.strokeDashoffset = len;
            tl.fromTo(p, { strokeDashoffset: len },
                         { strokeDashoffset: 0, duration: dur, ease: "power1.inOut" }, at);
          });
        };
        const ridePulse = (path, sel, at, dur) => {
          const dot = document.querySelector(sel);
          const len = path.getTotalLength();
          const prox = { v: 0 };
          const put = () => {
            const pt = path.getPointAtLength(prox.v * len);
            dot.setAttribute("cx", pt.x.toFixed(1));
            dot.setAttribute("cy", pt.y.toFixed(1));
          };
          put(); // seed frame 0
          tl.fromTo(prox, { v: 0 }, { v: 1, duration: dur, ease: "power1.inOut", onUpdate: put }, at);
          tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, at);
          tl.to(sel, { opacity: 0, duration: 0.3, ease: "power2.in" }, at + dur - 0.16);
        };
        const th1 = document.getElementById("f9-th1");
        const th2 = document.getElementById("f9-th2");
        const case1 = document.getElementById("f9-case1");
        const case2 = document.getElementById("f9-case2");

        /* ── single deterministic driver: micro-drift over the phase transform ── */
        const DRIFT_CYCLES = 1.8, AMP_X = 6, AMP_Y = 3, FREQ_RATIO = 1.3;
        const driver = { t: 0 };
        const apply = () => {
          const p = (driver.t / DUR) * Math.PI * 2 * DRIFT_CYCLES;
          const dx = Math.sin(p) * AMP_X;
          const dy = Math.sin(p * FREQ_RATIO) * AMP_Y;
          camEl.style.transform =
            "translate(" + (cam.x + dx).toFixed(2) + "px," + (cam.y + dy).toFixed(2) + "px) scale(" + cam.s.toFixed(4) + ")";
        };

        /* Camera phases — every cam tween carries onUpdate:apply (seek-safe). */
        // Scene 1 · settle-creep, then push onto the outcome card as the verdict stamps
        tl.to(cam, { s: 1.18, duration: 0.7,  ease: "power1.inOut", onUpdate: apply }, 0.15);
        tl.to(cam, { s: 1.34, x: 1136, y: 196, duration: 1.9,  ease: "power2.inOut", onUpdate: apply }, 0.95);
        // Scene 2 · track down-left to hold verdict + sealed record in one frame (thread draws)
        tl.to(cam, { s: 1.24, x: 915,  y: -26, duration: 1.2,  ease: "power2.inOut", onUpdate: apply }, 3.05);
        // Breathe · slow creep between cues (camera never sleeps)
        tl.to(cam, { s: 1.27, x: 945,  y: -11, duration: 0.95, ease: "power1.inOut", onUpdate: apply }, 4.6);
        // Scene 3 · whip-pan to Discover — cut-the-curve seam: accelerate in, matched decelerate out,
        // blur peaks exactly at the seam (18px full-frame per the cut catalog)
        tl.to(cam, { s: 1.36, x: -17,   y: 28,  duration: 0.4, ease: "power3.in",  onUpdate: apply }, 5.7);
        tl.to(cam, { s: 1.5,  x: -1042, y: 33,  duration: 0.4, ease: "power3.out", onUpdate: apply }, 6.1);
        tl.to(blurProxy, { v: 18, duration: 0.4, ease: "power3.in",  onUpdate: writeBlur }, 5.7);
        tl.to(blurProxy, { v: 0,  duration: 0.4, ease: "power3.out", onUpdate: writeBlur }, 6.1);
        // Scene 3 · slow push while the ranking reorders
        tl.to(cam, { s: 1.56, x: -1057, y: 45,  duration: 1.35, ease: "power1.inOut", onUpdate: apply }, 6.6);
        // Scene 4 · pull WIDE — Learn + Discover as two panes of one space
        // (framed 44px higher than the push so both panes clear the lower-third)
        tl.to(cam, { s: 0.68, x: 0, y: -26, duration: 1.65, ease: "power2.inOut", onUpdate: apply }, 8.05);
        // Scene 4 · final slow push; micro-drift carries the hold
        tl.to(cam, { s: 0.715, x: 0, y: -25, duration: 1.1, ease: "power1.inOut", onUpdate: apply }, 9.7);

        /* ── depth-of-field: chrome falls out of focus during the verdict push, refocuses for the thread ── */
        tl.to(".f9-dofA", { "--dof": "2.4px", opacity: 0.86, duration: 1.1, ease: "power2.inOut" }, 0.95);
        tl.to(".f9-dofA", { "--dof": "0px",  opacity: 1,     duration: 0.9, ease: "power2.inOut" }, 3.05);

        /* ── lower-third · Scene 1 ── */
        tl.fromTo("#f9-ltk", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5,  ease: "power2.out" }, 0.85);
        tl.fromTo("#f9-ltl", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 1.05);

        /* ── Scene 1 · results land: the measured line draws, then the verdict stamps ── */
        tl.fromTo(spark, { strokeDashoffset: SPARK_LEN },
                         { strokeDashoffset: 0, duration: 1.1, ease: "power2.out" }, 0.7);
        tl.fromTo("#f9-sparkdot", { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" },
                                  { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 1.6);
        // the measured bar overtakes the forecast bar, and the gap is named
        tl.fromTo("#f9-measbar", { scaleX: 0.737, transformOrigin: "0 50%" },
                                 { scaleX: 1, duration: 0.75, ease: "power2.out" }, 0.95);
        tl.fromTo("#f9-outchip", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.5);
        tl.fromTo("#f9-delta", { opacity: 0, x: -7 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 1.68);
        tl.fromTo("#f9-verdict", { opacity: 0, scale: 1.45 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power4.out" }, 1.95);
        // ring flash · struck in two tweens so the fromTo's own start state is opacity 0 —
        // a from-state above 0 renders immediately and would sit on screen from frame 0
        tl.fromTo("#f9-ring", { opacity: 0, scale: 0.9, transformOrigin: "50% 50%" },
                              { opacity: 0.55, scale: 1, duration: 0.12, ease: "power2.out" }, 2.05);
        tl.to("#f9-ring", { opacity: 0, scale: 1.3, duration: 0.5, ease: "power2.out" }, 2.17);

        /* ── Scene 2 · "scored against the call" ───────────────────────────────
           Leg 1: the thread leaves the verdict chip, routes through the channel
           carrying its label, and lands an arrowhead on the sealed call. ── */
        tl.fromTo("#f9-seed1", { opacity: 0, scale: 0.35, transformOrigin: "50% 50%" },
                               { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 3.05);
        drawLeg(th1, case1, 3.2, 1.25);
        ridePulse(th1, "#f9-pulse1", 3.2, 1.25);
        tl.fromTo("#f9-lab1", { opacity: 0, xPercent: -50, yPercent: -50, y: 7 },
                              { opacity: 1, xPercent: -50, yPercent: -50, y: 0, duration: 0.42, ease: "power2.out" }, 3.7);
        tl.fromTo("#f9-head1", { opacity: 0, scale: 0.45, transformOrigin: "50% 50%" },
                               { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 4.38);
        // the record takes the thread's edge, its lock chip glints, and it gains "scored ✓"
        tl.to("#f9-record", { borderColor: "#7D422B", duration: 0.5, ease: "power2.out" }, 4.42);
        tl.to("#f9-lock", { filter: "brightness(1.9)", duration: 0.22, ease: "power2.in"  }, 4.55);
        tl.to("#f9-lock", { filter: "brightness(1)",   duration: 0.32, ease: "power2.out" }, 4.77);
        tl.fromTo("#f9-scored", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 4.95);
        // agent line foreshadows the pan — the outcome is heading to discover
        tl.fromTo("#f9-agentlearn", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 5.15);

        /* ── Scene 3 · the ranking re-ranks itself (arrival state is the OLD order) ── */
        // the shipped bet collapses into a slim strip…
        tl.to("#f9-betold", { opacity: 0, y: -14, scale: 0.985, duration: 0.32, ease: "power2.in" }, 6.7);
        tl.fromTo("#f9-shiprow", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 6.78);
        // …and the next bets rise into their new slots (travel tuned so the projected
        // gap under the shipped strip matches the ranking's own card rhythm)
        tl.to("#f9-betunify",   { y: -98, duration: 0.75, ease: "power3.inOut" }, 6.85);
        tl.to("#f9-betonboard", { y: -98, duration: 0.7,  ease: "power3.inOut" }, 7.0);
        // chips renumber (02→01, 03→02) — small same-direction crossfades
        const swap = (a, b, at) => {
          tl.to(a, { opacity: 0, y: -5, duration: 0.22, ease: "power2.in" }, at);
          tl.fromTo(b, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, at + 0.1);
        };
        swap("#f9-rankUA", "#f9-rankUB", 7.05);
        swap("#f9-rankOA", "#f9-rankOB", 7.25);
        swap("#f9-openA",  "#f9-openB",  7.35);
        swap("#f9-confA",  "#f9-confB",  7.3);
        swap("#f9-noteA",  "#f9-noteB",  7.3);
        swap("#f9-syncA",  "#f9-syncB",  7.6);
        // re-score: composite counts 6.4 → 7.2, confidence bar extends, card takes the lead accent
        const scoreEl = document.getElementById("f9-scorenum");
        const score = { v: 6.4 };
        tl.fromTo(score, { v: 6.4 }, {
          v: 7.2, duration: 0.6, ease: "power2.out",
          onUpdate: () => { scoreEl.textContent = score.v.toFixed(1); },
        }, 7.1);
        tl.fromTo("#f9-confbar", { scaleX: 1, transformOrigin: "0 50%" },
                                 { scaleX: 1.0986, duration: 0.5, ease: "power2.out" }, 7.1);
        tl.to("#f9-scorenum", { color: "#6FA9A0", duration: 0.45, ease: "power2.out" }, 7.1);
        tl.to("#f9-betunify .f9-ubar", { backgroundColor: "#6FA9A0", duration: 0.45, ease: "power2.out" }, 7.1);
        tl.to("#f9-betunify", { borderColor: "#47615F", backgroundColor: "#1D2022", duration: 0.5, ease: "power2.out" }, 7.05);
        tl.to("#f9-betunify .sk-rank", { color: "#6FA9A0", duration: 0.4, ease: "power2.out" }, 7.05);
        // agent line + toast confirm the reorder
        tl.fromTo("#f9-agentdisc", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 6.9);
        tl.fromTo("#f9-toast", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 7.55);

        /* ── Scene 4 · "it learns, then it guides" ─────────────────────────────
           Leg 2: from the scored record, along the channel, up through the gap
           between the two screens, and onto the bet that just took 01. ── */
        tl.fromTo("#f9-seed2", { opacity: 0, scale: 0.35, transformOrigin: "50% 50%" },
                               { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 8.1);
        drawLeg(th2, case2, 8.25, 1.3);
        ridePulse(th2, "#f9-pulse2", 8.25, 1.3);
        tl.fromTo("#f9-lab2", { opacity: 0, xPercent: -50, yPercent: -50, y: 7 },
                              { opacity: 1, xPercent: -50, yPercent: -50, y: 0, duration: 0.42, ease: "power2.out" }, 8.72);
        tl.fromTo("#f9-head2", { opacity: 0, scale: 0.45, transformOrigin: "50% 50%" },
                               { opacity: 1, scale: 1, duration: 0.32, ease: "power3.out" }, 9.48);
        /* the shared brain absorbs it — as the thread crosses the rail into Discover the Brain
           glyph takes one ring and its count ticks. One pulse, no loop. */
        tl.fromTo("#f9-brainring", { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" },
                                   { opacity: 0.9, scale: 1.05, duration: 0.18, ease: "power2.out" }, 9.36);
        tl.to("#f9-brainring", { opacity: 0, scale: 1.5, duration: 0.5, ease: "power2.out" }, 9.54);
        tl.to("#f9-brain", { color: "#FF6B2C", duration: 0.2, ease: "power2.out" }, 9.36);
        tl.to("#f9-brain", { color: "#A8A29A", duration: 0.6, ease: "power1.inOut" }, 9.9);
        tl.fromTo("#f9-braincount", { opacity: 0, y: 5, scale: 0.6, transformOrigin: "50% 50%" },
                                    { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 9.52);
        // quiet emphasis on the closed loop during the hold — never a new element, just light
        tl.to("#f9-thread", { opacity: 1, duration: 0.7, ease: "power1.inOut" }, 9.8);

        /* driver registered LAST so it reads each frame's settled cam values */
        tl.to(driver, { t: DUR, duration: DUR, ease: "none", onUpdate: apply }, 0);
        apply(); // seed t=0

        window.__timelines["09-the-loop-closes"] = tl;
      </script>
    </template>
