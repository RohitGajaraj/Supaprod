      <script
        src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"

      <script>
        window.__timelines = window.__timelines || {};

        /* --- svg-path-draw setup: measure the arc, hide it via dash offset --- */
        var f9Draw = document.getElementById("f9-arc-draw");
        var f9Len = f9Draw.getTotalLength() * 1.02;
        f9Draw.style.strokeDasharray = String(f9Len);
        f9Draw.style.strokeDashoffset = String(f9Len);

        var tl = gsap.timeline({ paused: true });

        /* ================= chrome ================= */
        tl.fromTo(
          "#f9-kicker",
          { opacity: 0, yPercent: -40 },
          { opacity: 1, yPercent: 0, duration: 0.5, ease: "power3.out" },
          0.3
        );
        tl.fromTo(
          "#f9-cat-num",
          { opacity: 0, yPercent: -40 },
          { opacity: 1, yPercent: 0, duration: 0.5, ease: "power3.out" },
          0.38
        );

        /* ============ Scene 1 (0–2.8) — results land ============ */
        /* shipped card settles in early — hero visible well before t=0.5s */
        tl.fromTo(
          "#f9-shipped-card",
          { opacity: 0, yPercent: 14 },
          { opacity: 1, yPercent: 0, duration: 0.65, ease: "power3.out" },
          0.1
        );
        /* spring-pop-entrance (smooth): the outcome chip drops onto the card on "results land" */
        tl.fromTo(
          "#f9-chip-outcome",
          { opacity: 0, yPercent: -80, scale: 0.5 },
          { opacity: 1, yPercent: 0, scale: 1, duration: 0.55, ease: "power3.out" },
          1.05
        );

        /* ===== Scene 2 (2.8–5.8) — scored against the call that caused it ===== */
        tl.fromTo(
          "#f9-decision-card",
          { opacity: 0, xPercent: -6 },
          { opacity: 1, xPercent: 0, duration: 0.6, ease: "power3.out" },
          2.9
        );
        tl.fromTo(
          "#f9-arc-ghost",
          { opacity: 0 },
          { opacity: 0.18, duration: 0.45, ease: "power2.out" },
          3.05
        );
        /* svg-path-draw: ember arc traces leftward, outcome back to decision */
        tl.to(
          "#f9-arc-draw",
          { strokeDashoffset: 0, duration: 1.5, ease: "power2.out" },
          3.3
        );
        tl.fromTo(
          "#f9-arc-end",
          { opacity: 0, scale: 0, transformOrigin: "50% 50%" },
          { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" },
          4.7
        );
        tl.fromTo(
          "#f9-decision-ember",
          { opacity: 0 },
          { opacity: 1, duration: 0.55, ease: "power2.out" },
          4.75
        );

        /* ===== Scene 3 seam — cut-the-curve, leftward, cut at t=6.0 ===== */
        /* exit: whole-line variant — motion power4.in, fade ends ~0.02s before the cut */
        tl.fromTo(
          "#f9-actA-inner",
          { xPercent: 0 },
          { xPercent: -12, duration: 0.3, ease: "power4.in", immediateRender: false },
          5.7
        );
        tl.fromTo(
          "#f9-actA-inner",
          { opacity: 1 },
          { opacity: 0, duration: 0.28, ease: "power1.in", immediateRender: false },
          5.7
        );
        tl.set("#f9-actA-inner", { opacity: 0 }, 6.0);
        /* entry: mirrored back half — same direction, matched velocity, decelerating */
        tl.fromTo(
          "#f9-list-inner",
          { xPercent: 12, opacity: 0.35 },
          { xPercent: 0, opacity: 1, duration: 0.34, ease: "power4.out" },
          6.0
        );

        /* ===== Scene 3 (5.8–8.2) — the next bet re-ranks itself ===== */
        /* scale-swap-transition adapted to a positional swap on smooth arcs:
           rows trade slots (yPercent = (8.2+2)/8.2 row pitch), bulging outward
           with a slight scale dip/lift; the rank chips do the literal
           shrink-out / grow-in number swap with a 0.1s overlap. Zero bounce. */
        var SW = 6.85;
        var HD = 0.45;
        var PITCH = 124.39;

        tl.fromTo(
          "#f9-row-checkout",
          { yPercent: 0 },
          { yPercent: PITCH, duration: 2 * HD, ease: "power2.inOut" },
          SW
        );
        tl.fromTo(
          "#f9-row-billing",
          { yPercent: 0 },
          { yPercent: -PITCH, duration: 2 * HD, ease: "power2.inOut" },
          SW
        );
        /* arc bulge out… */
        tl.fromTo(
          "#f9-row-checkout",
          { xPercent: 0 },
          { xPercent: 6, duration: HD, ease: "power2.out", immediateRender: false },
          SW
        );
        tl.fromTo(
          "#f9-row-billing",
          { xPercent: 0 },
          { xPercent: -6, duration: HD, ease: "power2.out", immediateRender: false },
          SW
        );
        /* …and back in */
        tl.fromTo(
          "#f9-row-checkout",
          { xPercent: 6 },
          { xPercent: 0, duration: HD, ease: "power2.in", immediateRender: false },
          SW + HD
        );
        tl.fromTo(
          "#f9-row-billing",
          { xPercent: -6 },
          { xPercent: 0, duration: HD, ease: "power2.in", immediateRender: false },
          SW + HD
        );
        /* scale-swap flavor: descending row shrinks slightly, rising row grows slightly */
        tl.fromTo(
          "#f9-row-checkout",
          { scale: 1 },
          { scale: 0.96, duration: HD, ease: "power2.out", immediateRender: false },
          SW
        );
        tl.fromTo(
          "#f9-row-checkout",
          { scale: 0.96 },
          { scale: 1, duration: HD, ease: "power2.in", immediateRender: false },
          SW + HD
        );
        tl.fromTo(
          "#f9-row-billing",
          { scale: 1 },
          { scale: 1.04, duration: HD, ease: "power2.out", immediateRender: false },
          SW
        );
        tl.fromTo(
          "#f9-row-billing",
          { scale: 1.04 },
          { scale: 1, duration: HD, ease: "power2.in", immediateRender: false },
          SW + HD
        );
        /* rank chips renumber mid-swap — outgoing digit shrinks out fast,
           incoming digit grows in smooth, 0.1s overlap */
        tl.fromTo(
          "#f9-row-checkout .num-old",
          { scale: 1, opacity: 1 },
          { scale: 0.7, opacity: 0, duration: 0.18, ease: "power2.in", immediateRender: false },
          7.1
        );
        tl.fromTo(
          "#f9-row-checkout .num-new",
          { scale: 0.7, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
          7.2
        );
        tl.fromTo(
          "#f9-row-billing .num-old",
          { scale: 1, opacity: 1 },
          { scale: 0.7, opacity: 0, duration: 0.18, ease: "power2.in", immediateRender: false },
          7.1
        );
        tl.fromTo(
          "#f9-row-billing .num-new",
          { scale: 0.7, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
          7.2
        );
        /* post-swap: the new 01 takes the ember edge; the shipped bet steps back */
        tl.fromTo(
          "#f9-billing-edge",
          { opacity: 0 },
          { opacity: 1, duration: 0.5, ease: "power2.out" },
          7.85
        );
        tl.fromTo(
          "#f9-row-checkout",
          { opacity: 1 },
          { opacity: 0.6, duration: 0.45, ease: "power2.out", immediateRender: false },
          7.9
        );
        tl.fromTo(
          "#f9-tag-shipped",
          { opacity: 0 },
          { opacity: 0.85, duration: 0.4, ease: "power2.out" },
          7.95
        );

        /* ===== Scene 4 (8.2–10.8) — "It learns. Then it guides." ===== */
        tl.fromTo(
          "#f9-word-learns",
          { opacity: 0, scale: 1.28 },
          { opacity: 1, scale: 1, duration: 0.38, ease: "power4.out" },
          8.45
        );
        tl.fromTo(
          "#f9-word-guides",
          { opacity: 0, scale: 1.28 },
          { opacity: 1, scale: 1, duration: 0.38, ease: "power4.out" },
          9.55
        );

        /* asr-keyword-glow: single linear driver, attack–sustain–release envelope
           driving text-shadow + scale + color lerp on each word's inner span.
           The stamp tween owns the wrapper; the envelope owns the inner span —
           no two writers on one transform. Runs to 10.8 so the held read ends
           on the rest-glow breadcrumb. */
        var ATTACK = 0.18;
        var RELEASE = 0.45;
        var REST_LEVEL = 0.3;
        var MAX_BLUR = 22;
        var MAX_SCALE_BOOST = 0.07;
        var REST_RGB = { r: 242, g: 239, b: 233 };
        var PEAK_RGB = { r: 255, g: 107, b: 44 };
        var GLOW_WORDS = [
          { el: document.getElementById("f9-glow-learns"), start: 8.5, end: 9.25 },
          { el: document.getElementById("f9-glow-guides"), start: 9.6, end: 10.35 }
        ];

        function f9Envelope(time, start, end) {
          var releaseEnd = end + RELEASE;
          if (time < start) return 0;
          if (time < end) return Math.min((time - start) / ATTACK, 1);
          if (time < releaseEnd) {
            var decay = (time - end) / RELEASE;
            return 1 - decay * (1 - REST_LEVEL);
          }
          return REST_LEVEL;
        }
        function f9Lerp(a, b, t) {
          return Math.round(a + (b - a) * t);
        }

        var f9Driver = { t: 0 };
        tl.to(
          f9Driver,
          {
            t: 10.8,
            duration: 10.8,
            ease: "none",
            onUpdate: function () {
              for (var i = 0; i < GLOW_WORDS.length; i++) {
                var w = GLOW_WORDS[i];
                var env = f9Envelope(f9Driver.t, w.start, w.end);
                var blur = MAX_BLUR * env;
                var alpha = 0.15 + 0.65 * env;
                w.el.style.textShadow =
                  "0 0 " + blur.toFixed(2) + "px rgba(255,107,44," + alpha.toFixed(3) + ")";
                w.el.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env).toFixed(4) + ")";
                w.el.style.color =
                  "rgb(" +
                  f9Lerp(REST_RGB.r, PEAK_RGB.r, env) +
                  "," +
                  f9Lerp(REST_RGB.g, PEAK_RGB.g, env) +
                  "," +
                  f9Lerp(REST_RGB.b, PEAK_RGB.b, env) +
                  ")";
              }
            }
          },
          0
        );

        window.__timelines["09-the-loop-closes"] = tl;
      </script>
