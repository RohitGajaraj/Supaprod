<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 2 — Worth building · 8.5s · 1920x1080 · dark register (Broadside)
         Blueprint: kinetic-type-beats (Reproduce). Rules: discrete-text-sequence,
         asr-keyword-glow, scale-swap-transition.
         VO cue map (8.5s): "What nobody tells you" 0.0-1.3 · "is what's worth
         building." 1.3-2.9 ("worth" ~2.05-2.65) · pause · "So teams polish the
         prettiest idea…" 3.4-5.8 · "and miss." 6.3-7.1 · held read to 8.5.
         Head is metadata only — everything the runtime needs is inside <template>. -->
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:"Geist";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/Geist-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistMono-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Pixel Circle";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelCircle-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Pixel Grid";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelGrid-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Pixel Line";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelLine-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Pixel Square";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelSquare-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Pixel Triangle";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelTriangle-Regular.woff2") format("woff2");}
        @font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2");}
        @font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");}
        @font-face{font-family:"Mona Sans";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/MonaSans-Regular.woff2") format("woff2");}

        /* Root styled via #root only — never a class on the composition root. */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: "Mona Sans", sans-serif;
        }

        /* ---- full-bleed ground (its own clip, never a bg on #root) ---- */
        .ground {
          position: absolute;
          inset: 0;
          background: #0a0a0b; /* ink-black */
          z-index: 0;
        }

        /* ---- carried card texture (from F1), dims then topples ---- */
        .cards-layer {
          position: absolute;
          inset: 0;
          z-index: 1;
        }
        .cards-field {
          position: absolute;
          inset: 0;
          opacity: 0.55; /* carried in at 55%, dims to 30% in Scene 1 */
        }
        .card {
          position: absolute;
          width: 17cqw;
          padding: 1.15cqw;
          background: #141416; /* ink-black-alt */
          border: 1px solid #26262a; /* border-dark hairline */
          display: flex;
          flex-direction: column;
          gap: 0.55cqw;
          will-change: transform, opacity;
        }
        .card .stub {
          width: 1.9cqw;
          height: 2px; /* frame.md rule stub — hairline-scale, px by spec */
          background: #ff6b2c; /* fire-orange */
          margin-bottom: 0.35cqw;
        }
        .card .bar {
          height: 0.42cqw;
          background: #6b6660; /* cream-hint skeleton */
        }
        .card .bar.t {
          height: 0.62cqw;
          background: #a8a29a; /* cream-muted title bar */
          width: 62%;
        }
        .card .bar.b1 { width: 88%; }
        .card .bar.b2 { width: 55%; }
        #c2 .bar.t { width: 48%; }
        #c3 .bar.t { width: 70%; }
        #c4 .bar.b2 { width: 40%; }
        #c5 .bar.t { width: 55%; }
        #c6 .bar.b1 { width: 78%; }
        #c7 .bar.t { width: 66%; }
        #c1 { left: 9cqw;  top: 21cqh; opacity: 0.7; }
        #c2 { left: 65cqw; top: 19cqh; opacity: 0.7; }
        #c3 { left: 19cqw; top: 43cqh; opacity: 0.85; }
        #c4 { left: 60cqw; top: 45cqh; opacity: 0.85; }
        #c5 { left: 5cqw;  top: 49cqh; opacity: 1; }
        #c6 { left: 72cqw; top: 51cqh; opacity: 1; }
        #c7 { left: 40cqw; top: 14cqh; opacity: 0.85; }

        /* ---- type layer ---- */
        .type-layer {
          position: absolute;
          inset: 0;
          z-index: 2;
        }
        .headline-block {
          position: absolute;
          left: 0;
          right: 0;
          top: 33cqh;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 1.6cqh;
          text-align: center;
        }
        .kicker {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 500;
          font-size: 0.72cqw;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #ff6b2c; /* fire-orange kicker on dark */
          opacity: 0;
          will-change: transform, opacity;
        }
        .headline {
          font-size: 4.5cqw; /* h2 role */
          font-weight: 700;
          line-height: 1.1;
          letter-spacing: -0.02em;
          color: #f2efe9; /* cream */
          white-space: nowrap;
        }
        .headline .w {
          display: inline-block; /* required for transform on spans */
          opacity: 0; /* driven by the discrete-state driver every frame */
        }
        .headline .w + .w {
          margin-left: 1.05cqw;
        }
        #w-worth {
          transform-origin: 50% 60%;
          will-change: transform, text-shadow, color;
        }
        #w-q {
          display: inline-block;
          opacity: 0;
          margin-left: 0;
        }
        .miss {
          position: absolute;
          left: 0;
          right: 0;
          top: 68cqh; /* lower-third, above the 83% keep-out */
          text-align: center;
          font-size: 2.8cqw; /* h3 role — small and alone against the h2 */
          font-weight: 600;
          line-height: 1.2;
          letter-spacing: -0.02em;
          color: #f2efe9;
          opacity: 0;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }
      </style>

      <div id="root" data-composition-id="02-worth-building" data-width="1920" data-height="1080" data-duration="8.9">
        <!-- ground -->
        <div id="bg" class="clip ground" data-start="0" data-duration="8.5" data-track-index="0"></div>

        <!-- carried card texture — dims (S1), topples down-frame (S2) -->
        <div id="cards-layer" class="clip cards-layer" data-start="0" data-duration="8.5" data-track-index="1">
          <div class="cards-field" id="cards-field" data-layout-allow-overflow>
            <div class="card" id="c1"><span class="stub"></span><span class="bar t"></span><span class="bar b1"></span><span class="bar b2"></span></div>
            <div class="card" id="c2"><span class="stub"></span><span class="bar t"></span><span class="bar b1"></span><span class="bar b2"></span></div>
            <div class="card" id="c3"><span class="stub"></span><span class="bar t"></span><span class="bar b1"></span><span class="bar b2"></span></div>
            <div class="card" id="c4"><span class="stub"></span><span class="bar t"></span><span class="bar b1"></span><span class="bar b2"></span></div>
            <div class="card" id="c5"><span class="stub"></span><span class="bar t"></span><span class="bar b1"></span><span class="bar b2"></span></div>
            <div class="card" id="c6"><span class="stub"></span><span class="bar t"></span><span class="bar b1"></span><span class="bar b2"></span></div>
            <div class="card" id="c7"><span class="stub"></span><span class="bar t"></span><span class="bar b1"></span><span class="bar b2"></span></div>
          </div>
        </div>

        <!-- type layer — the statement, then the small "miss." stamp -->
        <div id="type-layer" class="clip type-layer" data-start="0" data-duration="8.5" data-track-index="2">
          <div class="headline-block" id="headline-block">
            <div class="kicker" id="kicker">the part nobody solved</div>
            <div class="headline" id="headline">
              <span class="w" id="w1">what's</span><span class="w" id="w-worth">worth</span><span class="w" id="w2">building<span id="w-q">?</span></span>
            </div>
          </div>
          <div class="miss" id="miss">miss.</div>
        </div>
      </div>

      <script
        src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"
        integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2"
        crossorigin="anonymous"
      ></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const DUR = 8.5;

        /* =========================================================
           Scene 1 (0–3.19) — carried texture dims; the statement
           hard-cuts in; ember keyword glow on "worth".
           ========================================================= */

        // Carried card texture dims 55% -> 30% as the frame opens.
        tl.fromTo(
          "#cards-field",
          { opacity: 0.55 },
          { opacity: 0.3, duration: 1.0, ease: "power2.out" },
          0
        );

        // Mono kicker settles in early — context before the statement.
        tl.fromTo(
          "#kicker",
          { opacity: 0, yPercent: 60 },
          { opacity: 1, yPercent: 0, duration: 0.6, ease: "power3.out" },
          0.4
        );

        /* discrete-text-sequence — whole-line hard-cut states at time
           thresholds (instant, no fade), plus a final punctuation snap.
           All spans occupy layout from t=0 (opacity-toggled) so the
           centered line never reflows. */
        const STATES = [
          { t: 0.0, s: 0 },   // empty slot
          { t: 1.5, s: 1 },   // hard cut: "what's worth building" — on the VO
          { t: 2.78, s: 2 },  // punctuation snap: "?" lands as the VO finishes
        ];
        function stateAt(time) {
          for (let i = STATES.length - 1; i >= 0; i--) {
            if (time >= STATES[i].t) return STATES[i].s;
          }
          return 0;
        }

        /* asr-keyword-glow — attack/sustain/release envelope on "worth",
           synced to the spoken word (~2.05–2.65). Rest level keeps an
           ember breadcrumb on the word for the rest of the frame. */
        const KW = { start: 2.05, end: 2.65 };
        const ATTACK_DUR = 0.18;
        const RELEASE = 0.45;
        const REST_LEVEL = 0.3;
        const MAX_BLUR_CQW = 1.15;
        const MAX_SCALE_BOOST = 0.09;
        function envelope(time, start, end) {
          const releaseEnd = end + RELEASE;
          if (time < start) return 0;
          if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
          if (time < releaseEnd) {
            const decay = (time - end) / RELEASE;
            return 1 - decay * (1 - REST_LEVEL);
          }
          return REST_LEVEL;
        }
        const REST_RGB = { r: 242, g: 239, b: 233 };   // cream
        const EMBER_RGB = { r: 255, g: 107, b: 44 };   // fire-orange
        function lerpChannel(a, b, t) {
          return Math.round(a + (b - a) * t);
        }

        const w1El = document.getElementById("w1");
        const wWorthEl = document.getElementById("w-worth");
        const w2El = document.getElementById("w2");
        const wQEl = document.getElementById("w-q");

        // Single linear driver — discrete states + glow are pure functions of t.
        const driver = { t: 0 };
        tl.to(
          driver,
          {
            t: DUR,
            duration: DUR,
            ease: "none",
            onUpdate: () => {
              const s = stateAt(driver.t);
              const line = s >= 1 ? "1" : "0";
              w1El.style.opacity = line;
              wWorthEl.style.opacity = line;
              w2El.style.opacity = line;
              wQEl.style.opacity = s >= 2 ? "1" : "0";

              const env = envelope(driver.t, KW.start, KW.end);
              const blur = MAX_BLUR_CQW * env;
              wWorthEl.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env) + ")";
              wWorthEl.style.textShadow =
                "0 0 " + blur.toFixed(3) + "cqw rgba(255,107,44," + (0.15 + env * 0.5).toFixed(3) + ")";
              wWorthEl.style.color =
                "rgb(" +
                lerpChannel(REST_RGB.r, EMBER_RGB.r, env) + "," +
                lerpChannel(REST_RGB.g, EMBER_RGB.g, env) + "," +
                lerpChannel(REST_RGB.b, EMBER_RGB.b, env) + ")";
            },
          },
          0
        );

        /* =========================================================
           Scene 2 (3.19–6.37) — "polish the prettiest idea": the
           cards tilt further and slide down-frame out of relevance.
           scale-swap-transition, outgoing half: shrink + fade on
           power2.in (rushing away), staggered card by card. Smooth
           recede — no bounce anywhere (film grammar).
           ========================================================= */
        const CARDS = [
          { sel: "#c1", r0: -7, s0: 0.8, o0: 0.7, dr: -8 },
          { sel: "#c2", r0: 6, s0: 0.8, o0: 0.7, dr: 7 },
          { sel: "#c3", r0: 5, s0: 0.9, o0: 0.85, dr: 6 },
          { sel: "#c4", r0: -6, s0: 0.9, o0: 0.85, dr: -8 },
          { sel: "#c5", r0: 3, s0: 1, o0: 1, dr: 5 },
          { sel: "#c6", r0: -4, s0: 1, o0: 1, dr: -6 },
          { sel: "#c7", r0: -3, s0: 0.88, o0: 0.85, dr: -5 },
        ];
        // Static tilt/scale from t=0 (set synchronously at build — these
        // clips are in the DOM at page load; no CSS transform, so no
        // gsap/css transform conflict).
        CARDS.forEach((c) => {
          gsap.set(c.sel, { rotation: c.r0, scale: c.s0 });
        });
        const EXIT_SCALE = 0.82;
        CARDS.forEach((c, i) => {
          tl.fromTo(
            c.sel,
            { rotation: c.r0, scale: c.s0, yPercent: 0, opacity: c.o0 },
            {
              rotation: c.r0 + c.dr,
              scale: c.s0 * EXIT_SCALE,
              yPercent: 138,
              opacity: 0,
              duration: 1.35,
              ease: "power2.in",
            },
            3.5 + i * 0.22
          );
        });

        /* =========================================================
           Scene 3 (6.37–8.5) — "and miss.": the field goes
           near-empty; "miss." stamps small and alone, lower-third.
           Held read, completely still, to the end.
           ========================================================= */
        tl.to(
          "#headline-block",
          { opacity: 0.32, duration: 0.6, ease: "power2.inOut" },
          6.45
        );
        tl.fromTo(
          "#miss",
          { opacity: 0, scale: 1.35 },
          { opacity: 1, scale: 1, duration: 0.32, ease: "power3.out" },
          6.6
        );

        window.__timelines["02-worth-building"] = tl;
      </script>
    </template>
  </body>
</html>
