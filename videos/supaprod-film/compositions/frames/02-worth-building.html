<style>
/* ————— fonts (kit block — project-root path + standalone-preview fallback) ————— */
@font-face{font-family:"Mona Sans";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/MonaSans-Regular.woff2") format("woff2"),url("assets/fonts/MonaSans-Regular.woff2") format("woff2");}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2");}

/* ————— root — tokens live HERE (a `:root` rule would be scoped away at assembly) ————— */
#root{
  position:absolute;inset:0;overflow:hidden;
  container-type:size;                    /* the container law — everything below is cqw/cqh */
  color:var(--sk-text);
  font-family:var(--sk-ui);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  /* surfaces (frame.md §Product screen tokens v3) */
  --sk-ground:#0A0A0B;
  --sk-panel:#141416;
  --sk-raised:#1A1A1D;
  --sk-hairline:#26262A;
  --sk-text:#F2EFE9;
  --sk-muted:#A8A29A;
  --sk-faint:#6B6660;
  /* stage colors */
  --sk-discover:#6FA9A0;
  --sk-decide:#C39A5E;
  --sk-plan:#8FA464;
  --sk-design:#AB7FA0;
  --sk-build:#6D97C2;
  --sk-ship:#BD8092;
  --sk-learn:#A89F66;
  --sk-pass:#4FC47A;
  --sk-fail:#EF6A5F;
  --sk-warn:#E8B44C;
  --sk-ember:#FF6B2C;
  --sk-accent:var(--sk-build);
  /* radii */
  --sk-r-chip:7px;
  --sk-r-control:8px;
  --sk-r-row:9px;
  --sk-r-card:10px;
  --sk-r-panel:12px;
  --sk-r-pane:16px;
  /* faces */
  --sk-ui:"Mona Sans",system-ui,sans-serif;
  --sk-mono:"IBM Plex Mono",ui-monospace,monospace;
  /* the only two shadows that exist */
  --sk-ring:0 0 0 1px var(--sk-hairline);
  --sk-ambient:0 24px 80px rgba(0,0,0,.5);
}
#root *,#root *::before,#root *::after{box-sizing:border-box;margin:0;padding:0;}

/* ————— clip layers ————— */
#wb-bg{position:absolute;inset:0;z-index:0;background:var(--sk-ground);}
#wb-world{position:absolute;inset:0;z-index:1;}
#wb-lt{position:absolute;inset:0;z-index:5;pointer-events:none;}

/* ————— camera (multi-phase-camera + viewport-change: ONE world wrapper) ————— */
#wb-cam{
  position:absolute;inset:0;
  transform-origin:50% 50%;
  will-change:transform,filter;
  filter:url(#wb-mb);                     /* motion-blur-streak rides the camera; stdDeviation 0 at rest */
}

/* ————— perspective stage + screen (kit) ————— */
.sk-stage{
  position:absolute;inset:0;display:grid;place-items:center;
  perspective:var(--sk-persp,2200px);
  perspective-origin:50% 42%;
}
.sk-screen{
  position:relative;
  width:var(--sk-w,88cqw);height:var(--sk-h,86cqh);
  transform:rotateX(var(--sk-rx,1.8deg)) rotateY(var(--sk-ry,-2.4deg));
  transform-style:preserve-3d;
  background:var(--sk-ground);
  border-radius:var(--sk-r-pane);
  box-shadow:var(--sk-ring),var(--sk-ambient);
  overflow:hidden;
}

/* ————— shell — this pre-Supaprod frame is the TEAM's own release tool: topbar + content, no station sidebar ————— */
.wb-shell{
  display:grid;height:100%;
  grid-template-rows:3.2cqh minmax(0,1fr);
}

/* ————— top bar (kit, grid-area removed for the row shell) ————— */
.sk-topbar{
  display:flex;align-items:center;gap:0.9cqw;
  padding:0 1cqw;border-bottom:1px solid var(--sk-hairline);background:var(--sk-ground);
}
.sk-crumb{display:flex;align-items:center;font:400 0.62cqw/1 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;}
.sk-crumb-sep{padding:0 0.35cqw;color:var(--sk-faint);}
.sk-crumb-here{color:var(--sk-text);}
.sk-ask{
  display:flex;align-items:center;gap:0.5cqw;flex:0 1 20cqw;height:2.1cqh;
  padding:0 0.4cqw 0 0.65cqw;background:var(--sk-panel);
  border:1px solid var(--sk-hairline);border-radius:var(--sk-r-control);
  font:400 0.66cqw/1 var(--sk-ui);color:var(--sk-faint);
}
.sk-ask svg{width:0.68cqw;height:0.68cqw;flex:none;stroke:var(--sk-faint);fill:none;stroke-width:1.6;}
.sk-kbd{
  margin-left:auto;padding:0.1cqw 0.32cqw;
  font:400 0.57cqw/1.4 var(--sk-mono);color:var(--sk-faint);
  background:var(--sk-ground);border:1px solid var(--sk-hairline);border-radius:5px;
}
.sk-spacer{flex:1;}
.sk-avatar{
  width:1.25cqw;height:1.25cqw;flex:none;display:grid;place-items:center;
  background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:50%;
  font:600 0.5cqw/1 var(--sk-ui);color:var(--sk-muted);letter-spacing:0.05em;
}

/* ————— true-UI type (kit) ————— */
.sk-title{font:600 1.3cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.01em;}
.sk-meta{font:400 0.68cqw/1.4 var(--sk-ui);color:var(--sk-muted);}
.sk-label{font:500 0.65cqw/1.4 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.10em;text-transform:uppercase;}

/* ————— panels · panes (kit) ————— */
.sk-panel{
  background:var(--sk-panel);border:1px solid var(--sk-hairline);
  border-radius:var(--sk-r-panel);overflow:hidden;min-height:0;
  display:flex;flex-direction:column;
}
.sk-pane{
  background:var(--sk-panel);border:1px solid var(--sk-hairline);
  border-radius:var(--sk-r-pane);overflow:hidden;min-height:0;
  display:flex;flex-direction:column;
}
.sk-panel-hd,.sk-pane-hd{
  display:flex;align-items:center;gap:0.6cqw;flex:none;
  padding:0.75cqw 1cqw;border-bottom:1px solid var(--sk-hairline);
}
.sk-panel-title{font:600 0.83cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
.sk-panel-body,.sk-pane-body{flex:1;min-height:0;overflow:hidden;}
.sk-panel-ft{
  display:flex;align-items:center;gap:0.6cqw;flex:none;
  padding:0.6cqw 1cqw;border-top:1px solid var(--sk-hairline);
  background:var(--sk-panel);
}

/* ————— chips · badges (kit) ————— */
.sk-chip{
  display:inline-flex;align-items:center;gap:0.3cqw;
  padding:0.22cqw 0.45cqw;border:1px solid var(--sk-hairline);
  border-radius:var(--sk-r-chip);background:rgba(255,255,255,0.02);
  font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;
  white-space:nowrap;
}
.sk-chip.is-on{color:var(--sk-accent);border-color:color-mix(in srgb,var(--sk-accent) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-accent) 8%,transparent);}
.sk-chip--pass{color:var(--sk-pass);border-color:color-mix(in srgb,var(--sk-pass) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-pass) 8%,transparent);}
.sk-chip--warn{color:var(--sk-warn);border-color:color-mix(in srgb,var(--sk-warn) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-warn) 8%,transparent);}
.sk-dot-inline{width:0.26cqw;height:0.26cqw;flex:none;border-radius:50%;background:currentColor;}
.sk-badge{
  display:inline-flex;align-items:center;padding:0.22cqw 0.45cqw;
  background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:var(--sk-r-chip);
  font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-muted);font-variant-numeric:tabular-nums;
}

/* ————— lower-third (kit — mono kicker + one sentence-case line, lower-left, never centered) ————— */
.sk-lowerthird{
  position:absolute;left:5.5cqw;bottom:7cqh;
  display:flex;flex-direction:column;gap:0.55cqh;
  text-shadow:0 2px 30px rgba(0,0,0,.6);
}
.sk-lt-kicker{
  font:500 0.72cqw/1 var(--sk-mono);letter-spacing:0.14em;text-transform:uppercase;
  color:var(--sk-ember);                  /* film-token kicker: fire-orange on dark */
}
.sk-lt-line{font:600 2.6cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.01em;}
.wb-ember{color:var(--sk-ember);font-style:normal;}

/* ————— frame content — releases / changelog + activation analytics ————— */
.wb-main{
  position:relative;display:grid;min-height:0;
  grid-template-columns:34cqw minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr);
  gap:1cqw;padding:1.1cqw;
}
.wb-pagehead{grid-column:1/-1;display:flex;align-items:baseline;gap:0.8cqw;}

/* depth-of-field planes — --dof drives blur; tweened on the timeline, never a CSS transition */
.wb-plane{filter:blur(var(--dof));will-change:filter;}
#wb-rel{--dof:0px;}
#wb-ana{--dof:7px;opacity:0.75;}          /* pre-blurred far plane; the rack brings it into focus */

/* changelog rows */
.wb-row{display:flex;align-items:center;gap:0.8cqw;padding:0.6cqw 1cqw;}
.wb-row + .wb-row{border-top:1px solid var(--sk-hairline);}
.wb-rowmain{flex:1;min-width:0;}
.wb-name{font:400 0.73cqw/1.35 var(--sk-ui);color:var(--sk-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wb-rowmeta{margin-top:0.18cqw;font:400 0.6cqw/1.3 var(--sk-ui);color:var(--sk-muted);}

/* activation chart */
.wb-chartbody{position:relative;}
.wb-plot{position:absolute;top:1.4cqw;right:4.6cqw;bottom:3.1cqw;left:3.4cqw;}
.wb-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block;}
.wb-ylab{position:absolute;right:calc(100% + 0.5cqw);transform:translateY(-50%);font:400 0.55cqw/1 var(--sk-mono);color:var(--sk-faint);font-variant-numeric:tabular-nums;}
.wb-xlab{position:absolute;top:calc(100% + 0.55cqw);transform:translateX(-50%);font:400 0.55cqw/1 var(--sk-mono);color:var(--sk-faint);letter-spacing:0.06em;text-transform:uppercase;}
.wb-val{position:absolute;left:calc(100% + 0.55cqw);top:45.7%;transform:translateY(-50%);font:500 0.68cqw/1 var(--sk-mono);color:var(--sk-text);font-variant-numeric:tabular-nums;}
.wb-enddot{position:absolute;left:calc(100% - 0.22cqw);top:45.7%;transform:translateY(-50%);width:0.44cqw;height:0.44cqw;border-radius:50%;background:var(--sk-build);}
</style>

  (function () {
    var ROOT = document.querySelector('[data-composition-id="02-worth-building"]');
    var camEl = ROOT.querySelector("#wb-cam");

    var tl = gsap.timeline({ paused: true });

    /* ───────────────── camera — one world wrapper, multi-phase + micro-drift ─────────────────
       Composite transform: translate(x,y) scale(s) → a world point at offset o from
       viewport center (960,540) lands at s·o + T, so T = −offset·scale (viewport-change math).
       Pose A (t0):    s 2.40, T(1060, 288)  → close-up on the changelog's upper rows
       Scene 1 pan:    T.y 288 → −288        → the camera rides down the list as rows land
       Scene 2 pull:   → s 1.0, T(0,0)       → whole screen revealed (motion-blur streak at peak velocity)
       Scene 3 push:   → s 1.45, T(−255,−9)  → slow push onto the flat line (right panel fills frame)
       Drift: Lissajous sine (freq ratio 1.35) added on top for the entire 8.5 s.            */
    var cam = { s: 2.4, x: 1060, y: 288 };
    var drift = { p: 0 };
    function applyCam() {
      var dx = Math.sin(drift.p) * 5;
      var dy = Math.sin(drift.p * 1.35) * 3;
      camEl.style.transform = "translate(" + (cam.x + dx) + "px, " + (cam.y + dy) + "px) scale(" + cam.s + ")";
    }
    applyCam(); /* seed frame 0 */

    tl.fromTo(cam, { y: 288 }, { y: -288, duration: 3.0, ease: "power1.inOut", onUpdate: applyCam }, 0);
    tl.to(cam, { s: 1.0, x: 0, y: 0, duration: 1.6, ease: "power2.inOut", onUpdate: applyCam }, 3.0);
    tl.to(cam, { s: 1.45, x: -255, y: -9, duration: 2.3, ease: "power1.inOut", onUpdate: applyCam }, 6.2);
    tl.to(drift, { p: Math.PI * 2 * 2, duration: 8.5, ease: "none", onUpdate: applyCam }, 0);

    /* ── motion-blur streak (Path A) — envelope peaks with the pull-back's peak velocity ── */
    var mbNode = ROOT.querySelector("#wb-mb-blur");
    var mb = { v: 0 };
    function writeMb() { mbNode.setAttribute("stdDeviation", mb.v + " 0"); }
    writeMb(); /* seed: sharp at rest */
    tl.to(mb, { v: 12, duration: 0.8, ease: "power2.in", onUpdate: writeMb }, 3.0);
    tl.to(mb, { v: 0, duration: 0.8, ease: "power2.out", onUpdate: writeMb }, 3.8);

    /* ── Scene 1 (0–3.0) — rows land down the list while the camera pans with them ── */
    ROOT.querySelectorAll(".wb-row-in").forEach(function (r, i) {
      tl.fromTo(r, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.45 + i * 0.3);
    });

    /* lower-third — kicker then line, on the VO's opening clause */
    tl.fromTo(ROOT.querySelector(".wb-lt-kicker"), { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.8);
    tl.fromTo(ROOT.querySelector(".wb-lt-line"), { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 1.1);

    /* ── Scene 2 (3.0–6.0) — rack focus onto the analytics plane (depth-of-field-blur) ── */
    var rel = ROOT.querySelector("#wb-rel");
    var ana = ROOT.querySelector("#wb-ana");
    tl.fromTo(ana, { "--dof": "7px", opacity: 0.75 }, { "--dof": "0px", opacity: 1, duration: 1.3, ease: "power2.inOut" }, 3.2);
    tl.fromTo(rel, { "--dof": "0px", opacity: 1 }, { "--dof": "2.2px", opacity: 0.94, duration: 1.3, ease: "power2.inOut" }, 3.2);

    /* the activation line draws itself FLAT (svg-path-draw, constant pen speed) */
    var line = ROOT.querySelector("#wb-line");
    var len = line.getTotalLength();
    line.style.strokeDasharray = String(len);
    line.style.strokeDashoffset = String(len);
    tl.fromTo(line, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 2.1, ease: "none" }, 3.9);

    /* release markers tick along the axis while the line refuses to move */
    ROOT.querySelectorAll(".wb-rmk").forEach(function (m, i) {
      tl.fromTo(m, { opacity: 0 }, { opacity: 0.85, duration: 0.3, ease: "power1.out" }, 3.95 + i * 0.17);
    });

    /* ── Scene 3 (6.0–8.5) — "and miss." ── */
    tl.fromTo(ROOT.querySelector("#wb-enddot"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 5.9);
    tl.fromTo(ROOT.querySelector("#wb-val"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 5.95);
    tl.fromTo(ROOT.querySelector("#wb-nochange"), { opacity: 0, scale: 0.92, y: 6 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" }, 6.0);
    /* the shipped wall dims — chained from the rack's resting values (immediateRender:false) */
    tl.fromTo(rel, { "--dof": "2.2px", opacity: 0.94 }, { "--dof": "5px", opacity: 0.45, duration: 0.9, ease: "power2.inOut", immediateRender: false }, 6.0);

    window.__timelines["02-worth-building"] = tl;
  })();
</script>
</template>
