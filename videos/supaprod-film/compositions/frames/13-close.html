<style>
/* ————— fonts (kit declarations, dual-path src) ————— */
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2");}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");}
@font-face{font-family:"Mona Sans";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/MonaSans-Regular.woff2") format("woff2"),url("assets/fonts/MonaSans-Regular.woff2") format("woff2");}

/* ————— root (styled via #root, never a class — scoper law) —————
   Product-screen tokens live here so every sk- component inherits them. */
#root{
  position:absolute;inset:0;overflow:hidden;background:#0A0A0B;
  /* surfaces */
  --sk-ground:#0A0A0B;
  --sk-panel:#141416;
  --sk-raised:#1A1A1D;
  --sk-hairline:#26262A;
  --sk-text:#F2EFE9;
  --sk-muted:#A8A29A;
  --sk-faint:#6B6660;
  /* stage colors */
  --sk-discover:#6FA9A0;
  --sk-decide:#C39A5E;
  --sk-plan:#8FA464;
  --sk-design:#AB7FA0;
  --sk-build:#6D97C2;
  --sk-ship:#BD8092;
  --sk-learn:#A89F66;
  --sk-pass:#4FC47A;
  --sk-fail:#EF6A5F;
  --sk-warn:#E8B44C;
  --sk-ember:#FF6B2C;
  --sk-accent:var(--sk-ember);
  /* radii */
  --sk-r-chip:7px;
  --sk-r-control:8px;
  --sk-r-row:9px;
  --sk-r-card:10px;
  --sk-r-panel:12px;
  --sk-r-pane:16px;
  /* faces */
  --sk-ui:"Mona Sans",system-ui,sans-serif;
  --sk-mono:"IBM Plex Mono",ui-monospace,monospace;
  /* the only two shadows */
  --sk-ring:0 0 0 1px var(--sk-hairline);
  --sk-ambient:0 24px 80px rgba(0,0,0,.5);
}

/* ————— frame ground & perspective stage (kit) ————— */
.sk-frame{
  position:relative;width:100%;height:100%;overflow:hidden;
  container-type:size;
  background:var(--sk-ground);
  color:var(--sk-text);
  font-family:var(--sk-ui);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
.sk-frame *,.sk-frame *::before,.sk-frame *::after{box-sizing:border-box;margin:0;padding:0;}
.sk-stage{
  position:absolute;inset:0;display:grid;place-items:center;
  perspective:var(--sk-persp,2200px);
  perspective-origin:50% 42%;
}
.sk-screen{
  position:relative;
  width:var(--sk-w,88cqw);height:var(--sk-h,86cqh);
  transform:translateY(-2.6cqh) rotateX(var(--sk-rx,1.8deg)) rotateY(var(--sk-ry,-2.4deg));
  transform-style:preserve-3d;
  background:var(--sk-ground);
  border-radius:var(--sk-r-pane);
  box-shadow:var(--sk-ring),var(--sk-ambient);
  overflow:hidden;
}

/* ————— app shell grid (kit) ————— */
.sk-shell{
  display:grid;height:100%;
  grid-template-columns:12.5cqw minmax(0,1fr);
  grid-template-rows:3.2cqh minmax(0,1fr);
  grid-template-areas:"side top" "side main";
}

/* ————— sidebar (kit) ————— */
.sk-sidebar{
  grid-area:side;display:flex;flex-direction:column;min-height:0;
  background:var(--sk-ground);border-right:1px solid var(--sk-hairline);
}
.sk-ws{display:flex;align-items:center;gap:0.55cqw;padding:1cqw 1cqw 0.8cqw;}
.sk-ws-mark{
  width:0.72cqw;height:0.72cqw;flex:none;border-radius:50%;
  border:1px solid var(--sk-ember);
  background:radial-gradient(circle at 50% 50%,var(--sk-ember) 0 28%,transparent 30%);
}
.sk-ws-name{font:600 0.82cqw/1 var(--sk-ui);color:var(--sk-text);letter-spacing:0.01em;}
.sk-ws-caret{margin-left:auto;font:400 0.6cqw/1 var(--sk-mono);color:var(--sk-faint);}
.sk-nav{display:flex;flex-direction:column;gap:0.12cqh;padding:0.3cqw 0.5cqw;}
.sk-navrow{
  display:flex;align-items:center;gap:0.55cqw;
  padding:0.42cqw 0.6cqw;border-radius:var(--sk-r-row);
  font:400 0.73cqw/1 var(--sk-ui);color:var(--sk-muted);
}
.sk-navrow .sk-dot{
  width:0.3cqw;height:0.3cqw;flex:none;border-radius:50%;
  background:var(--dot,var(--sk-faint));
}
.sk-navcount{margin-left:auto;font:400 0.55cqw/1 var(--sk-mono);color:var(--sk-faint);}
.sk-navrow.is-active{background:var(--sk-raised);color:var(--sk-text);}
.sk-navrow.is-active .sk-dot{box-shadow:0 0 0.45cqw 0 var(--dot,var(--sk-accent));}
.sk-navrow.is-active .sk-navcount{color:var(--sk-muted);}
.sk-side-foot{
  margin-top:auto;display:flex;align-items:center;gap:0.45cqw;
  padding:0.85cqw 1cqw;border-top:1px solid var(--sk-hairline);
  font:400 0.57cqw/1 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.03em;
}
.sk-livedot{
  width:0.26cqw;height:0.26cqw;flex:none;border-radius:50%;
  background:var(--sk-pass);box-shadow:0 0 0.4cqw var(--sk-pass);
}

/* ————— top bar (kit) ————— */
.sk-topbar{
  grid-area:top;display:flex;align-items:center;gap:0.9cqw;
  padding:0 1cqw;border-bottom:1px solid var(--sk-hairline);background:var(--sk-ground);
}
.sk-crumb{display:flex;align-items:center;font:400 0.62cqw/1 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;}
.sk-crumb-sep{padding:0 0.35cqw;color:var(--sk-faint);}
.sk-crumb-here{color:var(--sk-text);}
.sk-ask{
  display:flex;align-items:center;gap:0.5cqw;flex:0 1 20cqw;height:2.1cqh;
  padding:0 0.4cqw 0 0.65cqw;background:var(--sk-panel);
  border:1px solid var(--sk-hairline);border-radius:var(--sk-r-control);
  font:400 0.66cqw/1 var(--sk-ui);color:var(--sk-faint);
}
.sk-ask svg{width:0.68cqw;height:0.68cqw;flex:none;stroke:var(--sk-faint);fill:none;stroke-width:1.6;}
.sk-kbd{
  margin-left:auto;padding:0.1cqw 0.32cqw;
  font:400 0.57cqw/1.4 var(--sk-mono);color:var(--sk-faint);
  background:var(--sk-ground);border:1px solid var(--sk-hairline);border-radius:5px;
}
.sk-avatar{
  width:1.25cqw;height:1.25cqw;flex:none;display:grid;place-items:center;
  background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:50%;
  font:600 0.5cqw/1 var(--sk-ui);color:var(--sk-muted);letter-spacing:0.05em;
}

/* ————— true-UI type scale (kit) ————— */
.sk-greet{font:600 1.55cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.01em;}
.sk-body{font:400 0.73cqw/1.45 var(--sk-ui);color:var(--sk-text);}
.sk-meta{font:400 0.68cqw/1.4 var(--sk-ui);color:var(--sk-muted);}
.sk-label{font:500 0.65cqw/1.4 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.10em;text-transform:uppercase;}
.sk-spacer{flex:1;}

/* ————— panels · rows (kit) ————— */
.sk-panel{
  background:var(--sk-panel);border:1px solid var(--sk-hairline);
  border-radius:var(--sk-r-panel);overflow:hidden;min-height:0;
  display:flex;flex-direction:column;
}
.sk-panel-hd{
  display:flex;align-items:center;gap:0.6cqw;flex:none;
  padding:0.75cqw 1cqw;border-bottom:1px solid var(--sk-hairline);
}
.sk-panel-title{font:600 0.83cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
.sk-panel-body{flex:1;min-height:0;overflow:hidden;}
.sk-panel-ft{
  display:flex;align-items:center;gap:0.6cqw;flex:none;
  padding:0.6cqw 1cqw;border-top:1px solid var(--sk-hairline);
  background:var(--sk-panel);
}

/* ————— chips · badges (kit) ————— */
.sk-chip{
  display:inline-flex;align-items:center;gap:0.3cqw;
  padding:0.22cqw 0.45cqw;border:1px solid var(--sk-hairline);
  border-radius:var(--sk-r-chip);background:rgba(255,255,255,0.02);
  font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;
  white-space:nowrap;
}
.sk-chip--accent{color:var(--sk-accent);border-color:color-mix(in srgb,var(--sk-accent) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-accent) 8%,transparent);}
.sk-chip--pass{color:var(--sk-pass);border-color:color-mix(in srgb,var(--sk-pass) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-pass) 8%,transparent);}
.sk-chip--ember{color:var(--sk-ember);border-color:color-mix(in srgb,var(--sk-ember) 45%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-ember) 9%,transparent);}
.sk-dot-inline{width:0.26cqw;height:0.26cqw;flex:none;border-radius:50%;background:currentColor;}
.sk-badge{
  display:inline-flex;align-items:center;padding:0.22cqw 0.45cqw;
  background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:var(--sk-r-chip);
  font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-muted);font-variant-numeric:tabular-nums;
}
.sk-tick{color:var(--sk-pass);font-family:var(--sk-mono);}

/* ————— bet card (kit — the decision queue behind the mark) ————— */
.sk-betcard{
  flex:none;padding:1cqw 1.1cqw;background:var(--sk-raised);
  border:1px solid var(--sk-hairline);border-radius:var(--sk-r-card);
}
.sk-betcard-hd{display:flex;align-items:center;gap:0.6cqw;}
.sk-rank{font:500 0.62cqw/1 var(--sk-mono);color:var(--sk-faint);letter-spacing:0.06em;}
.sk-betcard-title{font:600 0.85cqw/1.25 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
.sk-betcard .sk-meta{margin-top:0.3cqw;}
.sk-betcard.is-lead{
  border-color:color-mix(in srgb,var(--sk-accent) 45%,var(--sk-hairline));
  background:color-mix(in srgb,var(--sk-accent) 4%,var(--sk-raised));
}
.sk-betcard.is-lead .sk-rank{color:var(--sk-accent);}
.sk-betnote{
  display:flex;gap:0.45cqw;margin-top:0.7cqw;padding-top:0.6cqw;
  border-top:1px solid var(--sk-hairline);
  font:400 0.57cqw/1.4 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;
}
.sk-betnote span{color:var(--sk-accent);}
.sk-agentline{
  margin-top:auto;display:flex;align-items:center;gap:0.5cqw;
  padding:0.6cqw 0.8cqw;background:var(--sk-raised);
  border:1px solid var(--sk-hairline);border-radius:var(--sk-r-row);
  font:400 0.62cqw/1.3 var(--sk-mono);color:var(--sk-muted);
}
.sk-run{color:var(--sk-accent);text-align:center;}

/* ————— console — agent activity feed (kit) ————— */
.sk-console-hd{
  display:flex;align-items:center;gap:0.6cqw;flex:none;
  padding:0.65cqw 1cqw;border-bottom:1px solid var(--sk-hairline);
}
.sk-console-body{padding:0.4cqw 0;}
.sk-logline{
  display:grid;grid-template-columns:3.4cqw 1cqw minmax(0,1fr);gap:0.5cqw;align-items:baseline;
  padding:0.26cqw 1cqw;font:400 0.62cqw/1.5 var(--sk-mono);color:var(--sk-muted);
  font-variant-numeric:tabular-nums;
}
.sk-log-t{color:var(--sk-faint);}
.sk-logline .sk-tick{text-align:center;}
.sk-logline.is-run{background:color-mix(in srgb,var(--sk-accent) 5%,transparent);color:var(--sk-text);}

/* ═════ frame-specific — the receding app, the lockup, the address, the fade ═════ */

/* ground clip — ink field with a faint center lift (never on #root) */
#cl-ground{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 52% at 50% 42%, #101013 0%, #0A0A0B 70%);
}
#cl-world{position:absolute;inset:0;}

/* the one camera — everything in the world rides it */
#cl-cam{
  position:absolute;inset:0;
  transform-origin:50% 50%;
  will-change:transform;
}

/* ————— the app receding into the dark (depth-of-field-blur on --cl-dof) ————— */
#cl-backwrap{
  position:absolute;inset:0;z-index:1;
  --cl-dof:11px;
  filter:blur(var(--cl-dof));
  will-change:transform,filter,opacity;
}
/* station colors as soft lights riding the blurred screen */
.cl-light{
  position:absolute;z-index:3;border-radius:50%;pointer-events:none;
  width:19cqw;height:19cqw;
}
#cl-light-discover{left:8cqw;top:22cqh;background:radial-gradient(circle,rgba(111,169,160,0.20) 0%,transparent 65%);}
#cl-light-decide{left:33cqw;top:52cqh;background:radial-gradient(circle,rgba(195,154,94,0.18) 0%,transparent 65%);}
#cl-light-build{left:57cqw;top:30cqh;background:radial-gradient(circle,rgba(109,151,194,0.18) 0%,transparent 65%);}
#cl-light-ship{left:71cqw;top:56cqh;background:radial-gradient(circle,rgba(189,128,146,0.16) 0%,transparent 65%);}
#cl-light-ember{left:42cqw;top:12cqh;width:14cqw;height:14cqw;background:radial-gradient(circle,rgba(255,107,44,0.14) 0%,transparent 65%);}

/* ————— the lockup (F13's sanctioned centered moment) ————— */
#cl-lockup{position:absolute;inset:0;z-index:5;}
#cl-glow{
  position:absolute;left:50%;top:33cqh;
  width:52cqh;height:52cqh;margin-left:-26cqh;margin-top:-26cqh;
  border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(255,107,44,0.30) 0%, rgba(255,107,44,0.09) 42%, transparent 70%);
  opacity:0;
  will-change:transform,opacity;
}
#cl-spin{
  position:absolute;left:50%;top:33cqh;
  width:22cqh;height:22cqh;margin-left:-11cqh;margin-top:-11cqh;
  will-change:transform;
}
#cl-spin svg{display:block;width:100%;height:100%;overflow:visible;}
#cl-core{opacity:0;}
#cl-word{
  position:absolute;left:0;right:0;top:46.2cqh;
  text-align:center;
  font:600 4.1cqw/1 var(--sk-ui);letter-spacing:-0.03em;color:var(--sk-text);
  text-transform:lowercase;
  opacity:0;
  will-change:transform,opacity;
}
#cl-tag{
  position:absolute;left:0;right:0;top:56cqh;
  display:flex;justify-content:center;gap:0.62cqw;
  font:600 2.25cqw/1.15 var(--sk-ui);letter-spacing:-0.015em;color:var(--sk-text);
}
#cl-tag span{display:inline-block;opacity:0;will-change:transform,opacity;}

/* ————— the address field — the caret's bookend ————— */
#cl-url{
  position:absolute;left:50%;top:62.6cqh;
  width:13.5cqw;height:4.4cqh;margin-left:-6.75cqw;
  display:flex;align-items:center;gap:0.18cqw;
  padding:0 1.1cqw;
  background:rgba(20,20,22,0.88);
  border:1px solid var(--sk-hairline);border-radius:var(--sk-r-control);
  box-shadow:var(--sk-ring),var(--sk-ambient);
  opacity:0;
  will-change:transform,opacity;
}
#cl-url-text{
  font:500 1.3cqw/1 var(--sk-mono);color:var(--sk-text);letter-spacing:0.01em;
  white-space:pre;
}
#cl-caret{
  width:0.14cqw;height:2.4cqh;flex:none;
  background:var(--sk-text);
}
#cl-sub{
  position:absolute;left:0;right:0;top:69.8cqh;
  text-align:center;
  font:400 0.95cqw/1.4 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.06em;
  opacity:0;
  will-change:transform,opacity;
}

/* ————— the film's one real exit — fade to black (final frame owns it) ————— */
#cl-fade{
  position:absolute;inset:0;z-index:200;
  background:#000;
  opacity:0;
  pointer-events:none;
  will-change:opacity;
}

/* v4 identity: real product mark + workspace label */
.sk-ws-mark{background:none !important;border-radius:0 !important;padding:0.08cqw;box-sizing:border-box;}
.sk-ws-space{font:400 0.62cqw/1 var(--sk-mono, "IBM Plex Mono", monospace);color:var(--sk-text-muted, #A8A29A);margin-left:0.45cqw;padding:0.16cqw 0.38cqw;border:1px solid var(--sk-hairline, #26262A);border-radius:6px;}
</style>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
<script>
  window.__timelines = window.__timelines || {};

  (function () {
    // Scope every query to THIS frame — kit classes and ids repeat nowhere else,
    // but scoping is the law when frames are inlined into one document.
    var clRoot = document.querySelector('[data-composition-id="13-close"]');
    var $ = function (sel) { return clRoot.querySelector(sel); };

    var DUR = 9.3;
    var tl = gsap.timeline({ paused: true });

    /* ── svg-path-draw setup — measure the loop, dash it out ───────────── */
    var loop = $("#cl-loop");
    var len = loop.getTotalLength() * 1.02; // slight overestimate per the recipe
    loop.style.strokeDasharray = String(len);
    loop.style.strokeDashoffset = String(len);

    /* ── the one camera (multi-phase-camera: approach → push → deeper push,
       plus continuous Lissajous micro-drift — the camera never sleeps) ──── */
    var camEl = $("#cl-cam");
    var cam = { s: 0.965, x: 0, y: 0 };
    var drift = { p: 0 };
    var DRIFT_AMP_X = 3.8, DRIFT_AMP_Y = 2.2, DRIFT_FREQ_RATIO = 1.35;
    var applyCam = function () {
      var dx = Math.sin(drift.p) * DRIFT_AMP_X;
      var dy = Math.sin(drift.p * DRIFT_FREQ_RATIO) * DRIFT_AMP_Y;
      camEl.style.transform =
        "translate(" + (cam.x + dx) + "px," + (cam.y + dy) + "px) scale(" + cam.s + ")";
    };
    applyCam(); // seed frame 0

    // phase 1 — slow approach while the mark draws
    tl.to(cam, { s: 1.015, duration: 2.6, ease: "power2.inOut" }, 0);
    // phase 2 — the very slow push under the lockup + typing
    tl.to(cam, { s: 1.05, duration: 3.2, ease: "power1.inOut" }, 2.6);
    // phase 3 — settle deeper into the mark as the film ends
    tl.to(cam, { s: 1.09, duration: 3.5, ease: "power2.inOut" }, 5.8);

    /* ═══ SCENE 1 (0.0–2.6s) · the app recedes, the mark draws itself ═══ */

    // the app home, pre-blurred (depth-of-field-blur on --cl-dof), receding
    // in perspective the whole first two scenes — "the world recedes."
    tl.fromTo("#cl-backwrap",
      { scale: 1.035, opacity: 0.55, "--cl-dof": "11px" },
      { scale: 0.95, opacity: 0.38, "--cl-dof": "17px", duration: 5.8, ease: "power1.inOut" }, 0);

    // the mark revolves as it completes (F4's draw motif, bookended)
    tl.fromTo("#cl-spin", { rotation: -46 }, { rotation: 0, duration: 2.4, ease: "power2.out" }, 0.05);
    // stroke draw — pen trace, power2.out, no bounce (VO: "Supaprod.")
    tl.to(loop, { strokeDashoffset: 0, duration: 1.85, ease: "power2.out" }, 0.10);
    // ember glow blooms behind the mark as the loop nears close
    tl.fromTo("#cl-glow", { opacity: 0, scale: 0.85 },
      { opacity: 0.26, scale: 1, duration: 0.7, ease: "power2.out" }, 1.35);
    // the ember core comes to rest at center
    tl.fromTo("#cl-core", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 1.5);

    // "Build what matters." — the three words rise beneath the mark on the cue
    var tagWords = ["#cl-t1", "#cl-t2", "#cl-t3"];
    tagWords.forEach(function (sel, i) {
      var el = $(sel);
      tl.set(el, { opacity: 0, y: 20 }, 0);
      tl.to(el, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.55 + i * 0.15);
    });

    /* ═══ SCENE 2 (2.6–5.8s) · the wordmark completes; the caret types ═══ */

    // wordmark joins between mark and tagline — the lockup completes
    tl.set("#cl-word", { opacity: 0, y: 18 }, 0);
    tl.to("#cl-word", { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 2.62);

    // the address field arrives — F3's caret, returned for the bookend
    tl.set("#cl-url", { opacity: 0, y: 12, scale: 0.98 }, 0);
    tl.to("#cl-url", { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, 3.92);

    /* typing (discrete-text-sequence) — "supaprod.ai", timed to the VO */
    var SEQ = [
      { t: 0,    x: "" },
      { t: 4.30, x: "s" },
      { t: 4.41, x: "su" },
      { t: 4.52, x: "sup" },
      { t: 4.63, x: "supa" },
      { t: 4.75, x: "supap" },
      { t: 4.86, x: "supapr" },
      { t: 4.97, x: "supapro" },
      { t: 5.08, x: "supaprod" },
      { t: 5.24, x: "supaprod." },
      { t: 5.36, x: "supaprod.a" },
      { t: 5.47, x: "supaprod.ai" }
    ];
    function seqAt(t) {
      for (var i = SEQ.length - 1; i >= 0; i--) if (t >= SEQ[i].t) return SEQ[i];
      return SEQ[0];
    }
    var urlText = $("#cl-url-text");
    var caret = $("#cl-caret");

    // master driver — one ease:none sweep runs the discrete text states
    var driver = { t: 0 };
    tl.to(driver, { t: DUR, duration: DUR, ease: "none", onUpdate: function () {
      urlText.textContent = seqAt(driver.t).x;
    }}, 0);

    // deterministic caret blink — 12 cycles over 9.3s (period ≈ 0.775s), sin square-wave
    var blink = { p: 0 };
    tl.to(blink, { p: Math.PI * 2 * 12, duration: DUR, ease: "none", onUpdate: function () {
      caret.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
    }}, 0);

    /* ═══ SCENE 3 (5.8–9.3s) · the ask lands, the lights dim, the film ends ═══ */

    // sub-line fades in on "no login needed"
    tl.set("#cl-sub", { opacity: 0, y: 10 }, 0);
    tl.to("#cl-sub", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 6.25);

    // the blurred app lights dim FIRST — the product recedes into the dark
    tl.to("#cl-backwrap", { opacity: 0.10, scale: 0.93, duration: 1.1, ease: "power2.inOut" }, 7.35);
    tl.to("#cl-glow", { opacity: 0.12, duration: 1.0, ease: "power2.inOut" }, 7.5);

    // …then the film's one real exit — a gentle fade to black over the last second
    // (final frame owns this; every other frame's exit is the root transition)
    tl.to("#cl-fade", { opacity: 1, duration: 1.0, ease: "power2.inOut" }, 8.3);

    /* drift — continuous micro-motion the whole 9.3s. Added LAST so every
       cam tween has updated before applyCam composes the transform. */
    tl.to(drift, {
      p: Math.PI * 2 * 2,
      duration: DUR,
      ease: "none",
      onUpdate: applyCam
    }, 0);

    window.__timelines["13-close"] = tl;
  })();
</script>
