  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      var tl = gsap.timeline({ paused: true });
      var $ = function (id) { return document.getElementById(id); };
      var world = $("f1-world");

      /* ── macro camera — multi-phase (viewport-change composite form) + micro-drift.
         Single source of truth; one writer. World layout math (plane 132×92cq,
         editor ox −1267…230, deploy ox 288…1267): T = target − offset × S. */
      var cam = { s: 1.32, x: 684, y: 53 };          /* phase 1 — close on the editor */
      var drift = { p: 0, dx: 0, dy: 0 };
      function applyCamera() {
        world.style.transform =
          "translate(" + (cam.x + drift.dx) + "px, " + (cam.y + drift.dy) + "px) scale(" + cam.s + ")";
      }
      applyCamera();
      /* phase 1 · 0–2.6 — slow drift right + breath-in while the agent types */
      tl.to(cam, { x: 648, y: 40, s: 1.345, duration: 2.6, ease: "sine.inOut", onUpdate: applyCamera }, 0);
      /* phase 2 · 2.6–3.5 — fast pan right to the deploy panel */
      tl.to(cam, { x: -606, y: 0, s: 1.22, duration: 0.9, ease: "power2.inOut", onUpdate: applyCamera }, 2.6);
      /* phase 3 · 3.5–5.6 — settle back from the pan's overshoot, slow breath-in
         (S 1.24 puts the deploy window's right edge past the frame edge → full bleed) */
      tl.to(cam, { x: -580, s: 1.24, duration: 2.1, ease: "sine.inOut", onUpdate: applyCamera }, 3.5);
      /* phase 4 · 5.6–8.2 — climax push onto the promote row / live chip
         (x −1055 keeps the window edge outside frame at max drift, no env sliver) */
      tl.to(cam, { x: -1950, y: 250, s: 1.82, duration: 2.6, ease: "power2.inOut", onUpdate: applyCamera }, 5.6);
      /* continuous micro-drift — 2 Lissajous cycles across the shot */
      tl.to(drift, {
        p: Math.PI * 2 * 2, duration: 8.2, ease: "none",
        onUpdate: function () {
          drift.dx = Math.sin(drift.p) * 5;
          drift.dy = Math.sin(drift.p * 1.35) * 3;
          applyCamera();
        }
      }, 0);

      /* ── pan velocity blur (motion-blur-streak, path A — proxy → stdDeviation).
         Peaks at the pan's midpoint (3.05s), resolves to 0 as the camera settles. */
      var blurNode = $("f1-streak-blur");
      var blurP = { v: 0 };
      function writeBlur() { blurNode.setAttribute("stdDeviation", blurP.v + " 0"); }
      writeBlur(); /* seed frame 0 */
      tl.to(blurP, { v: 16, duration: 0.45, ease: "power2.in", onUpdate: writeBlur }, 2.6);
      tl.to(blurP, { v: 0, duration: 0.45, ease: "power2.out", onUpdate: writeBlur }, 3.05);

      /* ── the agent writes the code (discrete-text-sequence — whole-line states
         at thresholds, burst cadence; caret + badge pulse on the same driver) */
      var lines = Array.prototype.slice.call(document.querySelectorAll(".f1-codeline"));
      var carets = lines.map(function (l) { return l.querySelector(".f1-caret"); });
      var badgeDot = $("f1-badge-dot");
      var COUNTS = [[0, 2], [0.35, 4], [0.7, 5], [0.95, 6], [1.25, 8], [1.55, 9], [1.8, 10],
                    [2.1, 12], [2.45, 14], [2.8, 15], [3.2, 17], [3.55, 18], [3.85, 20],
                    [4.25, 22], [4.7, 23], [5.05, 24], [5.4, 26]];
      function renderSeq(t) {
        var n = 2, i;
        for (i = 0; i < COUNTS.length; i++) { if (t >= COUNTS[i][0]) { n = COUNTS[i][1]; } else { break; } }
        var blinkOn = Math.sin(t * Math.PI * 2 / 0.64) > -0.1;
        for (i = 0; i < lines.length; i++) {
          lines[i].style.opacity = i < n ? "1" : "0";
          carets[i].style.opacity = (i === n - 1 && blinkOn) ? "1" : "0";
        }
        badgeDot.style.opacity = String(0.55 + 0.45 * Math.sin(t * Math.PI * 2 / 1.15));
      }
      renderSeq(0); /* seed frame 0 */
      var drv = { t: 0 };
      tl.to(drv, { t: 8.2, duration: 8.2, ease: "none", onUpdate: function () { renderSeq(drv.t); } }, 0);

      /* ── lower-third rises during scene 1 (film overlay, never centered) */
      tl.fromTo("#f1-lt-k", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.95);
      tl.fromTo("#f1-lt-l", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 1.2);

      /* ── scene 2 — pipeline ticks green (staggered pending→done flips) */
      var FLIPS = [3.3, 3.7, 4.05, 4.4];
      var pends = document.querySelectorAll(".f1-pip .sk-logline .f1-pend");
      var dones = document.querySelectorAll(".f1-pip .sk-logline .f1-done");
      var k;
      for (k = 0; k < 4; k++) {
        tl.to(pends[k], { opacity: 0, duration: 0.18, ease: "power1.in" }, FLIPS[k]);
        tl.fromTo(dones[k], { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, FLIPS[k]);
      }

      /* ── preview → production progress (stat-bars-and-fills — scaleX, left origin) */

      tl.to("#f1-fill", { backgroundColor: "#4FC47A", duration: 0.35, ease: "power2.out" }, 5.8);

      /* ── on "beautiful features" — three artifact cards slide up, staggered */
      var cards = document.querySelectorAll(".f1-art-card");
      for (k = 0; k < cards.length; k++) {
        tl.fromTo(cards[k], { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 4.5 + k * 0.16);
      }

      /* ── scene 3 — on "shipped in days", the deploy flips live */
      tl.to("#f1-pr-run", { opacity: 0, duration: 0.15, ease: "power1.in" }, 5.75);
      tl.fromTo("#f1-pr-done", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 5.75);
      tl.to("#f1-row-pend", { opacity: 0, duration: 0.22, ease: "power1.in" }, 5.85);
      tl.fromTo("#f1-row-live", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 5.85);
      tl.to("#f1-dep-pend", { opacity: 0, duration: 0.22, ease: "power1.in" }, 5.85);
      tl.fromTo("#f1-dep-live", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 5.85);

      /* ── depth-of-field — the editor falls out of focus behind the push
         (--dof var tween; caret keeps blinking behind the blur) */
      tl.to("#f1-editor", { "--dof": "3.6px", opacity: 0.82, duration: 1.0, ease: "power2.inOut" }, 5.8);

      window.__timelines["01-anyone-can-build"] = tl;
