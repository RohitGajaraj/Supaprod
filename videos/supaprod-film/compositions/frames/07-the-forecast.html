<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- F7 · The forecast — the commit form captures what you believe will happen, then seals it.
       The film's breather: slow push, quiet seal, close-up hold on the sealed row.
       Head is metadata only; the runtime clones ONLY the <template> below. -->

<body>
<template>
  <style>
    /* ————— fonts (screen kit, dual-path src) ————— */
    @font-face{font-family:"Geist";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/Geist-Regular.woff2") format("woff2"),url("assets/fonts/Geist-Regular.woff2") format("woff2");}
    @font-face{font-family:"Geist Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistMono-Regular.woff2") format("woff2"),url("assets/fonts/GeistMono-Regular.woff2") format("woff2");}
    @font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2");}
    @font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");}
    @font-face{font-family:"Mona Sans";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/MonaSans-Regular.woff2") format("woff2"),url("assets/fonts/MonaSans-Regular.woff2") format("woff2");}

    /* ————— tokens (screen kit v3 — declared on #root, inherit down; :root breaks under scoping) ————— */
    #root{
      --sk-ground:#0A0A0B;
      --sk-panel:#141416;
      --sk-raised:#1A1A1D;
      --sk-hairline:#26262A;
      --sk-text:#F2EFE9;
      --sk-muted:#A8A29A;
      --sk-faint:#6B6660;
      --sk-discover:#6FA9A0;
      --sk-decide:#C39A5E;
      --sk-plan:#8FA464;
      --sk-design:#AB7FA0;
      --sk-build:#6D97C2;
      --sk-ship:#BD8092;
      --sk-learn:#A89F66;
      --sk-pass:#4FC47A;
      --sk-fail:#EF6A5F;
      --sk-warn:#E8B44C;
      --sk-ember:#FF6B2C;
      --sk-accent:var(--sk-decide);
      --sk-r-chip:7px;
      --sk-r-control:8px;
      --sk-r-row:9px;
      --sk-r-card:10px;
      --sk-r-panel:12px;
      --sk-r-pane:16px;
      --sk-ui:"Mona Sans",system-ui,sans-serif;
      --sk-mono:"IBM Plex Mono",ui-monospace,monospace;
      --sk-ring:0 0 0 1px var(--sk-hairline);
      --sk-ambient:0 24px 80px rgba(0,0,0,.5);
      position:absolute;inset:0;width:100%;height:100%;overflow:hidden;
    }

    /* ————— ground clip (track 0) — the dependable full-bleed ink ————— */
    .f7-ground{position:absolute;inset:0;background:#0A0A0B;}

    /* ————— world clip (track 1) — kit frame + camera rig ————— */
    .f7-world{position:absolute;inset:0;}
    .sk-frame{
      position:relative;width:100%;height:100%;overflow:hidden;
      container-type:size;
      background:var(--sk-ground);
      color:var(--sk-text);
      font-family:var(--sk-ui);
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }
    .sk-frame *,.sk-frame *::before,.sk-frame *::after{box-sizing:border-box;margin:0;padding:0;}
    /* camera wrapper — single world transform (multi-phase-camera + viewport-change) */
    .f7-cam{
      position:absolute;inset:0;
      transform-origin:50% 50%;
      will-change:transform,filter;
      filter:url(#f7-pushblur);
    }
    .sk-stage{
      position:absolute;inset:0;display:grid;place-items:center;
      perspective:2200px;
      perspective-origin:50% 42%;
    }
    .sk-screen{
      position:relative;
      width:88cqw;height:86cqh;
      transform:rotateX(2.6deg) rotateY(-3.8deg);
      transform-style:preserve-3d;
      background:var(--sk-ground);
      border-radius:var(--sk-r-pane);
      box-shadow:var(--sk-ring),var(--sk-ambient);
      overflow:hidden;
      will-change:transform;
    }

    /* ————— app shell ————— */
    .sk-shell{
      display:grid;height:100%;
      grid-template-columns:12.5cqw minmax(0,1fr);
      grid-template-rows:3.2cqh minmax(0,1fr);
      grid-template-areas:"side top" "side main";
    }
    .sk-sidebar{
      grid-area:side;display:flex;flex-direction:column;min-height:0;
      background:var(--sk-ground);border-right:1px solid var(--sk-hairline);
    }
    .sk-ws{display:flex;align-items:center;gap:0.55cqw;padding:1cqw 1cqw 0.8cqw;}
    .sk-ws-mark{
      width:0.72cqw;height:0.72cqw;flex:none;border-radius:50%;
      border:1px solid var(--sk-ember);
      background:radial-gradient(circle at 50% 50%,var(--sk-ember) 0 28%,transparent 30%);
    }
    .sk-ws-name{font:600 0.82cqw/1 var(--sk-ui);color:var(--sk-text);letter-spacing:0.01em;}
    .sk-ws-caret{margin-left:auto;font:400 0.6cqw/1 var(--sk-mono);color:var(--sk-faint);}
    .sk-nav{display:flex;flex-direction:column;gap:0.12cqh;padding:0.3cqw 0.5cqw;}
    .sk-navrow{
      display:flex;align-items:center;gap:0.55cqw;
      padding:0.42cqw 0.6cqw;border-radius:var(--sk-r-row);
      font:400 0.73cqw/1 var(--sk-ui);color:var(--sk-muted);
    }
    .sk-navrow .sk-dot{
      width:0.3cqw;height:0.3cqw;flex:none;border-radius:50%;
      background:var(--dot,var(--sk-faint));
    }
    .sk-navcount{margin-left:auto;font:400 0.55cqw/1 var(--sk-mono);color:var(--sk-faint);}
    .sk-navrow.is-active{background:var(--sk-raised);color:var(--sk-text);}
    .sk-navrow.is-active .sk-dot{box-shadow:0 0 0.45cqw 0 var(--dot,var(--sk-accent));}
    .sk-navrow.is-active .sk-navcount{color:var(--sk-muted);}
    .sk-side-foot{
      margin-top:auto;display:flex;align-items:center;gap:0.45cqw;
      padding:0.85cqw 1cqw;border-top:1px solid var(--sk-hairline);
      font:400 0.57cqw/1 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.03em;
    }
    .sk-livedot{
      width:0.26cqw;height:0.26cqw;flex:none;border-radius:50%;
      background:var(--sk-pass);box-shadow:0 0 0.4cqw var(--sk-pass);
    }
    .sk-topbar{
      grid-area:top;display:flex;align-items:center;gap:0.9cqw;
      padding:0 1cqw;border-bottom:1px solid var(--sk-hairline);background:var(--sk-ground);
    }
    .sk-crumb{display:flex;align-items:center;font:400 0.62cqw/1 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;}
    .sk-crumb-sep{padding:0 0.35cqw;color:var(--sk-faint);}
    .sk-crumb-here{color:var(--sk-text);}
    .sk-ask{
      display:flex;align-items:center;gap:0.5cqw;flex:0 1 20cqw;height:2.1cqh;
      padding:0 0.4cqw 0 0.65cqw;background:var(--sk-panel);
      border:1px solid var(--sk-hairline);border-radius:var(--sk-r-control);
      font:400 0.66cqw/1 var(--sk-ui);color:var(--sk-faint);
    }
    .sk-ask svg{width:0.68cqw;height:0.68cqw;flex:none;stroke:var(--sk-faint);fill:none;stroke-width:1.6;}
    .sk-kbd{
      margin-left:auto;padding:0.1cqw 0.32cqw;
      font:400 0.57cqw/1.4 var(--sk-mono);color:var(--sk-faint);
      background:var(--sk-ground);border:1px solid var(--sk-hairline);border-radius:5px;
    }
    .sk-avatar{
      width:1.25cqw;height:1.25cqw;flex:none;display:grid;place-items:center;
      background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:50%;
      font:600 0.5cqw/1 var(--sk-ui);color:var(--sk-muted);letter-spacing:0.05em;
    }

    /* ————— type + primitives ————— */
    .sk-title{font:600 1.3cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.01em;}
    .sk-body{font:400 0.73cqw/1.45 var(--sk-ui);color:var(--sk-text);}
    .sk-meta{font:400 0.68cqw/1.4 var(--sk-ui);color:var(--sk-muted);}
    .sk-label{font:500 0.65cqw/1.4 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.10em;text-transform:uppercase;}
    .sk-spacer{flex:1;}
    .sk-panel{
      background:var(--sk-panel);border:1px solid var(--sk-hairline);
      border-radius:var(--sk-r-panel);overflow:hidden;min-height:0;
      display:flex;flex-direction:column;
    }
    .sk-panel-hd{
      display:flex;align-items:center;gap:0.6cqw;flex:none;
      padding:0.75cqw 1cqw;border-bottom:1px solid var(--sk-hairline);
    }
    .sk-panel-title{font:600 0.83cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
    .sk-panel-body{flex:1;min-height:0;overflow:hidden;}
    .sk-row{padding:0.7cqw 1cqw;}
    .sk-row + .sk-row{border-top:1px solid var(--sk-hairline);}
    .sk-chip{
      display:inline-flex;align-items:center;gap:0.3cqw;
      padding:0.22cqw 0.45cqw;border:1px solid var(--sk-hairline);
      border-radius:var(--sk-r-chip);background:rgba(255,255,255,0.02);
      font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;
      white-space:nowrap;
    }
    .sk-chip--accent{color:var(--sk-accent);border-color:color-mix(in srgb,var(--sk-accent) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-accent) 8%,transparent);}
    .sk-chip--pass{color:var(--sk-pass);border-color:color-mix(in srgb,var(--sk-pass) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-pass) 8%,transparent);}
    .sk-chip--ember{color:var(--sk-ember);border-color:color-mix(in srgb,var(--sk-ember) 45%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-ember) 9%,transparent);}
    .sk-dot-inline{width:0.26cqw;height:0.26cqw;flex:none;border-radius:50%;background:currentColor;}
    .sk-badge{
      display:inline-flex;align-items:center;padding:0.22cqw 0.45cqw;
      background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:var(--sk-r-chip);
      font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-muted);font-variant-numeric:tabular-nums;
    }

    /* ————— background Decide content (dimmed under the scrim — F6's end state) ————— */
    .f7-content{
      grid-area:main;position:relative;display:grid;
      grid-template-columns:minmax(0,1fr) 16cqw;
      grid-template-rows:auto minmax(0,1fr);
      gap:1cqw;padding:1.1cqw;min-height:0;
    }
    .f7-head{grid-column:1/-1;display:flex;align-items:baseline;gap:0.8cqw;}
    .sk-betcard{
      align-self:start;padding:1.1cqw 1.2cqw;background:var(--sk-raised);
      border:1px solid color-mix(in srgb,var(--sk-ember) 40%,var(--sk-hairline));
      border-radius:var(--sk-r-card);
      box-shadow:0 0 1cqw rgba(255,107,44,0.14);
    }
    .sk-betcard-hd{display:flex;align-items:center;gap:0.6cqw;}
    .sk-betcard-title{font:600 0.95cqw/1.25 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
    .sk-betcard .sk-meta{margin-top:0.3cqw;font-size:0.62cqw;}
    .sk-score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.1cqw;align-items:center;margin-top:0.7cqw;}
    .sk-score-main{display:flex;flex-direction:column;align-items:flex-start;gap:0.15cqw;}
    .sk-score-num{font:500 1.5cqw/1 var(--sk-mono);color:var(--sk-accent);letter-spacing:-0.03em;font-variant-numeric:tabular-nums;}
    .sk-score-cap{font:500 0.5cqw/1 var(--sk-mono);color:var(--sk-faint);letter-spacing:0.08em;text-transform:uppercase;}
    .sk-score-bars{display:flex;flex-direction:column;gap:0.45cqw;}
    .sk-subbar{display:grid;grid-template-columns:4.6cqw minmax(0,1fr) 1.9cqw;gap:0.55cqw;align-items:center;}
    .sk-subbar-name{font:400 0.55cqw/1 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.04em;}
    .sk-subbar-track{display:block;height:0.18cqw;background:var(--sk-hairline);border-radius:2px;overflow:hidden;}
    .sk-subbar-track i{display:block;height:100%;background:var(--sk-accent);border-radius:inherit;}
    .sk-subbar-val{font:400 0.55cqw/1 var(--sk-mono);color:var(--sk-muted);text-align:right;font-variant-numeric:tabular-nums;}
    .sk-betnote{
      display:flex;gap:0.45cqw;margin-top:0.8cqw;padding-top:0.65cqw;
      border-top:1px solid var(--sk-hairline);
      font:400 0.57cqw/1.4 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;
    }
    .sk-betnote span{color:var(--sk-accent);}
    .f7-passrow-title{font:400 0.73cqw/1.35 var(--sk-ui);color:var(--sk-muted);}
    .f7-passrow-title s{color:var(--sk-faint);}
    .f7-passrow-meta{margin-top:0.2cqw;font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-faint);font-variant-numeric:tabular-nums;}
    .f7-rail{align-self:stretch;}

    /* ————— scrim + centered stack (modal ⇄ sealed record share one grid cell) ————— */
    .f7-scrim{
      position:absolute;inset:0;z-index:10;
      background:rgba(10,10,11,0.55);backdrop-filter:blur(6px);
    }
    .f7-center{
      position:absolute;inset:0;z-index:20;
      display:grid;place-items:center;padding-bottom:6cqh;
    }
    .f7-center > *{grid-area:1/1;}

    /* ————— the commit form (kit modal — ember button: this is a gate) ————— */
    .sk-modal{
      position:relative;width:34cqw;background:var(--sk-panel);
      border:1px solid var(--sk-hairline);border-radius:var(--sk-r-pane);
      box-shadow:var(--sk-ring),var(--sk-ambient);overflow:hidden;
      --dof:0px;filter:blur(var(--dof));
      transform-origin:50% 50%;will-change:transform,opacity,filter;
    }
    .sk-modal-hd{display:flex;align-items:baseline;gap:0.7cqw;padding:0.9cqw 1.2cqw;border-bottom:1px solid var(--sk-hairline);}
    .sk-modal-title{font:600 0.95cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
    .sk-modal-body{display:flex;flex-direction:column;gap:0.9cqw;padding:1.1cqw 1.2cqw;}
    .sk-field-row{display:grid;grid-template-columns:1fr 1fr;gap:0.8cqw;}
    .sk-field .sk-label{display:block;margin-bottom:0.35cqw;}
    .sk-input{
      min-height:2.2cqh;display:flex;align-items:center;
      padding:0.5cqw 0.7cqw;background:var(--sk-ground);
      border:1px solid var(--sk-hairline);border-radius:var(--sk-r-control);
      font:400 0.73cqw/1.45 var(--sk-ui);color:var(--sk-text);
      white-space:nowrap;overflow:hidden;
    }
    .sk-input.is-focus{
      border-color:color-mix(in srgb,var(--sk-accent) 55%,var(--sk-hairline));
      background:color-mix(in srgb,var(--sk-accent) 4%,var(--sk-ground));
    }
    .sk-modal-ft{display:flex;align-items:center;gap:0.6cqw;padding:0.9cqw 1.2cqw;border-top:1px solid var(--sk-hairline);}
    .sk-btn{
      display:inline-flex;align-items:center;gap:0.4cqw;
      padding:0.45cqw 0.95cqw;background:var(--sk-raised);
      border:1px solid var(--sk-hairline);border-radius:var(--sk-r-control);
      font:500 0.66cqw/1 var(--sk-ui);color:var(--sk-text);
    }
    .sk-btn--ember{background:var(--sk-ember);border-color:transparent;color:#0A0A0B;font-weight:600;will-change:transform;}
    .sk-caret{
      display:inline-block;width:0.08cqw;height:0.95em;margin-left:0.08cqw;
      background:var(--sk-accent);vertical-align:-0.12em;
    }

    /* ————— the sealed record (what the form condenses into) ————— */
    .f7-record{
      width:31cqw;background:var(--sk-panel);
      border:1px solid color-mix(in srgb,var(--sk-ember) 32%,var(--sk-hairline));
      border-radius:var(--sk-r-card);
      box-shadow:var(--sk-ring),var(--sk-ambient);
      opacity:0;--dof:0px;filter:blur(var(--dof));
      transform-origin:50% 50%;will-change:transform,opacity,filter;
    }
    .f7-record-main{display:flex;align-items:center;gap:0.7cqw;padding:0.85cqw 1cqw 0.6cqw;}
    .f7-quote{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .f7-seal{position:relative;}
    .f7-sealglow{
      position:absolute;inset:-0.28cqw;border-radius:inherit;
      box-shadow:0 0 0.9cqw rgba(255,107,44,0.5);
      opacity:0;pointer-events:none;
    }
    .f7-seal svg{width:0.62cqw;height:0.62cqw;flex:none;overflow:visible;}
    .f7-seal svg rect,.f7-seal svg path{stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
    .f7-record-chips{display:flex;gap:0.5cqw;padding:0 1cqw 0.75cqw;}
    .f7-chip{opacity:0;will-change:transform,opacity;}
    .f7-record-ft{
      display:flex;align-items:center;gap:0.5cqw;
      padding:0.6cqw 1cqw;border-top:1px solid var(--sk-hairline);
    }
    .f7-stamp{
      font:500 0.55cqw/1.3 var(--sk-mono);color:var(--sk-ember);
      letter-spacing:0.09em;text-transform:uppercase;
      opacity:0;will-change:transform,opacity;
    }
    .f7-when{font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-faint);opacity:0;will-change:transform,opacity;}
    .f7-immutable{opacity:0;will-change:transform,opacity;}

    /* ————— cursor + ripple (kit) ————— */
    .sk-cursor{position:absolute;z-index:90;width:1.05cqw;height:1.05cqw;pointer-events:none;left:46cqw;top:64cqh;opacity:0;will-change:transform,opacity;}
    .sk-cursor svg{display:block;width:100%;height:100%;overflow:visible;}
    .sk-cursor svg path{fill:var(--sk-text);stroke:var(--sk-ground);stroke-width:1.1;stroke-linejoin:round;}
    .f7-ripple{
      position:absolute;left:57.6cqw;top:55cqh;width:2.2cqw;height:2.2cqw;
      margin:-1.1cqw 0 0 -1.1cqw;border:1px solid var(--sk-text);border-radius:50%;
      opacity:0;z-index:85;pointer-events:none;transform-origin:50% 50%;will-change:transform,opacity;
    }

    /* ————— overlay clip (track 2) — lower-third, above the caption keep-out ————— */
    .f7-overlay{position:absolute;inset:0;container-type:size;pointer-events:none;}
    .sk-lowerthird{
      position:absolute;left:5.5cqw;bottom:18.5cqh;z-index:60;
      display:flex;flex-direction:column;gap:0.55cqh;
      text-shadow:0 2px 30px rgba(0,0,0,.6);
      font-family:var(--sk-ui);
    }
    .sk-lt-kicker{
      font:500 0.72cqw/1 var(--sk-mono);letter-spacing:0.14em;text-transform:uppercase;
      color:var(--sk-decide);opacity:0;will-change:transform,opacity;
    }
    .sk-lt-line{font:600 2.6cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.01em;opacity:0;will-change:transform,opacity;}
  
/* v4 identity: real product mark + workspace label */
.sk-ws-mark{background:none !important;border-radius:0 !important;padding:0.08cqw;box-sizing:border-box;}
.sk-ws-space{font:400 0.62cqw/1 var(--sk-mono, "IBM Plex Mono", monospace);color:var(--sk-text-muted, #A8A29A);margin-left:0.45cqw;padding:0.16cqw 0.38cqw;border:1px solid var(--sk-hairline, #26262A);border-radius:6px;}
</style>

    <div data-hf-id="hf-gfeq" id="f7-overlay" class="clip f7-overlay" data-start="0" data-duration="8" data-track-index="2">
      <div data-hf-id="hf-0lxp" class="sk-lowerthird">
        <span data-hf-id="hf-5rqa" class="sk-lt-kicker" id="f7-lt-k">03 · The forecast</span>
        <span data-hf-id="hf-ct4e" class="sk-lt-line" id="f7-lt-l">what you believed, on the record.</span>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    /* ───────────────────────── camera rig (multi-phase-camera + viewport-change) ───────────────────────── */
    const camEl = document.getElementById("f7-cam");
    const screenEl = document.getElementById("f7-screen");
    const cam = { scale: 0.952, x: 14, y: 6 };           // phase state
    const drift = { p: 0 };                               // continuous micro-drift
    let dx = 0, dy = 0;
    function applyCamera() {
      dx = Math.sin(drift.p) * 5;
      dy = Math.sin(drift.p * 1.31) * 3;
      camEl.style.transform = `translate(${cam.x + dx}px, ${cam.y + dy}px) scale(${cam.scale})`;
    }
    const tilt = { rx: 2.6, ry: -3.8 };
    function applyTilt() {
      screenEl.style.transform = `rotateX(${tilt.rx}deg) rotateY(${tilt.ry}deg)`;
    }
    applyCamera(); applyTilt();

    /* push-blur (motion-blur-streak, push-through "B B" smear) — seeded at 0 */
    const blurNode = document.getElementById("f7-pushblur-std");
    const blurProxy = { v: 0 };
    const writeBlur = () => blurNode.setAttribute("stdDeviation", `${blurProxy.v} ${blurProxy.v}`);
    writeBlur();

    /* svg-path-draw · lock strokes measured + hidden before the timeline runs */
    const lockSegs = [document.getElementById("f7-lock-body"), document.getElementById("f7-lock-shackle")];
    lockSegs.forEach((p) => {
      const len = p.getTotalLength() * 1.05;
      p.style.strokeDasharray = `${len}`;
      p.style.strokeDashoffset = `${len}`;
    });

    /* ── Scene 1 (0.0–3.2) · the form over the dimmed Decide screen; the forecast types itself ── */
    tl.fromTo("#f7-frame", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.01);
    // slow push in — the approach (phase 1)
    tl.to(cam, { scale: 1, x: 0, y: 0, duration: 3.1, ease: "power2.out", onUpdate: applyCamera }, 0);
    tl.to(tilt, { rx: 1.6, ry: -2.2, duration: 3.0, ease: "power2.out", onUpdate: applyTilt }, 0);
    // the form arrives — hero visible early
    tl.fromTo("#f7-modal", { opacity: 0, y: 14, scale: 0.965 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, 0.12);
    // lower-third
    tl.fromTo("#f7-lt-k", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.5);
    tl.fromTo("#f7-lt-l", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.68);

    // discrete-text-sequence — the forecast typed with human cadence (clusters, a thinking pause)
    const SEQUENCE = [
      { t: 0.00, text: "" },
      { t: 0.95, text: "“I" },
      { t: 1.06, text: "“If" },
      { t: 1.18, text: "“If w" },
      { t: 1.26, text: "“If we" },
      { t: 1.40, text: "“If we fix" },
      { t: 1.55, text: "“If we fix ch" },
      { t: 1.66, text: "“If we fix checkout" },
      { t: 1.82, text: "“If we fix checkout first," },
      { t: 2.18, text: "“If we fix checkout first, activ" },
      { t: 2.30, text: "“If we fix checkout first, activation" },
      { t: 2.44, text: "“If we fix checkout first, activation ri" },
      { t: 2.56, text: "“If we fix checkout first, activation rises" },
      { t: 2.70, text: "“If we fix checkout first, activation rises." },
      { t: 2.84, text: "“If we fix checkout first, activation rises.”" },
    ];
    function textAt(time) {
      for (let i = SEQUENCE.length - 1; i >= 0; i--) {
        if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
      }
      return "";
    }
    const typeEl = document.getElementById("f7-type");
    const typeDriver = { t: 0 };
    tl.to(typeDriver, {
      t: 3.0, duration: 3.0, ease: "none",
      onUpdate: () => { typeEl.textContent = textAt(typeDriver.t); },
    }, 0);
    // caret blink — deterministic sin, runs until the form seals
    const caretEl = document.getElementById("f7-caret");
    const blink = { p: 0 };
    tl.to(blink, {
      p: Math.PI * 2 * 7, duration: 4.5, ease: "none",
      onUpdate: () => { caretEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0"; },
    }, 0);
    // the companion fields fill as the sentence lands
    tl.fromTo("#f7-know-txt", { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 2.95);
    tl.fromTo("#f7-hz-txt", { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 3.12);

    /* ── Scene 2 (3.2–5.6) · "before you find out" — the cursor commits; the form condenses and seals ── */
    // the gate line brightens under the VO
    tl.to("#f7-gatemeta", { color: "#F2EFE9", duration: 0.5, ease: "power1.inOut" }, 3.45);
    // camera keeps breathing forward between cues
    tl.to(cam, { scale: 1.035, duration: 1.3, ease: "power1.inOut", onUpdate: applyCamera }, 3.1);
    // cursor-click-ripple · move → settle → press → ring
    tl.fromTo("#f7-cursor", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 3.25);
    tl.to("#f7-cursor", { x: 218, y: -100, duration: 0.7, ease: "power2.inOut" }, 3.35);
    tl.to("#f7-cursor", { scale: 0.86, duration: 0.08, ease: "power2.in", yoyo: true, repeat: 1 }, 4.18);
    tl.to("#f7-commit", { scale: 0.95, duration: 0.08, ease: "power2.in", yoyo: true, repeat: 1 }, 4.18);
    tl.fromTo("#f7-ripple",
      { scale: 0.2, opacity: 0.5 },
      { scale: 2.4, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, 4.22);

    // the condensation — inverse zoom-through: form recedes at peak blur, the record arrives oversized
    tl.to("#f7-modal", { scale: 0.87, "--dof": "7px", duration: 0.24, ease: "power3.in" }, 4.42);
    tl.to("#f7-modal", { opacity: 0.15, duration: 0.24, ease: "none" }, 4.42);
    tl.set("#f7-modal", { opacity: 0 }, 4.66);
    tl.fromTo("#f7-record",
      { scale: 1.2, "--dof": "7px", opacity: 0.15 },
      { scale: 1, "--dof": "0px", opacity: 1, duration: 0.55, ease: "expo.out", immediateRender: false }, 4.66);

    // the camera pushes with the seal, streaking at peak velocity, sharp at the settle
    tl.to(cam, { scale: 1.12, y: 8, duration: 0.83, ease: "power2.inOut", onUpdate: applyCamera }, 4.42);
    tl.to(tilt, { rx: 1.2, ry: -1.5, duration: 0.83, ease: "power2.inOut", onUpdate: applyTilt }, 4.42);
    tl.to(blurProxy, { v: 3.2, duration: 0.34, ease: "power2.in", onUpdate: writeBlur }, 4.42);
    tl.to(blurProxy, { v: 0, duration: 0.55, ease: "power2.out", onUpdate: writeBlur }, 4.78);

    // svg-path-draw · the lock draws itself — body, then the shackle closes
    tl.to("#f7-lock-body", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 4.9);
    tl.to("#f7-lock-shackle", { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, 5.16);
    // mono stamp lands with the lock
    tl.fromTo("#f7-stamp", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 5.35);
    // cursor eases off the sealed row
    tl.to("#f7-cursor", { x: 298, y: -8, duration: 0.9, ease: "power2.inOut" }, 4.6);

    /* ── Scene 3 (5.6–8.0) · close-up hold on the sealed row — the quiet center of the film ── */
    // slow close-up push; the screen behind falls further away
    tl.to(cam, { scale: 1.26, y: 14, duration: 2.25, ease: "power1.inOut", onUpdate: applyCamera }, 5.7);
    tl.to(tilt, { rx: 0.9, ry: -1.0, duration: 2.25, ease: "power1.inOut", onUpdate: applyTilt }, 5.7);
    tl.to("#f7-scrim", { backgroundColor: "rgba(10,10,11,0.68)", duration: 0.9, ease: "power1.inOut" }, 5.7);
    // the record keeps gathering detail on the VO's tail — never a frozen hold
    tl.fromTo("#f7-chip-know", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 5.95);
    tl.fromTo("#f7-chip-hz", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 6.2);
    tl.fromTo("#f7-when", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 6.45);
    tl.fromTo("#f7-immutable", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 6.7);
    // one quiet ember breath on the seal
    tl.fromTo("#f7-sealglow", { opacity: 0 }, { opacity: 0.55, duration: 0.45, ease: "power1.inOut", immediateRender: false }, 7.05);
    tl.to("#f7-sealglow", { opacity: 0.28, duration: 0.5, ease: "power1.inOut" }, 7.55);

    /* drift driver — inserted LAST so it reads final cam state each frame; spans the whole shot */
    tl.to(drift, { p: Math.PI * 2 * 2, duration: 8, ease: "none", onUpdate: applyCamera }, 0);

    window.__timelines["07-the-forecast"] = tl;
  </script>
</template>
