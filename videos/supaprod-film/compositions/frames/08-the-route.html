<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- F8 · The route — one traveling shot across Plan, Build, Ship, then the seven-station route. 18.2s. Everything the runtime needs lives inside <template>. -->
  </head>
  <body>
    <template>
      <style>
        /* ————— fonts (kit copy of frame.md block, dual-path src) ————— */
        @font-face{font-family:"Geist";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/Geist-Regular.woff2") format("woff2"),url("assets/fonts/Geist-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistMono-Regular.woff2") format("woff2"),url("assets/fonts/GeistMono-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Pixel Circle";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelCircle-Regular.woff2") format("woff2"),url("assets/fonts/GeistPixelCircle-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Pixel Grid";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelGrid-Regular.woff2") format("woff2"),url("assets/fonts/GeistPixelGrid-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Pixel Line";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelLine-Regular.woff2") format("woff2"),url("assets/fonts/GeistPixelLine-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Pixel Square";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelSquare-Regular.woff2") format("woff2"),url("assets/fonts/GeistPixelSquare-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Pixel Triangle";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelTriangle-Regular.woff2") format("woff2"),url("assets/fonts/GeistPixelTriangle-Regular.woff2") format("woff2");}
        @font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2");}
        @font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2"),url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");}
        @font-face{font-family:"Mona Sans";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/MonaSans-Regular.woff2") format("woff2"),url("assets/fonts/MonaSans-Regular.woff2") format("woff2");}

        /* ————— tokens — on #root (never :root; scoping drops :root) ————— */
        #root{
          --sk-ground:#0A0A0B;
          --sk-panel:#141416;
          --sk-raised:#1A1A1D;
          --sk-hairline:#26262A;
          --sk-text:#F2EFE9;
          --sk-muted:#A8A29A;
          --sk-faint:#6B6660;
          --sk-discover:#6FA9A0;
          --sk-decide:#C39A5E;
          --sk-plan:#8FA464;
          --sk-design:#AB7FA0;
          --sk-build:#6D97C2;
          --sk-ship:#BD8092;
          --sk-learn:#A89F66;
          --sk-pass:#4FC47A;
          --sk-fail:#EF6A5F;
          --sk-warn:#E8B44C;
          --sk-ember:#FF6B2C;
          --sk-accent:var(--sk-plan);
          --sk-r-chip:7px;
          --sk-r-control:8px;
          --sk-r-row:9px;
          --sk-r-card:10px;
          --sk-r-panel:12px;
          --sk-r-pane:16px;
          --sk-ui:"Mona Sans",system-ui,sans-serif;
          --sk-mono:"IBM Plex Mono",ui-monospace,monospace;
          --sk-ring:0 0 0 1px var(--sk-hairline);
          --sk-ambient:0 24px 80px rgba(0,0,0,.5);
        }
        #root{position:absolute;inset:0;overflow:hidden;font-family:var(--sk-ui);}

        /* ————— frame ground (kit) ————— */
        .sk-frame{
          position:absolute;inset:0;overflow:hidden;
          container-type:size;
          background:var(--sk-ground);
          color:var(--sk-text);
          font-family:var(--sk-ui);
          -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
        }
        .sk-frame *,.sk-frame *::before,.sk-frame *::after{box-sizing:border-box;margin:0;padding:0;}

        /* ————— F8 world · three screens + route strip on one oversized canvas ————— */
        #f8cam{
          position:absolute;inset:0;
          transform-origin:50% 50%;
          will-change:transform;
        }
        .f8-stage{position:absolute;inset:0;}
        .f8-grid{
          position:absolute;left:-50cqw;top:-10cqh;width:200cqw;height:220cqh;
          background-image:radial-gradient(circle at 50% 50%, #26262A 1px, transparent 1.4px);
          background-size:4cqw 4cqw;
          opacity:0.35;
        }
        .sk-screen{
          position:absolute;top:4cqh;
          width:80cqw;height:76cqh;
          transform:perspective(2400px) rotateX(1.6deg) rotateY(-2.2deg);
          background:var(--sk-ground);
          border-radius:var(--sk-r-pane);
          box-shadow:var(--sk-ring),var(--sk-ambient);
          overflow:hidden;
        }
        #f8-scr-plan{left:-80cqw;--sk-accent:var(--sk-plan);}
        #f8-scr-build{left:10cqw;--sk-accent:var(--sk-build);}
        #f8-scr-ship{left:100cqw;--sk-accent:var(--sk-ship);}
        .f8-dof{--dof:0px;filter:blur(var(--dof));will-change:filter;}
        #f8-scr-build.f8-dof{--dof:3px;opacity:0.9;}
        #f8-scr-ship.f8-dof{--dof:3px;opacity:0.9;}

        /* ————— app shell (kit) ————— */
        .sk-shell{
          display:grid;height:100%;
          grid-template-columns:12.5cqw minmax(0,1fr);
          grid-template-rows:3.2cqh minmax(0,1fr);
          grid-template-areas:"side top" "side main";
        }
        .sk-sidebar{
          grid-area:side;display:flex;flex-direction:column;min-height:0;
          background:var(--sk-ground);border-right:1px solid var(--sk-hairline);
        }
        .sk-ws{display:flex;align-items:center;gap:0.55cqw;padding:1cqw 1cqw 0.8cqw;}
        .sk-ws-mark{
          width:0.72cqw;height:0.72cqw;flex:none;border-radius:50%;
          border:1px solid var(--sk-ember);
          background:radial-gradient(circle at 50% 50%,var(--sk-ember) 0 28%,transparent 30%);
        }
        .sk-ws-name{font:600 0.82cqw/1 var(--sk-ui);color:var(--sk-text);letter-spacing:0.01em;}
        .sk-ws-caret{margin-left:auto;font:400 0.6cqw/1 var(--sk-mono);color:var(--sk-faint);}
        .sk-nav{display:flex;flex-direction:column;gap:0.12cqh;padding:0.3cqw 0.5cqw;}
        .sk-navrow{
          display:flex;align-items:center;gap:0.55cqw;
          padding:0.42cqw 0.6cqw;border-radius:var(--sk-r-row);
          font:400 0.73cqw/1 var(--sk-ui);color:var(--sk-muted);
        }
        .sk-navrow .sk-dot{
          width:0.3cqw;height:0.3cqw;flex:none;border-radius:50%;
          background:var(--dot,var(--sk-faint));
        }
        .sk-navcount{margin-left:auto;font:400 0.55cqw/1 var(--sk-mono);color:var(--sk-faint);}
        .sk-navrow.is-active{background:var(--sk-raised);color:var(--sk-text);}
        .sk-navrow.is-active .sk-dot{box-shadow:0 0 0.45cqw 0 var(--dot,var(--sk-accent));}
        .sk-navrow.is-active .sk-navcount{color:var(--sk-muted);}
        .sk-side-foot{
          margin-top:auto;display:flex;align-items:center;gap:0.45cqw;
          padding:0.85cqw 1cqw;border-top:1px solid var(--sk-hairline);
          font:400 0.57cqw/1 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.03em;
        }
        .sk-livedot{
          width:0.26cqw;height:0.26cqw;flex:none;border-radius:50%;
          background:var(--sk-pass);box-shadow:0 0 0.4cqw var(--sk-pass);
        }
        .sk-topbar{
          grid-area:top;display:flex;align-items:center;gap:0.9cqw;
          padding:0 1cqw;border-bottom:1px solid var(--sk-hairline);background:var(--sk-ground);
        }
        .sk-crumb{display:flex;align-items:center;font:400 0.62cqw/1 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;}
        .sk-crumb-sep{padding:0 0.35cqw;color:var(--sk-faint);}
        .sk-crumb-here{color:var(--sk-text);}
        .sk-ask{
          display:flex;align-items:center;gap:0.5cqw;flex:0 1 20cqw;height:2.1cqh;
          padding:0 0.4cqw 0 0.65cqw;background:var(--sk-panel);
          border:1px solid var(--sk-hairline);border-radius:var(--sk-r-control);
          font:400 0.66cqw/1 var(--sk-ui);color:var(--sk-faint);
        }
        .sk-ask svg{width:0.68cqw;height:0.68cqw;flex:none;stroke:var(--sk-faint);fill:none;stroke-width:1.6;}
        .sk-kbd{
          margin-left:auto;padding:0.1cqw 0.32cqw;
          font:400 0.57cqw/1.4 var(--sk-mono);color:var(--sk-faint);
          background:var(--sk-ground);border:1px solid var(--sk-hairline);border-radius:5px;
        }
        .sk-avatar{
          width:1.25cqw;height:1.25cqw;flex:none;display:grid;place-items:center;
          background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:50%;
          font:600 0.5cqw/1 var(--sk-ui);color:var(--sk-muted);letter-spacing:0.05em;
        }

        /* ————— true-UI type (kit) ————— */
        .sk-title{font:600 1.3cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.01em;}
        .sk-body{font:400 0.73cqw/1.45 var(--sk-ui);color:var(--sk-text);}
        .sk-prose{font:400 0.70cqw/1.65 var(--sk-ui);color:var(--sk-text);}
        .sk-meta{font:400 0.68cqw/1.4 var(--sk-ui);color:var(--sk-muted);}
        .sk-label{font:500 0.65cqw/1.4 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.10em;text-transform:uppercase;}
        .sk-data{font:400 0.62cqw/1.5 var(--sk-mono);color:var(--sk-text);font-variant-numeric:tabular-nums;}
        .sk-spacer{flex:1;}

        /* ————— panels · rows (kit) ————— */
        .sk-panel{
          background:var(--sk-panel);border:1px solid var(--sk-hairline);
          border-radius:var(--sk-r-panel);overflow:hidden;min-height:0;
          display:flex;flex-direction:column;
        }
        .sk-pane{
          background:var(--sk-panel);border:1px solid var(--sk-hairline);
          border-radius:var(--sk-r-pane);overflow:hidden;min-height:0;
          display:flex;flex-direction:column;
        }
        .sk-panel-hd,.sk-pane-hd{
          display:flex;align-items:center;gap:0.6cqw;flex:none;
          padding:0.75cqw 1cqw;border-bottom:1px solid var(--sk-hairline);
        }
        .sk-panel-title{font:600 0.83cqw/1.2 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.005em;}
        .sk-panel-body,.sk-pane-body{flex:1;min-height:0;overflow:hidden;}
        .sk-panel-ft{
          display:flex;align-items:center;gap:0.6cqw;flex:none;
          padding:0.6cqw 1cqw;border-top:1px solid var(--sk-hairline);
          background:var(--sk-panel);
        }
        .sk-row{padding:0.7cqw 1cqw;}
        .sk-row + .sk-row{border-top:1px solid var(--sk-hairline);}

        /* ————— chips · badges (kit) ————— */
        .sk-chip{
          display:inline-flex;align-items:center;gap:0.3cqw;
          padding:0.22cqw 0.45cqw;border:1px solid var(--sk-hairline);
          border-radius:var(--sk-r-chip);background:rgba(255,255,255,0.02);
          font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-muted);letter-spacing:0.02em;
          white-space:nowrap;
        }
        .sk-chip--accent{color:var(--sk-accent);border-color:color-mix(in srgb,var(--sk-accent) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-accent) 8%,transparent);}
        .sk-chip--pass{color:var(--sk-pass);border-color:color-mix(in srgb,var(--sk-pass) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-pass) 8%,transparent);}
        .sk-chip--warn{color:var(--sk-warn);border-color:color-mix(in srgb,var(--sk-warn) 40%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-warn) 8%,transparent);}
        .sk-chip--ember{color:var(--sk-ember);border-color:color-mix(in srgb,var(--sk-ember) 45%,var(--sk-hairline));background:color-mix(in srgb,var(--sk-ember) 9%,transparent);}
        .sk-dot-inline{width:0.26cqw;height:0.26cqw;flex:none;border-radius:50%;background:currentColor;}
        .sk-badge{
          display:inline-flex;align-items:center;padding:0.22cqw 0.45cqw;
          background:var(--sk-raised);border:1px solid var(--sk-hairline);border-radius:var(--sk-r-chip);
          font:400 0.57cqw/1.3 var(--sk-mono);color:var(--sk-muted);font-variant-numeric:tabular-nums;
        }
        .sk-tick{color:var(--sk-pass);font-family:var(--sk-mono);}

        /* ————— doc — spec editor with TOC (kit) ————— */
        .sk-doc{display:grid;grid-template-columns:9cqw minmax(0,1fr);}
        .sk-doc-toc{border-right:1px solid var(--sk-hairline);padding:1cqw 0;}
        .sk-doc-toc .sk-label{display:block;padding:0 1cqw 0.55cqw;}
        .sk-doc-tocrow{font:400 0.68cqw/1.4 var(--sk-ui);color:var(--sk-muted);padding:0.32cqw 1cqw;}
        .sk-doc-tocrow.is-active{color:var(--sk-text);box-shadow:inset 2px 0 0 var(--sk-accent);}
        .sk-doc-body{padding:1.3cqw 1.8cqw;max-width:36cqw;}
        .sk-doc-kicker{display:flex;align-items:center;gap:0.6cqw;margin-bottom:0.9cqw;}
        .sk-doc-title{font:600 1.1cqw/1.25 var(--sk-ui);color:var(--sk-text);letter-spacing:-0.01em;margin-bottom:0.9cqw;}
        .sk-doc-h{font:600 0.78cqw/1.3 var(--sk-ui);color:var(--sk-text);margin:0.9cqw 0 0.4cqw;}
        .sk-doc-body .sk-prose{margin-bottom:0.6cqw;}
        .sk-caret{
          display:inline-block;width:0.08cqw;height:0.95em;margin-left:0.08cqw;
          background:var(--sk-accent);vertical-align:-0.12em;
        }

        /* ————— console — agent run log (kit) ————— */
        .sk-console-hd{
          display:flex;align-items:center;gap:0.6cqw;flex:none;
          padding:0.65cqw 1cqw;border-bottom:1px solid var(--sk-hairline);
        }
        .sk-console-body{padding:0.4cqw 0;}
        .sk-logline{
          display:grid;grid-template-columns:3.4cqw 1cqw minmax(0,1fr);gap:0.5cqw;align-items:baseline;
          padding:0.26cqw 1cqw;font:400 0.62cqw/1.5 var(--sk-mono);color:var(--sk-muted);
          font-variant-numeric:tabular-nums;
        }
        .sk-log-t{color:var(--sk-faint);}
        .sk-logline .sk-tick{text-align:center;}
        .sk-run{color:var(--sk-accent);text-align:center;}
        .sk-logline.is-run{background:color-mix(in srgb,var(--sk-accent) 5%,transparent);color:var(--sk-text);}

        /* ————— diff (kit) ————— */
        .sk-diff{font:400 0.62cqw/1.6 var(--sk-mono);padding:0.4cqw 0;}
        .sk-diff-row{display:grid;grid-template-columns:2cqw 1cqw minmax(0,1fr);gap:0.5cqw;padding:0.16cqw 0.9cqw;}
        .sk-diff-ln{color:var(--sk-faint);text-align:right;font-variant-numeric:tabular-nums;}
        .sk-diff-sign{text-align:center;}
        .sk-diff-row code{font:inherit;color:var(--sk-muted);white-space:pre;}
        .sk-diff-row.is-add{background:color-mix(in srgb,var(--sk-pass) 7%,transparent);}
        .sk-diff-row.is-add .sk-diff-sign{color:var(--sk-pass);}
        .sk-diff-row.is-add code{color:var(--sk-text);}
        .sk-diff-row.is-del{background:color-mix(in srgb,var(--sk-fail) 7%,transparent);}
        .sk-diff-row.is-del .sk-diff-sign{color:var(--sk-fail);}

        /* ————— checklist (kit) ————— */
        .sk-checklist{list-style:none;display:flex;flex-direction:column;}
        .sk-check{display:flex;align-items:center;gap:0.55cqw;padding:0.38cqw 0;font:400 0.73cqw/1.4 var(--sk-ui);color:var(--sk-muted);}
        .sk-tickbox{
          position:relative;
          width:0.85cqw;height:0.85cqw;flex:none;display:grid;place-items:center;
          border:1px solid var(--sk-hairline);border-radius:5px;
          font:500 0.5cqw/1 var(--sk-mono);color:transparent;
        }
        .f8-tickfill{
          position:absolute;inset:-1px;display:grid;place-items:center;
          background:color-mix(in srgb,var(--sk-pass) 14%,var(--sk-panel));
          border:1px solid color-mix(in srgb,var(--sk-pass) 50%,var(--sk-hairline));
          border-radius:5px;color:var(--sk-pass);
          font:500 0.5cqw/1 var(--sk-mono);
          opacity:0;
        }

        /* ————— sealed record row (kit) ————— */
        .sk-record{
          display:flex;align-items:center;gap:0.7cqw;
          padding:0.7cqw 1cqw;background:var(--sk-panel);
          border:1px solid var(--sk-hairline);border-radius:var(--sk-r-row);
        }
        .sk-record .sk-body{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

        /* ————— F8 · boundary banner (ember, thin, across the Build content top) ————— */
        .f8-boundary{
          grid-column:1/-1;display:flex;align-items:center;gap:0.6cqw;
          padding:0.4cqw 0.9cqw;
          border:1px solid color-mix(in srgb,var(--sk-ember) 35%,var(--sk-hairline));
          border-radius:var(--sk-r-row);
          background:color-mix(in srgb,var(--sk-ember) 6%,transparent);
          font:500 0.6cqw/1.3 var(--sk-mono);color:var(--sk-ember);letter-spacing:0.06em;
        }
        .f8-boundary svg{width:0.7cqw;height:0.7cqw;flex:none;stroke:currentColor;fill:none;stroke-width:1.4;}
        .f8-boundary .sk-meta{letter-spacing:normal;}

        /* ————— F8 · ship deploy swap ————— */
        .f8-depwrap{position:relative;display:inline-flex;}
        #f8-dep-live{position:absolute;left:0;top:0;opacity:0;}

        /* ————— F8 · route strip — seven mini stations + spine ————— */
        .f8-spine{position:absolute;left:-30.5cqw;top:94cqh;width:161cqw;height:22cqh;z-index:0;}
        .f8-spine svg{display:block;width:100%;height:100%;overflow:visible;}
        .f8-strip{position:absolute;left:-30.5cqw;top:94cqh;width:161cqw;height:22cqh;display:flex;gap:7cqw;z-index:1;}
        .f8-mini{
          position:relative;flex:none;width:17cqw;height:22cqh;
          background:var(--sk-panel);
          border:1px solid var(--sk-hairline);border-top:2px solid var(--mc);
          border-radius:var(--sk-r-card);
          box-shadow:var(--sk-ring),var(--sk-ambient);
          padding:0.75cqw 0.9cqw;
          display:flex;flex-direction:column;gap:0.55cqh;
        }
        .f8-mini-hd{
          display:flex;align-items:center;gap:0.4cqw;
          font:500 0.55cqw/1 var(--sk-mono);color:var(--mc);
          letter-spacing:0.08em;text-transform:uppercase;
        }
        .f8-mini-hd .sk-dot-inline{color:var(--mc);}
        .f8-mini-row{font:400 0.52cqw/1.35 var(--sk-ui);color:var(--sk-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .f8-mini-row.is-bright{color:var(--sk-text);font-weight:600;}
        .f8-mini-row.is-mono{font:400 0.5cqw/1.35 var(--sk-mono);color:var(--sk-muted);}
        .f8-mini-row .sk-tick{font-size:0.5cqw;}
        .f8-mini-canvas{flex:1;display:flex;gap:0.35cqw;min-height:0;}
        .f8-mini-canvas i{display:block;flex:1;border:1px solid var(--sk-hairline);border-radius:5px;background:var(--sk-raised);}

        /* ————— F8 · route flow label (lands with the wide) ————— */
        .f8-flow{
          position:absolute;left:-30.5cqw;top:118.5cqh;width:161cqw;
          display:flex;justify-content:center;align-items:baseline;gap:1.1cqw;
        }
        .f8-flow-tok{
          font:500 1.7cqw/1 var(--sk-mono);color:var(--sk-text);
          letter-spacing:0.1em;text-transform:uppercase;opacity:0;
        }
        .f8-flow-tok.is-arrow{color:var(--sk-faint);}

        /* ————— lower-third (kit, lifted above the caption keep-out) ————— */
        .sk-lowerthird{
          position:absolute;left:5.5cqw;bottom:18cqh;z-index:60;
          display:flex;flex-direction:column;gap:0.55cqh;
          text-shadow:0 2px 30px rgba(0,0,0,.6);
        }
        .f8-kickers{position:relative;height:0.8cqw;}
        .f8-kickers span{
          position:absolute;left:0;top:0;white-space:nowrap;
          font:500 0.72cqw/1 var(--sk-mono);letter-spacing:0.14em;text-transform:uppercase;
          opacity:0;
        }

                        <h1 data-hf-id="hf-odwa" class="sk-doc-title">Fix checkout drop-off</h1>
                        <h2 data-hf-id="hf-457e" class="sk-doc-h">problem</h2>
                        <p data-hf-id="hf-f0yq" class="sk-prose">41% of shoppers abandon between payment and confirmation. The card form clears every field on a declined card and the decline reason is never surfaced — 19 signals across 6 sources point at the same step.</p>

                  <div data-hf-id="hf-10t3" class="f8-mini-row is-bright">forecast: right <span data-hf-id="hf-3ofy" class="sk-tick">✓</span></div>
                  <div data-hf-id="hf-xfw5" class="f8-mini-row is-mono">activation ↑ · 30 days</div>
                  <div data-hf-id="hf-30wq" class="f8-mini-row is-mono">ranking updated</div>
                </div>
              </div>
              <div data-hf-id="hf-mfw3" class="f8-flow">
                <span data-hf-id="hf-y6a9" class="f8-flow-tok">signal</span><span data-hf-id="hf-5x43" class="f8-flow-tok is-arrow">→</span>
                <span data-hf-id="hf-ggor" class="f8-flow-tok">decision</span><span data-hf-id="hf-ol43" class="f8-flow-tok is-arrow">→</span>
                <span data-hf-id="hf-aewm" class="f8-flow-tok">spec</span><span data-hf-id="hf-o6t2" class="f8-flow-tok is-arrow">→</span>
                <span data-hf-id="hf-eidn" class="f8-flow-tok">build</span><span data-hf-id="hf-nsi1" class="f8-flow-tok is-arrow">→</span>
                <span data-hf-id="hf-b9nb" class="f8-flow-tok">ship</span><span data-hf-id="hf-ne70" class="f8-flow-tok is-arrow">→</span>
                <span data-hf-id="hf-x1ib" class="f8-flow-tok">learning</span>
              </div>

            </div>
          </div>
        </div>

        <!-- film overlay · lower-third rides outside the camera -->
        <div data-hf-id="hf-cslp" id="f8-lt" class="clip" data-start="0" data-duration="18.2" data-track-index="1">
          <div data-hf-id="hf-0lxp" class="sk-lowerthird">
            <div data-hf-id="hf-uvk3" class="f8-kickers">
              <span data-hf-id="hf-6v74" id="f8-k1">03 · Plan</span>
              <span data-hf-id="hf-x39g" id="f8-k2">05 · Build</span>
              <span data-hf-id="hf-f5le" id="f8-k3">06 · Ship</span>
              <span data-hf-id="hf-b3eu" id="f8-k4">01–07 · the route</span>
            </div>
            <span data-hf-id="hf-sabq" class="sk-lt-line" id="f8-ltl">seven stations, one connected route.</span>
          </div>
        </div>

      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const DUR = 18.2;
        const camEl = document.getElementById("f8cam");

        /* ── macro camera (multi-phase-camera + viewport-change, PAN mode) ──
           World geometry (px at 1920×1080): screen centers at ox = −1728 / 0 / +1728,
           oy = −86.4; strip stations at ox = (i−3)·460.8, oy = +594.
           Single cam object is the source of truth; screen = (S·ox + x, S·oy + y),
           so centering a target means x = −ox·S, y = −oy·S. One driver tween
           (registered last) writes transform every frame with sine micro-drift. */
        const cam = { s: 1.32, x: 2149, y: 61 };            // t=0 · tight on the typing doc body

        /* Scene 1 · PLAN — widen off the doc, then a slow push (camera never sleeps) */
        tl.to(cam, { s: 1.14, x: 1970,  y: 98,  duration: 2.0,  ease: "power1.inOut" }, 0.25);
        tl.to(cam, { s: 1.19, x: 2056,  y: 103, duration: 1.6,  ease: "power1.inOut" }, 2.45);
        /* Scene 2 · pan to BUILD (blur streak rides this pan) */
        tl.to(cam, { s: 1.16, x: 0,     y: 100, duration: 0.95, ease: "power2.inOut" }, 4.2);
        tl.to(cam, { s: 1.12, x: 60,    y: 96,  duration: 1.1,  ease: "power1.inOut" }, 5.3);
        tl.to(cam, { s: 1.24, x: 434,   y: 51,  duration: 1.7,  ease: "power1.inOut" }, 6.6);
        /* Scene 3 · pan to SHIP */
        tl.to(cam, { s: 1.16, x: -2005, y: 100, duration: 0.95, ease: "power2.inOut" }, 8.6);
        tl.to(cam, { s: 1.13, x: -1955, y: 96,  duration: 1.2,  ease: "power1.inOut" }, 9.7);
        tl.to(cam, { s: 1.24, x: -2676, y: 58,  duration: 1.7,  ease: "power1.inOut" }, 11.1);
        /* Scene 4 · pull + dive to the route strip, then dolly the seven stations */
        tl.to(cam, { s: 2.05, x: 2834,  y: -1218, duration: 0.55, ease: "power2.inOut" }, 13.0);
        const HOP = 944.64;                                  // station pitch × dolly scale
        for (let i = 1; i <= 6; i++) {
          tl.to(cam, { x: 2834 - i * HOP, duration: 0.3, ease: "power1.inOut" }, 13.55 + (i - 1) * 0.35);
        }
        /* Scene 5 · settle WIDE on the whole route, then breathe */
        tl.to(cam, { s: 0.56,  x: 0, y: -363, duration: 1.0,  ease: "power2.inOut" }, 15.9);
        tl.to(cam, { s: 0.578,       y: -373, duration: 1.25, ease: "power1.inOut" }, 16.95);

        /* ── motion-blur streak (path A, horizontal; peaks at peak pan velocity) ── */
        const blurNode = document.getElementById("f8-streak-blur");
        const blurProxy = { v: 0 };
        const writeBlur = () => {
          blurNode.setAttribute("stdDeviation", blurProxy.v.toFixed(2) + " 0");
          camEl.style.filter = blurProxy.v < 0.02 ? "none" : "url(#f8-streak)";
        };
        writeBlur(); // seed frame 0
        tl.to(blurProxy, { v: 12, duration: 0.45, ease: "power2.in",    onUpdate: writeBlur }, 4.2);
        tl.to(blurProxy, { v: 0,  duration: 0.55, ease: "power2.out",   onUpdate: writeBlur }, 4.65);
        tl.to(blurProxy, { v: 12, duration: 0.45, ease: "power2.in",    onUpdate: writeBlur }, 8.6);
        tl.to(blurProxy, { v: 0,  duration: 0.55, ease: "power2.out",   onUpdate: writeBlur }, 9.05);
        tl.to(blurProxy, { v: 9,  duration: 0.5,  ease: "power2.in",    onUpdate: writeBlur }, 13.0);
        tl.to(blurProxy, { v: 5,  duration: 2.0,  ease: "power1.inOut", onUpdate: writeBlur }, 13.55);
        tl.to(blurProxy, { v: 0,  duration: 0.8,  ease: "power2.out",   onUpdate: writeBlur }, 15.75);

        /* ── depth-of-field rack focus between the three screens ──
           (CSS seeds build/ship at 3px blur + 0.9 dim; plan starts sharp) */
        tl.to("#f8-scr-plan",  { "--dof": "3px",   opacity: 0.9,  duration: 0.9, ease: "power2.inOut" }, 4.2);
        tl.to("#f8-scr-build", { "--dof": "0px",   opacity: 1,    duration: 0.9, ease: "power2.inOut" }, 4.2);
        tl.to("#f8-scr-build", { "--dof": "3px",   opacity: 0.9,  duration: 0.9, ease: "power2.inOut" }, 8.6);
        tl.to("#f8-scr-ship",  { "--dof": "0px",   opacity: 1,    duration: 0.9, ease: "power2.inOut" }, 8.6);
        tl.to("#f8-scr-plan",  { "--dof": "2.2px", opacity: 0.94, duration: 0.8, ease: "power2.inOut" }, 13.0);
        tl.to("#f8-scr-build", { "--dof": "2.2px", opacity: 0.94, duration: 0.8, ease: "power2.inOut" }, 13.0);
        tl.to("#f8-scr-ship",  { "--dof": "2.2px", opacity: 0.94, duration: 0.8, ease: "power2.inOut" }, 13.0);
        tl.to("#f8-scr-plan",  { "--dof": "1.2px", opacity: 1,    duration: 1.0, ease: "power2.inOut" }, 15.9);
        tl.to("#f8-scr-build", { "--dof": "1.2px", opacity: 1,    duration: 1.0, ease: "power2.inOut" }, 15.9);
        tl.to("#f8-scr-ship",  { "--dof": "1.2px", opacity: 1,    duration: 1.0, ease: "power2.inOut" }, 15.9);

        /* ── Scene 1 · the spec writes itself (discrete-text-sequence, smooth slice) ── */
        const FULL = "Preserve form state on error, surface the decline reason inline, and retry tokenization without a full reload.";
        const typeEl = document.getElementById("f8-type");
        const len = { v: 0 };
        tl.to(len, {
          v: FULL.length, duration: 3.0, ease: "power1.inOut",
          onUpdate: () => { typeEl.textContent = FULL.substring(0, Math.floor(len.v)); },
        }, 0.9);
        /* TOC focus follows the doc: approach becomes the active section mid-type */
        tl.to("#f8-toc-problem",  { color: "#A8A29A", boxShadow: "inset 0 0 0 0 rgba(0,0,0,0)", duration: 0.35, ease: "power1.out" }, 2.6);
        tl.to("#f8-toc-approach", { color: "#F2EFE9", boxShadow: "inset 2px 0 0 #8FA464",       duration: 0.35, ease: "power1.out" }, 2.6);

        /* ── Scene 2 · console ticks live + diff rows stream ── */
        tl.fromTo("#f8-diff1", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 5.0);
        tl.fromTo("#f8-log5",  { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 5.4);
        tl.fromTo("#f8-diff2", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 5.7);
        tl.fromTo("#f8-log6",  { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 6.3);
        tl.fromTo("#f8-diff3", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 6.5);
        tl.fromTo("#f8-log7",  { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 7.2);

        /* ── Scene 3 · release notes unfurl · GTM ticks on the VO · deploy flips live ── */
        tl.fromTo("#f8-note1", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 8.85);
        tl.fromTo("#f8-note2", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 9.1);
        tl.fromTo("#f8-note3", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 9.35);
        const TICKS = [["#f8-tk1", "#f8-chk1", 9.9], ["#f8-tk2", "#f8-chk2", 10.6], ["#f8-tk3", "#f8-chk3", 11.3]];
        TICKS.forEach(([tick, row, at]) => {
          tl.fromTo(tick, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, at);
          tl.to(row, { color: "#F2EFE9", duration: 0.3, ease: "power1.out" }, at);
        });
        tl.to("#f8-dep-warn",  { opacity: 0, y: -5, duration: 0.3, ease: "power1.in" }, 12.15);
        tl.fromTo("#f8-dep-live", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 12.25);

        /* ── Scene 4 · spine draws through the stations as the camera passes ── */
        const spine = document.getElementById("f8-spinepath");
        const spineLen = spine.getTotalLength();
        spine.style.strokeDasharray = String(spineLen);
        spine.style.strokeDashoffset = String(spineLen);
        tl.to(spine, { strokeDashoffset: 0, duration: 2.35, ease: "none" }, 13.35);
        /* node dots pop as the pen crosses each gap */
        gsap.utils.toArray(".f8-node").forEach((node, i) => {
          tl.fromTo(node, { scale: 0, transformOrigin: "50% 50%" },
            { scale: 1, duration: 0.3, ease: "back.out(2)" }, 13.62 + i * 0.35);
        });
        /* each station gets a tap pulse on its camera hit */
        gsap.utils.toArray(".f8-mini").forEach((card, i) => {
          const at = 13.55 + i * 0.35;
          tl.to(card, { scale: 1.05, duration: 0.13, ease: "power2.out" }, at);
          tl.to(card, { scale: 1,    duration: 0.22, ease: "power2.in"  }, at + 0.13);
        });

        /* ── Scene 5 · the strip completes: signal → … → learning ── */
        tl.fromTo(".f8-flow-tok", { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.07 }, 16.2);

        /* ── lower-third · kicker relay follows the camera, line lands on the wide ── */
        tl.fromTo("#f8-k1", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.85);
        tl.to("#f8-k1", { opacity: 0, y: -8, duration: 0.3, ease: "power1.in" }, 4.3);
        tl.fromTo("#f8-k2", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 4.55);
        tl.to("#f8-k2", { opacity: 0, y: -8, duration: 0.3, ease: "power1.in" }, 8.7);
        tl.fromTo("#f8-k3", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 8.95);
        tl.to("#f8-k3", { opacity: 0, y: -8, duration: 0.3, ease: "power1.in" }, 15.85);
        tl.fromTo("#f8-k4", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 16.1);
        tl.fromTo("#f8-ltl", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 16.55);

        /* ── single deterministic driver: micro-drift + caret blink ── */
        const caretEl = document.getElementById("f8-caret");
        const DRIFT_CYCLES = 2.2, AMP_X = 6, AMP_Y = 3, FREQ_RATIO = 1.3;
        const driver = { t: 0 };
        const apply = () => {
          const p = (driver.t / DUR) * Math.PI * 2 * DRIFT_CYCLES;
          const dx = Math.sin(p) * AMP_X;
          const dy = Math.sin(p * FREQ_RATIO) * AMP_Y;
          camEl.style.transform =
            "translate(" + (cam.x + dx).toFixed(2) + "px," + (cam.y + dy).toFixed(2) + "px) scale(" + cam.s.toFixed(4) + ")";
          caretEl.style.opacity = Math.sin(driver.t * Math.PI * 2 / 0.9) > 0 ? "1" : "0.1";
        };

        /* driver registered LAST so it reads each frame's settled cam values */
        tl.to(driver, { t: DUR, duration: DUR, ease: "none", onUpdate: apply }, 0);
        apply(); // seed t=0

        window.__timelines["08-the-route"] = tl;
      </script>
    </template>
  </body>
