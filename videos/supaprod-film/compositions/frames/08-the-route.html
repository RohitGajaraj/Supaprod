<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 8 — The route. 18.2s, 1920x1080, dark register.
         One oversized world, three working stations (plan / build / ship),
         one virtual camera: open on PLAN, pan to BUILD, pan to SHIP, pull wide.
         All render-critical nodes live inside <template>. -->
  </head>
  <body>
    <template>
      <style>
        @font-face{font-family:"Geist";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/Geist-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistMono-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Pixel Circle";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelCircle-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Pixel Grid";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelGrid-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Pixel Line";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelLine-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Pixel Square";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelSquare-Regular.woff2") format("woff2");}
        @font-face{font-family:"Geist Pixel Triangle";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelTriangle-Regular.woff2") format("woff2");}
        @font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2");}
        @font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");}
        @font-face{font-family:"Mona Sans";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/MonaSans-Regular.woff2") format("woff2");}

        /* ————— root ————— */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          container-type: size;
          font-family: "Mona Sans", sans-serif;
          color: #f2efe9;
        }

        /* full-bleed ground — a clip, never the root */
        .r8-bg {
          position: absolute;
          inset: 0;
          background: #0a0a0b;
        }

        /* ————— stage (camera viewport) ————— */
        .r8-stage {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }

        /* ————— world (oversized canvas the camera traverses) ————— */
        .r8-world {
          position: absolute;
          left: 0;
          top: 0;
          width: 300cqw;
          height: 100cqh;
          transform-origin: 0 0;
          will-change: transform;
          filter: url(#r8-panblur);
        }

        /* route line threading the stations (world space) */
        .r8-route-svg {
          position: absolute;
          left: 0;
          top: 44.5cqh;
          width: 300cqw;
          height: 1cqh;
          overflow: visible;
        }
        .r8-route-base {
          fill: none;
          stroke: #26262a;
          stroke-width: 2;
          vector-effect: non-scaling-stroke;
        }
        .r8-route-draw {
          fill: none;
          stroke: #ff6b2c;
          stroke-width: 2.5;
          stroke-linecap: round;
          vector-effect: non-scaling-stroke;
        }

        /* ————— stations ————— */
        .r8-station {
          position: absolute;
        }
        .r8-st-plan  { left: 31cqw;  top: 15cqh; width: 38cqw; }
        .r8-st-build { left: 130cqw; top: 13cqh; width: 40cqw; }
        .r8-st-ship  { left: 222cqw; top: 13cqh; width: 56cqw; }

        .r8-st-rule {
          width: 1.9cqw;
          height: 2px;
          background: #ff6b2c;
          margin-bottom: 1.3cqh;
        }
        .r8-st-name {
          font-family: "Mona Sans", sans-serif;
          font-weight: 700;
          font-size: 3.2cqw;
          line-height: 1;
          letter-spacing: -0.02em;
          text-transform: lowercase;
          color: #f2efe9;
          margin-bottom: 2.4cqh;
        }

        .r8-card {
          background: #141416;
          border: 1px solid #26262a;
          padding: 1.8cqw 2cqw;
          box-sizing: border-box;
        }
        .r8-kicker {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 500;
          font-size: 0.72cqw;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #ff6b2c;
        }
        .r8-microlabel {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 500;
          font-size: 0.72cqw;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #6b6660;
        }

        /* — PLAN: spec doc typing itself — */
        .r8-spec-titlerow {
          display: flex;
          align-items: center;
          margin-top: 1.6cqh;
          min-height: 2.1cqw;
          white-space: nowrap;
        }
        .r8-spec-text {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 400;
          font-size: 1.45cqw;
          color: #f2efe9;
        }
        .r8-caret {
          display: inline-block;
          width: 0.55cqw;
          height: 1.7cqw;
          margin-left: 0.25cqw;
          background: #ff6b2c;
        }
        .r8-req-label {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 500;
          font-size: 0.85cqw;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #6b6660;
          margin-top: 2.2cqh;
          opacity: 0;
        }
        .r8-spec-bullets {
          list-style: none;
          margin: 1.1cqh 0 0;
          padding: 0;
        }
        .r8-spec-bullets li {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 400;
          font-size: 1.05cqw;
          line-height: 1.9;
          color: #a8a29a;
          opacity: 0;
        }
        .r8-slash {
          color: #ff6b2c;
          margin-right: 0.7cqw;
        }

        /* — BUILD: diff inside your boundaries — */
        .r8-build-wrap {
          position: relative;
          padding: 1.5cqw;
        }
        .r8-bframe {
          position: absolute;
          inset: 0;
          border: 1px solid rgba(255, 107, 44, 0.55);
          opacity: 0;
        }
        .r8-btag {
          position: absolute;
          top: -0.65cqw;
          left: 1.6cqw;
          padding: 0 0.6cqw;
          background: #0a0a0b;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 500;
          font-size: 0.72cqw;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #ff6b2c;
        }
        .r8-diff-head {
          border-bottom: 1px solid #26262a;
          padding-bottom: 1.1cqh;
          margin-bottom: 1.1cqh;
        }
        .r8-diff-row {
          display: flex;
          gap: 0.9cqw;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 400;
          font-size: 1cqw;
          line-height: 2.05;
          opacity: 0;
        }
        .r8-sign { width: 1cqw; }
        .r8-row-add .r8-sign { color: #ff6b2c; }
        .r8-row-add .r8-code { color: #f2efe9; }
        .r8-row-del .r8-sign { color: #6b6660; }
        .r8-row-del .r8-code {
          color: #6b6660;
          text-decoration: line-through;
        }

        /* — SHIP: release notes + go-to-market kit — */
        .r8-ship-cluster {
          display: flex;
          gap: 2cqw;
          align-items: flex-start;
        }
        .r8-rnotes { width: 30cqw; }
        .r8-rn-title {
          font-family: "Mona Sans", sans-serif;
          font-weight: 600;
          font-size: 1.6cqw;
          line-height: 1.25;
          letter-spacing: -0.02em;
          text-transform: lowercase;
          color: #f2efe9;
          margin-top: 1.5cqh;
          opacity: 0;
        }
        .r8-rn-line {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 400;
          font-size: 1cqw;
          line-height: 2.1;
          color: #a8a29a;
          opacity: 0;
        }
        .r8-rn-lines { margin-top: 1.3cqh; }
        .r8-gtm {
          width: 22cqw;
          opacity: 0;
        }
        .r8-gtm-rows { margin-top: 1.6cqh; }
        .r8-gtm-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 1cqw;
          padding: 0.9cqh 0;
        }
        .r8-gtm-label {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 400;
          font-size: 1cqw;
          color: #f2efe9;
          white-space: nowrap;
        }
        .r8-tick-right {
          display: flex;
          align-items: center;
          gap: 0.7cqw;
        }
        .r8-tick-track {
          display: block;
          width: 4.5cqw;
          height: 2px;
          background: #26262a;
        }
        .r8-tick-fill {
          display: block;
          width: 100%;
          height: 100%;
          background: #ff6b2c;
          transform: scaleX(0);
          transform-origin: left center;
        }
        .r8-chk {
          width: 1.1cqw;
          height: 1.1cqw;
          overflow: visible;
        }
        .r8-chk path {
          fill: none;
          stroke: #ff6b2c;
          stroke-width: 2;
          stroke-linecap: round;
          stroke-linejoin: round;
        }

        /* ————— screen-space overlay ————— */
        .r8-overlay {
          position: absolute;
          inset: 0;
          z-index: 5;
          pointer-events: none;
        }
        .r8-wayfinder {
          position: absolute;
          left: 5.5cqw;
          top: 5.2cqh;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 500;
          font-size: 0.72cqw;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #6b6660;
          opacity: 0;
        }
        .r8-wayfinder .r8-wp-on { color: #ff6b2c; }
        .r8-wp-sep { margin: 0 0.55cqw; }
        .r8-headline {
          position: absolute;
          left: 0;
          right: 0;
          top: 10cqh;
          text-align: center;
          font-family: "Mona Sans", sans-serif;
          font-weight: 700;
          font-size: 4.5cqw;
          line-height: 1.1;
          letter-spacing: -0.02em;
          text-transform: lowercase;
          color: #f2efe9;
          opacity: 0;
        }
        .r8-headline .r8-dot { color: #ff6b2c; }
        .r8-strip {
          position: absolute;
          left: 0;
          right: 0;
          top: 71cqh;
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 1.4cqw;
          font-family: "IBM Plex Mono", monospace;
          font-weight: 500;
          font-size: 0.95cqw;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #a8a29a;
        }
        .r8-strip .r8-tok { opacity: 0; }
        .r8-tok-learning { color: #ff6b2c; }
        .r8-arr {
          width: 1.5cqw;
          height: 0.65cqw;
          overflow: visible;
        }
        .r8-arr path {
          fill: none;
          stroke: #ff6b2c;
          stroke-width: 1.6;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
      </style>

      <div id="root" data-composition-id="08-the-route" data-width="1920" data-height="1080" data-duration="18.6">
        <!-- ground: full-bleed clip on the lowest track -->
        <div id="r8-bg" class="clip r8-bg" data-start="0" data-duration="18.2" data-track-index="0"></div>

        <!-- the shot -->
        <div id="r8-stage" class="clip r8-stage" data-start="0" data-duration="18.2" data-track-index="1">
          <!-- directional pan-blur filter (motion-blur-streak, path A) -->
          <svg width="0" height="0" aria-hidden="true" style="position: absolute">
            <defs>
              <filter id="r8-panblur" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur id="r8-blur" in="SourceGraphic" stdDeviation="0 0" />
              </filter>
            </defs>
          </svg>

          <div class="r8-world" id="r8-world">
            <!-- route line threading the three stations -->
            <svg class="r8-route-svg" viewBox="0 0 3000 10" preserveAspectRatio="none" aria-hidden="true">
              <path id="r8-route-base" class="r8-route-base" d="M 260 5 H 2840" />
              <path id="r8-route-draw" class="r8-route-draw" d="M 260 5 H 2840" />
            </svg>

            <!-- STATION 1 — PLAN: the spec writes itself -->
            <div class="r8-station r8-st-plan">
              <div class="r8-st-rule"></div>
              <div class="r8-st-name">plan</div>
              <div class="r8-card">
                <div class="r8-kicker">spec &middot; draft</div>
                <div class="r8-spec-titlerow">
                  <span class="r8-spec-text" id="r8-spec-text"></span>
                  <span class="r8-caret" id="r8-caret"></span>
                </div>
                <div class="r8-req-label" id="r8-req-label">requirements &mdash;</div>
                <ul class="r8-spec-bullets">
                  <li class="r8-bullet"><span class="r8-slash">/</span>one-screen guest checkout</li>
                  <li class="r8-bullet"><span class="r8-slash">/</span>save card for returning buyers</li>
                  <li class="r8-bullet"><span class="r8-slash">/</span>clear errors at payment step</li>
                </ul>
              </div>
            </div>

            <!-- STATION 2 — BUILD: the diff, inside your boundaries -->
            <div class="r8-station r8-st-build">
              <div class="r8-st-rule"></div>
              <div class="r8-st-name">build</div>
              <div class="r8-build-wrap">
                <div class="r8-bframe" id="r8-bframe">
                  <span class="r8-btag">your boundaries</span>
                </div>
                <div class="r8-card">
                  <div class="r8-diff-head"><span class="r8-microlabel">diff &middot; checkout</span></div>
                  <div class="r8-diff-row r8-row-del"><span class="r8-sign">&minus;</span><span class="r8-code">checkout.flow: three_steps</span></div>
                  <div class="r8-diff-row r8-row-add"><span class="r8-sign">+</span><span class="r8-code">checkout.flow: single_screen</span></div>
                  <div class="r8-diff-row r8-row-del"><span class="r8-sign">&minus;</span><span class="r8-code">shipping.page: separate</span></div>
                  <div class="r8-diff-row r8-row-add"><span class="r8-sign">+</span><span class="r8-code">payments.retry: on_timeout</span></div>
                  <div class="r8-diff-row r8-row-add"><span class="r8-sign">+</span><span class="r8-code">cards.save: returning_buyers</span></div>
                </div>
              </div>
            </div>

            <!-- STATION 3 — SHIP: release notes + go-to-market kit -->
            <div class="r8-station r8-st-ship">
              <div class="r8-st-rule"></div>
              <div class="r8-st-name">ship</div>
              <div class="r8-ship-cluster">
                <div class="r8-card r8-rnotes">
                  <div class="r8-kicker">release notes</div>
                  <div class="r8-rn-title" id="r8-rn-title">v2.4 &mdash; checkout, rebuilt</div>
                  <div class="r8-rn-lines">
                    <div class="r8-rn-line">guest checkout, one screen</div>
                    <div class="r8-rn-line">cards saved for next time</div>
                    <div class="r8-rn-line">payment errors, made clear</div>
                  </div>
                </div>
                <div class="r8-card r8-gtm" id="r8-gtm">
                  <div class="r8-kicker">go-to-market</div>
                  <div class="r8-gtm-rows">
                    <div class="r8-gtm-row">
                      <span class="r8-gtm-label">release notes</span>
                      <span class="r8-tick-right">
                        <span class="r8-tick-track"><span class="r8-tick-fill"></span></span>
                        <svg class="r8-chk" viewBox="0 0 14 14" aria-hidden="true"><path class="r8-chk-path" d="M 2 7.5 L 5.5 11 L 12 3.5" /></svg>
                      </span>
                    </div>
                    <div class="r8-gtm-row">
                      <span class="r8-gtm-label">announcement</span>
                      <span class="r8-tick-right">
                        <span class="r8-tick-track"><span class="r8-tick-fill"></span></span>
                        <svg class="r8-chk" viewBox="0 0 14 14" aria-hidden="true"><path class="r8-chk-path" d="M 2 7.5 L 5.5 11 L 12 3.5" /></svg>
                      </span>
                    </div>
                    <div class="r8-gtm-row">
                      <span class="r8-gtm-label">changelog</span>
                      <span class="r8-tick-right">
                        <span class="r8-tick-track"><span class="r8-tick-fill"></span></span>
                        <svg class="r8-chk" viewBox="0 0 14 14" aria-hidden="true"><path class="r8-chk-path" d="M 2 7.5 L 5.5 11 L 12 3.5" /></svg>
                      </span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- screen-space overlay: wayfinder chrome, landing headline, lifecycle strip -->
          <div class="r8-overlay">
            <div class="r8-wayfinder" id="r8-wayfinder">
              <span id="r8-wp-plan" class="r8-wp-on">plan</span><span class="r8-wp-sep">&middot;</span><span id="r8-wp-build">build</span><span class="r8-wp-sep">&middot;</span><span id="r8-wp-ship">ship</span>
            </div>
            <div class="r8-headline" id="r8-headline">one platform<span class="r8-dot">.</span></div>
            <div class="r8-strip" id="r8-strip">
              <span class="r8-tok">signal</span>
              <svg class="r8-arr r8-tok" viewBox="0 0 24 10" aria-hidden="true"><path d="M 1 5 H 20 M 16.5 1.5 L 21 5 L 16.5 8.5" /></svg>
              <span class="r8-tok">decision</span>
              <svg class="r8-arr r8-tok" viewBox="0 0 24 10" aria-hidden="true"><path d="M 1 5 H 20 M 16.5 1.5 L 21 5 L 16.5 8.5" /></svg>
              <span class="r8-tok">spec</span>
              <svg class="r8-arr r8-tok" viewBox="0 0 24 10" aria-hidden="true"><path d="M 1 5 H 20 M 16.5 1.5 L 21 5 L 16.5 8.5" /></svg>
              <span class="r8-tok">build</span>
              <svg class="r8-arr r8-tok" viewBox="0 0 24 10" aria-hidden="true"><path d="M 1 5 H 20 M 16.5 1.5 L 21 5 L 16.5 8.5" /></svg>
              <span class="r8-tok">ship</span>
              <svg class="r8-arr r8-tok" viewBox="0 0 24 10" aria-hidden="true"><path d="M 1 5 H 20 M 16.5 1.5 L 21 5 L 16.5 8.5" /></svg>
              <span class="r8-tok r8-tok-learning">learning</span>
            </div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
      <script>
        window.__timelines = window.__timelines || {};

        (function () {
          // Scope every lookup to THIS composition — sibling frames share the document.
          var ROOT = document.querySelector('[data-composition-id="08-the-route"]');
          var q = function (s) { return ROOT.querySelectorAll(s); };
          var q1 = function (s) { return ROOT.querySelector(s); };

          var W = ROOT.clientWidth || 1920;
          var H = ROOT.clientHeight || 1080;
          var U = W / 100; // 1cqw in px
          var V = H / 100; // 1cqh in px

          var ORANGE = "#FF6B2C";
          var HINT = "#6B6660";

          // ————— virtual camera (viewport-change, single-wrapper composite) —————
          // world point (ox, oy) lands on screen at (S*ox + x, S*oy + y)  →  T = -offset * S
          var world = q1("#r8-world");
          var cam = { x: 0, y: 0, s: 1 };
          function applyCamera() {
            world.style.transform =
              "translate(" + cam.x + "px, " + cam.y + "px) scale(" + cam.s + ")";
          }
          applyCamera();

          // station centers in world px
          var CX_PLAN = 50 * U, CX_BUILD = 150 * U, CX_SHIP = 250 * U;
          // camera x that centers a station at scale 1
          var X_PLAN = W / 2 - CX_PLAN;   // = 0
          var X_BUILD = W / 2 - CX_BUILD; // = -100U
          var X_SHIP = W / 2 - CX_SHIP;   // = -200U

          // wide landing: fit world span [26cqw .. 284cqw], center 155cqw, route y 45cqh → screen 46cqh
          var S_WIDE = 0.335;
          var X_WIDE = 50 * U - S_WIDE * 155 * U;
          var Y_WIDE = 46 * V - S_WIDE * 45 * V;

          // ————— pan blur (motion-blur-streak path A: proxy → setAttribute) —————
          var blurNode = q1("#r8-blur") || document.getElementById("r8-blur");
          var blurProxy = { v: 0 };
          function writeBlur() {
            blurNode.setAttribute("stdDeviation", blurProxy.v + " 0");
          }
          writeBlur(); // seed frame 0

          // ————— route draw (svg-path-draw: measured dash) —————
          var routeDraw = q1("#r8-route-draw");
          var routeLen = 0;
          try { routeLen = routeDraw.getTotalLength(); } catch (e) { routeLen = 0; }
          if (!routeLen || !isFinite(routeLen)) routeLen = 2580;
          routeDraw.style.strokeDasharray = String(routeLen);
          routeDraw.style.strokeDashoffset = String(routeLen);

          // checklist check marks (svg-path-draw, measured per path)
          var chkPaths = [];
          q(".r8-chk-path").forEach(function (p) {
            var len = 0;
            try { len = p.getTotalLength(); } catch (e) { len = 0; }
            if (!len || !isFinite(len)) len = 16;
            p.style.strokeDasharray = String(len);
            p.style.strokeDashoffset = String(len);
            chkPaths.push(p);
          });

          // ————— typed spec title (discrete-text-sequence) —————
          var SEQUENCE = [
            { t: 0.0, text: "" },
            { t: 0.62, text: "c" },
            { t: 0.74, text: "che" },
            { t: 0.86, text: "check" },
            { t: 0.98, text: "checko" },
            { t: 1.08, text: "checkout" },
            { t: 1.24, text: "checkout d" },
            { t: 1.34, text: "checkout dro" },
            { t: 1.44, text: "checkout drop-" },
            { t: 1.54, text: "checkout drop-off" },
            { t: 1.72, text: "checkout drop-off f" },
            { t: 1.82, text: "checkout drop-off fix" },
            { t: 2.0, text: "checkout drop-off fix — spec" },
          ];
          function textAt(time) {
            for (var i = SEQUENCE.length - 1; i >= 0; i--) {
              if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
            }
            return "";
          }
          var specText = q1("#r8-spec-text");
          var caret = q1("#r8-caret");

          // ————— the one timeline —————
          var tl = gsap.timeline({ paused: true });

          /* Scene 1 (0.0–3.1) — camera opens on PLAN; the spec writes itself.
             Gentle opening settle anchored on the PLAN station (no bounce). */
          var settle = { s: 1.03 };
          tl.fromTo(
            settle,
            { s: 1.03 },
            {
              s: 1,
              duration: 1.6,
              ease: "power2.out",
              onUpdate: function () {
                cam.s = settle.s;
                cam.x = 50 * U * (1 - settle.s);
                cam.y = 45 * V * (1 - settle.s);
                applyCamera();
              },
            },
            0
          );

          // wayfinder chrome fades in
          tl.fromTo(q1("#r8-wayfinder"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.35);

          // typing driver — discrete states, instant jumps
          var driver = { t: 0 };
          tl.to(
            driver,
            {
              t: 2.2,
              duration: 2.2,
              ease: "none",
              onUpdate: function () {
                specText.textContent = textAt(driver.t);
              },
            },
            0
          );

          // caret blink — deterministic sin, active only while the doc is being drafted
          var blink = { p: 0 };
          tl.to(
            blink,
            {
              p: Math.PI * 2 * 5.3,
              duration: 3.45,
              ease: "none",
              onUpdate: function () {
                caret.style.opacity = Math.sin(blink.p) > -0.2 ? "1" : "0";
              },
            },
            0
          );
          tl.set(caret, { opacity: 0 }, 3.46);

          // requirements label + ticking bullets
          tl.fromTo(q1("#r8-req-label"), { opacity: 0, y: 0.5 * V }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 2.08);
          var bullets = q(".r8-bullet");
          bullets.forEach(function (li, i) {
            tl.fromTo(
              li,
              { opacity: 0, x: -0.5 * U },
              { opacity: 1, x: 0, duration: 0.22, ease: "power2.out" },
              2.32 + i * 0.29
            );
          });

          /* Pan 1 (3.10–4.25) — PLAN → BUILD, matched-velocity lateral pan
             with a directional blur envelope peaking at max speed. */
          tl.fromTo(cam, { x: X_PLAN }, { x: X_BUILD, duration: 1.15, ease: "power3.inOut", onUpdate: applyCamera }, 3.1);
          tl.fromTo(blurProxy, { v: 0 }, { v: 12, duration: 0.575, ease: "power2.in", onUpdate: writeBlur }, 3.1);
          tl.fromTo(blurProxy, { v: 12 }, { v: 0, duration: 0.575, ease: "power2.out", onUpdate: writeBlur }, 3.675);

          // wayfinder hands off to build
          tl.to(q1("#r8-wp-plan"), { color: HINT, duration: 0.25, ease: "power1.out" }, 4.1);
          tl.to(q1("#r8-wp-build"), { color: ORANGE, duration: 0.25, ease: "power1.out" }, 4.1);

          /* Scene 2 (4.25–7.0) — BUILD: boundary frame, then the diff staggers in. */
          tl.fromTo(q1("#r8-bframe"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 4.35);
          var diffRows = q(".r8-diff-row");
          diffRows.forEach(function (row, i) {
            tl.fromTo(
              row,
              { opacity: 0, x: -0.7 * U },
              { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" },
              4.68 + i * 0.32
            );
          });

          /* Pan 2 (7.00–8.15) — BUILD → SHIP, same velocity + blur envelope. */
          tl.fromTo(cam, { x: X_BUILD }, { x: X_SHIP, duration: 1.15, ease: "power3.inOut", onUpdate: applyCamera }, 7.0);
          tl.fromTo(blurProxy, { v: 0 }, { v: 12, duration: 0.575, ease: "power2.in", onUpdate: writeBlur }, 7.0);
          tl.fromTo(blurProxy, { v: 12 }, { v: 0, duration: 0.575, ease: "power2.out", onUpdate: writeBlur }, 7.575);

          tl.to(q1("#r8-wp-build"), { color: HINT, duration: 0.25, ease: "power1.out" }, 8.05);
          tl.to(q1("#r8-wp-ship"), { color: ORANGE, duration: 0.25, ease: "power1.out" }, 8.05);

          /* Scene 3 (8.15–12.0) — SHIP: release notes unfurl, then the
             go-to-market checklist ticks item by item on the VO. */
          tl.fromTo(q1("#r8-rn-title"), { opacity: 0, y: 0.8 * V }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 8.35);
          var rnLines = q(".r8-rn-line");
          rnLines.forEach(function (line, i) {
            tl.fromTo(
              line,
              { opacity: 0, y: 0.7 * V },
              { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
              8.75 + i * 0.35
            );
          });
          tl.fromTo(q1("#r8-gtm"), { opacity: 0, x: 0.8 * U }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 9.7);

          // ticks: fill wipes (stat-bars-and-fills — scaleX, left origin) + drawn check
          var fills = q(".r8-tick-fill");
          var TICK_AT = [10.1, 10.7, 11.3];
          fills.forEach(function (fill, i) {
            tl.fromTo(fill, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, TICK_AT[i]);
          });
          chkPaths.forEach(function (p, i) {
            tl.to(p, { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, TICK_AT[i] + 0.32);
          });

          /* Scene 4 (12.05–15.4) — one pull wide (multi-phase-camera, single move):
             all three stations on the one route line; the route draws through them. */
          tl.fromTo(cam, { s: 1 }, { s: S_WIDE, duration: 1.6, ease: "power3.inOut", onUpdate: applyCamera }, 12.05);
          tl.fromTo(cam, { x: X_SHIP }, { x: X_WIDE, duration: 1.6, ease: "power3.inOut", onUpdate: applyCamera }, 12.05);
          tl.fromTo(cam, { y: 0 }, { y: Y_WIDE, duration: 1.6, ease: "power3.inOut", onUpdate: applyCamera }, 12.05);

          // the route line draws through the stations (svg-path-draw)
          tl.to(routeDraw, { strokeDashoffset: 0, duration: 2.0, ease: "power2.out" }, 12.35);

          // the whole route is one — wayfinder unifies
          tl.to(q1("#r8-wp-plan"), { color: ORANGE, duration: 0.3, ease: "power1.out" }, 13.3);
          tl.to(q1("#r8-wp-build"), { color: ORANGE, duration: 0.3, ease: "power1.out" }, 13.3);

          // landing statement
          tl.fromTo(q1("#r8-headline"), { opacity: 0, y: 1.6 * V }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 13.75);

          /* Scene 5 (15.4–18.2) — mono lifecycle strip stamps beneath the route;
             held wide, still, to the end (no exit — the root transition owns it). */
          var toks = q(".r8-tok");
          toks.forEach(function (tok, i) {
            tl.fromTo(
              tok,
              { opacity: 0, y: 0.6 * V },
              { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
              15.45 + i * 0.08
            );
          });

          window.__timelines["08-the-route"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
